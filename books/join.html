<!doctype html>
<!-- © 2026 شريف حشيش — جميع الحقوق محفوظة. ممنوع النسخ أو التعديل أو إعادة الاستخدام بدون إذن كتابي. -->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>سلاح التلميذ - دخول المدرسين</title>
<link rel="icon" href="teacher-192.png">
<link rel="stylesheet" href="common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<style>
body{background:#f5f3ff}
.lw{max-width:520px;margin:0 auto;padding:14px 16px 40px}
.lh{background:linear-gradient(135deg,#6d28d9,#3b82f6);color:#fff;border-radius:18px;padding:20px 16px;text-align:center;margin-bottom:12px}
.lh h1{margin:0 0 6px;font-size:23px}.lh p{margin:0;font-size:16px;line-height:1.7}
#ph{font-size:24px;text-align:center;letter-spacing:2px;padding:12px;width:100%;box-sizing:border-box;border:2px solid #c4b5fd;border-radius:14px}
.big{width:100%;font-size:19px;padding:13px;margin-top:10px}
.nf{background:#fef2f2;border:2px solid #fca5a5;border-radius:14px;padding:12px;margin-top:12px;font-size:16px;line-height:1.8}
.nf .acts{margin-top:8px}
.nw{background:#f0fdf4;border:2px solid #86efac;border-radius:14px;padding:12px;margin-top:12px;font-size:16px;line-height:1.7}
.nw label{display:block;font-weight:800;margin:10px 0 4px}
.nw input[type=text]{width:100%;box-sizing:border-box;font-size:18px;padding:10px;border:2px solid #bbf7d0;border-radius:12px}
.ch{display:flex;flex-wrap:wrap;gap:6px}
.ch button{border:2px solid #c4b5fd;background:#fff;border-radius:20px;padding:7px 14px;font-size:16px;font-weight:700;color:#5b21b6}
.ch button.on{background:#6d28d9;color:#fff;border-color:#6d28d9}
</style>
</head>
<body>
<div class="lw">
  <div class="lh"><h1>أهلًا بحضرتك في «سلاح التلميذ»</h1><p>اكتب رقم تليفونك<br>وهتاخد رابطك الخاص وتثبّت البرنامج</p></div>
  <div class="card">
    <label style="font-weight:800;font-size:17px">رقم تليفونك</label>
    <input id="ph" type="tel" inputmode="numeric" dir="ltr" placeholder="01xxxxxxxxx" autocomplete="tel">
    <button class="btn ok big" id="go">دخول</button>
    <div id="msg"></div>
  </div>
</div>
<script>/*! © 2026 شريف حشيش — جميع الحقوق محفوظة. ممنوع النسخ أو التعديل أو إعادة الاستخدام بدون إذن كتابي. */
"use strict";const TCFG="selah-trial-tcfg",TCODE="selah-trial-tcode";const h=new URLSearchParams(location.hash.slice(1));if(h.get("p")){const t=decodeCfg(h.get("p"));if(t)LS.set(TCFG,t)}const REP=h.get("r")||"",RN=h.get("n")||"المندوب",RP=(h.get("ph")||"").replace(/\D/g,"");const sb=makeClient(false,TCFG);if(REP)LS.set("selah-trial-join",location.href);const dev=deviceId();const msg=t=>$("#msg").innerHTML=t;function notFound(){msg(`<div class="nf">⚠️ الرقم ده مش متسجل عندنا.<br>اتأكد من الرقم وجرّب تاني، أو جرّب رقم تاني ليك، أو كلّم <b>أ/ ${esc(RN)}</b>${RP?` <span dir="ltr">${esc(RP)}</span>`:""}.\n    ${RP?`<div class="acts"><a class="btn pri" href="tel:${esc(RP)}">📞 اتصل</a><a class="btn ok" target="_blank" rel="noopener" href="${waLink(RP,"السلام عليكم يا أ/ "+RN+"، أنا مدرس وعايز أدخل على برنامج سلاح التلميذ ورقمي مش متسجل: "+$("#ph").value.trim())}">واتساب</a></div>`:""}</div>`)}const isD=t=>/\p{Nd}/u.test(String.fromCodePoint(t));const enDigits=t=>String(t||"").replace(/\p{Nd}/gu,(t=>{const e=t.codePointAt(0);let n=e;while(n>0&&isD(n-1))n--;return String((e-n)%10)}));async function go(){const t=enDigits($("#ph").value).replace(/\D/g,"");if(!REP)return msg('<div class="nf">⚠️ الرابط ناقص — اطلب الرابط تاني من المندوب.</div>');if(t.length<10)return msg('<div class="nf">اكتب الرقم كامل (11 رقم)</div>');const e=$("#go");e.disabled=true;e.textContent="⏳ لحظة…";msg("");try{const{data:e,error:n}=await sb.rpc("t_join",{p_rep:REP,p_phone:t,p_dev:dev});if(n)throw n;if(e&&e.c){LS.set(TCODE,e.c);msg('<div class="nf" style="background:#dcfce7;border-color:#86efac">✅ تمام! بنفتح لحضرتك البرنامج…</div>');location.href="teacher.html#c="+encodeURIComponent(e.c)+(h.get("p")?"&p="+h.get("p"):"");return}if(e&&e.err==="many")msg('<div class="nf">⚠️ محاولات كتير — استنى 10 دقايق وجرّب تاني، أو كلّم المندوب.</div>');else newForm(t)}catch(t){msg(`<div class="nf">⚠️ ${esc(errMsg(t))}</div>`)}e.disabled=false;e.textContent="دخول"}const SUBJS=[["ar","عربي"],["math","رياضة"],["stu","دراسات"],["en","إنجليزي"],["sci","علوم"],["kash","كشكول"]];const STGS=[["p","ابتدائي"],["m","إعدادي"],["pm","ابتدائي وإعدادي"]];function newForm(t){const e={subjects:new Set,stage:""};msg(`<div class="nw">👋 أهلًا بحضرتك! الرقم <b dir="ltr">0${esc(t)}</b> لسه مش متسجل عندنا — سجّل بياناتك وهتدخل على طول.\n    <label>الاسم</label><input type="text" id="nn" placeholder="مثلًا: أحمد محمد" autocomplete="name">\n    <label>المادة (اختار واحدة أو أكتر)</label><div class="ch" id="ns">${SUBJS.map((([t,e])=>`<button type="button" data-k="${t}">${e}</button>`)).join("")}</div>\n    <label>المرحلة</label><div class="ch" id="nst">${STGS.map((([t,e])=>`<button type="button" data-k="${t}">${e}</button>`)).join("")}</div>\n    <label>القرية / المنطقة</label><input type="text" id="na" placeholder="مثلًا: شبراخيت" autocomplete="address-level2">\n    <button class="btn ok big" id="ngo">✅ سجّلني وادخل</button>\n    <div class="small" style="margin-top:8px;color:#166534">هتتسجّل عند <b>أ/ ${esc(RN)}</b> وهيتواصل مع حضرتك.</div></div>`);$("#ns").onclick=t=>{const n=t.target.closest("button");if(!n)return;const s=n.dataset.k;e.subjects.has(s)?e.subjects.delete(s):e.subjects.add(s);n.classList.toggle("on",e.subjects.has(s))};$("#nst").onclick=t=>{const n=t.target.closest("button");if(!n)return;e.stage=n.dataset.k;$("#nst").querySelectorAll("button").forEach((t=>t.classList.toggle("on",t===n)))};$("#ngo").onclick=async()=>{const n=$("#nn").value.trim().replace(/\s+/g," ");if(n.length<3){alert("اكتب اسم حضرتك");$("#nn").focus();return}if(!e.subjects.size){alert("اختار المادة");return}const s=$("#ngo");s.disabled=true;s.textContent="⏳ لحظة…";try{const{data:a,error:o}=await sb.rpc("t_join_new",{p_rep:REP,p_phone:t,p_name:n,p_prof:{subjects:[...e.subjects],stage:e.stage,area:$("#na").value.trim()},p_dev:dev});if(o)throw o;if(a&&a.c){LS.set(TCODE,a.c);msg('<div class="nw">✅ اتسجّلت! بنفتح لحضرتك البرنامج…</div>');location.href="teacher.html#c="+encodeURIComponent(a.c)+(h.get("p")?"&p="+h.get("p"):"");return}const c={many:"⚠️ اتسجّل من الموبايل ده كذا مرة النهارده — جرّب بكرة أو كلّم المندوب.",bad:"⚠️ الرقم مش مظبوط — لازم 11 رقم ويبدأ بـ 01.",name:"⚠️ اكتب الاسم كامل.",rep:"⚠️ الرابط ده قديم — اطلب الرابط تاني من المندوب."}[a&&a.err];if(c){alert(c);s.disabled=false;s.textContent="✅ سجّلني وادخل";return}notFound()}catch(t){alert("⚠️ "+errMsg(t));s.disabled=false;s.textContent="✅ سجّلني وادخل"}};setTimeout((()=>$("#nn")&&$("#nn").focus()),100)}$("#go").onclick=go;$("#ph").onkeydown=t=>{if(t.key==="Enter")go()};</script>
</body>
</html>
