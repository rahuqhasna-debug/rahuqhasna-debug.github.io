<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>سلاح التلميذ - المدرس</title>
<link rel="manifest" href="teacher.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500&display=swap">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<style>
.t-nw{grid-column:1/-1;background:linear-gradient(140deg,#f472b6,#be185d)}
.t-rv{grid-column:1/-1;background:linear-gradient(140deg,#2dd4bf,#0e7490)}.t-rv.lock{background:linear-gradient(140deg,#cbd5e1,#64748b)}
.rvl label{display:flex;align-items:center;gap:10px;padding:12px;border:2px solid #e2e8f0;border-radius:14px;margin-bottom:8px;font-weight:700;font-size:17px;cursor:pointer;background:#fff}
.rvl label.on{border-color:#16a34a;background:#dcfce7}.rvl input{width:24px;height:24px}
/* بند 50: رسومات متحركة لشاشة الأذونات (إيد بتدوس ← المفتاح يخضرّ) */
.phsvg .swb{animation:swb 3s infinite}.phsvg .swk{animation:swk 3s infinite}
@keyframes swb{0%,38%{fill:#cbd5e1}48%,100%{fill:#16a34a}}
@keyframes swk{0%,38%{transform:translateX(0)}48%,100%{transform:translateX(16px)}}
.phsvg .fing{animation:fing 3s infinite;opacity:0}
@keyframes fing{0%{opacity:0;transform:translate(30px,50px)}15%{opacity:1}35%{transform:translate(0,0)}40%{transform:translate(0,4px)}48%{transform:translate(0,0);opacity:1}70%{opacity:1}85%,100%{opacity:0;transform:translate(0,0)}}
.phsvg .shk{animation:shk 1s infinite;transform-box:fill-box;transform-origin:center top}
@keyframes shk{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-14deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-6deg)}}
.pgdots{display:flex;gap:6px;justify-content:center;margin:8px 0}.pgdots span{flex:1;max-width:60px;height:8px;border-radius:4px;background:#e2e8f0}.pgdots span.ok{background:#16a34a}.pgdots span.on{background:#f59e0b}
/* بند 51: واجهة الأذونات + صفحة التثبيت (هوية بنفسجي، RTL) */
.pm-hero{background:linear-gradient(145deg,#7c3aed,#4c1d95);color:#fff;border-radius:22px;padding:20px 16px 16px;text-align:center;box-shadow:0 10px 26px rgba(76,29,149,.3)}
.pm-hero img{width:60px;height:60px;border-radius:16px;background:#fff;padding:4px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.pm-hero h2{margin:10px 0 6px;font-size:21px;line-height:1.5}.pm-hero p{margin:0 0 12px;font-size:14px;line-height:1.8;opacity:.95}
.pm-bar{height:10px;border-radius:6px;background:rgba(255,255,255,.28);overflow:hidden;margin:4px 6px 6px}.pm-bar span{display:block;height:100%;background:#fde68a;border-radius:6px;transition:width .4s}
.vid-t{font-weight:800;font-size:18px;color:#4c1d95;text-align:center;margin:20px 0 10px}
.phf{position:relative;width:220px;max-width:64%;margin:0 auto;border:9px solid #111827;border-radius:32px;background:#000;box-shadow:0 14px 32px rgba(17,24,39,.3),0 2px 6px rgba(17,24,39,.2);overflow:hidden}
.phf video{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;background:#1e1b4b}
.phf .pp{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);border:0;border-radius:20px;background:rgba(17,24,39,.78);color:#fff;font:700 14px inherit;font-family:inherit;padding:8px 16px;cursor:pointer;backdrop-filter:blur(4px)}
.pm-list{margin-top:14px}
.pcard{display:flex;gap:10px;align-items:flex-start;background:#fff;border:2px solid #ede9fe;border-inline-start:7px solid var(--c);border-radius:18px;padding:14px 12px;margin-top:12px;box-shadow:0 4px 14px rgba(76,29,149,.07)}
.pcard.ok{background:#f0fdf4;border-color:#bbf7d0;--c:#16a34a}.pcard.lock{opacity:.6}
.pcard .num{width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;flex:none}
.pcard .bd{flex:1;min-width:0}.pcard h4{margin:0;font-size:17px;color:#1e1b4b}.pcard p{margin:5px 0 8px;font-size:13.5px;line-height:1.8;color:#475569}
.pcard .th{width:62px;flex:none}.pcard .th .phsvg{width:62px;max-width:none;margin:0}
.pbtn{display:block;width:100%;border:0;border-radius:14px;padding:12px 14px;font:800 15px inherit;font-family:inherit;color:#fff;background:linear-gradient(140deg,#8b5cf6,#6d28d9);box-shadow:0 5px 14px rgba(109,40,217,.32);cursor:pointer}
.pm-note{margin:16px 0 8px;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:14px;padding:12px;font-size:13.5px;line-height:1.9;color:#4c1d95}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.chips span{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:4px 11px;font-size:12.5px;font-weight:700}
.tl{position:relative;margin:14px 0 4px}.tl::before{content:'';position:absolute;inset-inline-start:21px;top:22px;bottom:22px;width:4px;background:linear-gradient(#c4b5fd,#7c3aed);border-radius:2px}
.tl-i{position:relative;display:flex;gap:12px;align-items:center;margin-bottom:12px}
.tl-n{width:46px;height:46px;flex:none;border-radius:50%;background:var(--c);font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 5px #fff,0 4px 12px rgba(0,0,0,.2);z-index:1}
.tl-b{flex:1;background:#fff;border:2px solid #ede9fe;border-radius:16px;padding:10px 12px;box-shadow:0 4px 12px rgba(76,29,149,.07)}
.tl-b b{display:block;font-size:16px;color:#1e1b4b;margin-bottom:2px}.tl-b span{font-size:13.5px;color:#475569;line-height:1.8}.tl-b.hot{background:#fffbeb;border-color:#fcd34d}
.ins-c{background:linear-gradient(160deg,#faf5ff,#fff);border:2px solid #ddd6fe;border-radius:24px;padding:26px 18px;text-align:center;box-shadow:0 12px 30px rgba(76,29,149,.14)}
.ins-c img{width:84px;height:84px;border-radius:22px;box-shadow:0 8px 20px rgba(76,29,149,.3)}
.ins-c h2{margin:14px 0 6px;font-size:23px;color:#4c1d95}.ins-c .sub{color:#475569;font-size:15px;line-height:1.8;margin-bottom:16px}
.ins-b{display:block;width:100%;border:0;border-radius:18px;padding:17px;font:800 19px inherit;font-family:inherit;color:#fff;background:linear-gradient(140deg,#8b5cf6,#5b21b6);box-shadow:0 8px 20px rgba(91,33,182,.4);cursor:pointer}
.ins-f{list-style:none;padding:0;margin:18px 0 0;text-align:start;font-size:14px;color:#334155;line-height:2}.ins-f li::before{content:'✓';display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:#ede9fe;color:#6d28d9;font-weight:800;margin-inline-end:8px;font-size:13px}
.pgback{background:#fef2f2;border:2px solid #dc2626;border-radius:12px;padding:8px 10px;margin:8px 0;font-weight:700;color:#991b1b}
.pgbrand{background:#fffbeb;border:1px dashed #f59e0b;border-radius:10px;padding:8px 10px;margin-top:8px;text-align:start;line-height:1.9}
/* متابعة 7: فواتيري + مرتجعات */
.invbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.ib{border:0;border-radius:16px;padding:12px 6px;font:800 17px inherit;font-family:inherit;color:#fff;cursor:pointer;box-shadow:0 5px 12px -6px rgba(0,0,0,.4)}
.ib b{font-size:22px;display:block;margin-bottom:2px}.ib-i{background:linear-gradient(140deg,#38bdf8,#2563eb)}.ib-r{background:linear-gradient(140deg,#fb923c,#dc2626)}
.tbw{overflow-x:auto}.tb{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:8px}.tb th,.tb td{padding:6px 4px;text-align:center;border-bottom:1px solid #e5e7eb}.tb td:first-child,.tb th:first-child{text-align:start}
.lrow{padding:10px 12px;margin-bottom:8px}
/* متابعة 7: اعرف الجديد — قنوات التليجرام */
.nhd{color:#fff;font-weight:800;font-size:18px;border-radius:16px;padding:8px 14px;margin:14px 0 10px;text-align:center}
.ngrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ngrid .nch:first-child{grid-column:1/-1}
.nch{border:0;border-radius:20px;background:var(--bg);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;cursor:pointer;box-shadow:0 6px 14px -8px rgba(0,0,0,.4);color:#1e1b4b}
.nch:active{transform:scale(.97)}
.nch .nci{width:64px;height:64px;display:block}.nch .nci svg{width:100%;height:100%;display:block}
.nch .ncl{font-size:17px;font-weight:800}
.nch .nct{font-size:12.5px;font-weight:700;background:#229ED9;color:#fff;border-radius:12px;padding:2px 10px}.nch .nct.soon{background:#94a3b8}
/* متابعة 7: الرئيسية 6 مربعات قد بعض */
.ttiles.six .tt{grid-column:auto}
.hm .ttiles.six{grid-template-rows:repeat(3,1fr)}
.ttiles.six .tti{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);width:50px;height:50px;padding:10px}
.hm .ttiles.six .tti{width:46px;height:46px;padding:10px}
.ttiles.six .tti svg{width:100%;height:100%;display:block}
.ttiles.six .ttl{font-size:14px;font-weight:700}.hm .ttiles.six .ttl{font-size:13.5px}
.hm .ttiles.six{gap:8px}.hm .ttiles.six .tt{border-radius:16px;box-shadow:0 4px 10px -6px rgba(0,0,0,.4)}
.h-or{background:linear-gradient(140deg,#fb923c,#ea580c)}.h-ms{background:linear-gradient(140deg,#60a5fa,#2563eb)}
.h-me{background:linear-gradient(140deg,#a78bfa,#6d28d9)}.h-pr{background:linear-gradient(140deg,#fbbf24,#d97706)}
.h-nw{background:linear-gradient(140deg,#f472b6,#db2777)}.h-rv{background:linear-gradient(140deg,#34d399,#059669)}.h-rv.lock{background:linear-gradient(140deg,#cbd5e1,#64748b)}
/* متابعة 8: يافطة إعلانية + تصغير وتبسيط */
.promo{flex:none;position:relative;overflow:hidden;border-radius:18px;padding:12px 14px;margin-bottom:8px;color:#fff;text-align:center;background:linear-gradient(135deg,#4c1d95,#6d28d9 60%,#7c3aed);box-shadow:0 6px 16px -8px rgba(76,29,149,.6)}
.promo::after{content:'';position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(253,230,138,.12);top:-50px;inset-inline-start:-30px}
.promo .pr-t{position:relative;font-size:17px;font-weight:800;line-height:1.5}.promo .pr-t b{color:#fde68a}
.promo .pr-r{position:relative;display:flex;gap:6px;justify-content:center;margin:8px 0 6px;flex-wrap:wrap}
.promo .pr-r span{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:20px;padding:3px 11px;font-size:12.5px;font-weight:700}
.promo .pr-s{position:relative;font-size:12.5px;opacity:.9;border-top:1px solid rgba(255,255,255,.2);padding-top:6px}
body{font-size:15px}
.phead{font-size:17px;padding:10px 12px;border-radius:16px}.phead .small{font-size:12.5px}
.card{padding:12px}.card h3{font-size:15px}
.gobtn{font-size:16px;padding:12px}
.ib{font-size:15px;padding:9px 6px;border-radius:14px}.ib b{font-size:19px}
/* ملفي أهدى وأصغر */
.pform .psec{border-radius:16px;padding:10px 12px 2px;margin-bottom:10px;border-top-width:3px;box-shadow:0 3px 10px -6px rgba(15,23,42,.2)}
.pform .psh{font-size:15px;gap:8px;margin-bottom:8px}
.pform .pdot{width:30px;height:30px;font-size:16px}
.pform .field{margin-bottom:9px}.pform .field>label{font-size:13px}
.pform .field input,.pform .field select,.pform .field textarea{padding:8px 10px;font-size:14.5px}
.pform .warnbox{font-size:12.5px;padding:7px 9px}
/* اعرف الجديد أشيك */
.nhd{background:none!important;color:var(--c,#334155);font-size:15px;text-align:start;padding:0 2px 0 0;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.nhd::after{content:'';flex:1;height:2px;border-radius:2px;background:currentColor;opacity:.25}
.ngrid{grid-template-columns:repeat(3,1fr);gap:8px}.ngrid .nch:first-child{grid-column:auto}
.nch{background:#fff;border:1px solid #e5e7eb;border-top:3px solid var(--ac);border-radius:14px;padding:10px 4px;gap:5px;box-shadow:0 2px 8px -4px rgba(0,0,0,.2)}
.nch .nci{width:38px;height:38px}.nch .ncl{font-size:13.5px;font-weight:700;color:#1e293b}
.nch .nct{font-size:11px;font-weight:600;border-radius:10px;padding:1px 8px}
/* متابعة 7: شاشة الأذونات — مربعات تحت بعض + تليفون صغير فيه الزراير بتتحرك */
.pm-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}.pm-top img{width:40px;height:40px;border-radius:12px}
.pm-top .pm-bar{flex:1;background:#ede9fe;margin:0}.pm-top .pm-bar span{background:#16a34a}.pm-top b{color:#4c1d95}
.pbx{display:flex;align-items:center;gap:10px;border-radius:18px;padding:12px;margin-bottom:10px;background:color-mix(in srgb,var(--c) 14%,#fff);border:2px solid color-mix(in srgb,var(--c) 45%,#fff);color:color-mix(in srgb,var(--c) 55%,#111);cursor:pointer;font-weight:800;font-size:18px}
.pbx:active{transform:scale(.98)}.pbx.ok{--c:#16a34a;background:linear-gradient(140deg,#22c55e,#15803d);border-color:#15803d;color:#fff}
.pbx.ok .pbx-go{background:#fff;color:#15803d}
.pbx-go{display:inline-block;margin-top:8px;background:var(--c);color:#fff;border-radius:14px;padding:6px 16px;font-size:15px;font-weight:800;box-shadow:0 3px 8px color-mix(in srgb,var(--c) 45%,transparent);animation:bdg 1.6s infinite}.pbx.lock{opacity:.5;cursor:default}
.pbx-t{flex:1;line-height:1.4}.pbx-t small{display:block;font-size:13px;font-weight:600;opacity:.85;margin-top:3px}
.pmini{width:118px;flex:none;border:3px solid #1f2937;border-radius:14px;background:#fff;padding:7px 6px;display:flex;flex-direction:column;gap:6px;justify-content:center;min-height:60px}
.psr{display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:11px;font-weight:700;color:#111;line-height:1.2}
.psw{flex:none;width:26px;height:14px;border-radius:7px;background:#cbd5e1;position:relative}
.psw::after{content:'';position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.psw.on{background:#16a34a}.psw.on::after{right:14px}
.psw.go{animation:pswb 2.4s var(--d) infinite}.psw.go::after{animation:pswk 2.4s var(--d) infinite}
@keyframes pswb{0%,35%{background:#cbd5e1}45%,90%{background:#16a34a}100%{background:#cbd5e1}}
@keyframes pswk{0%,35%{right:2px}45%,90%{right:14px}100%{right:2px}}
.pring{display:block;text-align:center;font-size:28px}.pring.go{animation:shk 1s infinite;transform-origin:center top}
.pbx-x{display:flex;gap:8px;margin:-4px 0 12px}.pbx-x>*{flex:1;margin:0}
/* متابعة 7: سهم «انزل تحت» بعد ما يدوس أندرويد */
.godown{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:50;background:#6d28d9;color:#fff;border-radius:24px;padding:8px 18px;font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;box-shadow:0 6px 18px rgba(76,29,149,.45);animation:gdn 1s infinite;pointer-events:none}
.godown b{font-size:26px;line-height:1}
@keyframes gdn{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}
/* متابعة 8 (2): شريط فوق وتحت موف أصغر + رئيسية 5 مربعات بأيقونات ملوّنة + صفحة الطلب مضغوطة */
header.top{background:linear-gradient(135deg,#5b21b6,#7c3aed)}
header.top .in{padding:6px 12px;gap:6px}header.top h1{font-size:15.5px}
header.top .hb{font-size:17px;padding:2px 4px}
header.top .hb.backpill{font-size:13.5px;padding:4px 12px}
nav.tabs{background:linear-gradient(135deg,#5b21b6,#7c3aed);border-top:0;border-radius:18px 18px 0 0;box-shadow:0 -4px 14px rgba(76,29,149,.25)}
nav.tabs a{color:rgba(255,255,255,.78);font-size:12px;padding:6px 4px 7px}nav.tabs a .i{font-size:18px}
nav.tabs a.on{color:#fff;font-weight:800}nav.tabs a.on .i{background:rgba(255,255,255,.2);border-radius:12px;margin:0 auto;width:44px}
main.wrap.hm{height:calc(100dvh - 128px);padding-top:10px}
.hm .ttiles.five{margin-bottom:18px;grid-template-rows:repeat(3,1fr)}
.ttiles.five .tt{grid-column:auto}.ttiles.five .tt.wd{grid-column:1/-1;flex-direction:row;gap:12px}
.ttiles.five .tti,.hm .ttiles.five .tti{width:46px;height:46px;font-size:33px;line-height:1;background:rgba(255,255,255,.22);box-shadow:none}
.ttiles.five .ttl,.hm .ttiles.five .ttl{font-size:14px;font-weight:700}
.hm .ttiles.five .tt{border-radius:16px;box-shadow:0 4px 10px -6px rgba(0,0,0,.4)}
.invbar{gap:8px;margin-bottom:6px}.ib{font-size:13.5px;padding:7px 6px;border-radius:12px}.ib b{display:inline;font-size:15px;margin:0 0 0 4px}
main.wrap.ordv{height:calc(100dvh - 104px);padding:8px 12px 6px;display:flex;flex-direction:column;overflow:hidden}
.ordv .phead{flex:none;font-size:14.5px;padding:6px 10px;margin-bottom:6px;border-radius:12px}.ordv .phead .small{font-size:11.5px}
.ordv .invbar{flex:none}
.oscr{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 1px 6px}
.ordv .bklist{gap:6px;padding-bottom:4px}
.ordv .bk{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;padding:7px 10px;border-radius:12px;box-shadow:0 2px 6px -4px rgba(0,0,0,.25)}
.ordv .bk-n{font-size:13.5px;font-weight:700;gap:6px}.ordv .bk-dot{width:9px;height:9px}
.ordv .bk-p{margin-top:1px;font-size:12.5px}.ordv .bk-p b{font-size:13.5px}
.ordv .qty{display:inline-flex;align-items:center;border:1.5px solid var(--line,#d1d5db);border-radius:10px;overflow:hidden;gap:0}
.ordv .qty button{width:30px;height:30px;border:0;border-radius:0;background:var(--brand-soft,#ede9fe);font-size:17px;font-weight:800;cursor:pointer;color:var(--ink)}
.ordv .qty input{width:38px;height:30px;border:0;text-align:center;font-size:15px;font-weight:800;background:var(--card);color:var(--ink);padding:0;-moz-appearance:textfield}
.ordv .qty input::-webkit-outer-spin-button,.ordv .qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ordv .bk-sum{grid-column:1/-1;font-size:12px;min-width:0}.ordv .bk-sum:empty{display:none}
.ordv .field{margin:8px 0 0}.ordv .field textarea{min-height:44px}
.ordv .totbar{position:static;flex:none;margin-top:6px;padding:6px 10px;border-radius:14px;display:flex;align-items:center;gap:8px;text-align:start;box-shadow:0 -2px 10px rgba(0,0,0,.1)}
.ordv #tot{flex:1;font-size:12.5px;line-height:1.4}.ordv .totbar b{font-size:14.5px}
.ordv .totbar .gobtn{width:auto;flex:none;font-size:14.5px;padding:9px 16px;border-radius:12px}
/* متابعة 8 (3): مساحة بيضاء أكبر في الرئيسية + سطر تحت «اطلب كتبك» + رجوع تحت على الشمال + أسعار مضغوطة + أغلفة */
.hm .ttiles.five{flex:0 0 auto;grid-template-rows:116px 100px 100px;gap:18px 20px;margin:12px 8px 18px}
.ttiles.five .tt.h-or{background:linear-gradient(135deg,#fdf2f8,#fbcfe8);border:1.5px solid #f9a8d4;box-shadow:0 8px 18px -10px rgba(219,39,119,.55)}
.ttiles.five .tt.wd .tti{width:64px;height:64px;font-size:44px;background:#fff;box-shadow:0 2px 8px rgba(219,39,119,.2)}
.ttiles.five .tt.wd .ttl{font-size:19px;font-weight:800;color:#9d174d}.ttiles.five .tt.wd .tsub{font-size:13px;color:#6d28d9;font-weight:600}
.hm .ttiles.five .tt{padding:8px}

<body>
<header class="top"><div class="in"><button class="hb backpill" id="back" hidden aria-label="رجوع">رجوع ➜</button><h1 id="title">سلاح التلميذ</h1><button class="hb" id="bell" aria-label="الإشعارات">🔔<span class="cnt" id="bellCnt" hidden></span></button><button class="hb" id="reload" aria-label="تحديث">🔄</button></div></header>
<main class="wrap" id="app"><div class="loading">جاري التحميل…</div></main>
<div id="cbar"></div>
<button class="back2" id="back2" hidden aria-label="رجوع">➜ رجوع</button>
<nav class="tabs" id="tabs" hidden>
  <a data-v="home"><span class="i">🏠</span>الرئيسية<span class="cnt" id="homeCnt" hidden></span></a>
  <a data-v="msgs"><span class="i">💬</span>الرسائل<span class="cnt" id="msgCnt" hidden></span></a>
  <a data-v="me"><span class="i">👤</span>بياناتي</a>
</nav>
<script>
"use strict";
const TCFG = 'selah-trial-tcfg', TCODE = 'selah-trial-tcode', DISMISS = 'selah-trial-tdismiss';
(function () {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('p')) { const c = decodeCfg(h.get('p')); if (c) LS.set(TCFG, c); }
  if (h.get('c')) { LS.set(TCODE, h.get('c').trim()); history.replaceState(null, '', location.pathname + (h.get('v') ? '#v=' + h.get('v') : '')); }
})();
const code = LS.get(TCODE);
const sb = makeClient(false, TCFG);
const app = $('#app');
let D = null, view = (new URLSearchParams(location.hash.slice(1)).get('v')) || 'home', newPhotos = [], st = {}, msgs = [], lastId = 0, pollT = null, instEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); instEvt = e; if (D) render(); });
window.addEventListener('appinstalled', () => { instEvt = null; installedNow = true; if (D) render(); });
let installedNow = false;
let RV = null;   // 📦 استلمت إيه: {open, recv:{b:[...], at}}

const NATIVE = !!window.SilahApp;   // جوه تطبيق الأندرويد الحقيقي (بند 48)
const isApp = NATIVE || matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const UA = navigator.userAgent, IOS = /iphone|ipad|ipod/i.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
const INAPP = /FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\)/i.test(UA), SAMSUNG = /SamsungBrowser/i.test(UA), IOS_SAFARI = IOS && !/CriOS|FxiOS|EdgiOS|OPiOS/i.test(UA) && !INAPP;
const tName = n => 'أ/ ' + String(n || '').trim();
const vals = () => ({ ...(D.profile || {}), avatar: D.avatar || '' });
// لو الكتاب ليه سعر قبل الخصم بس، بيظهر بيه (من غير ما يختفي)
const prices = () => ((D.prices && D.prices.items) || []).map(p => p.post == null && p.pre != null ? { ...p, post: p.pre, pre: null } : p);
// النغمة: الموبايل بيمنع الصوت لحد ما المدرس يلمس الشاشة مرة — فأول لمسة «بتفتح» الصوت (بصمت)، وبعدها النغمة بتشتغل مع أي رسالة أو تنبيه
// (2026-11-12 تاني) النغمة كانت بتشتغل ساعات وساعات لأ: الموبايل بيوقّف الصوت لما الصفحة تروح الخلفية.
// الحل: Web Audio — النغمة بتتحمّل مرة واحدة في الذاكرة، والصوت بيتفتح مع أول لمسة، وبيرجع يتفتح لوحده كل ما الصفحة ترجع قدام أو المدرس يلمس الشاشة.
let ACX = null, RBUF = null, RLOAD = null, LAST_DING = 0;
const RING_SND = (() => { try { const a = new Audio('ring.mp3'); a.preload = 'auto'; return a; } catch (e) { return null; } })();   // احتياطي لو Web Audio مش موجود
function acx() { if (!ACX) { const C = window.AudioContext || window.webkitAudioContext; if (C) ACX = new C(); } return ACX; }
function loadRing() {
  const c = acx(); if (!c || RBUF || RLOAD) return RLOAD;
  RLOAD = fetch('ring.mp3').then(r => r.arrayBuffer()).then(b => new Promise((ok, no) => c.decodeAudioData(b, ok, no))).then(buf => { RBUF = buf; }).catch(() => { RLOAD = null; });
  return RLOAD;
}
function unlockAudio() {
  const c = acx(); if (!c) return;
  if (c.state !== 'running') c.resume().catch(() => { });
  loadRing();
  try { const s = c.createBufferSource(); s.buffer = c.createBuffer(1, 1, 22050); s.connect(c.destination); s.start(0); } catch (e) { }   // صوت فاضي عشان يفتح الصوت
}
['pointerdown', 'touchstart', 'keydown', 'click'].forEach(ev => document.addEventListener(ev, unlockAudio, { passive: true }));
document.addEventListener('visibilitychange', () => { if (!document.hidden && ACX && ACX.state !== 'running') ACX.resume().catch(() => { }); });
async function ding() {
  if (!isApp) return;   // الرنة في التطبيق المتثبّت بس — مش من المتصفح
  try { navigator.vibrate && navigator.vibrate([400, 150, 400, 150, 600]); } catch (e) { }
  if (document.hidden) return;   // في الخلفية: إشعار الموبايل هو اللي بيرن
  const now = Date.now(); if (now - LAST_DING < 1500) return; LAST_DING = now;   // مايتكررش فوق بعضه
  try {
    const c = acx();
    if (c) {
      if (c.state !== 'running') await c.resume().catch(() => { });
      if (!RBUF) await loadRing();
      if (RBUF && c.state === 'running') { const s = c.createBufferSource(); s.buffer = RBUF; s.connect(c.destination); s.start(0); return; }
    }
    if (RING_SND) { RING_SND.currentTime = 0; RING_SND.play().catch(() => { }); }
  } catch (e) { }
}

async function load() {
  if (!sb) { app.innerHTML = '<div class="alert">البرنامج لسه مش متظبط. كلّم المندوب.</div>'; return; }
  if (!code && isApp) return renderPasteCode();
  if (!code) { app.innerHTML = '<div class="alert"><h3>افتح الرابط اللي وصلك من المندوب</h3>الرابط ده لازم يكون فيه الكود الخاص بيك.</div>'; return; }
  try {
    const [{ data, error }, rv] = await Promise.all([sb.rpc('t_get', { p_code: code }), sb.rpc('t_recv_get', { p_code: code })]);
    if (error) throw error;
    if (rv && rv.data) RV = rv.data;
    if (!data) { app.innerHTML = '<div class="alert"><h3>الرابط ده مش شغال</h3>كلّم المندوب يبعتلك رابط جديد.</div>'; $('#tabs').hidden = true; return; }
    const first = !D; D = normD(data); SEEN = evSig(D); loadNews(); $('#tabs').hidden = false; render(); setBadge(); startWatch();
    // طلب تحديث جديد من آخر مرة ← صوت
    const ids = D.updates.map(u => u.id), seen = LS.get('selah-trial-tupd', []);
    if (ids.some(i => !seen.includes(i))) ding(); LS.set('selah-trial-tupd', ids);
    if (first) {
      const { data: rep } = await sb.rpc('t_rep', { p_code: code });
      window.TP = { id: D.id, rep, name: D.name, subs: (D.profile || {}).subjects || [] }; window.pushReady && window.pushReady();
      if (D.unread && window.pushNotifyRep) window.pushNotifyRep('✅ ' + D.name + ' فتح البرنامج وبيشوف رسايلك');
      reportInstall();
    }
  } catch (e) { app.innerHTML = `<div class="alert">${esc(errMsg(e))}</div><button class="btn" onclick="load()">حاول تاني</button>`; }
}
/* متابعة 10: المدرس فتح من التطبيق المتثبّت ← بيتسجل في القاعدة (فلتر «📲 مثبّت» عند المندوب)،
   وأول مرة بس بيوصل إشعار للمندوب والمالك «📲 الأستاذ فلان ثبّت التطبيق» */
async function reportInstall() {
  if (!isApp || !code || LS.get('selah-trial-inst') === code) return;
  try {
    const { data, error } = await sb.rpc('t_installed', { p_code: code });
    if (error || !data) return;
    LS.set('selah-trial-inst', code);
    if (data.first && (data.to || []).length && window.pushNotifyStaff) window.pushNotifyStaff(data.to, '📲 الأستاذ ' + (data.name || D.name) + ' ثبّت التطبيق');
  } catch (e) { }
}
/* متابعة الجديد في كل الصفحات (طلب شريف 2026-11-12): كل 15 ثانية والتطبيق قدام + أول ما يرجع قدام.
   النغمة بترن مع: رسالة أو تنبيه 🔔 جديد، طلب تحديث، سؤال من المندوب، قرار على تعديل، أي تغيير في الطلبات (استلام/موافقة/رفض/تعديل). */
let WATCH = null, SEEN = null;
function evSig(x) {
  return { u: x.unread || 0, up: (x.updates || []).map(u => u.id).join(','), q: x.pending && x.pending.status === 'question' ? (x.pending.id + ':' + (x.pending.at || '')) : '',
    d: (x.decisions || []).length, o: (x.orders || []).filter(o => o.status !== 'pending' || isRepOrd(o)).map(o => o.id + ':' + o.status + ':' + (o.items || []).map(i => i.q).join('.')).join('|') };
}
function isNewer(a, b) {
  return (view !== 'msgs' && a.u > b.u) || (!!a.up && a.up.split(',').some(i => !b.up.split(',').includes(i))) || (!!a.q && a.q !== b.q) || a.d > b.d || a.o !== b.o;
}
function updCounts() {
  const n = D.updates.length + (D.pending && D.pending.status === 'question' ? 1 : 0);
  $('#homeCnt').hidden = !n; $('#homeCnt').textContent = n; $('#msgCnt').hidden = !D.unread; $('#msgCnt').textContent = D.unread; updBell();
}
async function watchTick() {
  if (document.hidden || !code || !D || !isApp) return;
  try {
    let [{ data }, rv] = await Promise.all([sb.rpc('t_get', { p_code: code }), sb.rpc('t_recv_get', { p_code: code })]); if (!data) return; data = normD(data);
    if (rv && rv.data && !!rv.data.open !== !!(RV && RV.open)) { RV = rv.data; if (view === 'home') { D = data; render(); } }
    const a = evSig(data), b = SEEN || evSig(D); SEEN = a;
    if (isNewer(a, b)) ding();
    if (JSON.stringify(a) !== JSON.stringify(evSig(D))) {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
      D = data; setBadge();
      if (view === 'home' || (view === 'books' && !typing)) render(); else updCounts();
    }
  } catch (e) { }
}
function startWatch() {
  if (WATCH || !isApp) return;
  WATCH = setInterval(watchTick, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) watchTick(); });
}
// طلبات التحديث اللي المدرس ردّ عليها ماتظهرش تاني
function normD(d) { const done = LS.get('selah-trial-tupd-done', []); d.updates = (d.updates || []).filter(u => !done.includes(u.id)); return d; }
function go(v) { view = v; if (!isApp) toast('📲 ثبّت التطبيق الأول', 2500); render(); scrollTo(0, 0); }
// عدد الجديد على أيقونة البرنامج (في الموبايلات اللي بتسمح)
function setBadge() {
  const n = (D.unread || 0) + D.updates.length + (D.pending && D.pending.status === 'question' ? 1 : 0);
  try { if (navigator.setAppBadge) n ? navigator.setAppBadge(n) : navigator.clearAppBadge(); } catch (e) { }
}
function render() {
  clearInterval(pollT); $('#cbar').innerHTML = ''; app.className = 'wrap'; updBell();
  if (!isApp) return renderGate();   // من المتصفح: شاشة التثبيت بس
  if (NATIVE && !permOk()) return renderPerm();   // بند 50: مايدخلش غير لما يخلّص كل الأذونات
  if (!NATIVE && !webPermOk()) return renderWebPerm();   // نفس الفكرة للبرنامج المتثبّت من المتصفح
  $('#tabs').hidden = false;
  $$('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.v === view));
  const n = D.updates.length + (D.pending && D.pending.status === 'question' ? 1 : 0);
  $('#homeCnt').hidden = !n; $('#homeCnt').textContent = n;
  $('#msgCnt').hidden = !D.unread; $('#msgCnt').textContent = D.unread;
  $('#title').textContent = { me: '👤 بياناتي', msgs: '💬 الرسائل', books: '📚 كتبي', prices: '💰 أسعار الكتب', order: '🛒 اطلب كتبك بسعر مميز', inv: '🧾 فواتيري', ret: '↩️ مرتجعات', recv: '📦 استلمت مننا إيه', news: '🆕 اعرف الجديد' }[view] || 'أهلًا ' + tName(D.name);
  if (view !== 'news') newsSub = null;
  if (view === 'news') renderNews(); else if (view === 'recv') renderRecv(); else if (view === 'me') renderMe(); else if (view === 'msgs') renderMsgs(); else if (view === 'books') renderBooks(); else if (view === 'prices') renderPrices(); else if (view === 'order') renderOrder(); else if (view === 'inv') renderInv(); else if (view === 'ret') renderRet(); else renderHome();
}
const fieldsTxt = keys => keys.map(k => FIELD_LABEL[k] || k).join('، ');
const valsList = o => Object.keys(o || {}).map(k => `<div class="kv"><span>${FIELD_LABEL[k] || k}</span><span>${fmtVal(k, o[k])}</span></div>`).join('');

function renderHome() {
  const v = vals();
  // متابعة 7: اتشال الشريط الأبيض (اسم المدرس) — الرئيسية 6 مربعات قد بعض بأيقونات كرتونية ملوّنة
  const HI = { or: '🛒', ms: '💬', pr: '📚', nw: '📢', rv: '📦' };   // متابعة 8: أيقونات ملوّنة زي أيقونات الشريط اللي تحت
  let h = `<div class="promo"><div class="pr-t">كتب سلاح التلميذ <b>بسعر مميز</b></div>
    <div class="pr-r"><span>🚚 توصيل لحد السنتر</span><span>↩️ المرتجع علينا</span><span>💳 الدفع بعدين</span></div>
    <div class="pr-s">سلاح التلميذ.. معاك في القمة</div></div>`;
  h += `<div class="ttiles five"><button class="tt wd h-or" data-v="order"><span class="tti">${HI.or}</span><span class="tlx"><span class="ttl">اطلب كتبك بسعر مميز</span><span class="tsub">اطلب دلوقتي بأقل سعر وأسرع توصيل.. والحساب بعدين</span></span></button>
    <button class="tt h-ms" data-v="msgs"><span class="tti">${HI.ms}</span><span class="ttl">الرسائل</span>${D.unread ? `<span class="ttb">${D.unread}</span>` : ''}</button>
    <button class="tt h-pr" data-v="prices"><span class="tti">${HI.pr}</span><span class="ttl">أسعار الكتب</span></button>
    <button class="tt h-nw" data-v="news"><span class="tti">${HI.nw}</span><span class="ttl">اعرف الجديد</span>${newsTotal() ? `<span class="ttb">${newsTotal()}</span>` : ''}</button>
    <button class="tt h-rv ${RV && RV.open ? '' : 'lock'}" data-v="recv"><span class="tti">${HI.rv}</span><span class="ttl">استلمت مننا إيه</span>${!(RV && RV.open) ? '<span class="tts">🔒</span>' : ''}</button></div>`;
  const notif = NATIVE ? (window.SilahApp.pushOn() ? 'granted' : 'default') : 'Notification' in window ? Notification.permission : 'unsupported';
  if (notif !== 'granted' && notif !== 'unsupported') h += `<div class="icard"><div class="ic-t">🔔 فعّل الإشعارات</div>
    <div class="ic-s">عشان توصلك رسائل سلاح التلميذ ومواعيد تسليم النسخ المجانية.</div>
    <button class="gobtn" id="setup">🔔 فعّل الإشعارات</button></div>`;
  if (D.unread) h += `<div class="alert"><h3>💬 عندك ${D.unread} رسالة جديدة</h3><button class="btn danger" onclick="go('msgs')">افتح الرسائل ←</button></div>`;
  for (const u of D.updates) h += `<div class="alert"><h3>📝 مطلوب تحديث بياناتك</h3>${esc(fieldsTxt(u.fields || []))}${u.note ? `<div style="margin-top:6px">«${esc(u.note)}»</div>` : ''}
    <div class="acts"><button class="btn danger" onclick="go('me')">حدّث دلوقتي ←</button></div></div>`;
  const p = D.pending;
  if (p && p.status === 'question') h += `<div class="note"><h3 style="margin:0 0 6px">❓ سؤال من المندوب على تعديلك</h3>«${esc(p.reason || '')}»
    <textarea id="reply" placeholder="اكتب ردك هنا…" style="margin-top:8px"></textarea>
    <div class="acts"><button class="btn owe" id="sendReply">ابعت الرد</button><button class="btn ghost" onclick="go('me')">عدّل بياناتي</button></div></div>`;
  else if (p) h += `<div class="note"><b>⏳ تعديلك في انتظار المراجعة</b><div class="small" style="margin-top:4px">${esc(fieldsTxt(Object.keys(p.new_values || {})))}${p.photos ? ` + ${p.photos} صورة` : ''}</div></div>`;
  // الكروت الخلصانة: عليها ❌ والمدرس يشيلها
  const gone = new Set(LS.get(DISMISS, []));
  const xb = k => `<button class="xbtn" data-x="${esc(k)}" aria-label="شيل">✕</button>`;
  for (const o of D.orders.filter(o => o.status !== 'pending' && !isRepOrd(o) && !(o.kind === 'order' && o.status === 'approved') && !gone.has('o' + o.id)).slice(0, 3)) h += `<div class="${o.status === 'approved' ? 'good' : 'alert'}">${xb('o' + o.id)}${o.status === 'approved' ? '✅ اتوافق على' : '❌ اترفض'} ${o.kind === 'order' ? 'طلب الكتب' : 'تعديل الكميات'}${o.reason ? ' — ' + esc(o.reason) : ''}<div class="small">${fmtDate(o.at)}</div></div>`;
  const decs = D.decisions.filter(d => !gone.has('d' + d.at));
  if (decs.length) {
    h += '<div class="card"><h3>آخر القرارات على تعديلاتك</h3>';
    for (const d of decs) {

function recvBooks() {

  const PS = ['ar', 'math', 'stu', 'en', 'sci'], MS = ['ar', 'math', 'stu'], FROMP = { sci: 4, stu: 4 };
  let gs = (p.grades || []).map(Number).filter(g => g >= 1 && g <= 9);
  if (!gs.length) gs = [...(stg.includes('p') ? [1, 2, 3, 4, 5, 6] : []), ...(stg.includes('m') ? [7, 8, 9] : [])];
  const out = [];
  for (const s of subs) for (const g of gs) {
    if (g <= 6) { if (PS.includes(s) && g >= (FROMP[s] || 1)) out.push(`p-${s}-${g}`); }
    else if (MS.includes(s)) out.push(`m-${s}-${g - 6}`);

}
