<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<title>سلاح التلميذ - المدرس</title>
<link rel="manifest" href="teacher.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<style>
.t-nw{grid-column:1/-1;background:linear-gradient(140deg,#f472b6,#be185d)}
.t-rv{grid-column:1/-1;background:linear-gradient(140deg,#2dd4bf,#0e7490)}.t-rv.lock{background:linear-gradient(140deg,#cbd5e1,#64748b)}
.rvl label{display:flex;align-items:center;gap:10px;padding:12px;border:2px solid #e2e8f0;border-radius:14px;margin-bottom:8px;font-weight:700;font-size:17px;cursor:pointer;background:#fff}
.rvl label.on{border-color:#16a34a;background:#dcfce7}.rvl input{width:24px;height:24px}
</style>
</head>
<body>
<header class="top"><div class="in"><h1 id="title">سلاح التلميذ</h1><button class="hb" id="reload" aria-label="تحديث">🔄</button></div></header>
<main class="wrap" id="app"><div class="loading">جاري التحميل…</div></main>
<div id="cbar"></div>
<nav class="tabs" id="tabs" hidden>
  <a data-v="home"><span class="i">🏠</span>الرئيسية<span class="cnt" id="homeCnt" hidden></span></a>
  <a data-v="msgs"><span class="i">💬</span>الرسائل<span class="cnt" id="msgCnt" hidden></span></a>
  <a data-v="books" id="booksTab" hidden><span class="i">📚</span>كتبي</a>
  <a data-v="me"><span class="i">👤</span>ملفي</a>
</nav>
<script>
"use strict";
const TCFG = 'selah-trial-tcfg', TCODE = 'selah-trial-tcode', DISMISS = 'selah-trial-tdismiss';
(function () {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('p')) { const c = decodeCfg(h.get('p')); if (c) LS.set(TCFG, c); }
  if (h.get('c')) { LS.set(TCODE, h.get('c').trim()); history.replaceState(null, '', location.pathname + (h.get('v') ? '#v=' + h.get('v') : '')); }
})();
const code = LS.get(TCODE);
const sb = makeClient(false, TCFG);
const app = $('#app');
let D = null, view = (new URLSearchParams(location.hash.slice(1)).get('v')) || 'home', newPhotos = [], st = {}, msgs = [], lastId = 0, pollT = null, instEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); instEvt = e; if (D) render(); });
window.addEventListener('appinstalled', () => { instEvt = null; installedNow = true; if (D) render(); });
let installedNow = false;
let RV = null;   // 📦 استلمت إيه: {open, recv:{b:[...], at}}

const NATIVE = !!window.SilahApp;   // جوه تطبيق الأندرويد الحقيقي (بند 48)
const isApp = NATIVE || matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const UA = navigator.userAgent, IOS = /iphone|ipad|ipod/i.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
const INAPP = /FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\)/i.test(UA), SAMSUNG = /SamsungBrowser/i.test(UA), IOS_SAFARI = IOS && !/CriOS|FxiOS|EdgiOS|OPiOS/i.test(UA) && !INAPP;
const tName = n => 'أ/ ' + String(n || '').trim();
const vals = () => ({ ...(D.profile || {}), avatar: D.avatar || '' });
// لو الكتاب ليه سعر قبل الخصم بس، بيظهر بيه (من غير ما يختفي)
const prices = () => ((D.prices && D.prices.items) || []).map(p => p.post == null && p.pre != null ? { ...p, post: p.pre, pre: null } : p);
// النغمة: الموبايل بيمنع الصوت لحد ما المدرس يلمس الشاشة مرة — فأول لمسة «بتفتح» الصوت (بصمت)، وبعدها النغمة بتشتغل مع أي رسالة أو تنبيه
// (2026-11-12 تاني) النغمة كانت بتشتغل ساعات وساعات لأ: الموبايل بيوقّف الصوت لما الصفحة تروح الخلفية.
// الحل: Web Audio — النغمة بتتحمّل مرة واحدة في الذاكرة، والصوت بيتفتح مع أول لمسة، وبيرجع يتفتح لوحده كل ما الصفحة ترجع قدام أو المدرس يلمس الشاشة.
let ACX = null, RBUF = null, RLOAD = null, LAST_DING = 0;
const RING_SND = (() => { try { const a = new Audio('ring.mp3'); a.preload = 'auto'; return a; } catch (e) { return null; } })();   // احتياطي لو Web Audio مش موجود
function acx() { if (!ACX) { const C = window.AudioContext || window.webkitAudioContext; if (C) ACX = new C(); } return ACX; }
function loadRing() {
  const c = acx(); if (!c || RBUF || RLOAD) return RLOAD;
  RLOAD = fetch('ring.mp3').then(r => r.arrayBuffer()).then(b => new Promise((ok, no) => c.decodeAudioData(b, ok, no))).then(buf => { RBUF = buf; }).catch(() => { RLOAD = null; });
  return RLOAD;
}
function unlockAudio() {
  const c = acx(); if (!c) return;
  if (c.state !== 'running') c.resume().catch(() => { });
  loadRing();
  try { const s = c.createBufferSource(); s.buffer = c.createBuffer(1, 1, 22050); s.connect(c.destination); s.start(0); } catch (e) { }   // صوت فاضي عشان يفتح الصوت
}
['pointerdown', 'touchstart', 'keydown', 'click'].forEach(ev => document.addEventListener(ev, unlockAudio, { passive: true }));
document.addEventListener('visibilitychange', () => { if (!document.hidden && ACX && ACX.state !== 'running') ACX.resume().catch(() => { }); });
async function ding() {
  if (!isApp) return;   // الرنة في التطبيق المتثبّت بس — مش من المتصفح
  try { navigator.vibrate && navigator.vibrate([400, 150, 400, 150, 600]); } catch (e) { }
  if (document.hidden) return;   // في الخلفية: إشعار الموبايل هو اللي بيرن
  const now = Date.now(); if (now - LAST_DING < 1500) return; LAST_DING = now;   // مايتكررش فوق بعضه
  try {
    const c = acx();
    if (c) {
      if (c.state !== 'running') await c.resume().catch(() => { });
      if (!RBUF) await loadRing();
      if (RBUF && c.state === 'running') { const s = c.createBufferSource(); s.buffer = RBUF; s.connect(c.destination); s.start(0); return; }
    }
    if (RING_SND) { RING_SND.currentTime = 0; RING_SND.play().catch(() => { }); }
  } catch (e) { }
}

async function load() {
  if (!sb) { app.innerHTML = '<div class="alert">البرنامج لسه مش متظبط. كلّم المندوب.</div>'; return; }
  if (!code && isApp) return renderPasteCode();
  if (!code) { app.innerHTML = '<div class="alert"><h3>افتح الرابط اللي وصلك من المندوب</h3>الرابط ده لازم يكون فيه الكود الخاص بيك.</div>'; return; }
  try {
    const [{ data, error }, rv] = await Promise.all([sb.rpc('t_get', { p_code: code }), sb.rpc('t_recv_get', { p_code: code })]);
    if (error) throw error;
    if (rv && rv.data) RV = rv.data;
    if (!data) { app.innerHTML = '<div class="alert"><h3>الرابط ده مش شغال</h3>كلّم المندوب يبعتلك رابط جديد.</div>'; $('#tabs').hidden = true; return; }
    const first = !D; D = normD(data); SEEN = evSig(D); loadNews(); $('#tabs').hidden = false; render(); setBadge(); startWatch();
    // طلب تحديث جديد من آخر مرة ← صوت
    const ids = D.updates.map(u => u.id), seen = LS.get('selah-trial-tupd', []);
    if (ids.some(i => !seen.includes(i))) ding(); LS.set('selah-trial-tupd', ids);
    if (first) {
      const { data: rep } = await sb.rpc('t_rep', { p_code: code });
      window.TP = { id: D.id, rep, name: D.name, subs: (D.profile || {}).subjects || [] }; window.pushReady && window.pushReady();
      if (D.unread && window.pushNotifyRep) window.pushNotifyRep('✅ ' + D.name + ' فتح البرنامج وبيشوف رسايلك');
    }
  } catch (e) { app.innerHTML = `<div class="alert">${esc(errMsg(e))}</div><button class="btn" onclick="load()">حاول تاني</button>`; }
}
/* متابعة الجديد في كل الصفحات (طلب شريف 2026-11-12): كل 15 ثانية والتطبيق قدام + أول ما يرجع قدام.
   النغمة بترن مع: رسالة أو تنبيه 🔔 جديد، طلب تحديث، سؤال من المندوب، قرار على تعديل، أي تغيير في الطلبات (استلام/موافقة/رفض/تعديل). */
let WATCH = null, SEEN = null;
function evSig(x) {
  return { u: x.unread || 0, up: (x.updates || []).map(u => u.id).join(','), q: x.pending && x.pending.status === 'question' ? (x.pending.id + ':' + (x.pending.at || '')) : '',
    d: (x.decisions || []).length, o: (x.orders || []).filter(o => o.status !== 'pending' || isRepOrd(o)).map(o => o.id + ':' + o.status + ':' + (o.items || []).map(i => i.q).join('.')).join('|') };
}
function isNewer(a, b) {
  return (view !== 'msgs' && a.u > b.u) || (!!a.up && a.up.split(',').some(i => !b.up.split(',').includes(i))) || (!!a.q && a.q !== b.q) || a.d > b.d || a.o !== b.o;
}
function updCounts() {
  const n = D.updates.length + (D.pending && D.pending.status === 'question' ? 1 : 0);
  $('#homeCnt').hidden = !n; $('#homeCnt').textContent = n; $('#msgCnt').hidden = !D.unread; $('#msgCnt').textContent = D.unread;
}
async function watchTick() {
  if (document.hidden || !code || !D || !isApp) return;
  try {
    let [{ data }, rv] = await Promise.all([sb.rpc('t_get', { p_code: code }), sb.rpc('t_recv_get', { p_code: code })]); if (!data) return; data = normD(data);
    if (rv && rv.data && !!rv.data.open !== !!(RV && RV.open)) { RV = rv.data; if (view === 'home') { D = data; render(); } }
    const a = evSig(data), b = SEEN || evSig(D); SEEN = a;
    if (isNewer(a, b)) ding();
    if (JSON.stringify(a) !== JSON.stringify(evSig(D))) {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
      D = data; setBadge();
      if (view === 'home' || (view === 'books' && !typing)) render(); else updCounts();
    }
  } catch (e) { }
}
function startWatch() {
  if (WATCH || !isApp) return;
  WATCH = setInterval(watchTick, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) watchTick(); });
}
// طلبات التحديث اللي المدرس ردّ عليها ماتظهرش تاني
function normD(d) { const done = LS.get('selah-trial-tupd-done', []); d.updates = (d.updates || []).filter(u => !done.includes(u.id)); return d; }
function go(v) { view = v; if (!isApp) toast('📲 ثبّت التطبيق الأول', 2500); render(); scrollTo(0, 0); }
// عدد الجديد على أيقونة البرنامج (في الموبايلات اللي بتسمح)
function setBadge() {
  const n = (D.unread || 0) + D.updates.length + (D.pending && D.pending.status === 'question' ? 1 : 0);
  try { if (navigator.setAppBadge) n ? navigator.setAppBadge(n) : navigator.clearAppBadge(); } catch (e) { }
}
function render() {
  clearInterval(pollT); $('#cbar').innerHTML = '';
  if (!isApp) return renderGate();   // من المتصفح: شاشة التثبيت بس
  $$('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.v === view));
  const n = D.updates.length + (D.pending && D.pending.status === 'question' ? 1 : 0);
  $('#homeCnt').hidden = !n; $('#homeCnt').textContent = n;
  $('#msgCnt').hidden = !D.unread; $('#msgCnt').textContent = D.unread;
  $('#booksTab').hidden = !((D.books || []).length || D.orders.length || canOrder(D.profile));
  $('#title').textContent = { me: 'ملفي', msgs: '💬 ' + (D.rep ? 'الأستاذ ' + D.rep : 'الرسائل'), books: '📚 كتبي', prices: '💰 أسعار الكتب', order: '🛒 اطلب كتبك بسعر مميز', recv: '📦 استلمت مننا إيه', news: '🆕 اعرف الجديد' }[view] || 'أهلًا ' + tName(D.name);
  if (view !== 'news') newsSub = null;
  if (view === 'news') renderNews(); else if (view === 'recv') renderRecv(); else if (view === 'me') renderMe(); else if (view === 'msgs') renderMsgs(); else if (view === 'books') renderBooks(); else if (view === 'prices') renderPrices(); else if (view === 'order') renderOrder(); else renderHome();
}
const fieldsTxt = keys => keys.map(k => FIELD_LABEL[k] || k).join('، ');
const valsList = o => Object.keys(o || {}).map(k => `<div class="kv"><span>${FIELD_LABEL[k] || k}</span><span>${fmtVal(k, o[k])}</span></div>`).join('');

function renderHome() {
  const v = vals();
  let h = `<div class="card" style="display:flex;align-items:center;gap:12px">${v.avatar ? `<img class="av lg" src="${v.avatar}" alt="">` : '<span class="av lg">👤</span>'}
    <div><b style="font-size:19px">${esc(tName(D.name))}</b><div class="muted small">${esc([valText('subjects', v.subjects), v.area].filter(x => x && x !== '—').join(' · '))}</div></div></div>`;
  // أيقونات الرئيسية
  h += `<div class="ttiles"><button class="tt big" data-v="order"><span class="tti">🛒</span><span class="ttl">اطلب كتبك بسعر مميز</span><span class="tts">أسعار خاصة لحضرتك — اطلب دلوقتي 🔥</span></button>
    <button class="tt t-msg" data-v="msgs"><span class="tti">💬</span><span class="ttl">الرسائل</span>${D.unread ? `<span class="ttb">${D.unread}</span>` : ''}</button>
    <button class="tt t-pr" data-v="prices"><span class="tti">💰</span><span class="ttl">أسعار الكتب</span></button>
    <button class="tt t-bk" data-v="books"><span class="tti">📚</span><span class="ttl">كتبي</span></button>
    <button class="tt t-me" data-v="me"><span class="tti">👤</span><span class="ttl">ملفي</span>${D.updates.length ? '<span class="ttb">!</span>' : ''}</button>
    <button class="tt t-nw" data-v="news"><span class="tti">🆕</span><span class="ttl">اعرف الجديد</span><span class="tts">فيديوهات وشروحات لمادتك</span>${newsTotal() ? `<span class="ttb">${newsTotal()}</span>` : ''}</button>
    <button class="tt t-rv ${RV && RV.open ? '' : 'lock'}" data-v="recv"><span class="tti">📦</span><span class="ttl">استلمت مننا إيه الترم ده</span><span class="tts">${!(RV && RV.open) ? '🔒 هتتفتح لما المندوب يسلّمك' : RV.recv ? '✅ اتبعت — تقدر تعدّل' : 'علّم على الكتب اللي استلمتها'}</span></button></div>`;
  // المدرس اللي على النسخة المتثبّتة من المتصفح (أندرويد): يتنقل للتطبيق الحقيقي عشان الإشعار يرن والموبايل مقفول
  if (!NATIVE && /Android/i.test(UA)) h += `<div class="icard"><div class="ic-t">📲 نزّل تطبيق «سلاح التلميذ» الجديد</div>
    <div class="ic-s">عشان رسايل الأستاذ ترن عندك والموبايل مقفول 🔔 (بعد ما تثبّته امسح النسخة دي)</div>
    <button class="gobtn" id="getApk">⬇️ نزّل التطبيق</button></div><div id="guide"></div>`;
  h += ringCard();
  const notif = NATIVE ? (window.SilahApp.pushOn() ? 'granted' : 'default') : 'Notification' in window ? Notification.permission : 'unsupported';
  if (notif !== 'granted' && notif !== 'unsupported') h += `<div class="icard"><div class="ic-t">🔔 فعّل الإشعارات</div>
    <div class="ic-s">عشان توصلك رسائل سلاح التلميذ ومواعيد تسليم النسخ المجانية.</div>
    <button class="gobtn" id="setup">🔔 فعّل الإشعارات</button></div>`;
  if (D.unread) h += `<div class="alert"><h3>💬 عندك ${D.unread} رسالة جديدة</h3><button class="btn danger" onclick="go('msgs')">افتح الرسائل ←</button></div>`;
  for (const u of D.updates) h += `<div class="alert"><h3>📝 مطلوب تحديث بياناتك</h3>${esc(fieldsTxt(u.fields || []))}${u.note ? `<div style="margin-top:6px">«${esc(u.note)}»</div>` : ''}
    <div class="acts"><button class="btn danger" onclick="go('me')">حدّث دلوقتي ←</button></div></div>`;
  const p = D.pending;
  if (p && p.status === 'question') h += `<div class="note"><h3 style="margin:0 0 6px">❓ سؤال من المندوب على تعديلك</h3>«${esc(p.reason || '')}»
    <textarea id="reply" placeholder="اكتب ردك هنا…" style="margin-top:8px"></textarea>
    <div class="acts"><button class="btn owe" id="sendReply">ابعت الرد</button><button class="btn ghost" onclick="go('me')">عدّل ملفي</button></div></div>`;
  else if (p) h += `<div class="note"><b>⏳ تعديلك في انتظار المراجعة</b><div class="small" style="margin-top:4px">${esc(fieldsTxt(Object.keys(p.new_values || {})))}${p.photos ? ` + ${p.photos} صورة` : ''}</div></div>`;
  // الكروت الخلصانة: عليها ❌ والمدرس يشيلها
  const gone = new Set(LS.get(DISMISS, []));
  const xb = k => `<button class="xbtn" data-x="${esc(k)}" aria-label="شيل">✕</button>`;
  for (const o of D.orders.filter(o => o.status !== 'pending' && !isRepOrd(o) && !(o.kind === 'order' && o.status === 'approved') && !gone.has('o' + o.id)).slice(0, 3)) h += `<div class="${o.status === 'approved' ? 'good' : 'alert'}">${xb('o' + o.id)}${o.status === 'approved' ? '✅ اتوافق على' : '❌ اترفض'} ${o.kind === 'order' ? 'طلب الكتب' : 'تعديل الكميات'}${o.reason ? ' — ' + esc(o.reason) : ''}<div class="small">${fmtDate(o.at)}</div></div>`;
  const decs = D.decisions.filter(d => !gone.has('d' + d.at));
  if (decs.length) {
    h += '<div class="card"><h3>آخر القرارات على تعديلاتك</h3>';
    for (const d of decs) {
      if (d.status === 'rejected') h += `<div class="alert" style="margin:8px 0 0">${xb('d' + d.at)}❌ اترفض تعديل (${esc(fieldsTxt(Object.keys(d.new_values || {})))})${d.reason ? `<br>السبب: ${esc(d.reason)}` : ''}<div class="small">${fmtDate(d.at)}</div></div>`;
      else {
        const edited = Object.keys(d.final_values || {}).filter(k => JSON.stringify(d.final_values[k]) !== JSON.stringify((d.new_values || {})[k]));
        h += `<div class="good" style="margin:8px 0 0">${xb('d' + d.at)}✅ اتوافق على تعديلك (${esc(fieldsTxt(Object.keys(d.final_values || {})))})
          ${edited.length ? `<div class="small" style="margin-top:4px">✏️ المندوب عدّل قبل الموافقة:</div>${valsList(Object.fromEntries(edited.map(k => [k, d.final_values[k]])))}` : ''}
          ${d.reason ? `<div class="small">ملاحظة: ${esc(d.reason)}</div>` : ''}<div class="small">${fmtDate(d.at)}</div></div>`;
      }
    }
    h += '</div>';
  }
  app.innerHTML = h;
  $$('.ttiles [data-v]').forEach(b => b.onclick = () => (b.dataset.v === 'recv' && !(RV && RV.open)) ? toast('🔒 الصفحة دي هتتفتح لما المندوب يسلّمك الكتب', 3000) : go(b.dataset.v));
  $$('[data-x]').forEach(b => b.onclick = () => { const a = LS.get(DISMISS, []); a.push(b.dataset.x); LS.set(DISMISS, a.slice(-200)); renderHome(); });
  // متابعة الجديد بقت في كل الصفحات (startWatch تحت)
  const su = $('#setup'); su && (su.onclick = setupApp);
  const ga = $('#getApk'); ga && (ga.onclick = apkGuide);
  bindRingCard();
  const sr = $('#sendReply');
  sr && (sr.onclick = async () => {
    const r = $('#reply').value.trim(); if (!r) return toast('اكتب الرد الأول');
    sr.disabled = true;
    const { error } = await sb.rpc('t_submit', { p_code: code, p_values: {}, p_photos: [], p_reply: r });
    if (error) { sr.disabled = false; return toast(errMsg(error)); }
    toast('اتبعت ✅'); load();
  });
}
async function setupApp() {
  if (NATIVE) { window.SilahApp.askPush(); setTimeout(renderHome, 4000); return; }
  try { if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission(); } catch (e) { }
  if (window.pushInit) try { await window.pushInit(); } catch (e) { }
  if (instEvt) { instEvt.prompt(); try { await instEvt.userChoice; } catch (e) { } instEvt = null; }
  else if (!matchMedia('(display-mode: standalone)').matches) toast('من قايمة Chrome (⋮) اختار «تثبيت التطبيق» أو «إضافة للشاشة الرئيسية»', 5000);
  renderHome();
}

/* ---------- شاشة التثبيت (من المتصفح) + دليل خطوة بخطوة بالصور ---------- */
// رسمة موبايل فيها الحتة المهمة متعلّمة بدايرة حمرا وسهم
function phone(inner) {

}

async function pullMsgs(first) {

const mySubs = () => ((D.profile || {}).subjects || []).filter(s => NEWS_CH[s]);
function newsNew(s) { const seen = LS.get('selah-news-seen', {})[s] || ''; return NEWS.items.filter(x => x.s === s && x.at > seen).length; }
function newsTotal() { return [...mySubs(), 'all'].reduce((n, s) => n + newsNew(s), 0); }
function renderNews() {
  loadNews();
  const mine = mySubs();
  if (!newsSub) {
    const tile = (s, me) => { const n = me ? newsNew(s) : 0, c = NEWS.items.filter(x => x.s === s).length;
      return `<button class="tt" data-ns="${s}" style="background:${s === 'all' ? 'linear-gradient(140deg,#94a3b8,#475569)' : `linear-gradient(140deg,${SUBJ_COL[s]}cc,${SUBJ_COL[s]})`};${me ? '' : 'opacity:.8'}"><span class="tti">${s === 'all' ? '📢' : '📚'}</span><span class="ttl">${NEWS_L[s]}</span><span class="tts">${me && s !== 'all' ? '⭐ مادتك' : c ? c + ' ملف' : ''}</span>${n ? `<span class="ttb">${n}</span>` : ''}</button>`; };
    const rest = Object.keys(NEWS_CH).filter(s => !mine.includes(s));
    app.innerHTML = `<div class="phead">🆕 اعرف الجديد<div class="small">فيديوهات وشروحات وملفات لكل مادة — اختار المادة</div></div>
      <div class="ttiles">${mine.map(s => tile(s, true)).join('')}${tile('all', true)}</div>
      ${rest.length ? `<div class="small muted" style="margin:4px 0 8px">باقي المواد:</div><div class="ttiles">${rest.map(s => tile(s, false)).join('')}</div>` : ''}`;
    $$('[data-ns]').forEach(b => b.onclick = () => { newsSub = b.dataset.ns; render(); scrollTo(0, 0); });
    return;
  }
  const s = newsSub, seenAll = LS.get('selah-news-seen', {}), seen = seenAll[s] || '', l = NEWS.items.filter(x => x.s === s);
  app.innerHTML = `<button class="btn sm ghost" id="nback" style="margin-bottom:8px">→ كل المواد</button>
    <div class="phead" style="${s !== 'all' ? `background:${SUBJ_COL[s]}` : ''}">${esc(NEWS_L[s])}</div>
    ${NEWS_CH[s] ? `<a class="gobtn" style="display:block;text-align:center;text-decoration:none;margin-bottom:12px;background:#229ED9" target="_blank" rel="noopener" href="https://t.me/${NEWS_CH[s]}">✈️ افتح قناة ${esc(NEWS_L[s])} على تليجرام</a>` : ''}
    ${l.length ? l.map(x => `<button class="card" data-nf="${esc(x.id)}" style="display:flex;gap:10px;align-items:center;width:100%;text-align:start;font-family:inherit;font-size:16px;cursor:pointer;border:0"><span style="font-size:30px">${NEWS_IC[x.t] || '📎'}</span><span style="flex:1"><b>${esc(x.n)}</b>${x.at > seen ? ' <span class="pill bad">جديد</span>' : ''}<br><span class="small muted">${fmtDate(x.at)}</span></span><span style="font-size:20px">◀</span></button>`).join('')
      : '<div class="card empty">لسه مفيش ملفات هنا — تابعنا، الجديد جاي قريب 🌟</div>'}`;
  seenAll[s] = new Date().toISOString(); LS.set('selah-news-seen', seenAll);
  $('#nback').onclick = () => { newsSub = null; render(); };
  $$('[data-nf]').forEach(b => b.onclick = () => {
    const x = l.find(y => y.id === b.dataset.nf); if (!x) return;
    const v = document.createElement('div');
    v.style.cssText = 'position:fixed;inset:0;z-index:999;background:#000;display:flex;flex-direction:column';
    v.innerHTML = `<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;color:#fff"><b style="flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(x.n)}</b><button class="btn sm" id="nvx">✕ قفل</button></div>
      <iframe src="https://drive.google.com/file/d/${encodeURIComponent(x.id)}/preview" allow="autoplay; fullscreen" allowfullscreen style="flex:1;border:0;width:100%;background:#fff"></iframe>`;
    document.body.appendChild(v); $('#nvx', v).onclick = () => v.remove();
  });
}

/* ---------- ملفي ---------- */
function renderMe() {
  const req = new Set(D.updates.flatMap(u => u.fields || []));
  const pend = D.pending ? D.pending.new_values : null;
  st = {};
  // الملف متقسم كروت ملونة. كل كارت ليه أيقونة في دايرة
  const V = vals(), o = { req, pend, remind: true, noWarn: true };
  const SEC = [['me', '👤', 'بياناتي', ['name', 'avatar', 'phone']], ['work', '📚', 'شغلي', ['stage', 'subjects', 'spec', 'grades', 'where', 'students', 'area', 'school']],
    ['place', '🚚', 'مكان الدرس', ['address', 'loc']], ['days', '🕒', 'أيام السنتر', ['days']]];
  const reqList = [...req].filter(k => FIELD_LABEL[k]);
  app.innerHTML = `<form id="pf" class="pform" onsubmit="return false">
    ${reqList.length ? `<div class="reqbar"><b>📝 مطلوب منك تحدّث:</b><div class="pgrid">${reqList.map(k => `<button type="button" class="chip" data-go="${k}">${FIELD_LABEL[k]}</button>`).join('')}</div></div>` : ''}
    <div class="warnbox">${WARN_TXT}</div>
    <div class="small muted" style="text-align:center;margin-bottom:8px">أي تعديل بيروح للمندوب يراجعه الأول، وبعد الموافقة يتعتمد.</div>
    ${SEC.map(([k, ic, t, keys]) => `<section class="psec s-${k}"><div class="psh"><span class="pdot">${ic}</span>${t}</div>${profileForm(V, { ...o, only: keys })}</section>`).join('')}
    <section class="psec s-ph"><div class="psh"><span class="pdot">📷</span>صور مع طلبتك</div>
    <div class="field${req.has('photos') ? ' req' : ''}" data-f="photos"><label>📷 صور إضافية${req.has('photos') ? ' <span class="pill bad">مطلوب تحديثه</span>' : ''}</label>
      <div class="avnote">📷 صورة سيلفي ليك مع طلبتك وهم ماسكين كتبنا 📚 — لازم حضرتك تكون في الصورة</div>
      <div class="photos" id="phs"></div>
      <div class="avbtns" style="margin-top:8px"><label class="btn pri">📷 كاميرا<input type="file" accept="image/*" capture="environment" class="phIn" hidden></label><label class="btn">🖼️ المعرض<input type="file" accept="image/*" multiple class="phIn" hidden></label></div>
      ${D.pending && D.pending.photos ? `<div class="pend">⏳ ${D.pending.photos} صورة في انتظار المراجعة</div>` : ''}</div></section>
    <div class="savebar"><button class="gobtn" id="save">✅ تم — ابعت للمراجعة</button></div></form>`;
  const f = $('#pf'); bindProfileForm(f, st, { remind: true }); drawPhotos();
  $$('.pgrid input:checked', f).forEach(i => i.parentNode.classList.add('on'));
  $$('[data-go]', f).forEach(b => b.onclick = () => { const x = $(`.field[data-f="${b.dataset.go}"]`, f); x && x.scrollIntoView({ behavior: 'smooth', block: 'center' }); });
  $$('.phIn').forEach(inp => inp.onchange = async e => {
    const files = [...e.target.files]; e.target.value = '';
    for (const fl of files) { try { newPhotos.push(await compressImage(fl, 1280, 60000)); drawPhotos(); } catch (er) { toast(errMsg(er)); } }
  });
  $('#save').onclick = async () => {
    const nv = readProfileForm(f, st), ch = changedOnly(vals(), nv);
    if (!Object.keys(ch).length && !newPhotos.length) return toast('مفيش تغيير');
    if ('name' in ch && !String(ch.name).trim()) return toast('الاسم مينفعش يبقى فاضي');
    const b = $('#save'); b.disabled = true; b.textContent = 'جاري الإرسال…';
    const { error } = await sb.rpc('t_submit', { p_code: code, p_values: ch, p_photos: newPhotos, p_reply: null });
    if (error) { b.disabled = false; b.textContent = '✅ تم — ابعت للمراجعة'; return toast(errMsg(error)); }
    // طلبات التحديث اللي اتردّ عليها تتشال من عنده
    const ids = (D.updates || []).map(u => u.id), done = LS.get('selah-trial-tupd-done', []); LS.set('selah-trial-tupd-done', [...new Set([...done, ...ids])].slice(-100));
    newPhotos = []; toast('اتبعت للمراجعة ✅ — جزاك الله خيرًا'); window.pushNotifyRep && window.pushNotifyRep('📝 ' + D.name + ' عدّل ملفه'); view = 'home'; load();
  };
  const first = $('.field.req'); first && first.scrollIntoView({ block: 'center' });
}
function drawPhotos() {
  const box = $('#phs'); if (!box) return;
  box.innerHTML = newPhotos.map((p, i) => `<div class="ph"><img src="${p}" alt=""><button type="button" class="x" data-i="${i}">✕</button></div>`).join('');
  $$('.x', box).forEach(b => b.onclick = () => { newPhotos.splice(+b.dataset.i, 1); drawPhotos(); });
}

$$('#tabs a').forEach(a => a.onclick = () => go(a.dataset.v));
$('#reload').onclick = () => load();
load();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
