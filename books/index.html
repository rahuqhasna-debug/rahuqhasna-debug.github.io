/* ================= البيع والتجار ================= */
// البيع: إنجليزي ابتدائي 1-6، وإعدادي (عربي ورياضة ودراسات 1-3). الخصم: إنجليزي 30%، إعدادي 24.5%
const SELL_KEYS = BOOK_ORDER.filter(k=>{ const {st,sb}=bookParts(k); return st==='m' || sb==='en'; });
const isSell = k => SELL_KEYS.includes(k);
const discOf = k => bookParts(k).st==='m' ? 0.245 : 0.30;
const r2 = n => Math.round(n*100)/100;
const fmtN = n => r2(n).toLocaleString('en-US',{maximumFractionDigits:2});
const fmtM = n => fmtN(n)+' ج';
const byRank = (a,b)=>bookRank[a.b]-bookRank[b.b];
let ACC = {}, salesTab = 'orders';
function parseNum(v){
  if(v===undefined || v===null || v==='') return null;
  if(typeof v==='number') return v;
  const s=digits(v).replace(/٫/g,'.').replace(/[,،]/g,'').replace(/[^\d.\-]/g,'');
  if(!s) return null; const n=parseFloat(s); return isNaN(n)?null:n;
}
function priceOf(k){
  const p=db.prices[k]; if(!p) return null;
  const post = p.post!=null ? p.post : p.pre!=null ? r2(p.pre*(1-discOf(k))) : null;
  return post==null ? null : {pre:p.pre??null, post};
}
// أول سعر يترفع: البيع اللي اتسجل من غير سعر، وبضاعة التجار اللي من غير سعر
function fillPrices(){
  for(const s of db.sales) if(s.st==='sold') for(const it of s.items) if(it.post==null){ const p=priceOf(it.b); if(p){ it.pre=p.pre; it.post=p.post; } }
  for(const l of db.merchants) if(l.p==null){ const p=priceOf(l.b); if(p) l.p=p.post; }
}
const saleIdx = () => Object.fromEntries(db.sales.map(s=>[s.id,s]));
function itemsLine(items){
  return [...items].sort(byRank).map(it=>`<span class="bk" style="color:var(--c-${bookParts(it.b).sb})">${esc(bookLabel(it.b))}</span> × ${it.q}`).join('، ');
}
const waLink = (phone, text) => `https://wa.me/${phone?'2'+phone:''}?text=${encodeURIComponent(text)}`;
const pickDate = v => (!v || v===dayKey()) ? new Date().toISOString() : new Date(v+'T12:00:00').toISOString();

/* --- بضاعة التجار: أول دخل أول خرج --- */
function lotUsed(){
  const u={};
  for(const s of db.sales) if(s.st==='sold') for(const it of s.items) for(const x of it.src||[]) if(x.lot) u[x.lot]=(u[x.lot]||0)+x.q;
  for(const p of db.payments) if(p.k==='ret') for(const pt of p.parts||[]) for(const x of pt.lots||[]) if(x.lot) u[x.lot]=(u[x.lot]||0)-x.q;
  for(const r of db.merchRets) for(const x of r.lots||[]) u[x.lot]=(u[x.lot]||0)+x.q;   // مرتجع للتاجر يقلّل الفاضل
  return u;
}
function lotLeft(){ const u=lotUsed(), o={}; for(const l of db.merchants) o[l.id]=l.q-(u[l.id]||0); return o; }
function merchAvail(k, left){
  const by=new Map();
  for(const l of db.merchants) if(l.b===k && left[l.id]>0) by.set(l.m, (by.get(l.m)||0)+left[l.id]);
  return [...by];
}
function allocate(k, q, left){
  const src=[];
  for(const l of db.merchants){
    if(!q) break; if(l.b!==k || left[l.id]<=0) continue;
    const n=Math.min(q, left[l.id]); src.push({lot:l.id, q:n}); left[l.id]-=n; q-=n;
  }
  if(q) src.push({lot:null, q});
  return src;
}
function shortMsg(items){
  if(!db.merchants.length) return '';
  const left=lotLeft(), out=[];
  for(const it of items){ const a=merchAvail(it.b,left).reduce((s,[,n])=>s+n,0); if(it.q>a) out.push(`• ${bookLabel(it.b)}: عايز ${it.q} والموجود ${a}`); }
  return out.join('\n');
}
// يحوّل الطلب لبيع: السعر وقتها يتحفظ + كل سطر يتقسم على التجار
function sellItems(s, left){
  for(const it of s.items){ const p=priceOf(it.b); it.pre=p?p.pre:null; it.post=p?p.post:null; it.src=allocate(it.b, it.q, left); }
  s.st='sold'; s.sd=new Date().toISOString();
}
function merchSum(){
  const left=lotLeft(), m=new Map();
  const g=name=>{ if(!m.has(name)) m.set(name,{name, q:0, total:0, paid:0, left:0, owe:0, rq:0, rv:0, noPrice:false, rows:new Map(), pays:[], rets:[]}); return m.get(name); };
  const lotById=Object.fromEntries(db.merchants.map(l=>[l.id,l]));
  for(const l of db.merchants){
    const x=g(l.m), lf=Math.max(0,left[l.id]);
    x.q+=l.q; x.left+=lf; if(l.p==null) x.noPrice=true; else x.total+=l.q*l.p;
    const rk=l.b+'|'+(l.p??'');
    if(!x.rows.has(rk)) x.rows.set(rk,{b:l.b, p:l.p, q:0, left:0, ret:0});
    const r=x.rows.get(rk); r.q+=l.q; r.left+=lf;
  }
  for(const p of db.merchPays){ const x=g(p.m); x.paid+=p.amt; x.pays.push(p); }
  for(const r of db.merchRets){ const x=g(r.m); x.rq+=r.q; x.rv+=mretVal(r); x.rets.push(r);
    for(const z of r.lots||[]){ const l=lotById[z.lot]; const row=l && x.rows.get(l.b+'|'+(l.p??'')); if(row) row.ret+=z.q; } }
  for(const x of m.values()) x.owe=r2(x.total-x.paid-x.rv);
  return [...m.values()];
}

/* --- حسابات المدرسين --- */
function retVal(r, S){ let v=0; for(const pt of r.parts||[]){ const it=S[pt.sale]?.items[pt.i]; if(it && it.post!=null) v+=pt.q*it.post; } return v; }
function accMap(){
  const S=saleIdx(), m={};
  const g=id=>m[id] ||= {bought:0, n:0, rn:0, paid:0, ret:0, owe:0, noPrice:false, orders:0, sold:false};   // n = خد كام كتاب، rn = رجّع كام
  for(const s of db.sales){
    if(s.st==='order'){ g(s.t).orders++; continue; }
    if(s.st!=='sold') continue;
    const a=g(s.t); a.sold=true;
    for(const it of s.items){ a.n+=it.q; if(it.post==null) a.noPrice=true; else a.bought+=it.q*it.post; }
  }
  for(const p of db.payments){ const a=g(p.t); if(p.k==='pay') a.paid+=p.amt; else if(p.k==='ret'){ a.ret+=retVal(p,S); a.rn+=p.q||0; } }
  for(const a of Object.values(m)) a.owe=r2(a.bought-a.paid-a.ret);
  return m;
}
// سطور البيع اللي لسه ممكن يترجع منها
function retLines(tid){
  const done={};
  for(const p of db.payments) if(p.k==='ret' && p.t===tid) for(const pt of p.parts||[]){ const key=pt.sale+':'+pt.i; done[key]=(done[key]||0)+pt.q; }
  const lines=[];
  for(const s of db.sales) if(s.st==='sold' && s.t===tid) s.items.forEach((it,i)=>{ const left=it.q-(done[s.id+':'+i]||0); if(left>0) lines.push({s, it, i, left}); });
  return lines;
}
// المرتجع يرجع لنفس التاجر اللي اتباع منه
function retLots(tid, s, i, q){
  const prior={};
  for(const p of db.payments) if(p.k==='ret' && p.t===tid) for(const pt of p.parts||[]) if(pt.sale===s.id && pt.i===i) for(const x of pt.lots||[]) prior[x.lot]=(prior[x.lot]||0)+x.q;
  // المرتجع القديم بيتخصم من سطور نفس التاجر من الآخر (مرة واحدة بس — حتى لو التاجر متكرر في الفاتورة بعد تعديلها)
  const out=[];
  for(const x of [...(s.items[i].src||[])].reverse()){
    if(!q) break; const r=Math.min(x.q, prior[x.lot]||0); prior[x.lot]=(prior[x.lot]||0)-r; const can=x.q-r; if(can<=0) continue;
    const n=Math.min(q,can); out.push({lot:x.lot, q:n}); q-=n;
  }
  if(q) out.push({lot:null, q});
  return out;
}

}

let planAreas=new Set();
function planNeed(t){ const ow=autoOwed(t), a=ACC[t.id], ord=db.sales.filter(s=>s.st==='order' && s.t===t.id);
  return {ow, money:a&&a.owe>0?a.owe:0, ord, any: ow.length || (a&&a.owe>0) || ord.length}; }
function planList(){ return db.teachers.filter(t=>t.area && planAreas.has(t.area)).map(t=>({t, n:planNeed(t)})).filter(x=>x.n.any)
  .sort((a,b)=>a.t.area.localeCompare(b.t.area,'ar') || a.t.name.localeCompare(b.t.name,'ar')); }
function planTake(list){ const m={}; for(const {n} of list){ for(const k of n.ow) m[k]=(m[k]||0)+1; for(const s of n.ord) for(const it of s.items) m[it.b]=(m[it.b]||0)+it.q; } return m; }

  const areas=Object.keys(cnt).sort((a,b)=>a.localeCompare(b,'ar'));

/* ================= بند ظ: تنبيه «مدرسين A ما استلموش» ================= */
const AL_KEY=KEY+'-alert';
function alState(){ const z={day:dayKey(), cur:'', done:[], eve:false};
  try{ const s=JSON.parse(localStorage.getItem(AL_KEY)||'{}'); return s.day===z.day ? {...z, ...s} : z; }catch(e){ return z; } }
function alSave(s){ try{ localStorage.setItem(AL_KEY, JSON.stringify(s)); }catch(e){} }
function pendingA(area){ return db.teachers.filter(t=>t.area===area && clsLetter(t)==='A' && !isDup(t) && autoOwed(t).length); }
function workedAreasToday(){ const d=dayKey(), ids=new Set();
  for(const e of db.entries) if(e.s==='d' && dk(e.dd)===d) ids.add(e.t);
  for(const s of db.sales) if(dk(s.st==='sold'?s.sd:s.d)===d) ids.add(s.t);
  return [...new Set([...ids].map(id=>tById(id)?.area).filter(Boolean))]; }
function bell(){
  try{ navigator.vibrate && navigator.vibrate([300,150,300,150,600]); }catch(e){}
  try{ const C=new (window.AudioContext||window.webkitAudioContext)();
    [0,0.35,0.7].forEach(t0=>{ const o=C.createOscillator(), g=C.createGain(); o.frequency.value=880; o.connect(g); g.connect(C.destination);
      g.gain.setValueAtTime(0.3,C.currentTime+t0); g.gain.exponentialRampToValueAtTime(0.001,C.currentTime+t0+0.3); o.start(C.currentTime+t0); o.stop(C.currentTime+t0+0.32); });
    setTimeout(()=>C.close(),1600); }catch(e){}
}
function alertA(groups){   // groups = [[القرية, [مدرسين]], ...]
  if(!groups.length || document.getElementById('alA')) return;
  bell();
  const m=document.createElement('div'); m.className='modal'; m.id='alA'; m.style.zIndex='80';
  m.innerHTML=`<div class="box"><h3>🔔 لسه فيه مدرسين A ما استلموش</h3>${groups.map(([a,l])=>`<div class="card" style="margin-bottom:8px"><b>📍 ${esc(a)}</b>
      ${l.map(t=>`<div class="al-row"><div class="grow"><a href="#/t/${encodeURIComponent(t.id)}" data-al="x"><b>${esc(t.name)}</b></a> <span class="small muted">باقيله ${autoOwed(t).length}</span></div><div class="icos">${phoneBtns(t)}</div></div>`).join('')}
      <button class="btn owe sm" style="width:100%;margin-top:8px" data-al="back" data-a="${esc(a)}">↩️ ارجع لهم</button></div>`).join('')}
    <button class="btn ghost" style="width:100%" data-al="x">بعدين</button></div>`;
  document.body.appendChild(m);
  m.addEventListener('click', e=>{ const b=e.target.closest('[data-al]'); if(e.target===m){ m.remove(); return; } if(!b) return;
    if(b.dataset.al==='back'){ homeArea=b.dataset.a; homeFilter='owed'; homeQuery=''; m.remove(); if(location.hash==='#/teachers') render(); else location.hash='#/teachers'; }
    else m.remove(); });
}
// بعد كل تسليم/بيع: لو دخل قرية تانية والقرية اللي قبلها فيها مدرسين A ما استلموش → تنبيه
function afterWork(tid){
  const t=tById(tid); if(!t || !t.area) return;
  const s=alState(), prev=s.cur; let grp=[];
  if(prev && prev!==t.area && !s.done.includes(prev)){ const l=pendingA(prev); if(l.length){ s.done.push(prev); grp=[[prev,l]]; } }
  s.cur=t.area; alSave(s);
  saveVillageLoc(t.area);
  if(grp.length && !isNight()) setTimeout(()=>alertA(grp), 500);
}
// بعد 6 بالليل: المناطق اللي اشتغل فيها النهارده وفيها A ما استلموش
function eveningCheck(){
  if(new Date().getHours()<18 || isNight() || !db.teachers.length) return;
  const s=alState(); if(s.eve) return; s.eve=true; alSave(s);
  const grp=workedAreasToday().map(a=>[a, pendingA(a)]).filter(([,l])=>l.length);
  if(grp.length) setTimeout(()=>alertA(grp), 1500);
}
// GPS (والبرنامج مفتوح بس): أول تسليم في القرية يحفظ مكانها، ولو بعد عنها أكتر من 2 كم وفيها A ما استلموش → تنبيه
let geoWatch=null;
function distKm(a,b){ const R=6371, r=x=>x*Math.PI/180, dLa=r(b.lat-a.lat), dLo=r(b.lng-a.lng);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function saveVillageLoc(area){
  if(!navigator.geolocation) return; db.vloc ||= {};
  if(db.vloc[area]){ startWatch(); return; }
  try{ navigator.geolocation.getCurrentPosition(p=>{ db.vloc[area]={lat:p.coords.latitude, lng:p.coords.longitude}; save(false); startWatch(); }, ()=>{}, {enableHighAccuracy:true, timeout:20000, maximumAge:120000}); }catch(e){}
}
function startWatch(){
  if(geoWatch!=null || !navigator.geolocation) return;
  try{ geoWatch=navigator.geolocation.watchPosition(p=>{
    if(isNight()) return;
    const here={lat:p.coords.latitude, lng:p.coords.longitude}, s=alState();
    for(const a of workedAreasToday()){ const v=db.vloc?.[a]; if(!v || s.done.includes(a) || distKm(here,v)<=2) continue;
      const l=pendingA(a); if(!l.length) continue;
      s.done.push(a); alSave(s); alertA([[a,l]]); break; }
  }, ()=>{}, {enableHighAccuracy:false, maximumAge:60000, timeout:60000}); }catch(e){}
}

// السلة: بتفضل لو قفلت الشاشة من غير حفظ، وتتمسح بعد الحفظ أو بـ «فضّي السلة»
let CART=null;
function saleForm(tid, editId, mode='sell'){
  const ed = editId ? db.sales.find(s=>s.id===editId && s.st==='order') : null;

  const keep=()=>{ if(!ed) CART = Object.keys(st.qty).length ? {tid:st.tid, qty:{...st.qty}} : null; };
  let revOpen=false;
  const m=document.createElement('div'); m.className='modal';

    <div class="sale-foot"><button class="cart-btn" data-sf="cart"><span>🛒</span><span class="grow" id="sf_tot"></span><span id="sf_arr">▴</span></button>

  document.body.appendChild(m);
  const close=()=>m.remove();
  const items=()=>SELL_KEYS.filter(k=>st.qty[k]>0).map(k=>({b:k, q:st.qty[k]}));
  const drawRev=()=>{
    const box=m.querySelector('#sf_rev'); box.hidden=!revOpen; m.querySelector('#sf_arr').textContent=revOpen?'▾':'▴';
    if(!revOpen) return;
    const its=items();
    box.innerHTML = (its.length ? its.map(it=>{ const p=priceOf(it.b); return `<div class="srow"><div class="grow"><b style="color:var(--c-${bookParts(it.b).sb})">${esc(bookLabel(it.b))}</b><div class="small">${p?`${fmtN(p.post)} ج × ${it.q} = <b>${fmtM(p.post*it.q)}</b>`:'السعر —'}</div></div>
        <div class="step"><button data-sf="dec" data-k="${it.b}" aria-label="أقل">−</button><span class="q">${it.q}</span><button class="plus" data-sf="inc" data-k="${it.b}" aria-label="زوّد">+</button></div>
        <button class="btn sm danger" data-sf="rm" data-k="${it.b}" title="شيله">🗑️</button></div>`; }).join('') : '<div class="muted small" style="padding:6px">السلة فاضية — زوّد كتب من فوق.</div>') +
      `<div class="field" style="margin-top:8px"><label>🚚 ميعاد التوصيل المتوقع (للطلب — اختياري)</label><input id="sf_due" type="date" value="${esc(ed?.due||st.due||'')}"></div>
      <div class="row2"><button class="btn" data-sf="order" style="background:var(--owe-soft);color:var(--owe)">${ed?'💾 حفظ الطلب':'📝 سجّل طلب'}</button><button class="btn ok" data-sf="sell">${ed?'✅ باع على طول':'🛒 بيع دلوقتي'}</button></div>
      ${ed?'':'<button class="btn ghost sm" data-sf="empty" style="width:100%;margin-top:8px">🧹 فضّي السلة</button>'}`;
    const du=box.querySelector('#sf_due'); if(du) du.addEventListener('change',()=>{ st.due=du.value; });
  };
  const drawTot=()=>{
    let n=0, tot=0, miss=false;
    for(const it of items()){ n+=it.q; const p=priceOf(it.b); if(!p) miss=true; else tot+=it.q*p.post; }
    m.querySelector('#sf_tot').innerHTML = n
      ? `السلة: ${n} كتاب — ${miss ? (tot?`${fmtM(tot)} + كتب من غير سعر`:'السعر لسه ما اتحددش') : fmtM(tot)}`
      : 'السلة فاضية — اكتب العدد قدام الكتب';
    drawRev();
  };
  const drawRes=raw=>{
    const res=m.querySelector('#sf_res'); raw=raw.trim();
    const isNum=/^[\d٠-٩۰-۹\s+\-]+$/.test(raw), qd=normPhone(raw).replace(/^0/,''), Q=isNum?null:parseQuery(raw);
    const hits=!raw ? [] : db.teachers.filter(t=> isNum ? (!!qd && (t.phone||'').includes(qd)) : matchTeacher(t, Q)).slice(0,8);
    res.innerHTML=(raw && !hits.length?'<div class="hint" style="margin:0 0 6px">مش لاقيه.</div>':'') +
      hits.map(t=>`<button class="pick-row" data-sf="pick" data-id="${esc(t.id)}"><b>${esc(t.name)}</b>${nameTags(t)} <span class="small muted">${esc([t.phone,t.area,t.subjectText].filter(Boolean).join(' • '))}</span></button>`).join('') +
      (raw ? `<div class="addnew"><b class="small">➕ ضيفه (لو مش موجود)</b><div class="row2"><input id="sf_nn" placeholder="الاسم" value="${esc(isNum?'':raw)}"><input id="sf_np" inputmode="tel" dir="ltr" placeholder="التليفون" value="${esc(isNum?raw:'')}"></div>
        <input id="sf_na" list="vl_s" autocomplete="off" placeholder="المنطقة / القرية" style="margin-top:6px;width:100%">${vlist('vl_s')}
        <button class="btn sm pri" data-sf="addt" style="margin-top:8px">➕ ضيفه</button></div>` : '<div class="hint">اكتب اسم المدرس أو رقمه.</div>');
  };
  const drawT=()=>{
    const box=m.querySelector('#sf_t'), t=tById(st.tid);
    if(t){ box.innerHTML=`<div class="pick"><div class="grow"><b>${esc(t.name)}</b><div class="small muted">${esc([t.subjectText, STAGE_TXT[t.stage]||'', t.phone].filter(Boolean).join(' • '))}</div></div>${ed?'':'<button class="btn sm ghost" data-sf="chg">تغيير</button>'}</div>`; return; }
    box.innerHTML=`<div class="search" style="margin:0 0 6px"><input id="sf_q" type="search" placeholder="🔎 اسم المدرس أو التليفون" autocomplete="off"></div><div id="sf_res"></div>`;
    const q=box.querySelector('#sf_q'); q.addEventListener('input',()=>drawRes(q.value)); drawRes(''); setTimeout(()=>q.focus(),50);
  };
  const drawB=()=>{
    const box=m.querySelector('#sf_b'), t=tById(st.tid);
    if(!t){ box.innerHTML=''; drawTot(); return; }
    const mg=myGroups(t), mine=SELL_KEYS.filter(k=>mg.has(k.split('-').slice(0,2).join('-')));
    const others=SELL_KEYS.filter(k=>!mine.includes(k));
    const left=lotLeft();
    const row=k=>{ const p=priceOf(k), av=merchAvail(k,left), q=st.qty[k]||'';

    box.innerHTML = mine.length
      ? `<div class="stage-t">⭐ تخصصه</div>${mine.map(row).join('')}<details class="others" ${others.some(k=>st.qty[k])?'open':''}><summary>📚 باقي الكتب (${others.length})</summary>${others.map(row).join('')}</details>`

    const r=m.querySelector(`#sf_b .srow[data-k="${k}"]`); if(r){ r.classList.toggle('sel',!!q); const i=r.querySelector('.qin'); if(document.activeElement!==i) i.value=q||''; }
    keep(); drawTot(); };
  const drawSpec=t=>{ const box=m.querySelector('#sf_spec');
    box.innerHTML = t ? specPicker(t, 'data-sf="spec-save"', 'حدد تخصص المدرس الأول') : '';
    if(t) box.scrollIntoView({block:'start'}); };
  m.addEventListener('input', e=>{ const i=e.target.closest('.qin'); if(i) setQ(i.dataset.k, parseInt(digits(i.value).replace(/\D/g,''),10)); });
  const save1=(sell)=>{
    const t=tById(st.tid); if(!t){ alert('اختار المدرس الأول'); return; }
    const its=items(); if(!its.length){ alert('اكتب عدد الكتب الأول'); return; }
    if(dupBlock(t)) return;
    // قفل: التخصص لازم يبقى معروف — الأعداد اللي اتكتبت بتفضل زي ما هي
    if(!expectedBooks(t).length){ alert('⚠️ حدد تخصص المدرس الأول'); drawSpec(t); return; }
    // النقص: الموجود عند التجار يتباع، والناقص يتسجّل طلب مستني التنفيذ
    const sp = sell ? splitAvail(its) : null;
    if(sp && sp.rest.length){
      const msg = sp.sell.length ? `⚠️ الكتب دي مش موجودة كلها:\n${shortLines(sp.rest)}\n\nهيتباع الموجود بس، والناقص يتسجّل «طلب مستني التنفيذ». تكمل؟`
        : `⚠️ الكتاب غير متوفر:\n${shortLines(sp.rest)}\n\nمفيش حاجة تتباع دلوقتي — يتسجّل كله «طلب مستني التنفيذ»؟`;
      if(!confirm(msg)) return; }
    const sellNow = !!(sp && sp.sell.length);
    const n=its.reduce((s,x)=>s+x.q,0), sn=sellNow?sp.sell.reduce((s,x)=>s+x.q,0):0, due=(m.querySelector('#sf_due')?.value ?? st.due) || '';
    close(); if(!ed) CART=null;
    withUndo(sellNow ? `✅ اتباع ${sn} كتاب لـ ${t.name}${sp.rest.length?' — والناقص اتسجّل طلب':''}` : (sell ? '📝 الكتب مش موجودة — اتسجّل طلب' : ed ? '💾 الطلب اتعدّل' : `📝 اتسجّل طلب ${n} كتاب`), ()=>{
      let s = ed;
      // الطلب بيفضل سجل: oq = العدد المطلوب، ord = البيع ده كان طلب
      if(s){ if(sellNow){ s.oq ||= qtyMap(s.items); s.ord=true; } s.items=its; if(!sellNow) s.oq=qtyMap(its); }
      else { s={id:uid(), t:t.id, st:'order', d:new Date().toISOString(), items:its, rep:db.rep}; if(!sellNow) s.oq=qtyMap(its); db.sales.push(s); }
      if(!sellNow){ if(due) s.due=due; else delete s.due; }
      if(sellNow) sellRest(s, sp);
    });
    afterWork(t.id);
    if(sellNow) showInvoice(t.id, true);
  };
  m.addEventListener('click', e=>{
    if(e.target===m){ close(); return; }
    const b=e.target.closest('[data-sf]'); if(!b) return;
    const a=b.dataset.sf, k=b.dataset.k;
    if(a==='close') close();
    else if(a==='cart'){ revOpen=!revOpen; drawRev(); if(revOpen) setTimeout(()=>m.querySelector('#sf_rev').scrollIntoView({block:'nearest'}),30); }
    else if(a==='rm') setQ(k,0);
    else if(a==='empty'){ if(!confirm('تفضّي السلة؟')) return; for(const x of Object.keys(st.qty)) setQ(x,0); CART=null; }
    else if(a==='inc') setQ(k,(st.qty[k]||0)+1);
    else if(a==='dec') setQ(k,(st.qty[k]||0)-1);
    else if(a==='pick'){ if(dupBlock(tById(b.dataset.id))) return; st.tid=b.dataset.id; keep(); drawT(); drawB(); }
    else if(a==='chg'){ st.tid=''; drawSpec(null); drawT(); drawB(); }
    else if(a==='spec-save'){ const t=tById(st.tid); if(!t || !applySpec(t, m.querySelector('#specbar'))) return;
      save(); drawSpec(null); drawT(); drawB(); toast('✅ التخصص اتحفظ — كمّل'); }
    else if(a==='addt'){
      const name=m.querySelector('#sf_nn').value.trim(), phone=normPhone(m.querySelector('#sf_np').value);
      if(!name){ alert('اكتب اسم المدرس'); return; }
      const dup=phone && db.teachers.find(x=>x.phone===phone);
      if(dup){ if(confirm(`الرقم ده متسجّل لـ «${dup.name}». تختاره؟`)){ st.tid=dup.id; drawT(); drawB(); } return; }
      const area=(m.querySelector('#sf_na')?.value||'').trim();
      const nt={id:uid(), name, phone, isNew:true, area, newArea:isNewArea(area), stage:'', subjectText:'', subjects:[], school:'', cls:'', students:'', plan:'', notes:'', created:new Date().toISOString()};
      db.teachers.push(nt); save(); st.tid=nt.id; keep(); drawT(); drawB(); toast(`➕ اتضاف ${name}`);
    }
    else if(a==='order') save1(false);
    else if(a==='sell') save1(true);
  });
  drawT(); drawB();
}

function showInvoice(tid, fresh){

  const rows=new Map();

    const x=rows.get(key); x.q+=it.q; x.r+=R[s.id+':'+i]||0; });
  const list=[...rows.values()].sort(byRank);
  const day=fmtDay(dayKey()), log=invLog(tid);
  const msg=`🧾 فاتورة بيع — سلاح التلميذ\nالتاريخ: ${day}\nالمندوب: ${db.rep}\nالمدرس: ${t.name}\n\n` +
    list.map(r=>`• ${bookLabel(r.b)}: خد ${r.q}${r.r?` • رجّع ${r.r}`:''} • فضل معاه ${r.q-r.r}`+(r.post!=null?` × ${fmtN(r.post)} = ${fmtM((r.q-r.r)*r.post)}`:' (السعر لسه ما اتحددش)')).join('\n') +
    `\n\nإجمالي اللي خده: ${fmtM(a.bought)}${a.noPrice?' (فيه كتب السعر لسه ما اتحددش)':''}\nالمرتجع: ${fmtM(a.ret)}\nالمدفوع: ${fmtM(a.paid)}\nالباقي عليك: ${fmtM(a.owe)}` +
    (log.length?`\n\n📜 سجل المعاملات:\n`+log.map(l=>`• ${l.t} بتاريخ ${l.day} — ${fmtM(l.v)}`).join('\n'):'');
  const C=k=>'#'+SUBJ_COLOR[bookParts(k).sb];
  const m=document.createElement('div'); m.className='inv-wrap';
  m.innerHTML=`<div class="inv"><div class="inv-h"><div class="brand">سلاح التلميذ</div><div style="text-align:left"><h2>فاتورة بيع</h2><div class="d">${day}</div></div></div>
    <div class="inv-b"><div class="inv-who"><div><span>المندوب: </span><b>${esc(db.rep)}</b></div><div><span>المدرس: </span><b>${esc(t.name)}</b></div></div>
    <div class="tscroll"><table class="tbl"><thead><tr><th>الكتاب</th><th>خد</th><th>رجّع</th><th>فضل معاه</th><th>السعر قبل</th><th>السعر بعد</th><th>الإجمالي</th></tr></thead><tbody>
    ${list.map(r=>`<tr><td><b style="color:${C(r.b)}">${esc(bookLabel(r.b))}</b></td><td>${r.q}</td><td><b style="color:#ea580c">${r.r||''}</b></td><td><b>${r.q-r.r}</b></td><td>${r.pre!=null?`<s>${fmtN(r.pre)}</s>`:'—'}</td><td>${r.post!=null?fmtN(r.post):'—'}</td><td><b>${r.post!=null?fmtN((r.q-r.r)*r.post):'—'}</b></td></tr>`).join('') || '<tr><td colspan="7">مفيش بيع.</td></tr>'}</tbody></table></div>
    ${a.noPrice?'<div class="inv-np">السعر لسه ما اتحددش</div>':''}
    <div class="kv"><span>إجمالي اللي خده</span><b>${fmtM(a.bought)}</b></div><div class="kv"><span>المرتجع</span><b style="color:#ea580c">${fmtM(a.ret)}</b></div>

      <a class="btn ok" href="${esc(waLink(t.phone, msg))}" target="_blank" rel="noopener">💬 واتساب (كلام)</a><button class="btn ghost" style="background:#fff;color:#111" data-inv="close">✕ اقفل</button></div>`;
  document.body.appendChild(m);

  m.querySelector('[data-inv="img"]').onclick=async()=>{

  };
}
// المشاركة (واتساب وغيره) من قايمة المشاركة، ولو مش متاحة ينزّل الملف
async function shareFile(blob, name, type, title){
  const file=new File([blob], name, {type});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title}); return; }catch(e){ if(e.name==='AbortError') return; }
  }
  download(blob, name); toast('⬇️ الملف نزل');
}
// سجل المعاملات بالتاريخ: فاتورة 1، مرتجع، دفع
function invLog(tid){
  const D=tSaleData(tid), S=saleIdx(), out=[];
  for(const x of D.inv){ let v=0; for(const it of x.s.items) if(it.post!=null) v+=it.q*it.post; out.push({d:x.s.sd||x.s.d, k:'inv', t:`فاتورة ${x.no}`, v, c:'#1d4ed8'}); }
  const g=new Map(); for(const p of D.rets){ const k=p.g||p.d; if(!g.has(k)) g.set(k,{d:p.d, v:0, n:0}); const z=g.get(k); z.v+=retVal(p,S); z.n+=p.q||0; }
  for(const z of g.values()) out.push({d:z.d, k:'ret', t:`مرتجع ${z.n} كتاب`, v:z.v, c:'#ea580c'});
  for(const p of D.pays) out.push({d:p.d, k:'pay', t:'دفع', v:p.amt, c:'#15803d'});
  return out.sort((a,b)=>a.d.localeCompare(b.d)).map(l=>({...l, day:fmtDay(dk(l.d))}));
}
// رسم الفاتورة على canvas (من غير مكتبات، عربي من اليمين للشمال)
function invoiceCanvas({t, a, list, day, log=[]}){
  const W=720, S=2, P=24, FF='"Cairo","Segoe UI",Tahoma,"Noto Sans Arabic","Noto Naskh Arabic",Arial,sans-serif';
  const RH=40, rowsN=Math.max(1,list.length), LH=32;
  const H = 96 + 16 + 56 + 16 + 40 + rowsN*RH + 16 + (a.noPrice?32:0) + 3*38 + 70 + (log.length?50+log.length*LH:0) + P;
  const cv=document.createElement('canvas'); cv.width=W*S; cv.height=H*S;
  const x=cv.getContext('2d'); x.scale(S,S); x.direction='rtl'; x.textBaseline='middle';
  const font=(sz,b)=>x.font=`${b?'bold ':''}${sz}px ${FF}`;
  const text=(s,px,py,{sz=16,b=false,c='#111',al='right'}={})=>{ font(sz,b); x.fillStyle=c; x.textAlign=al; x.fillText(s,px,py); return x.measureText(s).width; };

// PDF بسيط فيه صورة JPEG واحدة (مكتوب يدوي من غير مكتبة)
function pdfFromJpeg(jpg, iw, ih){
  const enc=new TextEncoder(), parts=[], offs=[]; let len=0;
  const put=d=>{ const u=typeof d==='string'?enc.encode(d):d; parts.push(u); len+=u.length; };
  const pw=595, ph=Math.round(595*ih/iw*100)/100;
  const content=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
  put('%PDF-1.4\n');
  const obj=(n,body)=>{ offs[n]=len; put(`${n} 0 obj\n`); for(const b of body) put(b); put('\nendobj\n'); };
  obj(1,['<< /Type /Catalog /Pages 2 0 R >>']);
  obj(2,['<< /Type /Pages /Kids [3 0 R] /Count 1 >>']);
  obj(3,[`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`]);
  obj(4,[`<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`, jpg, '\nendstream']);
  obj(5,[`<< /Length ${content.length} >>\nstream\n${content}\nendstream`]);
  const xref=len;
  put(`xref\n0 6\n0000000000 65535 f \n${[1,2,3,4,5].map(n=>String(offs[n]).padStart(10,'0')+' 00000 n \n').join('')}trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, {type:'application/pdf'});
}

function mretVal(r){ let v=0; for(const z of r.lots||[]){ const l=db.merchants.find(x=>x.id===z.lot); if(l && l.p!=null) v+=z.q*l.p; } return v; }
function mretAlloc(name, k, q, left){
  const out=[];
  for(const l of [...db.merchants].reverse()){ if(!q) break; if(l.m!==name || l.b!==k || left[l.id]<=0) continue;
    const n=Math.min(q,left[l.id]); out.push({lot:l.id, q:n}); q-=n; }
  return out;
}

function rowBook(sbv, gv, stv){
  const sb=parseSubjects(String(sbv??''))[0], g=parseGrade(gv); if(!sb || !g) return null;
  const st=(parseStage(String(stv??'')) || parseStage(String(gv??'')) || (sb==='en'?'p':'m'))[0];
  const k=`${st}-${sb}-${g}`; return bookRank[k]===undefined ? null : k;
}
function findHead(rows, need){
  for(let i=0;i<Math.min(15,rows.length);i++){
    const h=[...(rows[i]||[])].map(x=>normText(x??'')); const fi=re=>h.findIndex(x=>x && re.test(x));
    const H={row:i, h, sb:fi(/ماده/), g:fi(/صف/), st:fi(/مرحله/)};
    if(H.sb>=0 && H.g>=0 && need(H, fi)) return H;
  }
  return null;
}

$('#fileMerch').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  let rows; try{ rows=await readXlsx(f); }catch(err){ alert('مش قادر أقرا الملف ده. اتأكد إنه شيت إكسل (.xlsx).'); return; }
  const H=findHead(rows, ()=>true);
  if(!H){ alert('مش لاقي أعمدة: المادة، الصف'); return; }
  // أعمدة التجار بالترتيب. بيقبل «محمود عدد» و«محمود سعر»، أو «محمود» بس:
  // العمود اللي فيه «سعر» = سعر التاجر اللي قبله، وأي عمود تاني = عدد تاجر (واسم التاجر مكرر مرتين = التاني سعر)
  const raw=rows[H.row]||[], ms=[], byN={}, fixed=new Set([H.sb, H.g, H.st]); let last=null;
  for(let i=0;i<raw.length;i++){
    const n=H.h[i]||''; if(fixed.has(i) || !n || /اجمالي|ملاحظ|صنف|كتاب/.test(n)) continue;
    const isP=/سعر/.test(n), isQ=/عدد|كميه/.test(n);
    const name=String(raw[i]).replace(/(ال)?(عدد|سعر|كمية|كميه)/g,' ').replace(/[\-–_:()]/g,' ').replace(/\s+/g,' ').trim();
    const key=normText(name);
    let mc = key ? byN[key] : null;
    if(isP){ const tgt=mc||last; if(tgt && tgt.p<0) tgt.p=i; continue; }
    if(mc && !isQ && mc.q>=0 && mc.p<0){ mc.p=i; continue; }
    if(!key) continue;
    if(!mc){ mc=byN[key]={name, q:-1, p:-1}; ms.push(mc); }
    if(mc.q<0) mc.q=i;
    last=mc;
  }
  const now=new Date().toISOString(), add=[]; let bad=0;
  for(const mc of ms.filter(x=>x.q>=0)){
    for(const r of rows.slice(H.row+1)){
      if(!r) continue;
      const q=parseInt(digits(r[mc.q]??'').replace(/[^\d]/g,''),10); if(!q) continue;
      const k=rowBook(r[H.sb], r[H.g], H.st>=0?r[H.st]:'');
      if(!k || !isSell(k)){ bad++; continue; }
      let p=mc.p>=0?parseNum(r[mc.p]):null; if(p==null) p=priceOf(k)?.post ?? null;
      add.push({id:uid(), m:mc.name, b:k, q, p, d:now});
    }
  }
  if(!add.length){ alert('مفيش أعداد في الشيت.'); return; }
  const sum={}; for(const l of add) sum[l.m]=(sum[l.m]||0)+l.q;
  // تأكيد + تاريخ الاستلام (النهارده افتراضي)
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="box"><h3>🏪 بضاعة تجار جديدة</h3>${Object.entries(sum).map(([n,q])=>`<div class="kv"><span>${esc(n)}</span><b>${q} كتاب</b></div>`).join('')}
    ${bad?`<div class="hint" style="color:var(--bad)">⚠️ و ${bad} سطر مش فاهمه (هيتساب)</div>`:''}
    <div class="field" style="margin-top:10px"><label>تاريخ الاستلام</label><input id="mu_d" type="date" value="${dayKey()}"></div>
    <div class="row2"><button class="btn pri" id="mu_ok">➕ ضيفهم</button><button class="btn ghost" id="mu_x">إلغاء</button></div></div>`;
  document.body.appendChild(m);
  m.addEventListener('click',ev=>{ if(ev.target===m) m.remove(); });
  m.querySelector('#mu_x').onclick=()=>m.remove();
  m.querySelector('#mu_ok').onclick=()=>{
    const d=pickDate(m.querySelector('#mu_d').value), g=uid(); m.remove();
    for(const l of add){ l.d=d; l.g=g; }
    withUndo(`🏪 اتضاف ${add.reduce((s,l)=>s+l.q,0)} كتاب لبضاعة التجار`, ()=>{ db.merchants.push(...add); });
  };
});

function syncRows(){

      sales.push([`فاتورة ${invNo[s.id]}`, D(s.sd), t.name||'؟', t.phone||'', bookLabel(it.b), x.q, it.pre??'', it.post??'', it.post!=null?r2(x.q*it.post):'', x.lot?(lot[x.lot]?.m||'؟'):'—', 'IMG:'+imgBase(t,s.sd)]); }
  const pays=[['التاريخ','المدرس','النوع','الكتاب','العدد','المبلغ','فاتورة رقم']];

    else pays.push([D(p.d), t.name||'؟', 'مرتجع', bookLabel(p.b), p.q, r2(retVal(p,S)), [...new Set((p.parts||[]).map(pt=>invNo[pt.sale]).filter(Boolean))].map(n=>'فاتورة '+n).join('، ')]); }
  // التسليمات: كل سطر ليه كود ثابت (e.id) عشان عمود «التسجيل على برنامج الشركة» اللي شريف بيعلّمه يفضل زي ما هو
  const dels=[];

function syncStats(){
  const st=dayStats(dayKey()), acc=accMap(), left=stockLeft(), S=saleIdx(); let sold=0, owe=0;
  for(const a of Object.values(acc)){ sold+=a.bought; if(a.owe>0) owe+=a.owe; }
  // أرقام كل يوم (آخر 40 يوم) لمقارنة المناديب في صفحة المتابعة: سلّم • باع بـ • حصّل • مرتجع
  const from=dayKey(new Date(Date.now()-40*864e5)), days={}, g=k=>days[k] ||= {d:0, sv:0, pd:0, rv:0};
  for(const e of db.entries) if(e.s==='d'){ const k=dk(e.dd); if(k>=from) g(k).d+=e.q; }
  for(const s of db.sales) if(s.st==='sold'){ const k=dk(s.sd); if(k>=from) for(const it of s.items) if(it.post!=null) g(k).sv+=it.q*it.post; }
  for(const p of db.payments){ const k=dk(p.d); if(k<from) continue; if(p.k==='pay') g(k).pd+=p.amt; else g(k).rv+=retVal(p,S); }
  for(const k in days) for(const f of ['sv','pd','rv']) days[k][f]=r2(days[k][f]);
  const merchOwe=r2(merchSum().reduce((s,x)=>s+Math.max(0,x.owe),0));

    merchOwe, days};
}

var PQ={}, NAV=null, MAP=null, mapCat='', mapRouteOnly=false, PIN_OK=false, VOICE=true, WL=null, LF=null;

/* ---------- ١) البحث: كل كارت عليه data-hay = كل بيانات المدرس/التاجر متطبّعة ---------- */
function hayT(t){ const ms=teacherMerch(t.id).map(([n])=>n).filter(n=>n!==MNONE);
  return teacherHay(t)+' '+normText([...ms, t.active===true?'فعال':t.active===false?'مش فعال':'', t.loc?'ليه موقع':'الموقع ناقص', tCatName(t)].join(' ')); }
const qWords = raw => normText(raw).split(' ').filter(Boolean);
function searchBar(id, ph){ return `<div class="search"><input id="${id}" type="search" placeholder="${esc(ph||'🔎 دوّر: اسم، تليفون، قرية، تصنيف، تخصص، مادة، تاجر…')}" value="${esc(PQ[id]||'')}" autocomplete="off" enterkeyhint="search"></div>`; }
function bindSearch(id, box, empty){

function filterHay(box, raw, empty){
  if(!box) return; const ws=qWords(raw); let shown=0;
  box.querySelectorAll('[data-hay]').forEach(el=>{ unmark(el);
    const h=el.dataset.hay||'', ok=!ws.length || ws.every(w=>h.includes(w) || (/^0\d{2,}$/.test(w) && h.includes(w.slice(1))));
    el.hidden=!ok; if(ok){ shown++; if(ws.length) markWords(el, ws); } });
  // الأقسام اللي كل اللي جواها اتخفى تتخفى، واللي فيها نتيجة تتفتح
  box.querySelectorAll('[data-hgrp]').forEach(g=>{ const any=!!g.querySelector('[data-hay]:not([hidden])'); g.hidden = !!ws.length && !any; if(ws.length && any && g.tagName==='DETAILS') g.open=true; });
  let msg=box.querySelector('.nores');
  if(ws.length && !shown){ if(!msg){ msg=document.createElement('div'); msg.className='card empty nores'; box.prepend(msg); } msg.textContent=empty||'مفيش مدرس بالاسم ده في الصفحة دي'; }
  else if(msg) msg.remove();
}
// تمييز الكلمة اللي اتلاقت بالأصفر (بنفس التطبيع: أ/إ/ا، ة/ه، ي/ى، أرقام عربي وإنجليزي)
function nch(c){ let i=AR_DIG.indexOf(c); if(i>=0) return String(i); i=FA_DIG.indexOf(c); if(i>=0) return String(i);
  if('أإآٱ'.includes(c)) return 'ا'; if(c==='ة') return 'ه'; if(c==='ى') return 'ي'; if(/[ً-ْـ]/.test(c)) return ''; return c.toLowerCase(); }
function markWords(root, ws){
  if(!root || !ws.length) return;
  const tw=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode:n=>n.parentElement && !n.parentElement.closest('mark.hl,script,style,select,option') && n.nodeValue.trim() ? 1 : 2});
  const nodes=[]; while(tw.nextNode()) nodes.push(tw.currentNode);
  for(const node of nodes){ const s=node.nodeValue; let ns=''; const map=[];
    for(let i=0;i<s.length;i++){ for(const ch of nch(s[i])){ ns+=ch; map.push(i); } }
    const rs=[];
    for(const w of ws){ let p=0; while((p=ns.indexOf(w,p))>=0){ rs.push([map[p], map[p+w.length-1]+1]); p+=w.length; } }
    if(!rs.length) continue;
    rs.sort((a,b)=>a[0]-b[0]); const mg=[]; for(const r of rs){ const l=mg[mg.length-1]; if(l && r[0]<=l[1]) l[1]=Math.max(l[1],r[1]); else mg.push([...r]); }
    const frag=document.createDocumentFragment(); let at=0;
    for(const [a,b] of mg){ if(a>at) frag.appendChild(document.createTextNode(s.slice(at,a))); const mk=document.createElement('mark'); mk.className='hl'; mk.textContent=s.slice(a,b); frag.appendChild(mk); at=b; }
    if(at<s.length) frag.appendChild(document.createTextNode(s.slice(at)));
    node.parentNode.replaceChild(frag, node);
  }
}
function unmark(root){ root.querySelectorAll('mark.hl').forEach(m=>{ const p=m.parentNode; p.replaceChild(document.createTextNode(m.textContent), m); p.normalize(); }); }

/* ---------- ٢) النقص: الناقص يتساب والباقي يكمل ---------- */
// البيع (من بضاعة التجار): الموجود يتباع، والناقص يتسجّل طلب مستني التنفيذ
function splitAvail(items){
  // مفيش بضاعة تجار متسجّلة = مفيش حاجة تتباع (الكل يتسجّل طلب)
  const left=lotLeft(), sell=[], rest=[];
  for(const it of items){ const a=Math.max(0, merchAvail(it.b,left).reduce((s,[,n])=>s+n,0)), q=Math.min(it.q,a);
    if(q) sell.push({b:it.b, q}); if(it.q>q) rest.push({b:it.b, q:it.q-q, want:it.q, a}); }
  return {sell, rest};
}
const shortLines = rest => rest.map(x=>`• ${bookLabel(x.b)} — المطلوب ${x.want}، الموجود ${x.a}، الناقص ${x.q}`).join('\n');

  if(sp.rest.length){
    db.sales.push({id:uid(), t:s.t, st:'order', d:s.d||new Date().toISOString(), items:sp.rest.map(x=>({b:x.b, q:x.q})), oq:qtyMap(sp.rest), rep:s.rep||db.rep, ...(s.due?{due:s.due}:{}), from:s.id});
    if(s.oq) for(const x of sp.rest){ s.oq[x.b]=(s.oq[x.b]||0)-x.q; if(s.oq[x.b]<=0) delete s.oq[x.b]; }
  }

}
// التسليم (من مخزن الشركة): الكتاب الناقص يتقال عليه ويتساب، والباقي يتسلّم. لو مفيش استلام من المخزن متسجّل خالص → مفيش فحص
function doDeliver(t, map, after){
  const left=stockLeft(), ok={}, short=[];
  for(const [b,q] of Object.entries(map)){ const a=Math.max(0,left[b]||0), n=Math.min(q,a); if(n) ok[b]=n; if(q>n) short.push({b, want:q, a}); }
  const keys=Object.keys(ok).sort((a,b)=>bookRank[a]-bookRank[b]);
  if(short.length) alert('⚠️ الكتاب ده مش موجود في المخزن:\n'+short.map(x=>`• ${bookLabel(x.b)} — المطلوب ${x.want}، المتاح ${x.a}`).join('\n')+(keys.length?'\n\nهيتسلّم الباقي عادي.':''));
  if(!keys.length) return;
  const n=keys.reduce((s,k)=>s+ok[k],0);
  deliverModal(t, n, apply=>{ const now=new Date().toISOString();
    withUndo(`✅ اتسجّل تسليم ${n} كتاب`, ()=>{ apply(); for(const k of keys) db.entries.push({id:uid(), t:t.id, b:k, q:ok[k], s:'d', dd:now, rd:'', rep:db.rep}); if(after) after(); });
    afterWork(t.id); });
}

function getGPS(){ return new Promise((ok,no)=>{

/* ---------- ٤) مواقع المدرسين: زرار في صفحة المدرس + شيت في الإعدادات ---------- */
function locUp(t){

}
function parseLoc(v){
  let s=digits(String(v??'')).replace(/٫/g,'.').replace(/،/g,',');
  try{ s=decodeURIComponent(s); }catch(e){}
  const m = s.match(/@(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/) || s.match(/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/)
    || s.match(/[?&](?:q|query|ll|destination|daddr|center|sll)=(?:loc:)?\s*(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/i)
    || s.match(/(-?\d{1,2}\.\d{2,})\s*[,\s]\s*(-?\d{1,3}\.\d{2,})/);
  if(!m) return null; const lat=+m[1], lng=+m[2];
  if(!isFinite(lat) || !isFinite(lng) || Math.abs(lat)>90 || Math.abs(lng)>180 || (!lat && !lng)) return null;
  return {lat, lng};
}

$('#fileLoc').addEventListener('change', async e=>{

  let H=null;
  for(let i=0;i<Math.min(15,rows.length);i++){ const h=[...(rows[i]||[])].map(x=>normText(x??'')); const fi=re=>h.findIndex(x=>x && re.test(x));
    const ph=fi(/تليفون|تلفون|موبايل|محمول|هاتف|رقم|phone|mobile/), lc=fi(/موقع|لوكيشن|location|خريطه|رابط|link|map/), la=fi(/^lat|عرض/), ln=fi(/^(lng|lon)|طول/);
    if(ph>=0 && (lc>=0 || (la>=0 && ln>=0))){ H={row:i, ph, lc, la, ln}; break; } }
  if(!H){ alert('مش لاقي أعمدة: التليفون والموقع'); return; }
  const byP=new Map(db.teachers.filter(t=>t.phone).map(t=>[t.phone,t]));

/* ---------- ٦) الملاحة جوه البرنامج (الطريق من خدمة OSRM المجانية + صوت عربي) ---------- */
const MODT={left:'شمال', right:'يمين', 'slight left':'شمال خفيف', 'slight right':'يمين خفيف', 'sharp left':'شمال جامد', 'sharp right':'يمين جامد', straight:'على طول', uturn:'وارجع'};
const ARW={left:'⬅️', 'slight left':'↖️', 'sharp left':'⬅️', right:'➡️', 'slight right':'↗️', 'sharp right':'➡️', straight:'⬆️', uturn:'↩️'};
function navText(st){
  const m=st.maneuver||{}, md=MODT[m.modifier]||'', nm=st.name?` في ${st.name}`:'';
  if(m.modifier==='uturn' && m.type!=='arrive' && m.type!=='depart') return `لف وارجع (يو-تيرن)${nm}`;
  switch(m.type){
    case 'depart': return `ابدأ${md&&md!=='على طول'?` ناحية ال${md}`:''}${nm}`;
    case 'arrive': return 'وصلت للمدرس';
    case 'roundabout': case 'rotary': return `في الدوران خد المخرج ${m.exit?`رقم ${m.exit}`:''}${nm}`;
    case 'roundabout turn': return `في الدوران لف ${md}${nm}`;
    case 'exit roundabout': case 'exit rotary': return `اطلع من الدوران${nm}`;
    case 'fork': return `عند التفريعة خد ال${md||'طريق'}${nm}`;
    case 'end of road': return `في آخر الطريق لف ${md}${nm}`;
    case 'continue': case 'new name': return !md||m.modifier==='straight' ? `كمّل على طول${nm}` : `كمّل ${md}${nm}`;
    case 'merge': case 'on ramp': case 'off ramp': return `ادخل ${md}${nm}`;
    default: return m.modifier==='straight'||!md ? `كمّل على طول${nm}` : `لف ${md}${nm}`;
  }
}
const fmtDist = m => m>=1000 ? `${(m/1000).toFixed(1).replace(/\.0$/,'')} كم` : `${Math.max(10, Math.round(m/10)*10)} متر`;
function fmtDur(s){ const m=Math.round(s/60); return m<60 ? `${Math.max(1,m)} دقيقة` : `${Math.floor(m/60)} ساعة${m%60?` و${m%60} دقيقة`:''}`; }
const mDist = (a,b) => distKm(a,b)*1000;
const LLp = a => ({lat:a[1], lng:a[0]});
function segDist(p, a, b){ const k=Math.cos(p.lat*Math.PI/180)*111320, K=110540;
  const ax=(a.lng-p.lng)*k, ay=(a.lat-p.lat)*K, bx=(b.lng-p.lng)*k, by=(b.lat-p.lat)*K, dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
  let u=L2 ? -(ax*dx+ay*dy)/L2 : 0; u=Math.max(0,Math.min(1,u)); const x=ax+u*dx, y=ay+u*dy; return Math.sqrt(x*x+y*y); }
function offRoute(p, pts){ let m=Infinity; for(let i=1;i<pts.length;i++){ const d=segDist(p,pts[i-1],pts[i]); if(d<m) m=d; } return m; }
function say(txt){
  if(!VOICE || !('speechSynthesis' in window)) return;
  try{ const u=new SpeechSynthesisUtterance(txt); u.lang='ar-EG'; const v=speechSynthesis.getVoices().find(x=>/^ar/i.test(x.lang)); if(v) u.voice=v; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}
async function wakeOn(){ try{ if(navigator.wakeLock && !WL) WL=await navigator.wakeLock.request('screen'); }catch(e){} }
function wakeOff(){ try{ WL && WL.release(); }catch(e){} WL=null; }
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) WL=null; else if(NAV && !NAV.done) wakeOn(); });
function navMsg(ar, txt, d){ const el=$('#navTop'); if(el) el.innerHTML=`<span class="ar">${ar}</span><div class="grow">${esc(txt)}${d?`<div class="d">${esc(d)}</div>`:''}</div>`; }

  try{ NAV.map && NAV.map.remove(); }catch(e){} try{ speechSynthesis.cancel(); }catch(e){}
  wakeOff(); NAV=null;
}

function navInit(t){

async function navFix(pos){
  if(!NAV || NAV.done || !NAV.map) return;
  const LL=window.L, p={lat:pos.coords.latitude, lng:pos.coords.longitude}; NAV.here=p;
  if(!NAV.me) NAV.me=LL.circleMarker([p.lat,p.lng], {radius:9, color:'#fff', weight:3, fillColor:'#0ea5e9', fillOpacity:1}).addTo(NAV.map); else NAV.me.setLatLng([p.lat,p.lng]);
  if(NAV.follow) NAV.map.setView([p.lat,p.lng], Math.max(NAV.map.getZoom(), 16));

    const inf=$('#navInfo'); if(inf) inf.innerHTML=`<a class="btn ok sm" href="#/t/${encodeURIComponent(NAV.t)}">📂 افتح صفحة المدرس</a>`;
    try{ navigator.geolocation.clearWatch(NAV.watch); }catch(e){} NAV.watch=null; wakeOff(); return; }
  const off = NAV.pts.length ? offRoute(p, NAV.pts) : Infinity;

    if(NAV.busy || Date.now()-NAV.lastRoute<15000) return;

  navStep(p);
}
async function navRoute(p){
  NAV.busy=true; NAV.lastRoute=Date.now(); const re=!!NAV.pts.length;
  if(!re) navMsg('⏳', 'بيرسم الطريق…', '');
  try{
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${p.lng},${p.lat};${NAV.dest.lng},${NAV.dest.lat}?overview=full&geometries=geojson&steps=true`);
    const j=await r.json(); if(!NAV) return;
    const rt=j.routes && j.routes[0]; if(j.code!=='Ok' || !rt) throw new Error('no route');

    const LL=window.L; if(NAV.line) NAV.line.remove();
    NAV.line=LL.polyline(NAV.pts.map(x=>[x.lat,x.lng]), {color:'#2563eb', weight:7, opacity:.85}).addTo(NAV.map);
    if(!re){ NAV.follow=false; NAV.map.fitBounds(NAV.line.getBounds(), {padding:[30,30]}); setTimeout(()=>{ if(NAV) NAV.follow=true; }, 4000);
      say(`الطريق ${fmtDist(rt.distance)}، حوالي ${fmtDur(rt.duration)}. ${NAV.steps[1]?navText(NAV.steps[1]):''}`); }

    navStep(p);
  }catch(e){ if(NAV){ navMsg('⚠️', 'مش قادر أرسم الطريق دلوقتي', 'اتأكد من النت — هحاول تاني لوحدي'); NAV.lastRoute=Date.now()-5000; } }

}
function navStep(p){
  const S=NAV.steps; if(!S.length) return;
  // نروح للفة اللي بعدها لو قرّبنا من اللفة دي (أقل من 25 م) أو عدّيناها
  while(NAV.si < S.length-1){
    const a=LLp(S[NAV.si].maneuver.location), b=LLp(S[NAV.si+1].maneuver.location), d0=mDist(p,a);

  const st=S[NAV.si], d=mDist(p, LLp(st.maneuver.location)), txt=navText(st);
  navMsg(st.maneuver.type==='arrive'?'🏁':(ARW[st.maneuver.modifier]||'⬆️'), txt, `بعد ${fmtDist(d)}`);
  let rem=d; for(let i=NAV.si;i<S.length;i++) rem+=S[i].distance||0;
  const inf=$('#navInfo'); if(inf) inf.textContent=`فاضل ${fmtDist(rem)} • حوالي ${fmtDur(rem*(NAV.ratio||0.1))}`;
  const k=NAV.si;
  if(d<=160 && d>40 && !NAV.said[k+'a']){ NAV.said[k+'a']=1; say(`بعد ${fmtDist(d)}، ${txt}`); }
  else if(d<=40 && !NAV.said[k+'b']){ NAV.said[k+'b']=1; say(txt); }
}

// خط السير بالأيام: db.days = [{id, n, t:[أكواد المدرسين]}] — مش ملزم، ترتيب للمندوب بس
const DAY_ORD=['الأول','التاني','التالت','الرابع','الخامس','السادس','السابع','التامن','التاسع','العاشر'];
let mapDay='';   // لو الخريطة مفتوحة من يوم معيّن
const dayById = id => db.days.find(d=>d.id===id);

const mapRouteIds = () => { const d=mapDay && dayById(mapDay); return d ? d.t : routeIds(); };
function cleanDays(){ let ch=false; for(const d of db.days){ const n=d.t.filter(id=>tById(id)); if(n.length!==d.t.length){ d.t=n; ch=true; } } if(ch) save(false); }
// تحميلة العربية: نفس حساب «خطة بكرة» القديم (كل كتاب مستحق = 1 + الطلبات)
function dayTake(ids){ const m={}; for(const id of ids){ const t=tById(id); if(!t) continue; const n=planNeed(t);
  for(const k of n.ow) m[k]=(m[k]||0)+1; for(const s of n.ord) for(const it of s.items) m[it.b]=(m[it.b]||0)+it.q; } return m; }
const takeSum = take => Object.values(take).reduce((s,v)=>s+v,0);
function takeHtml(take){ const tk=Object.keys(take).sort((a,b)=>bookRank[a]-bookRank[b]);
  return `<h3 class="sec-t">🚗 حمّل العربية (${takeSum(take)} كتاب)</h3>` + (tk.map(k=>`<div class="kv"><span style="color:var(--c-${bookParts(k).sb});font-weight:700">${esc(bookLabel(k))}</span><b>${take[k]}</b></div>`).join('') || '<div class="muted">مفيش كتب باقية للمدرسين دول.</div>'); }
const dayAreas = ids => { const a=[...new Set(ids.map(id=>tById(id)?.area).filter(Boolean))]; return a.length ? ' • 📍 '+esc(a.slice(0,3).join('، '))+(a.length>3?` +${a.length-3}`:'') : ''; };
function dayText(d){ const take=dayTake(d.t);
  return `🧭 ${d.n}\n\n🚗 حمّل العربية (${takeSum(take)} كتاب):\n` + Object.keys(take).sort((a,b)=>bookRank[a]-bookRank[b]).map(k=>`• ${bookLabel(k)}: ${take[k]}`).join('\n') +
    `\n\n👥 المدرسين (${d.t.length}):\n` + d.t.map(tById).filter(Boolean).map(t=>{ const n=planNeed(t); return `• ${t.name}${t.phone?` (${t.phone})`:''}${t.area?` — ${t.area}`:''}${n.ow.length?` — باقيله ${n.ow.length} كتاب`:''}${n.money?` — عليه ${fmtM(n.money)}`:''}${n.ord.length?' — عنده طلب':''}`; }).join('\n');
}
function renderRoute(){
  setHeader('🧭 خط السير', false); cleanDays();
  const all=routeIds(), allTake=dayTake(all);
  app.innerHTML=`<div class="card"><div class="kv"><span>الأيام</span><b style="font-size:20px">${db.days.length}</b></div><div class="kv"><span>المدرسين في كل الأيام</span><b>${all.length}</b></div><div class="kv"><span>🚗 الكتب لكل الأيام</span><b>${takeSum(allTake)}</b></div>
    <div class="row2" style="margin-top:8px"><button class="btn pri" data-act="day-add">➕ يوم جديد</button><button class="btn" data-act="route-map" ${all.some(id=>tById(id)?.loc)?'':'disabled'}>📍 الكل على الخريطة</button></div>
    <p class="hint">ضيف الأيام اللي جاية، وفي كل يوم المدرسين اللي ناوي تزورهم (بالقرية أو بالاسم). مش لازم تلتزم بيه — ده ترتيب ليك بس.</p></div>
    ${db.days.length ? db.days.map(d=>{ const tk=takeSum(dayTake(d.t)); return `<a class="card dayc" href="#/route/${encodeURIComponent(d.id)}"><div class="grow"><b style="font-size:17px">📅 ${esc(d.n)}</b><div class="small muted">👥 ${d.t.length} مدرس • 🚗 ${tk} كتاب${dayAreas(d.t)}</div></div><span>←</span></a>`; }).join('')

function routePick(dayId){
  const day=dayById(dayId); if(!day) return;

  const areas=[...new Set(db.teachers.map(t=>t.area).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));

  m.innerHTML=`<div class="box"><h3>🧭 مدرسين ${esc(day.n)}</h3>

    <div class="row2" style="margin-top:8px"><button class="btn sm" data-rp="all">☑️ اختار كل اللي ظاهرين</button><button class="btn sm ghost" data-rp="none">⬜ شيل كل اللي ظاهرين</button></div>
    <div class="pickl" id="rp_l"></div>
    <div class="row2"><button class="btn ok" data-rp="ok"></button><button class="btn ghost" data-rp="x">إلغاء</button></div></div>`;
  document.body.appendChild(m);

  const inDays=id=>db.days.filter(x=>x.id!==day.id && x.t.includes(id)).map(x=>x.n);
  const shown=()=>{ const ws=qWords(q);
    if(!AS.size && !ws.length && !needOnly) return day.t.filter(id=>chosen.has(id)).map(tById).filter(Boolean).concat(db.teachers.filter(t=>chosen.has(t.id) && !day.t.includes(t.id)));
    const rk=recvRankFn();
    return db.teachers.filter(t=>(!AS.size || AS.has(t.area)) && (!needOnly || planNeed(t).any) && (!ws.length || ws.every(w=>hayT(t).includes(w)))).sort((a,b)=>rk(a)-rk(b) || a.name.localeCompare(b.name,'ar')); };

    box.innerHTML = l.length ? l.slice(0,300).map(t=>{ const o=inDays(t.id); return `<label><input type="checkbox" data-id="${esc(t.id)}" ${chosen.has(t.id)?'checked':''}><div class="grow"><b>${esc(t.name)}</b>${nameTags(t)}<div class="small muted">${esc([t.area, t.phone, t.subjectText].filter(Boolean).join(' • '))}</div>${o.length?`<div class="small" style="color:var(--owe)">📅 موجود في: ${esc(o.join('، '))}</div>`:''}</div></label>`; }).join('')
      : `<div class="empty small">${AS.size||q.trim()?'مفيش مدرس بالاختيار ده':'اختار قرية أو أكتر، أو دوّر على مدرس — والمختارين بيظهروا هنا'}</div>`;
    markWords(box, qWords(q)); okBtn(); };
  m.querySelector('#rp_q').addEventListener('input', e=>{ q=e.target.value; draw(); });
  bindAreaChips(m, 'rpa', AS, draw);
  m.querySelector('#rp_n').addEventListener('change', e=>{ needOnly=e.target.checked; draw(); });
  m.addEventListener('change', e=>{ const c=e.target.closest('input[type=checkbox][data-id]'); if(!c) return; c.checked ? chosen.add(c.dataset.id) : chosen.delete(c.dataset.id); okBtn(); });
  m.addEventListener('click', e=>{
    if(e.target===m){ m.remove(); return; }
    const b=e.target.closest('[data-rp]'); if(!b) return; const a=b.dataset.rp;
    if(a==='all' || a==='none'){ for(const t of shown()) a==='all' ? chosen.add(t.id) : chosen.delete(t.id); draw(); }
    else if(a==='x') m.remove();
    else if(a==='ok'){ m.remove(); const keep=day.t.filter(id=>chosen.has(id)), add=[...chosen].filter(id=>!keep.includes(id));
      withUndo(`🧭 ${day.n}: ${chosen.size} مدرس`, ()=>{ const d=dayById(day.id); if(d) d.t=[...keep, ...add]; }); }
  });
  draw();
}

/* ---------- الزيارات + التسجيل على برنامج الشركة ----------
   كل مدرس اتسلّمله كتب في يوم = زيارة (مدرس + يوم). db.reg[كود التسليم] = تاريخ تسجيله على برنامج الشركة.
   اللي اتسجل بيختفي من الزيارة؛ لما الزيارة كلها تتسجل تروح فولدر «التسجيلات». */
function visitGroups(){
  const g={};
  for(const e of db.entries){ if(e.s!=='d' || !e.dd || !tById(e.t)) continue;
    const day=dk(e.dd), k=e.t+'|'+day; (g[k] ||= {k, t:e.t, day, ents:[]}).ents.push(e); }
  return Object.values(g).map(v=>{ v.left=v.ents.filter(e=>!db.reg[e.id]); v.ents.sort((a,b)=>bookRank[a.b]-bookRank[b.b]); v.left.sort((a,b)=>bookRank[a.b]-bookRank[b.b]); return v; })
    .sort((a,b)=>b.day.localeCompare(a.day) || tById(a.t).name.localeCompare(tById(b.t).name,'ar'));
}
const bkChips = ents => `<div class="vbk">${ents.map(e=>`<span style="color:var(--c-${bookParts(e.b).sb});font-weight:700">${esc(bookLabel(e.b))}${e.q>1?` × ${e.q}`:''}</span>`).join('')}</div>`;
function visitRow(v, reg){
  const t=tById(v.t), dates=[...new Set(v.ents.map(e=>dk(db.reg[e.id])).filter(Boolean))].sort();
  return `<div class="vrow" data-hay="${esc(teacherHay(t))}"><div class="tc-top" style="gap:8px"><div class="grow"><a href="#/t/${encodeURIComponent(t.id)}"><b>${esc(t.name)}</b></a>${nameTags(t)}
      <div class="small muted">${esc([t.area, t.phone].filter(Boolean).join(' • '))}${reg?` • زيارة ${dayName(v.day)} ${fmtDay(v.day)}`:''}</div></div><div class="icos">${phoneBtns(t)}</div></div>
    ${bkChips(reg ? v.ents : v.left)}
    ${reg ? `<div class="regd">✅ تم التسجيل بتاريخ ${dates.map(fmtDay).join(' و ')}</div><div class="row2" style="margin-top:6px"><button class="btn sm ghost" data-act="reg-undo" data-k="${esc(v.k)}">↩️ رجّعها للزيارات</button><button class="btn sm" data-act="vis-edit" data-k="${esc(v.k)}">✏️ تعديل الزيارة</button></div>`
      : `${v.left.length<v.ents.length?'<div class="small muted" style="margin-top:4px">اتسجل منها جزء قبل كده — ده الباقي</div>':''}<div class="row2" style="margin-top:8px"><button class="btn sm ok" data-act="reg-visit" data-k="${esc(v.k)}">✅ تم التسجيل</button><button class="btn sm" data-act="vis-edit" data-k="${esc(v.k)}">✏️ تعديل الزيارة</button></div>`}</div>`;
}
function renderVisits(f){

    app.innerHTML = list.length ? searchBar('vq')+`<div id="vlist">${groupHtml(list, false)}</div>` : '<div class="card empty">مفيش زيارات مستنية تسجيل هنا 🎉</div>';

  setHeader('👣 الزيارات', false);

  app.innerHTML=`<div class="card"><p class="hint" style="margin-top:0">أي مدرس بتسلّمه كتب بيدخل هنا لوحده في فولدر اليوم. بعد ما تسجّله على برنامج الشركة دوس «✅ تم التسجيل».</p>
      <div class="row2"><a class="btn pri" href="#/visits/all" style="text-align:center;text-decoration:none">📋 الكل (${open.length})</a><a class="btn ok" href="#/visits/reg" style="text-align:center;text-decoration:none">✅ التسجيلات (${done.length})</a></div></div>
    ${days.length ? days.map(d=>`<a class="card vfold" href="#/visits/${d}"><span style="font-size:26px">📁</span><div class="grow"><b>${dayName(d)} ${fmtDay(d)}</b>${d===today?' <span class="pill new">النهارده</span>':''}<div class="small muted">مستني تسجيل</div></div><span class="n">${byDay[d].length}</span></a>`).join('')
      : '<div class="card empty">مفيش زيارات مستنية تسجيل 🎉</div>'}
    ${old?`<button class="btn ghost sm" style="width:100%" data-act="reg-old">✔️ علّم كل الزيارات القديمة (قبل النهارده) إنها اتسجلت — ${old} زيارة</button>`:''}`;
}
function regVisit(k){

    <div class="row2"><button class="btn ok" data-rg="all">✅ سجلت الكل</button><button class="btn pri" data-rg="sel">✅ سجلت المحدد بس</button></div>

    if(!ids.length){ alert('علّم على كتاب واحد على الأقل'); return; }
    m.remove(); const now=new Date().toISOString(), full=ids.length===v.left.length;
    withUndo(full ? `✅ ${t.name} اتسجل — راح التسجيلات` : `✅ اتسجل ${ids.length} — الباقي فاضل في الزيارة`, ()=>{ for(const id of ids) db.reg[id]=now; });
  });

/* ---------- تعديل الزيارة + تعديل فاتورة المدرس + سجل التعديلات ----------
   تعديل الزيارة: الكتب اللي اتسلّمت (db.entries) — الرصيد = المستلم − المسلّم فبيتحسب لوحده (زوّدت ينقص، رجّعت يزيد).
   تعديل الفاتورة: عدد كل كتاب في البيع، والتقسيم على التجار (src) بيتعدّل، فرصيد التجار بيتحسب لوحده. المرتجع اللي اتسجّل ما بيتمسحش. */
function logEdit(kind, tid, ch, extra){ if(ch.length) db.editLog.push({id:uid(), at:new Date().toISOString(), kind, t:tid, ch, ...(extra||{})}); }
function qtyRows(rows, withPrice){
  return rows.map((r,i)=>`<div class="srow"><div class="grow"><b style="color:var(--c-${bookParts(r.b).sb})">${esc(bookLabel(r.b))}</b>${r.fresh?' <span class="pill new">جديد</span>':''}
      <div class="small muted">كان ${r.q0}${withPrice&&r.pr!=null?` • ${fmtN(r.pr)} ج للواحد`:''}${r.min?` • رجّع منه ${r.min} (مش هينزل عنها)`:''}</div></div>
    <div class="step"><button data-ev="dec" data-i="${i}" aria-label="أقل">−</button><input class="qin" inputmode="numeric" data-i="${i}" value="${r.q}"><button class="plus" data-ev="inc" data-i="${i}" aria-label="زوّد">+</button></div></div>`).join('');
}
function bindQtyEditor(m, rows, paintList, paintSum, minOf){
  m.addEventListener('input', e=>{ const i=e.target.closest('.qin'); if(!i) return; const r=rows[+i.dataset.i];
    r.q=Math.max(minOf(r),Math.min(9999,parseInt(digits(i.value).replace(/\D/g,''),10)||0)); paintSum(); });
  m.addEventListener('click', e=>{ if(e.target===m){ m.remove(); return; } const b=e.target.closest('[data-ev]'); if(!b) return; const r=rows[+b.dataset.i];
    r.q=Math.max(minOf(r),Math.min(9999,r.q+(b.dataset.ev==='inc'?1:-1))); paintList(); });
  m.querySelector('#ev_add').addEventListener('change', e=>{ const b=e.target.value; if(!b) return; const ex=rows.find(r=>r.b===b);
    if(ex) ex.q++; else rows.push({id:'', i:-1, b, q0:0, q:1, min:0, fresh:true, pr:priceOf(b)?.post ?? null}); e.target.value=''; paintList(); });
}
function editVisit(k){
  const v=visitGroups().find(x=>x.k===k); if(!v) return; const t=tById(v.t);
  const rows=v.ents.map(e=>({id:e.id, b:e.b, q0:e.q, q:e.q, min:0})), stk=stockLeft();
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="box"><h3>✏️ تعديل زيارة ${esc(t.name)}</h3><div class="small muted" style="margin-bottom:8px">زيارة ${dayName(v.day)} ${fmtDay(v.day)} — زوّد أو نقّص أي كتاب، والرصيد بيتعدّل لوحده (زوّدت ينقص، رجّعت يزيد). صفّر الخانة عشان تشيل الكتاب.</div>
    <div id="ev_l"></div>
    <div class="field" style="margin-top:8px"><label>➕ ضيف كتاب</label><select id="ev_add"><option value="">اختار الكتاب…</option>${BOOK_ORDER.map(b=>`<option value="${b}">${esc(bookLabel(b))}</option>`).join('')}</select></div>
    <div id="ev_sum" class="tot" style="margin:8px 0"></div>
    <div class="row2"><button class="btn pri" id="ev_ok">💾 حفظ التعديل</button><button class="btn ghost" id="ev_x">إلغاء</button></div></div>`;
  document.body.appendChild(m);
  const delta=()=>{ const d={}; for(const r of rows) if(r.q!==r.q0) d[r.b]=(d[r.b]||0)+(r.q-r.q0); return Object.entries(d).filter(([,x])=>x); };
  const paintSum=()=>{ const d=delta();
    m.querySelector('#ev_sum').innerHTML = d.length ? d.map(([b,x])=>{ const after=stk?(stk[b]||0)-x:null;
      return `<div class="small">${esc(bookLabel(b))}: ${x>0?`زوّدت ${x} ← الرصيد <b style="color:var(--owe)">ينقص ${x}</b>`:`نقّصت ${-x} ← الرصيد <b style="color:var(--ok)">يزيد ${-x}</b>`}${after!=null?` (يبقى ${after})`:''}${after!=null&&after<0?' <span style="color:var(--bad)">⚠️ أكتر من اللي استلمته</span>':''}</div>`; }).join('') : '<span class="muted">لسه ما غيّرتش حاجة</span>'; };
  const paintList=()=>{ m.querySelector('#ev_l').innerHTML=qtyRows(rows, false); paintSum(); };
  bindQtyEditor(m, rows, paintList, paintSum, ()=>0);
  m.querySelector('#ev_x').onclick=()=>m.remove();
  m.querySelector('#ev_ok').onclick=()=>{
    const d=delta(); if(!d.length){ alert('ما غيّرتش حاجة'); return; }
    if(stk && d.some(([b,x])=>(stk[b]||0)-x<0) && !confirm('فيه كتاب هيبقى رصيده بالسالب (أكتر من اللي استلمته). تكمّل؟')) return;
    const ch=rows.filter(r=>r.q!==r.q0).map(r=>({f:bookLabel(r.b)+(r.id?'':' (جديد)'), o:r.id?String(r.q0):'—', n:r.q?String(r.q):'اتشال'}));
    const dd=v.ents[0].dd; m.remove();
    withUndo('✏️ الزيارة اتعدّلت — الرصيد اتحسب', ()=>{
      for(const r of rows){
        if(r.id){ const e=db.entries.find(x=>x.id===r.id); if(!e || r.q===r.q0) continue;
          if(r.q<=0) db.entries=db.entries.filter(x=>x.id!==r.id); else e.q=r.q;
          delete db.reg[r.id]; }   // اتعدّل: يرجع للزيارات يتسجّل تاني على برنامج الشركة
        else if(r.q>0) db.entries.push({id:uid(), t:v.t, b:r.b, q:r.q, s:'d', dd, rd:'', rep:db.rep});
      }
      logEdit('visit', v.t, ch, {day:v.day});
    });

function shrinkSrc(s, i, d){   // ينقّص التقسيم على التجار من الآخر، من غير اللي اترجّع
  const prior={};
  for(const p of db.payments) if(p.k==='ret' && p.t===s.t) for(const pt of p.parts||[]) if(pt.sale===s.id && pt.i===i) for(const x of pt.lots||[]) prior[x.lot]=(prior[x.lot]||0)+x.q;
  const src=s.items[i].src||[];
  for(let j=src.length-1; j>=0 && d>0; j--){ const x=src[j], r=Math.min(x.q, prior[x.lot]||0); prior[x.lot]=(prior[x.lot]||0)-r;
    const can=x.q-r; if(can<=0) continue; const n=Math.min(d,can); x.q-=n; d-=n; }
  s.items[i].src=src.filter(x=>x.q>0);
}

const areaChips=(areas, key)=>`<div class="achips" data-ak="${key}"><button type="button" class="chip" data-${key}="">كل القرى</button>${areas.map(a=>`<button type="button" class="chip" data-${key}="${esc(a)}">${esc(a)}</button>`).join('')}</div>`;
function bindAreaChips(root, key, S, cb){
  const box=root.querySelector(`[data-ak="${key}"]`); if(!box) return;
  const paint=()=>box.querySelectorAll('button').forEach(b=>{ const a=b.getAttribute('data-'+key); b.classList.toggle('on', a ? S.has(a) : !S.size); });
  box.addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; e.preventDefault(); e.stopPropagation();
    const a=b.getAttribute('data-'+key); if(!a) S.clear(); else S.has(a) ? S.delete(a) : S.add(a); paint(); cb(); });
  paint();
}

/* [رابط المدرس]: بنجيب (أو نعمل) حساب كل مدرس في 💬 المراسلات (Supabase) بجلسة admin.html المحفوظة على نفس الموقع */
async function sbSession(){
  const c=window.SILAH_CONFIG; let s=null; try{ s=JSON.parse(localStorage.getItem('selah-trial-auth')||'null'); }catch(e){}
  if(!c || !s || !s.refresh_token) return null;
  if(!s.expires_at || s.expires_at*1000 < Date.now()+60000){
    const r=await fetch(c.SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:c.SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});
    if(!r.ok) return null; const n=await r.json(); s={...s, ...n}; try{ localStorage.setItem('selah-trial-auth', JSON.stringify(s)); }catch(e){}
  }
  return {c, s, h:{apikey:c.SUPABASE_ANON_KEY, Authorization:'Bearer '+s.access_token, 'Content-Type':'application/json'}};
}
function sbProfile(t){ return {name:t.name||'', phone:t.phone||'', stage:t.stage||'', subjects:(t.subjects||[]).filter(x=>x!=='kash').slice(0,2), spec:t.spec||'',
  area:t.area||'', school:t.school||'', grades:(t.tGrades&&t.tGrades.length?t.tGrades:(t.grades||[]).filter(g=>g>=1&&g<=6)), where:t.where||'', students:t.students||'',
  ...(t.tAddress?{address:t.tAddress}:{}), ...(t.tLoc?{loc:t.tLoc}:{}), ...(t.tDays?{days:t.tDays}:{})}; }
function sbBooks(tid){ const m={}; for(const s of db.sales||[]) if(s.t===tid) for(const it of s.items||[]) m[it.b]=(m[it.b]||0)+(+it.q||0);
  return Object.entries(m).filter(([,q])=>q>0).map(([b,q])=>({b, l:bookLabel(b), q})); }
async function sbLinks(list){
  const S=await sbSession(); if(!S) throw new Error('login');
  const me=await (await fetch(S.c.SUPABASE_URL+'/rest/v1/staff?select=id&user_id=eq.'+S.s.user.id,{headers:S.h})).json();
  if(!Array.isArray(me) || !me[0]) throw new Error('login');
  const rep=me[0].id, codes={}, base=new URL('teacher.html', location.href).href;
  const get=async ids=>{ const r=await fetch(S.c.SUPABASE_URL+'/rest/v1/teachers?select=id,local_id,invite_code&rep_id=eq.'+rep+'&local_id=in.('+ids.map(encodeURIComponent).join(',')+')',{headers:S.h}); const j=await r.json(); if(!r.ok) throw new Error(j.message||'err'); j.forEach(x=>{ codes[x.local_id]=x.invite_code; sbIds[x.local_id]=x.id; }); };
  for(let i=0;i<list.length;i+=80) await get(list.slice(i,i+80).map(t=>t.id));
  const miss=list.filter(t=>!codes[t.id]);
  for(let i=0;i<miss.length;i+=200){
    const rows=miss.slice(i,i+200).map(t=>({rep_id:rep, local_id:t.id, name:t.name, phone:t.phone||'', profile:sbProfile(t), books:sbBooks(t.id)}));
    const r=await fetch(S.c.SUPABASE_URL+'/rest/v1/teachers?on_conflict=rep_id,local_id',{method:'POST',headers:{...S.h, Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(rows)});
    const j=await r.json(); if(!r.ok) throw new Error(j.message||'err'); j.forEach(x=>{ codes[x.local_id]=x.invite_code; sbIds[x.local_id]=x.id; });
  }
  try{ localStorage.setItem('selah-trial-ids', JSON.stringify(sbIds)); }catch(e){}
  const out={}; for(const t of list) if(codes[t.id]) out[t.id]=base+'#c='+codes[t.id]; return out;
}

      <a class="btn ok" id="mq_wa" style="display:block;text-decoration:none;margin-top:12px;font-size:17px" href="${esc(waLink(t.phone, body))}" target="_blank" rel="noopener">💬 افتح الواتساب وابعت</a>
      <div class="row2" style="margin-top:8px"><button class="btn pri" data-mq="next">التالي ←</button><button class="btn ghost" data-mq="skip">⏭️ تخطّي</button></div>
      <button class="btn ghost sm" style="width:100%;margin-top:8px" data-mq="x">✕ وقّف الإرسال</button></div>`;

    case 'rreq-no': rreqAct(el.dataset.id, false); break;
    case 'sent-f': sentF[el.dataset.k]=el.dataset.v; renderSent(); break;
    case 'sent-ask': { const k=el.dataset.v; sentAsk.has(k)?sentAsk.delete(k):sentAsk.add(k); renderSent(); break; }
    case 'sent-all': for(const t of sentShown()) if(t.phone) sentSel.add(t.id); sentDraw(); break;
    case 'sent-none': for(const t of sentShown()) sentSel.delete(t.id); sentDraw(); break;
    case 'sent-send': sentSend(); break;
    case 'sent-codes': sentCodes(); break;
    case 'req-add': { const inp=$('#rq_t'), v=(inp?.value||'').trim(); if(!v){ toast('اكتب الطلب الأول'); break; }
      (db.reqs ||= []).push({id:uid(), t:el.dataset.id, txt:v, at:new Date().toISOString(), done:false}); save(); render(); toast('🔔 الطلب اتسجّل وظاهر في الجرس'); break; }
    case 'req-done': { const r=(db.reqs||[]).find(x=>x.id===el.dataset.id); if(!r) break; const open=!!document.getElementById('bellM');
      r.done=true; r.doneAt=new Date().toISOString(); save(); render(); if(open) bellModal(); break; }
    case 'req-del': { if(!confirm('تمسح الطلب ده؟')) break; db.reqs=(db.reqs||[]).filter(x=>x.id!==el.dataset.id); save(); render(); break; }
    case 'vis-edit': editVisit(el.dataset.k); break;
    case 'inv-edit': editInvoice(el.dataset.id); break;
    case 'reg-undo': { const v=visitGroups().find(x=>x.k===el.dataset.k); if(!v || !confirm('ترجّع الزيارة دي للزيارات (كأنها ما اتسجلتش)؟')) break;
      withUndo('↩️ الزيارة رجعت', ()=>{ for(const e2 of v.ents) delete db.reg[e2.id]; }); break; }
    case 'reg-old': { const today=dayKey(), l=visitGroups().filter(v=>v.left.length && v.day<today); if(!l.length) break;
      if(!confirm(`هتعلّم ${l.length} زيارة قديمة (قبل النهارده) إنها اتسجلت على برنامج الشركة وتروح التسجيلات. أكمل؟`)) break;
      const now=new Date().toISOString(); withUndo(`✔️ ${l.length} زيارة راحت التسجيلات`, ()=>{ for(const v of l) for(const e2 of v.left) db.reg[e2.id]=now; }); break; }
    case 'msg-f': msgF[el.dataset.k]=el.dataset.v; renderMsgs(); break;
    case 'msg-all': for(const t of msgShown()) if(t.phone) msgSel.add(t.id); msgDraw(); break;
    case 'msg-none': for(const t of msgShown()) msgSel.delete(t.id); msgDraw(); break;
    case 'msg-send': msgSend(); break;
    case 'my-stock': stockModal(); break;
  }
});

/* ---------- ٨) تعديل فاتورة التاجر برقم سري + سجل التعديلات ---------- */
const pinHash = p => { let h=5381; for(const c of 'selah|'+p) h=(((h<<5)+h) ^ c.charCodeAt(0))>>>0; return h.toString(36); };
function pinCard(){
  return `<div class="card"><h3 class="sec-t">🔒 الرقم السري (تعديل فواتير التجار)</h3>
    <div class="small muted" style="margin-bottom:8px">${db.pinH?'الرقم السري متحدد ✅ — البرنامج بيطلبه مرة واحدة كل ما تفتحه.':'لسه ما حددتش رقم سري — لازم تحدده عشان تعدّل فاتورة تاجر.'}</div>
    <button class="btn" style="width:100%" data-act="pin-set">${db.pinH?'🔑 غيّر الرقم السري':'🔑 حدد رقم سري'}</button>
    ${db.pinH?'<a href="#" class="small" data-act="pin-forgot" style="display:block;margin-top:8px">نسيت الرقم السري؟</a>':''}
  </div>`;
}
function pinModal(title, fields, cb){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="box"><h3>${title}</h3>${fields.map(([id,l])=>`<div class="field"><label>${l}</label><input id="${id}" type="password" inputmode="numeric" maxlength="6" autocomplete="off" dir="ltr"></div>`).join('')}
    <div class="row2"><button class="btn pri" id="pn_ok">تمام</button><button class="btn ghost" id="pn_x">إلغاء</button></div></div>`;
  document.body.appendChild(m); const close=()=>m.remove();
  m.addEventListener('click', e=>{ if(e.target===m) close(); }); m.querySelector('#pn_x').onclick=close;
  setTimeout(()=>m.querySelector('input').focus(), 50);
  const go=()=>{ const v=Object.fromEntries(fields.map(([id])=>[id, digits(m.querySelector('#'+id).value).replace(/\D/g,'')])); if(cb(v)!==false) close(); };
  m.querySelector('#pn_ok').onclick=go; m.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
}
function setPin(){
  const f=[...(db.pinH?[['pn_o','الرقم السري القديم']]:[]), ['pn_n','الرقم السري الجديد (4 لـ 6 أرقام)'], ['pn_n2','اكتبه تاني']];
  pinModal(db.pinH?'🔑 غيّر الرقم السري':'🔑 حدد رقم سري', f, v=>{
    if(db.pinH && pinHash(v.pn_o)!==db.pinH){ alert('الرقم السري القديم غلط'); return false; }
    if(!/^\d{4,6}$/.test(v.pn_n)){ alert('الرقم السري لازم يبقى من 4 لـ 6 أرقام'); return false; }
    if(v.pn_n!==v.pn_n2){ alert('الرقمين مش زي بعض'); return false; }
    db.pinH=pinHash(v.pn_n); PIN_OK=true; save(); render(); toast('🔒 الرقم السري اتحفظ');
  });
}
function needPin(cb){
  if(!db.pinH){ alert('حدد رقم سري الأول من الإعدادات (🔒 الرقم السري).'); location.hash='#/settings'; return; }
  if(PIN_OK){ cb(); return; }
  pinModal('🔒 اكتب الرقم السري', [['pn_c','الرقم السري']], v=>{ if(pinHash(v.pn_c)!==db.pinH){ alert('الرقم السري غلط'); return false; } PIN_OK=true; setTimeout(cb, 0); });
}

/* ---------- ٩) تذكير «صلِّ على النبي ﷺ» كل نص ساعة (مرة مكتوب ومرة بالصوت) ---------- */
// كل ٢٠ دقيقة تذكير بالدور (٦ أنواع)، مكتوب + صوت + إشعار النظام. إلزامي (مفيش إعدادات)
const PB_MIN=20;
const NIGHT_FROM=21, NIGHT_TO=7;   // بالليل مفيش تذكيرات ولا تنبيهات الـ GPS
function isNight(){ const h=new Date().getHours(); return h>=NIGHT_FROM || h<NIGHT_TO; }
// الأحاديث من الصحيح (متفق عليه / الترمذي)، والآيات بنصها
const REM_CATS=[
  {k:'sal',    items:h=>[['🤍 صلِّ على النبي ﷺ','اللهم صلِّ وسلِّم وبارك على سيدنا محمد'],['🤍 صلِّ على النبي ﷺ','اللهم صلِّ على محمد وعلى آل محمد']]},
  {k:'sharif', items:h=>{ const w=h<12?'بيصبّح':'بيمسّي'; return [[`🤍 أخوك شريف ${w} عليك`, `أخوك شريف ${w} عليك`]]; }},
  {k:'dhikr',  items:h=>[['📿 سبحان الله وبحمده، سبحان الله العظيم','سبحان الله وبحمده، سبحان الله العظيم'],['📿 لا إله إلا الله وحده لا شريك له','لا إله إلا الله وحده لا شريك له']]},
  {k:'verse',  items:h=>[['📖 ﴿وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا﴾ (الطلاق: ٢)','ومن يتق الله يجعل له مخرجا'],['📖 ﴿إِنَّ مَعَ الْعُسْرِ يُسْرًا﴾ (الشرح: ٦)','إن مع العسر يسرا'],['📖 ﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾ (الرعد: ٢٨)','ألا بذكر الله تطمئن القلوب']]},
  {k:'hadith', items:h=>[['📜 «إنما الأعمال بالنيات» — متفق عليه','إنما الأعمال بالنيات'],['📜 «المسلم من سلم المسلمون من لسانه ويده» — متفق عليه','المسلم من سلم المسلمون من لسانه ويده'],['📜 «الكلمة الطيبة صدقة» — متفق عليه','الكلمة الطيبة صدقة'],['📜 «إن الله رفيق يحب الرفق في الأمر كله» — متفق عليه','إن الله رفيق يحب الرفق في الأمر كله'],['📜 «تبسّمك في وجه أخيك صدقة» — رواه الترمذي','تبسمك في وجه أخيك صدقة']]},
  {k:'hikma',  items:h=>[['💡 الصبر مفتاح الفرج','الصبر مفتاح الفرج'],['💡 القناعة كنز لا يفنى','القناعة كنز لا يفنى'],['💡 اللي بيزرع الخير بيحصد الخير','اللي بيزرع الخير بيحصد الخير']]}
];
function remChime(){   // صوت متوسط (مش عالي)
  try{ const C=new (window.AudioContext||window.webkitAudioContext)();
    [[523,0],[659,0.5]].forEach(([f,t0])=>{ const o=C.createOscillator(), g=C.createGain(); o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(C.destination);
      g.gain.setValueAtTime(0.0001,C.currentTime+t0); g.gain.exponentialRampToValueAtTime(0.15,C.currentTime+t0+0.05); g.gain.exponentialRampToValueAtTime(0.0001,C.currentTime+t0+0.9);
      o.start(C.currentTime+t0); o.stop(C.currentTime+t0+0.95); });
    setTimeout(()=>C.close(),2000); }catch(e){}
}
function speakRem(txt){
  try{ if(!('speechSynthesis' in window)) return; const u=new SpeechSynthesisUtterance(txt); u.lang='ar-EG'; u.volume=0.8;
    const v=speechSynthesis.getVoices().find(x=>/^ar/i.test(x.lang)); if(v) u.voice=v; speechSynthesis.speak(u); }catch(e){}
}
function remSysNotify(txt){   // إشعار النظام: صوته بيتبع الصامت بتاع التليفون
  try{ if(!('Notification' in window) || Notification.permission!=='granted') return;
    const opts={body:txt, tag:'selah-rem', renotify:true, icon:'icon-192.png', badge:'icon-192.png'};
    if(navigator.serviceWorker && navigator.serviceWorker.ready)
      navigator.serviceWorker.ready.then(r=>r.showNotification('سلاح التلميذ البحيرة', opts)).catch(()=>{ try{ new Notification('سلاح التلميذ البحيرة', opts); }catch(e){} });
    else new Notification('سلاح التلميذ البحيرة', opts);
  }catch(e){}
}
function pbShow(n){
  const h=new Date().getHours(), cat=REM_CATS[n%REM_CATS.length], items=cat.items(h);
  let [txt, sp]=items[Math.floor(n/REM_CATS.length)%items.length];
  const pend=pendReqs().length; if(pend && n%3===2){ txt=`🔔 عندك ${pend} طلب من المدرسين — دوس الجرس فوق`; sp=''; }
  remSysNotify(txt);
  if(document.hidden) return;   // البرنامج مش ظاهر: الإشعار بس
  const el=document.createElement('div'); el.className='hello-s pb-s out'; el.textContent=txt; document.body.appendChild(el);
  const bye=()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 600); };
  el.onclick=bye; setTimeout(()=>el.classList.remove('out'), 60); setTimeout(bye, 7000);
  remChime();
  if(cat.k==='sal' && sp && !(NAV && !NAV.done)) speakRem(sp);
}
function remPermBar(){   // مش مجبر، بس شريط دايم لحد ما يفعّل الإشعارات
  if(!('Notification' in window) || Notification.permission==='granted' || document.getElementById('remPerm')) return;

  document.body.appendChild(b);

}
function pbTick(){
  if(!db.rep || isNight() || document.querySelector('.hello-s')) return;
  let s={}; try{ s=JSON.parse(localStorage.getItem(KEY+'-pb')||'{}'); }catch(e){}
  const now=Date.now();
  if(!s.at) s={at:now, n:0}; else if(now-s.at>=PB_MIN*60000){ s.at=now; s.n=(s.n||0)+1; pbShow(s.n-1); }
  try{ localStorage.setItem(KEY+'-pb', JSON.stringify(s)); }catch(e){}
}

    case 'pin-set': setPin(); break;
