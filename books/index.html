<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>سلاح التلميذ البحيرة</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#f3f5f4;--card:#ffffff;--ink:#14201e;--muted:#5d6b68;--line:#dde4e2;
  --brand:#0f766e;--brand-ink:#ffffff;--brand-soft:#e2f2ef;
  --ok:#15803d;--ok-soft:#e4f4e9;--owe:#b45309;--owe-soft:#fdf0dc;--bad:#b91c1c;--bad-soft:#fde7e7;
  --sel:#dbeafe;--sel-ink:#1d4ed8;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 10px rgba(0,0,0,.04);
  --c-ar:#1D4ED8;--c-math:#15803D;--c-stu:#92400E;--c-en:#7E22CE;--c-sci:#EA580C;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1413;--card:#17201e;--ink:#e5eeec;--muted:#93a39f;--line:#283432;
  --brand:#2dd4bf;--brand-ink:#04201c;--brand-soft:#11322e;
  --ok:#4ade80;--ok-soft:#12301d;--owe:#fbbf24;--owe-soft:#38290b;--bad:#f87171;--bad-soft:#3a1515;
  --sel:#1e3358;--sel-ink:#93c5fd;--shadow:none;
  --c-ar:#60a5fa;--c-math:#4ade80;--c-stu:#d6a35c;--c-en:#c084fc;--c-sci:#fb923c}}
:root[data-theme="dark"]{
  --bg:#0e1413;--card:#17201e;--ink:#e5eeec;--muted:#93a39f;--line:#283432;
  --brand:#2dd4bf;--brand-ink:#04201c;--brand-soft:#11322e;
  --ok:#4ade80;--ok-soft:#12301d;--owe:#fbbf24;--owe-soft:#38290b;--bad:#f87171;--bad-soft:#3a1515;
  --sel:#1e3358;--sel-ink:#93c5fd;--shadow:none;
  --c-ar:#60a5fa;--c-math:#4ade80;--c-stu:#d6a35c;--c-en:#c084fc;--c-sci:#fb923c}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic","Noto Naskh Arabic",Arial,sans-serif;font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.wrap{max-width:860px;margin:0 auto;padding:12px 16px 120px}
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink)}
header.top .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-btn{flex:none;border:0;border-radius:10px;padding:5px 10px;background:rgba(255,255,255,.18);color:inherit;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}
.bk-btn.due{background:var(--owe);color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
header.top .back{background:none;border:0;color:inherit;font-size:22px;padding:2px 6px;cursor:pointer}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;max-width:215px;text-align:center;padding:8px 4px 9px;text-decoration:none;color:var(--muted);font-size:13px;position:relative}
nav.tabs a .i{display:block;font-size:20px;line-height:1.2}
nav.tabs a.on{color:var(--brand);font-weight:700}
nav.tabs .badge{position:absolute;top:3px;right:calc(50% - 22px);background:var(--owe);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;min-width:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:17px}
.search input:focus{outline:none;border-color:var(--brand)}
.btn{border:0;border-radius:12px;padding:11px 16px;cursor:pointer;background:var(--brand-soft);color:var(--brand);font-weight:700;white-space:nowrap}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.ok{background:var(--ok);color:#fff}
.btn.owe{background:var(--owe);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
select.area{border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:6px 10px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.tlist{display:flex;flex-direction:column;gap:8px}
.titem{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-decoration:none;color:inherit}
.titem:active{background:var(--brand-soft)}
.titem .nm{font-weight:700}
.titem .sub{font-size:13px;color:var(--muted)}
.titem .grow{flex:1;min-width:0}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.owe{background:var(--owe-soft);color:var(--owe)}
.pill.new{background:var(--line);color:var(--muted)}
.pill.cls{background:var(--brand-soft);color:var(--brand)}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.thead h2{margin:0 0 4px;font-size:21px}
.thead .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:var(--muted)}
.thead .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.warn{border-radius:12px;padding:12px;margin-bottom:12px;background:var(--owe-soft);border:1px solid color-mix(in srgb,var(--owe) 35%,transparent)}
.warn h3{margin:0 0 8px;font-size:16px;color:var(--owe)}
.orow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed color-mix(in srgb,var(--owe) 30%,transparent)}
.orow:first-of-type{border-top:0}
.orow .grow{flex:1}
.got{border-radius:12px;padding:12px;margin-bottom:12px;background:var(--ok-soft)}
.got h3{margin:0 0 6px;font-size:15px;color:var(--ok)}
.stage-t{font-size:15px;font-weight:800;margin:18px 2px 8px;color:var(--muted)}
.subj-grid{columns:165px;column-gap:8px}
details.subj{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 8px;break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid}
details.subj>summary .sn,details.subj .lbl b{color:var(--sc)}
.pill.stk{background:var(--line);color:var(--muted)}
.pill.stk.neg{background:var(--bad-soft);color:var(--bad)}
.tbox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.tbox .stat{cursor:pointer;font:inherit;color:inherit}
.tbox .stat span{font-size:14px;font-weight:700}
.tbox .stat.on{border-color:var(--brand);background:var(--brand-soft)}
.blist{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;line-height:1.9}
.bk{font-weight:700}
.stk-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.stk-row .grow{flex:1;min-width:0;font-weight:700;font-size:14px}
.stk-row input{width:64px;padding:7px 8px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);text-align:center}
details.stk>summary{cursor:pointer;font-weight:700;padding:8px 0;color:var(--brand)}
details.subj>summary{list-style:none;cursor:pointer;padding:10px 10px;display:flex;align-items:center;gap:4px;font-weight:700;white-space:nowrap}
details.subj>summary .pill{font-size:11px;padding:0 5px}
details.subj>summary::-webkit-details-marker{display:none}
details.subj>summary::after{content:"▾";margin-inline-start:auto;color:var(--muted);transition:transform .15s}
details.subj[open]>summary::after{transform:rotate(180deg)}
details.subj.mine>summary{background:var(--brand-soft)}
.star{font-size:12px;color:var(--brand)}
.grow-row{display:flex;align-items:center;gap:4px;padding:6px 8px;border-top:1px solid var(--line);min-height:50px}
.grow-row.sel{background:var(--sel)}
.grow-row .lbl{flex:1;min-width:0;cursor:pointer;user-select:none;line-height:1.25}
.grow-row .lbl b{font-size:15px;display:block}
.grow-row .lbl .pill{font-size:11px;padding:0 5px}
.step{display:flex;align-items:center;gap:2px;flex:none}
.step button{width:34px;height:36px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);font-size:19px;cursor:pointer;line-height:1;padding:0}
.step button.plus{border-color:var(--brand);color:var(--brand)}
.step .q{min-width:20px;text-align:center;font-weight:800;font-size:17px}
.titem{cursor:pointer}
.titem .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.icos{display:flex;gap:6px}
.ico{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;background:var(--brand-soft);text-decoration:none;font-size:18px}
.oline{font-size:13px;color:var(--owe);font-weight:700;margin-top:3px}
.lhead{grid-column:1/-1;font-weight:700;color:var(--muted);font-size:14px;margin:2px 2px 0}
.grow-row.sel .q{color:var(--sel-ink)}
.actbar{position:fixed;left:0;right:0;bottom:62px;z-index:25;display:none;padding:0 12px}
.actbar.show{display:block}
.actbar .in{max-width:836px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px;display:flex;gap:8px;align-items:center}
.actbar .btn{flex:1;padding:13px 8px}
.hist{font-size:14px}
.hrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow .grow{flex:1}
textarea{width:100%;min-height:70px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);padding:8px 10px;resize:vertical}
.field{margin-bottom:10px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.field input,.field select{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@media (min-width:700px){.modal{align-items:center}.modal .box{border-radius:18px}}
.modal h3{margin:0 0 12px}
.row2{display:flex;gap:8px}
.row2>*{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:140px;z-index:60;background:#1f2937;color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:#7dd3fc;font-weight:700;cursor:pointer}
.oblock{margin-bottom:10px}
.oblock .hd{display:flex;align-items:center;gap:8px;font-weight:700}
.oblock .hd .grow{flex:1}
.oblock ul{margin:6px 0 0;padding:0 18px 0 0}
.oblock li{padding:2px 0}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.sec-t{font-size:16px;margin:0 0 10px}
.banner{background:var(--bad-soft);color:var(--bad);padding:10px 14px;border-radius:12px;margin-bottom:12px;font-weight:700}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.cls-bar{background:var(--sel);border:1.5px solid color-mix(in srgb,var(--sel-ink) 40%,transparent);border-radius:12px;padding:12px;margin-bottom:12px}
.cls-bar h3{margin:0 0 8px;font-size:16px;color:var(--sel-ink)}
.cls-bar .acts{display:flex;gap:8px;flex-wrap:wrap}
.cls-bar select{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font-size:15px;min-width:120px}
.backup-bar{background:var(--owe-soft);border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.backup-bar .grow{flex:1;font-size:14px;color:var(--owe)}
.auto-owed{background:color-mix(in srgb,var(--brand-soft) 70%,transparent);border:1px dashed var(--brand);border-radius:12px;padding:12px;margin-bottom:12px}
.auto-owed h3{margin:0 0 6px;font-size:15px;color:var(--brand)}
.auto-owed .items{font-size:14px;color:var(--muted)}
.lock-badge{display:inline-block;background:var(--line);color:var(--muted);border-radius:8px;padding:1px 6px;font-size:11px;margin-inline-start:6px}
/* البيع والتجار */
.scard .hd{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:4px}
.scard .hd a{color:inherit;text-decoration:none}
.scard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.scard .acts .btn{text-decoration:none}
.scard .tot{margin-top:6px;font-size:15px}
.scard.focus{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin-top:6px}
.mgrid div{background:var(--bg);border-radius:10px;padding:6px 2px}
.mgrid span{display:block;font-size:12px;color:var(--muted)}
.mgrid b{font-size:14px}
.sumline{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:16px}
details.mcard>summary{list-style:none;cursor:pointer}
details.mcard>summary::-webkit-details-marker{display:none}
details.mcard h4{margin:12px 0 4px;font-size:15px}
details.done>summary{cursor:pointer;font-weight:700;color:var(--muted);padding:8px 2px}
.tscroll{overflow-x:auto;margin-top:10px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center}
.tbl th{color:var(--muted);font-weight:700;font-size:12px}
.tbl td:first-child,.tbl th:first-child{text-align:right}
.mline{display:block;width:100%;text-align:right;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:700;cursor:pointer}
.pill.sale{background:var(--sel);color:var(--sel-ink)}
.pill.money{background:var(--bad-soft);color:var(--bad)}
.sale-foot{position:sticky;bottom:-16px;background:var(--card);border-top:1px solid var(--line);padding:10px 0 4px;margin-top:10px}
.sale-foot .tot{margin-bottom:8px;font-size:16px}
.pick{display:flex;align-items:center;gap:8px;background:var(--brand-soft);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.pick .grow{flex:1;min-width:0}
.pick-row{display:block;width:100%;text-align:right;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.addnew{border:1px dashed var(--line);border-radius:12px;padding:10px;margin-top:6px}
.addnew input{min-width:0;width:100%;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);margin-top:6px}
.srow{display:flex;align-items:center;gap:6px;padding:8px 4px;border-top:1px solid var(--line)}
.srow.sel{background:var(--sel)}
.srow .grow{flex:1;min-width:0;line-height:1.35}
.step .qin{width:48px;height:36px;text-align:center;border-radius:9px;border:1.5px solid var(--line);background:var(--card);font-weight:800;font-size:17px;padding:0}
.srow .step button{width:30px;height:36px;font-size:17px}
details.others>summary{cursor:pointer;font-weight:700;padding:10px 2px;color:var(--brand)}
.inv-wrap{position:fixed;inset:0;z-index:55;background:#e5e7eb;overflow:auto;padding:16px 12px 24px}
.inv{background:#fff;color:#111;max-width:560px;margin:0 auto;border-radius:12px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.inv-h{background:#0f766e;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px}
.inv-h .brand{font-weight:800;font-size:21px;flex:1}
.inv-h h2{margin:0;font-size:17px}
.inv-h .d{font-size:13px;opacity:.9}
.inv-b{padding:14px 16px 18px}
.inv-who{background:#e2f2ef;border-radius:10px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:15px}
.inv-who span{color:#555}
.inv .tbl{margin:12px 0;border-radius:8px;overflow:hidden}
.inv .tbl th{background:#0f766e;color:#fff;font-size:13px;border:0;padding:8px 4px}
.inv .tbl td{border:0;color:#111}
.inv .tbl tbody tr:nth-child(even) td{background:#f3f4f6}
.inv .tbl s{color:#888}
.inv .kv{border-color:#e5e7eb}
.inv .kv:first-of-type{border-top:0}
.inv-np{text-align:center;color:#b45309;font-weight:700;margin:6px 0}
.inv-due{margin-top:10px;background:#b91c1c;color:#fff;border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;font-size:20px;font-weight:800}
.inv-acts{max-width:560px;margin:12px auto 0;display:flex;flex-wrap:wrap;gap:8px}
.inv-acts .btn{flex:1 1 40%;text-align:center;text-decoration:none}
/* اللوجو والتوقيع */
header.top .logo{width:30px;height:30px;border-radius:7px;background:#fff;object-fit:contain;flex:none}
.splash{position:fixed;inset:0;z-index:100;background:#fff;color:#0f766e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .35s}
.splash img{width:150px;height:150px;object-fit:contain}
.splash .nm{font-size:22px;font-weight:800}
.splash .sg{font-size:14px;color:#5d6b68}
.splash.out{opacity:0;pointer-events:none}
.sign{text-align:center;color:var(--muted);font-size:13px;margin:18px 0 4px}
/* ألوان كروت المدرسين */
.titem.st-part{background:var(--owe-soft);border-color:color-mix(in srgb,var(--owe) 35%,transparent);border-inline-start:5px solid var(--owe)}
.titem.st-done{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent);border-inline-start:5px solid var(--ok)}
.pill.dup{background:var(--bad-soft);color:var(--bad)}
.pill.abc{background:var(--sel);color:var(--sel-ink)}
.pill.nw{background:#ede9fe;color:#6d28d9}
.titem.is-new{border-inline-end:5px solid #7c3aed}
.ddrow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line);font-size:15px}
.ddrow:first-child{border-top:0}
.ddrow input{width:20px;height:20px;flex:none}
.dupg{border-top:1px solid var(--line);padding:8px 0}
.dupg:first-of-type{border-top:0}
.spec-subs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.spec-subs label{border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:5px 10px;font-size:14px;cursor:pointer;font-weight:700}
.spec-subs input{margin:0 0 0 4px;vertical-align:middle}
details.others-t>summary{cursor:pointer;font-weight:800;padding:12px 2px;color:var(--brand);font-size:15px}
details.ob{border-top:1px solid var(--line)}
details.ob>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;padding:8px 0}
details.ob>summary::-webkit-details-marker{display:none}
details.ob>summary::after{content:"▾";color:var(--muted);margin-inline-start:6px}
.ob-t{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 0;font-size:14px}
.ob-t .grow{flex:1;min-width:0}

/* ================= التصنيفات ================= */
const CLS_MAP = {
  'فصل':       {stages:['p'], gradeRange:{p:[1,3]}, subjects:['ar','math']},
  'صفوف عليا': {stages:['p'], gradeRange:{p:[4,6]}},
  'اعدادي':    {stages:['m'], gradeRange:{m:[1,3]}},
  'إعدادي':    {stages:['m'], gradeRange:{m:[1,3]}},
  'صفوف عليا واعدادي': {stages:['p','m'], gradeRange:{p:[4,6], m:[1,3]}},
  'ابتدائي واعدادي':   {stages:['p','m'], gradeRange:{p:[1,6], m:[1,3]}},
  'ابتدائي وإعدادي':   {stages:['p','m'], gradeRange:{p:[1,6], m:[1,3]}},
  'ابتدائي':   {stages:['p'], gradeRange:{p:[1,6]}},
  'كشكول':     {stages:['p'], gradeRange:{p:[1,6]}, subjects:['ar','math','stu','sci']},
};
function parseCls(raw){
  if(!raw) return null;
  const n = normText(raw);
  for(const [k,v] of Object.entries(CLS_MAP)){
    if(normText(k)===n) return v;
  }
  if(/كشكول/.test(n)) return CLS_MAP['كشكول'];
  if(/فصل/.test(n)) return CLS_MAP['فصل'];
  if(/صفوف.?عليا/.test(n) && /اعدا/.test(n)) return CLS_MAP['صفوف عليا واعدادي'];
  if(/صفوف.?عليا/.test(n)) return CLS_MAP['صفوف عليا'];
  if(/ابتدا/.test(n) && /اعدا/.test(n)) return CLS_MAP['ابتدائي واعدادي'];
  if(/ابتدا/.test(n)) return CLS_MAP['ابتدائي'];
  if(/اعدا/.test(n)) return CLS_MAP['اعدادي'];
  return null;
}
// عمود التصنيف في شيت المندوب فيه A أو B أو C (نوع المدرس)
function clsLetter(t){ const s=String(t.cls||'').trim().toUpperCase(); return /^[ABC]$/.test(s) ? s : ''; }
// التخصص: اللي المندوب اختاره (t.spec)، وإلا «كشكول» أو «فصل» لو مكتوبين في أي عمود، وإلا التصنيف لو مفهوم
function teacherCls(t){
  if(t.spec){ const c=parseCls(t.spec); if(c) return c; }
  for(const v of [t.cls, t.subjectText, t.stageText]){ const n=normText(v||'');
    if(/كشكول/.test(n)) return CLS_MAP['كشكول']; if(/فصل/.test(n)) return CLS_MAP['فصل']; }
  return clsLetter(t) ? null : parseCls(t.cls);
}
// المواد والمراحل بتاعته (للبحث وترتيب الكتب)
function tSubs(t){ const c=teacherCls(t); return [...new Set([...(c?.subjects||[]), ...(t.subjects||[])])]; }
function tStages(t){ const c=teacherCls(t); return [...new Set([...(c?.stages||[]), ...(t.stage||'').split('').filter(s=>STAGES[s])])]; }
function myGroups(t){ return new Set(expectedBooks(t).map(k=>k.split('-').slice(0,2).join('-'))); }
function expectedBooks(t){
  let cls = teacherCls(t);
  if(!cls){ // مفيش تصنيف واضح → من المرحلة + المادة اللي في الشيت
    const sts=(t.stage||'').split('').filter(s=>STAGES[s]);
    if(!sts.length) return [];
    cls={stages:sts, gradeRange:{}};
  }
  const subs = cls.subjects || t.subjects || [];
  if(!subs.length) return [];
  const books = [];
  for(const st of cls.stages){
    const [gMin, gMax] = cls.gradeRange[st] || [1, STAGES[st].grades];
    const stSubs = subs.filter(sb => STAGES[st].subjects.includes(sb));
    for(const sb of stSubs){
      const from = Math.max(gMin, FROM[st+'-'+sb]||1);
      for(let g=from; g<=gMax; g++) books.push(`${st}-${sb}-${g}`);
    }
  }
  return books;
}
function autoOwed(t){
  const exp = expectedBooks(t);
  if(!exp.length) return [];
  const delivered = new Set();
  for(const e of db.entries) if(e.t===t.id && e.s==='d') delivered.add(e.b);
  return exp.filter(k => !delivered.has(k));
}
function owedEntries(){
  const r=[]; for(const t of db.teachers) for(const k of autoOwed(t)) r.push({id:'', t:t.id, b:k, q:1, s:'o', dd:'', rd:''});
  return r;
}

}

function dayStats(day){
  const visits=new Set(); let d=0,o=0;
  for(const e of db.entries){
    if(e.s==='d' && dk(e.dd)===day){ d+=e.q; visits.add(e.t); }
    if(e.rd && dk(e.rd)===day){ o+=e.q; visits.add(e.t); }

}

function helloSlot(h){ return h>=5&&h<10 ? 0 : h>=10&&h<14 ? 1 : h>=14&&h<18 ? 2 : 3; }
function maybeHello(){
  if(!db.rep || $('.hello-s')) return;
  const d=new Date(), h=d.getHours(), slot=`${dayKey(h<5?new Date(d.getTime()-864e5):d)}-${helloSlot(h)}`;
  let last=''; try{ last=localStorage.getItem(KEY+'-hello')||''; }catch(e){}
  if(last===slot) return;
  try{ localStorage.setItem(KEY+'-hello', slot); }catch(e){}
  const nm=esc(db.rep);
  const g = h>=5&&h<12 ? `☀️ صباح الخير يا ${nm} — أخوك شريف حشيش بيصبّح عليك`
    : h>=12&&h<17 ? `🌤️ نهارك سعيد يا ${nm} — أخوك شريف حشيش بيسلّم عليك` : `🌙 مساء الخير يا ${nm} — أخوك شريف حشيش بيمسّي عليك`;
  const di=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)%ENC.length;
  const el=document.createElement('div'); el.className='hello-s out'; el.innerHTML=`${g}<div class="enc">${ENC[di]}</div>`;
  document.body.appendChild(el);
  const bye=()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 600); };
  el.onclick=bye; setTimeout(()=>el.classList.remove('out'), 60); setTimeout(bye, 6000);
}

function todayData(){
  const t=dayKey(), del={}, sold={}, S=saleIdx(); let dN=0, sv=0, sN=0, paid=0, rN=0, rv=0;
  for(const e of db.entries) if(e.s==='d' && dk(e.dd)===t){ dN+=e.q; del[e.b]=(del[e.b]||0)+e.q; }
  for(const s of db.sales) if(s.st==='sold' && dk(s.sd)===t) for(const it of s.items){ sN+=it.q; sold[it.b]=(sold[it.b]||0)+it.q; if(it.post!=null) sv+=it.q*it.post; }
  for(const p of db.payments) if(dk(p.d)===t){ if(p.k==='pay') paid+=p.amt; else { rN+=p.q||0; rv+=retVal(p,S); } }
  return {dN, sv:r2(sv), sN, paid:r2(paid), rN, rv:r2(rv), del, sold, visits:dayStats(t).visits};
}

const SUBJ_RE=[['ar',/^(ال)?عربي/],['math',/^(ال)?رياض/],['stu',/^(ال)?دراس/],['en',/^(ال)?(انجليز|انجلش|english)/],['sci',/^(ال)?علوم/]];
const subjOf=w=>{ const m=SUBJ_RE.find(([k,re])=>re.test(w)); return m?m[0]:null; };
// البحث بأي حاجة: كل الكلمات لازم تتطابق. A/B/C لوحده = التصنيف بس
function parseQuery(raw){
  const q={owed:false, subjs:[], stages:[], letter:'', rest:[]};
  for(let w of normText(raw).split(' ').filter(Boolean)){
    if(w.length>2 && w[0]==='و' && (subjOf(w.slice(1)) || /^(ال)?(ابتدا|اعدا)/.test(w.slice(1)))) w=w.slice(1);
    if(/^(ال)?مستحق/.test(w)) q.owed=true;
    else if(subjOf(w)) q.subjs.push(subjOf(w));
    else if(/^(ال)?ابتدا/.test(w)) q.stages.push('p');
    else if(/^(ال)?اعدا/.test(w)) q.stages.push('m');
    else if(/^[abc]$/.test(w)) q.letter=w.toUpperCase();
    else q.rest.push(w);
  }
  return q;
}
const emptyQ = () => ({owed:false, subjs:[], stages:[], letter:'', rest:[]});
function teacherHay(t){ return normText([t.name, t.phone, t.area, t.school, t.subjectText, t.stageText, STAGE_TXT[t.stage]||'', t.cls, t.spec,
  ...tSubs(t).map(s=>SUBJ[s]), ...tStages(t).map(s=>STAGES[s].name)].filter(Boolean).join(' ')); }
function matchTeacher(t, Q, owedList){
  if(Q.letter && clsLetter(t)!==Q.letter) return false;
  if(Q.owed){ const l=owedList || autoOwed(t).map(b=>({b, s:'o'})); if(!l.some(e=>owedMatch(e, Q.subjs, Q.stages))) return false; }
  else { const ss=tSubs(t), sts=tStages(t); if(!Q.subjs.every(s=>ss.includes(s)) || !Q.stages.every(s=>sts.includes(s))) return false; }
  if(!Q.rest.length) return true;
  const h=teacherHay(t), ph=t.phone||'';
  return Q.rest.every(w=>h.includes(w) || (/^\d{3,}$/.test(w) && ph.includes(w.replace(/^0/,''))));
}
function owedMatch(e,subjs,stages){ if(e.s!=='o') return false; const p=bookParts(e.b); return (!subjs?.length||subjs.includes(p.sb)) && (!stages?.length||stages.includes(p.st)); }
function owedLine(ents){
  const by={}; for(const e of [...ents].sort((a,b)=>bookRank[a.b]-bookRank[b.b])){ (by[bookParts(e.b).sb] ||= []).push(e); }
  return Object.entries(by).map(([sb,l])=>`${SUBJ[sb]}: `+l.map(e=>{const p=bookParts(e.b); return `${GRADE[p.g-1]} ${STAGES[p.st].name}`+(e.q>1?` (${e.q})`:'');}).join('، ')).join(' • ');
}

    <div class="side"><div>${badges}</div><div class="icos">${phoneBtns(t)}</div></div></div>`;

function renderList(){
  const idx=indexEntries(), today=dayKey();
  const raw=homeQuery.trim(); const qd=normPhone(raw).replace(/^0/,'');
  const isNum = raw && /^[\d٠-٩۰-۹\s+\-]+$/.test(raw);
  const Q = raw && !isNum ? parseQuery(raw) : emptyQ();
  const owedBy={}; for(const e of owedEntries()) (owedBy[e.t] ||= []).push(e);
  const visitedToday=new Set(db.entries.filter(e=>dk(e.dd)===today||dk(e.rd)===today).map(e=>e.t));
  let list=db.teachers.filter(t=>{
    if(homeArea && t.area!==homeArea) return false;
    const x=idx[t.id];
    if(homeFilter==='plan' && t.plan!==today) return false;
    if(homeFilter==='owed' && !x?.o) return false;
    if(homeFilter==='today' && !visitedToday.has(t.id)) return false;
    if(homeFilter==='none' && x) return false;
    if(!raw) return true;
    if(isNum) return !!qd && (t.phone||'').includes(qd);
    return matchTeacher(t, Q, owedBy[t.id]||[]);
  });
  list.sort((a,b)=>{
    const la=idx[a.id]?.last||'', lb=idx[b.id]?.last||'';
    if(homeFilter==='all' && !raw && la!==lb) return lb.localeCompare(la);
    return a.name.localeCompare(b.name,'ar');
  });
  const total=list.length; list=list.slice(0,80);
  const el=$('#tlist');
  if(!total){ el.innerHTML=`<div class="empty" style="grid-column:1/-1">مفيش نتايج${raw?` لـ «${esc(raw)}»`:''}<br><br><button class="btn" data-act="new-teacher" data-name="${esc(isNum||Q.owed||Q.subjs.length||Q.stages.length||Q.letter?'':raw)}" data-phone="${esc(isNum?raw:'')}">➕ ضيف مدرس جديد</button></div>`; return; }
  let head='';
  if(raw && !isNum){
    const areaHit = Q.rest.length ? [...new Set(list.map(t=>t.area).filter(a=>a && Q.rest.every(w=>normText(a).includes(w))))] : [];
    const desc=[Q.owed?'ليهم مستحق':'', ...Q.subjs.map(s=>SUBJ[s]), ...Q.stages.map(s=>STAGES[s].name), Q.letter?`تصنيف ${Q.letter}`:'', areaHit.length===1?`في ${areaHit[0]}`:''].filter(Boolean).join(' ');
    head=`<div class="lhead">${total} مدرس ${esc(desc)}</div>`;
  }
  const showOwed = Q.owed || homeFilter==='owed';
  el.innerHTML = head + list.map(t=>{
    const oe = showOwed ? (owedBy[t.id]||[]).filter(e=>owedMatch(e, Q.owed?Q.subjs:null, Q.owed?Q.stages:null)) : [];
    return teacherCard(t, idx[t.id], oe.length?`<div class="oline">⏳ ${esc(owedLine(oe))}</div>`:'');
  }).join('') + (total>80?`<div class="empty small" style="grid-column:1/-1">ظاهر 80 من ${total} — اكتب في البحث علشان تضيّق</div>`:'');
}

let owedSubj='', owedArea='', owedQuery='';
// بحث الكتب: «عربي 5» أو «عربي خامسة ابتدائي» أو «خامسة» أو كتابين «عربي 5 رياضة 4»
const GRADE_RE=[[/^(ال)?(اولي|اول)$/,1],[/^(ال)?(تانيه|ثانيه|تاني|ثاني)$/,2],[/^(ال)?(تالته|ثالثه|تالت|ثالث)$/,3],[/^(ال)?(رابعه|رابع)$/,4],[/^(ال)?(خامسه|خامس)$/,5],[/^(ال)?(سادسه|سادس|سته|ست)$/,6]];
const gradeOf=w=>{ if(/^[1-6]$/.test(w)) return +w; const m=GRADE_RE.find(([re])=>re.test(w)); return m?m[1]:0; };
const stageOf=w=>/^(ال)?ابتدا/.test(w)?'p':/^(ال)?اعدا/.test(w)?'m':'';
function parseBookQuery(raw){
  const specs=[], rest=[]; let cur=null;
  const nu=()=>{ cur={sb:'', g:0, st:''}; specs.push(cur); return cur; };
  for(let w of normText(raw).split(' ').filter(Boolean)){
    if(w.length>1 && w[0]==='و'){ const r=w.slice(1); if(subjOf(r)||gradeOf(r)||stageOf(r)) w=r; }
    const sb=subjOf(w), g=gradeOf(w), st=stageOf(w);
    if(sb){ if(cur && !cur.sb) cur.sb=sb; else nu().sb=sb; }
    else if(g){ if(cur && !cur.g) cur.g=g; else nu().g=g; }
    else if(st){ if(cur && !cur.st) cur.st=st; else nu().st=st; }
    else if(!/^(ال)?صف$/.test(w)) rest.push(w);
  }
  return {specs, rest};
}
function bookMatch(k, specs){ if(!specs.length) return true; const p=bookParts(k);
  return specs.some(s=>(!s.sb||p.sb===s.sb) && (!s.g||p.g===s.g) && (!s.st||p.st===s.st)); }
function owedFiltered(){
  const BQ=owedQuery.trim() ? parseBookQuery(owedQuery) : {specs:[], rest:[]};
  return owedEntries().filter(e=>{
    if(owedSubj && bookParts(e.b).sb!==owedSubj) return false;
    const t=tById(e.t);
    if(owedArea && (!t || t.area!==owedArea)) return false;
    if(!bookMatch(e.b, BQ.specs)) return false;
    if(BQ.rest.length){ if(!t) return false; const h=teacherHay(t); if(!BQ.rest.every(w=>h.includes(w))) return false; }
    return true;
  });
}

let delDays=new Set();
const DAY_NM=['الأحد','الاتنين','التلات','الأربع','الخميس','الجمعة','السبت'];
const dayName=k=>DAY_NM[new Date(k+'T12:00:00').getDay()];
const dShort=k=>{ const [,m,d]=k.split('-'); return `${+d}/${+m}`; };
function delByDay(){ const m={}; for(const e of db.entries) if(e.s==='d' && e.dd){ const x=m[dk(e.dd)] ||= {n:0, b:{}}; x.n+=e.q; x.b[e.b]=(x.b[e.b]||0)+e.q; } return m; }
function delDaysCard(){

  for(const k of [...delDays]) if(!D[k]) delDays.delete(k);

  return `<div class="card">${h}
    <div class="chips" style="margin:0 0 6px">${q('today','النهارده')}${q('week','آخر 7 أيام')}${q('month','الشهر ده')}${q('clear','امسح الاختيار')}</div>
    <div style="max-height:320px;overflow:auto">${ks.map(k=>`<label class="ddrow"><input type="checkbox" data-dd="${k}" ${delDays.has(k)?'checked':''}><span class="grow">${dayName(k)} ${dShort(k)}</span><b>${D[k].n} كتاب</b></label>`).join('')}</div>
    <div id="ddsum" class="tot" style="margin:8px 0"></div>
    <button class="btn pri" style="width:100%" data-act="dd-xlsx">📚 نزّل الشيت</button>
    <p class="hint">الكتب اللي اتسلّمت للمدرسين بس. الشيت فيه كل المواد وكل الصفوف (حتى لو صفر)، وكل يوم مختار في عمود لوحده + الإجمالي.</p></div>`;
}
function ddSum(){ const el=$('#ddsum'); if(!el) return; const D=delByDay(), n=[...delDays].reduce((s,k)=>s+(D[k]?.n||0),0);
  el.innerHTML = delDays.size ? `تم اختيار <b>${delDays.size}</b> ${delDays.size===1?'يوم':'أيام'} — <b>${n}</b> كتاب` : '<span class="muted">اختار يوم أو أكتر</span>'; }
function ddQuick(r){
  const D=delByDay(), t=dayKey(), d=new Date();
  const from = r==='today' ? t : r==='week' ? dayKey(new Date(Date.now()-6*864e5)) : r==='month' ? isoDay(d.getFullYear(), d.getMonth()+1, 1) : null;
  delDays = new Set(from ? Object.keys(D).filter(k=>k>=from && k<=t) : []);
  app.querySelectorAll('[data-dd]').forEach(cb=>cb.checked=delDays.has(cb.dataset.dd)); ddSum();
  if(from && !delDays.size) toast('مفيش تسليمات في الفترة دي');
}
const SUBJ_ALL={ar:'العربي', math:'الرياضة', stu:'الدراسات', sci:'العلوم', en:'الإنجليزي'};
function delSheetOf(days){
  const D=delByDay(); days=[...days].filter(k=>D[k]).sort();
  if(!days.length) return null;
  const hd=days.map(k=>`${dayName(k)} ${dShort(k)}`), sum=a=>a.reduce((x,y)=>x+y,0);
  const rows=[[`المندوب: ${db.rep}`], [`الإدارة: ${db.idara||'—'}`], ['الأيام: '+hd.join('، ')], [], ['الكتاب', ...hd, 'الإجمالي']];
  const grand=days.map(()=>0), B=(t,c)=>({rich:[{t:String(t), bold:true, color:c}]});
  for(const sb of ['ar','math','stu','sci','en']){
    const ks=BOOK_ORDER.filter(k=>bookParts(k).sb===sb); if(!ks.length) continue;
    const sub=days.map(()=>0);
    for(const k of ks){ const v=days.map(d=>D[d].b[k]||0); v.forEach((n,i)=>sub[i]+=n); rows.push([bookLabel(k), ...v, sum(v)]); }
    const c=SUBJ_COLOR[sb]; rows.push([B('إجمالي '+SUBJ_ALL[sb], c), ...sub.map(n=>B(n,c)), B(sum(sub),c)]);
    sub.forEach((n,i)=>grand[i]+=n);
  }
  rows.push([B('الإجمالي الكلي'), ...grand.map(n=>B(n)), B(sum(grand))]);
  return {name:'الكتب اللي اتسلّمت', rows, head:4, widths:[28, ...days.map(()=>14), 12]};
}
function exportDelDays(){
  if(!delDays.size){ alert('اختار يوم أو أكتر الأول'); return; }
  const sh=delSheetOf(delDays); if(!sh) return;
  const ks=[...delDays].sort();
  download(buildXlsx([sh]), `الكتب-اللي-اتسلمت-${db.rep}-${ks[0]}${ks.length>1?'-لحد-'+ks[ks.length-1]:''}.xlsx`); toast('⬇️ الشيت نزل');
}

document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  switch(a){
    case 'noop': break;
    case 'open-t': location.hash='#/t/'+encodeURIComponent(el.dataset.id); break;
    case 'owed-subj': owedSubj=el.dataset.k; renderOwed(); break;
    case 'inc': bumpSel(el.dataset.k, 1); break;
    case 'dec': bumpSel(el.dataset.k, -1); break;
    case 'clear-sel': sel={}; document.querySelectorAll('.grow-row.sel').forEach(r=>{r.classList.remove('sel'); r.querySelector('.q').textContent='';}); updateActbar(); break;
    case 'commit-d': commitSel('d'); break;
    case 'deliver-owed': { const k=el.dataset.k, t=tById(curTeacher); if(!t) break; withUndo('✅ اتسجّل التسليم', ()=>{ db.entries.push({id:uid(), t:t.id, b:k, q:1, s:'d', dd:new Date().toISOString(), rd:'', rep:db.rep}); }); afterWork(t.id); break; }
    case 'deliver-all-owed': { const t=tById(curTeacher); if(!t) break; const now=new Date().toISOString(); const ks=autoOwed(t); withUndo(`✅ اتسلّم ${ks.length} كتاب`, ()=>{ for(const k of ks) db.entries.push({id:uid(), t:t.id, b:k, q:1, s:'d', dd:now, rd:'', rep:db.rep}); }); afterWork(t.id); break; }
    case 'del-entry': { const id=el.dataset.id; const ent=db.entries.find(z=>z.id===id);

/* ================= ZIP / XLSX ================= */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipBlob(files, type){
  const enc=new TextEncoder(), parts=[], cd=[]; let off=0;
  for(const f of files){
    const nm=enc.encode(f.name), d=typeof f.data==='string'?enc.encode(f.data):f.data, crc=crc32(d);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,0,true); lh.setUint16(12,0x21,true); lh.setUint32(14,crc,true); lh.setUint32(18,d.length,true);
    lh.setUint32(22,d.length,true); lh.setUint16(26,nm.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer), nm, d);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true);
    ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0x21,true); ch.setUint32(16,crc,true);
    ch.setUint32(20,d.length,true); ch.setUint32(24,d.length,true); ch.setUint16(28,nm.length,true); ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer), nm);
    off+=30+nm.length+d.length;
  }
  const cdSize=cd.reduce((a,b)=>a+b.length,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cdSize,true); e.setUint32(16,off,true);
  return new Blob([...parts, ...cd, new Uint8Array(e.buffer)], {type});
}
async function unzip(buf){
  const u=new Uint8Array(buf), v=new DataView(buf); let e=-1;
  for(let i=u.length-22;i>=Math.max(0,u.length-65558);i--){ if(v.getUint32(i,true)===0x06054b50){e=i;break;} }
  if(e<0) throw new Error('not a zip');
  const n=v.getUint16(e+10,true); let p=v.getUint32(e+16,true); const files={}; const td=new TextDecoder();
  for(let i=0;i<n;i++){
    const method=v.getUint16(p+10,true), csize=v.getUint32(p+20,true), nl=v.getUint16(p+28,true), xl=v.getUint16(p+30,true), cl=v.getUint16(p+32,true), lo=v.getUint32(p+42,true);
    const name=td.decode(u.subarray(p+46,p+46+nl)); p+=46+nl+xl+cl;
    const start=lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true);
    files[name]={method, data:u.subarray(start,start+csize)};
  }
  return { async text(name){ const f=files[name]; if(!f) return null; let d=f.data;
    if(f.method===8){ if(typeof DecompressionStream==='undefined') throw new Error('old browser');
      d=new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()); }
    return td.decode(d); } };
}
function colIdx(s){ let n=0; for(const ch of s) n=n*26+(ch.charCodeAt(0)-64); return n-1; }
function colName(i){ let s=''; i++; while(i){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; }
async function readXlsx(file){
  const z=await unzip(await file.arrayBuffer()), P=new DOMParser(), X='application/xml';
  let ss=[]; const ssT=await z.text('xl/sharedStrings.xml');
  if(ssT){ const d=P.parseFromString(ssT,X); ss=[...d.getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].filter(t=>t.parentNode.nodeName!=='rPh').map(t=>t.textContent).join('')); }
  let path='xl/worksheets/sheet1.xml';
  const wb=await z.text('xl/workbook.xml'), rels=await z.text('xl/_rels/workbook.xml.rels');
  if(wb && rels){
    const s=P.parseFromString(wb,X).getElementsByTagName('sheet')[0];
    const rid=s && (s.getAttribute('r:id') || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'));
    const rel=[...P.parseFromString(rels,X).getElementsByTagName('Relationship')].find(r=>r.getAttribute('Id')===rid);
    if(rel){ const t=rel.getAttribute('Target'); path = t.startsWith('/') ? t.slice(1) : 'xl/'+t.replace(/^\.\//,''); }
  }
  const sx=await z.text(path); if(!sx) throw new Error('no sheet');
  const rows=[];
  for(const row of P.parseFromString(sx,X).getElementsByTagName('row')){
    const arr=[];
    for(const c of row.getElementsByTagName('c')){
      const ref=c.getAttribute('r'); const ci = ref ? colIdx(ref.replace(/\d+/g,'')) : arr.length;
      const t=c.getAttribute('t'), vEl=c.getElementsByTagName('v')[0]; let val;
      if(t==='s') val = vEl ? ss[+vEl.textContent] : '';
      else if(t==='inlineStr') val=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');
      else if(vEl){ const tx=vEl.textContent; val = (t==='str'||t==='b'||t==='e'||isNaN(+tx)) ? tx : +tx; }
      if(val!==undefined && val!=='') arr[ci]=typeof val==='string'?val.trim():val;
    }
    rows.push(arr);
  }
  return rows;
}
function detectHeader(rows){
  for(let i=0;i<Math.min(15,rows.length);i++){
    const h=[...(rows[i]||[])].map(x=>normText(x??''));
    const find=re=>h.findIndex(x=>x && re.test(x));
    let name=h.findIndex(x=>x && /اسم/.test(x) && /(مدرس|معلم)/.test(x) && !/مدرسه/.test(x));
    if(name<0) name=h.findIndex(x=>/^(الاسم|اسم|المدرس|المعلم|اسم المدرس)$/.test(x));
    const phone=find(/هاتف|تليفون|موبايل|محمول|جوال|تلفون|رقم/);
    if(name>=0) return {row:i, name, phone, stage:find(/ابتدا|اعدا|مرحله/), subject:find(/ماده|المواد|تخصص/),
      area:find(/منطقه|قريه/), school:find(/مدرسه/), cls:find(/تصنيف/), students:find(/طلاب/), date:find(/تاريخ/)};
  }
  return null;
}
function serialToParts(v){ const d=new Date(Math.round((v-25569)*864e5)); return [d.getUTCFullYear(), d.getUTCMonth()+1, d.getUTCDate()]; }
$('#fileXlsx').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  let rows; try{ rows=await readXlsx(f); }catch(err){ alert('مش قادر أقرا الملف ده. اتأكد إنه شيت إكسل (.xlsx).'); return; }
  const H=detectHeader(rows);
  if(!H){ alert('مش لاقي عمود «اسم المدرس» في الشيت.'); return; }
  const data=rows.slice(H.row+1).filter(r=>r && (r[H.name] || (H.phone>=0 && r[H.phone])));
  const get=(r,i)=> i>=0 && r[i]!==undefined ? String(r[i]).trim() : '';
  // التاريخ: إكسل أحياناً بيقلب اليوم والشهر (1/11 بيبقى 11 يناير). لو كل التواريخ الرقمية نفس اليوم وشهور مختلفة → اقلبهم
  let swap=false;
  if(H.date>=0){ const nums=data.map(r=>r[H.date]).filter(v=>typeof v==='number' && v>20000 && v<80000).map(serialToParts);
    if(nums.length>2 && new Set(nums.map(p=>p[2])).size===1 && new Set(nums.map(p=>p[1])).size>2) swap=true; }
  const parseDate=v=>{
    if(v===undefined||v==='') return '';
    if(typeof v==='number' && v>20000 && v<80000){ let [y,m,d]=serialToParts(v); if(swap) [m,d]=[d,m]; return isoDay(y,m,d); }
    const s=digits(v); let mm=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/); if(mm) return isoDay(+mm[3],+mm[2],+mm[1]);
    mm=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(mm) return isoDay(+mm[1],+mm[2],+mm[3]); return '';
  };
  let add=0, upd=0, twice=0; const plan=[], seen=new Map();
  for(const r of data){
    const name=get(r,H.name), phone=normPhone(get(r,H.phone));
    const subjectText=get(r,H.subject), stageText=get(r,H.stage);
    const rec={name, phone, stage:parseStage(stageText), stageText, subjectText, subjects:parseSubjects(subjectText),
      area:get(r,H.area), school:get(r,H.school), cls:get(r,H.cls), students:get(r,H.students), plan:parseDate(r[H.date])};
    // نفس الرقم مرتين في نفس الشيت → يتضاف مرة واحدة (السطر التاني يكمّل الخانات الفاضية بس)
    if(phone && seen.has(phone)){ const p=seen.get(phone).rec; for(const k of Object.keys(rec)) if(!p[k] || (Array.isArray(p[k]) && !p[k].length)) p[k]=rec[k]; twice++; continue; }
    const ex = phone ? db.teachers.find(t=>t.phone===phone) : db.teachers.find(t=>normText(t.name)===normText(name));
    const item={rec, ex}; plan.push(item); if(phone) seen.set(phone, item); ex?upd++:add++;
  }
  if(!plan.length){ alert('الشيت فاضي.'); return; }
  if(!confirm(`لقيت ${plan.length} مدرس في الشيت:\n• ${add} جديد\n• ${upd} موجودين قبل كده (هتتحدّث بياناتهم بس)${twice?`\n• ${twice} سطر رقمه متكرر في الشيت (اتحسب مرة واحدة)`:''}\n\nأستوردهم؟`)) return;
  for(const {rec,ex} of plan){
    if(ex){ for(const k of Object.keys(rec)) if(rec[k] && (!Array.isArray(rec[k]) || rec[k].length)) ex[k]=rec[k];
      delete ex.isNew; delete ex.newArea; }   // اتستورد من الشيت → مبقاش «جديد»
    else db.teachers.push({id:uid(), ...rec, name:rec.name||rec.phone, notes:'', created:new Date().toISOString()});
  }
  save(); location.hash='#/teachers'; homeFilter='all'; render(); toast(`✅ اتستورد ${plan.length} مدرس`);
});

const xmlEsc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
function dateSerial(isoStr){ const d=new Date(isoStr); return (Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()) - Date.UTC(1899,11,30))/864e5; }

const FILLMAP={part:'FDE7C4', done:'D7F5DF', new:'E9D5FF'};
const cellFill = c => (c && typeof c==='object' && 'v' in c) ? c.fill : null;
function sheetXml(sh, FX){

  const st=(fill,kind)=> fill ? 5+FX.get(fill)*4+kind : [0,2,3,4][kind];
  const out=rows.map((r,ri)=>{ const rf=FILLMAP[r.fill]||r.fill||null;
    return `<row r="${ri+1}">`+r.map((c0,ci)=>{
    const ref=colName(ci)+(ri+1);
    let c=c0, f=rf, b=!!r.bold;
    if(c && typeof c==='object' && 'v' in c){ f=c.fill||f; b=c.bold||b; c=c.v; }
    if(c===null||c===undefined||c==='') return f?`<c r="${ref}" s="${st(f,0)}"/>`:'';
    if(ri===head) return `<c r="${ref}" t="inlineStr" s="1"><is><t>${xmlEsc(c)}</t></is></c>`;
    if(typeof c==='number') return `<c r="${ref}" s="${st(f,b?3:0)}"><v>${c}</v></c>`;
    if(c.date) return `<c r="${ref}" s="${st(f,1)}"><v>${dateSerial(c.date)}</v></c>`;
    if(c.rich) return `<c r="${ref}" t="inlineStr" s="${st(f,2)}"><is>${c.rich.map(r=>`<r><rPr>${r.bold?'<b/>':''}<sz val="11"/>${r.color?`<color rgb="FF${r.color}"/>`:''}<rFont val="Calibri"/></rPr><t xml:space="preserve">${xmlEsc(r.t).replace(/\n/g,'&#10;')}</t></r>`).join('')}</is></c>`;
    return `<c r="${ref}" t="inlineStr" s="${st(f,b?3:0)}"><is><t xml:space="preserve">${xmlEsc(c)}</t></is></c>`;
  }).join('')+`</row>`; }).join('');
  const cols=widths?`<cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols>`:'';
  // تجميد صف العناوين (+ أول عمود = اسم المدرس/التاجر)
  const pane = freezeCol ? `<pane xSplit="1" ySplit="${head+1}" topLeftCell="B${head+2}" activePane="bottomRight" state="frozen"/>`
    : `<pane ySplit="${head+1}" topLeftCell="A${head+2}" activePane="bottomLeft" state="frozen"/>`;
  // قايمة منسدلة + لون أخضر/أحمر حسب الاختيار

      `<dataValidations count="1"><dataValidation type="list" allowBlank="1" showErrorMessage="1" sqref="${rg}"><formula1>"${xmlEsc(dv.green)},${xmlEsc(dv.red)}"</formula1></dataValidation></dataValidations>`; }

}

  const files=[
    {name:'[Content_Types].xml', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`},
    {name:'_rels/.rels', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView rightToLeft="1"/></bookViews><sheets>${sheets.map((s,i)=>`<sheet name="${xmlEsc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets>${sheets.some(s=>s.rows.length>1&&!s.head)?`<definedNames>${sheets.map((s,i)=>s.rows.length>1&&!s.head?`<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${xmlEsc(s.name)}'!$A$1:$${colName(s.rows[0].length-1)}$${s.rows.length}</definedName>`:'').join('')}</definedNames>`:''}</workbook>`},
    {name:'xl/_rels/workbook.xml.rels', data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},

/* ================= البيع والتجار ================= */
// البيع: إنجليزي ابتدائي 1-6، وإعدادي (عربي ورياضة ودراسات 1-3). الخصم: إنجليزي 30%، إعدادي 24.5%
const SELL_KEYS = BOOK_ORDER.filter(k=>{ const {st,sb}=bookParts(k); return st==='m' || sb==='en'; });
const isSell = k => SELL_KEYS.includes(k);
const discOf = k => bookParts(k).st==='m' ? 0.245 : 0.30;
const r2 = n => Math.round(n*100)/100;
const fmtN = n => r2(n).toLocaleString('en-US',{maximumFractionDigits:2});
const fmtM = n => fmtN(n)+' ج';
const byRank = (a,b)=>bookRank[a.b]-bookRank[b.b];
let ACC = {}, salesTab = 'orders';
function parseNum(v){
  if(v===undefined || v===null || v==='') return null;
  if(typeof v==='number') return v;
  const s=digits(v).replace(/٫/g,'.').replace(/[,،]/g,'').replace(/[^\d.\-]/g,'');
  if(!s) return null; const n=parseFloat(s); return isNaN(n)?null:n;
}
function priceOf(k){
  const p=db.prices[k]; if(!p) return null;
  const post = p.post!=null ? p.post : p.pre!=null ? r2(p.pre*(1-discOf(k))) : null;
  return post==null ? null : {pre:p.pre??null, post};
}
// أول سعر يترفع: البيع اللي اتسجل من غير سعر، وبضاعة التجار اللي من غير سعر
function fillPrices(){
  for(const s of db.sales) if(s.st==='sold') for(const it of s.items) if(it.post==null){ const p=priceOf(it.b); if(p){ it.pre=p.pre; it.post=p.post; } }
  for(const l of db.merchants) if(l.p==null){ const p=priceOf(l.b); if(p) l.p=p.post; }
}
const saleIdx = () => Object.fromEntries(db.sales.map(s=>[s.id,s]));
function itemsLine(items){
  return [...items].sort(byRank).map(it=>`<span class="bk" style="color:var(--c-${bookParts(it.b).sb})">${esc(bookLabel(it.b))}</span> × ${it.q}`).join('، ');
}
const waLink = (phone, text) => `https://wa.me/${phone?'2'+phone:''}?text=${encodeURIComponent(text)}`;
const pickDate = v => (!v || v===dayKey()) ? new Date().toISOString() : new Date(v+'T12:00:00').toISOString();

/* --- بضاعة التجار: أول دخل أول خرج --- */
function lotUsed(){
  const u={};
  for(const s of db.sales) if(s.st==='sold') for(const it of s.items) for(const x of it.src||[]) if(x.lot) u[x.lot]=(u[x.lot]||0)+x.q;
  for(const p of db.payments) if(p.k==='ret') for(const pt of p.parts||[]) for(const x of pt.lots||[]) if(x.lot) u[x.lot]=(u[x.lot]||0)-x.q;
  for(const r of db.merchRets) for(const x of r.lots||[]) u[x.lot]=(u[x.lot]||0)+x.q;   // مرتجع للتاجر يقلّل الفاضل
  return u;
}
function lotLeft(){ const u=lotUsed(), o={}; for(const l of db.merchants) o[l.id]=l.q-(u[l.id]||0); return o; }
function merchAvail(k, left){
  const by=new Map();
  for(const l of db.merchants) if(l.b===k && left[l.id]>0) by.set(l.m, (by.get(l.m)||0)+left[l.id]);
  return [...by];
}
function allocate(k, q, left){
  const src=[];
  for(const l of db.merchants){
    if(!q) break; if(l.b!==k || left[l.id]<=0) continue;
    const n=Math.min(q, left[l.id]); src.push({lot:l.id, q:n}); left[l.id]-=n; q-=n;
  }
  if(q) src.push({lot:null, q});
  return src;
}
function shortMsg(items){
  if(!db.merchants.length) return '';
  const left=lotLeft(), out=[];
  for(const it of items){ const a=merchAvail(it.b,left).reduce((s,[,n])=>s+n,0); if(it.q>a) out.push(`• ${bookLabel(it.b)}: عايز ${it.q} والموجود ${a}`); }
  return out.join('\n');
}
// يحوّل الطلب لبيع: السعر وقتها يتحفظ + كل سطر يتقسم على التجار
function sellItems(s, left){
  for(const it of s.items){ const p=priceOf(it.b); it.pre=p?p.pre:null; it.post=p?p.post:null; it.src=allocate(it.b, it.q, left); }
  s.st='sold'; s.sd=new Date().toISOString();
}
function merchSum(){
  const left=lotLeft(), m=new Map();
  const g=name=>{ if(!m.has(name)) m.set(name,{name, q:0, total:0, paid:0, left:0, owe:0, rq:0, rv:0, noPrice:false, rows:new Map(), pays:[], rets:[]}); return m.get(name); };
  const lotById=Object.fromEntries(db.merchants.map(l=>[l.id,l]));
  for(const l of db.merchants){
    const x=g(l.m), lf=Math.max(0,left[l.id]);
    x.q+=l.q; x.left+=lf; if(l.p==null) x.noPrice=true; else x.total+=l.q*l.p;
    const rk=l.b+'|'+(l.p??'');
    if(!x.rows.has(rk)) x.rows.set(rk,{b:l.b, p:l.p, q:0, left:0, ret:0});
    const r=x.rows.get(rk); r.q+=l.q; r.left+=lf;
  }
  for(const p of db.merchPays){ const x=g(p.m); x.paid+=p.amt; x.pays.push(p); }
  for(const r of db.merchRets){ const x=g(r.m); x.rq+=r.q; x.rv+=mretVal(r); x.rets.push(r);
    for(const z of r.lots||[]){ const l=lotById[z.lot]; const row=l && x.rows.get(l.b+'|'+(l.p??'')); if(row) row.ret+=z.q; } }
  for(const x of m.values()) x.owe=r2(x.total-x.paid-x.rv);
  return [...m.values()];
}

/* --- حسابات المدرسين --- */
function retVal(r, S){ let v=0; for(const pt of r.parts||[]){ const it=S[pt.sale]?.items[pt.i]; if(it && it.post!=null) v+=pt.q*it.post; } return v; }
function accMap(){
  const S=saleIdx(), m={};
  const g=id=>m[id] ||= {bought:0, n:0, rn:0, paid:0, ret:0, owe:0, noPrice:false, orders:0, sold:false};   // n = خد كام كتاب، rn = رجّع كام
  for(const s of db.sales){
    if(s.st==='order'){ g(s.t).orders++; continue; }
    if(s.st!=='sold') continue;
    const a=g(s.t); a.sold=true;
    for(const it of s.items){ a.n+=it.q; if(it.post==null) a.noPrice=true; else a.bought+=it.q*it.post; }
  }
  for(const p of db.payments){ const a=g(p.t); if(p.k==='pay') a.paid+=p.amt; else if(p.k==='ret'){ a.ret+=retVal(p,S); a.rn+=p.q||0; } }
  for(const a of Object.values(m)) a.owe=r2(a.bought-a.paid-a.ret);
  return m;
}
// سطور البيع اللي لسه ممكن يترجع منها
function retLines(tid){
  const done={};
  for(const p of db.payments) if(p.k==='ret' && p.t===tid) for(const pt of p.parts||[]){ const key=pt.sale+':'+pt.i; done[key]=(done[key]||0)+pt.q; }
  const lines=[];
  for(const s of db.sales) if(s.st==='sold' && s.t===tid) s.items.forEach((it,i)=>{ const left=it.q-(done[s.id+':'+i]||0); if(left>0) lines.push({s, it, i, left}); });
  return lines;
}
// المرتجع يرجع لنفس التاجر اللي اتباع منه
function retLots(tid, s, i, q){
  const prior={};
  for(const p of db.payments) if(p.k==='ret' && p.t===tid) for(const pt of p.parts||[]) if(pt.sale===s.id && pt.i===i) for(const x of pt.lots||[]) prior[x.lot]=(prior[x.lot]||0)+x.q;
  const out=[];
  for(const x of [...(s.items[i].src||[])].reverse()){
    if(!q) break; const can=x.q-(prior[x.lot]||0); if(can<=0) continue;
    const n=Math.min(q,can); out.push({lot:x.lot, q:n}); prior[x.lot]=(prior[x.lot]||0)+n; q-=n;
  }
  if(q) out.push({lot:null, q});
  return out;
}

/* --- صفحة البيع --- */
function renderSales(sub, focus){
  setHeader('💰 البيع', false);
  if(['orders','acc','merch'].includes(sub)) salesTab=sub;
  const orders=db.sales.filter(s=>s.st==='order').sort((a,b)=>b.d.localeCompare(a.d));

    <div class="chips">${tab('orders',`🛒 طلبات (${orders.length})`)}${tab('acc','🧾 حسابات المدرسين')}${tab('merch','🏪 التجار')}</div>`;
  if(salesTab==='orders') html+=ordersHtml(orders);
  else if(salesTab==='acc') html+=accHtml();

const MNONE='من غير تاجر';
const lotMap = () => Object.fromEntries(db.merchants.map(l=>[l.id,l]));
const lotName = (L, lot) => lot ? (L[lot]?.m || '؟') : MNONE;
function teacherMerch(tid){
  const L=lotMap(), m={}, g=n=>m[n] ||= {n:0, r:0};
  for(const s of db.sales) if(s.st==='sold' && s.t===tid) for(const it of s.items) for(const x of (it.src&&it.src.length?it.src:[{lot:null,q:it.q}])) g(lotName(L,x.lot)).n+=x.q;
  for(const p of db.payments) if(p.k==='ret' && p.t===tid) for(const pt of p.parts||[]) for(const x of pt.lots||[]) g(lotName(L,x.lot)).r+=x.q;
  return Object.entries(m);
}
function merchLines(tid){
  const l=teacherMerch(tid); if(!l.length || (l.length===1 && l[0][0]===MNONE)) return '';
  return l.map(([n,x])=>`<div class="small">🏪 ${esc(n)}: خد <b>${x.n}</b> • رجّع <b>${x.r}</b> • فضل معاه <b>${x.n-x.r}</b></div>`).join('');
}
function merchTeachers(name){
  const L=lotMap(), m={};
  for(const s of db.sales) if(s.st==='sold') for(const it of s.items) for(const x of it.src||[]) if(x.lot && L[x.lot]?.m===name) (m[s.t] ||= {n:0,r:0}).n+=x.q;
  for(const p of db.payments) if(p.k==='ret') for(const pt of p.parts||[]) for(const x of pt.lots||[]) if(x.lot && L[x.lot]?.m===name) (m[p.t] ||= {n:0,r:0}).r+=x.q;
  return Object.entries(m).map(([id,x])=>({t:tById(id), ...x})).filter(x=>x.t).sort((a,b)=>a.t.name.localeCompare(b.t.name,'ar'));
}

function retPlan(tid, b, q){
  const parts=[]; let need=q;
  for(const l of retLines(tid).filter(l=>l.it.b===b).sort((x,y)=>(y.s.sd||'').localeCompare(x.s.sd||''))){
    if(!need) break; const n=Math.min(need,l.left);
    parts.push({sale:l.s.id, i:l.i, q:n, lots:retLots(tid, l.s, l.i, n)}); need-=n;
  }
  return parts;
}
function partsMerch(parts){ const L=lotMap(), m={}; for(const pt of parts) for(const x of pt.lots||[]){ const n=lotName(L,x.lot); m[n]=(m[n]||0)+x.q; }
  return Object.entries(m).map(([n,q])=>`${n} ${q}`).join(' + '); }

function tSaleData(tid){
  const L=lotMap();
  const sales=db.sales.filter(s=>s.st==='sold' && s.t===tid).sort((a,b)=>(a.sd||'').localeCompare(b.sd||''));
  const S=Object.fromEntries(sales.map((s,i)=>[s.id,{s, no:i+1, ret:{}, rets:new Map()}]));
  const rets=db.payments.filter(p=>p.k==='ret' && p.t===tid).sort((a,b)=>a.d.localeCompare(b.d));
  for(const p of rets) for(const pt of p.parts||[]){ const x=S[pt.sale]; if(!x) continue;
    x.ret[pt.i]=(x.ret[pt.i]||0)+pt.q;
    const key=p.g||p.d; if(!x.rets.has(key)) x.rets.set(key,{key, d:p.d, lines:[]});
    const it=x.s.items[pt.i];
    x.rets.get(key).lines.push({b:it?.b||p.b, q:pt.q, v:it&&it.post!=null?pt.q*it.post:0, m:partsMerch([pt])});
  }
  const pays=db.payments.filter(p=>p.k==='pay' && p.t===tid).sort((a,b)=>a.d.localeCompare(b.d));
  return {inv:sales.map(s=>S[s.id]), rets, pays, L};
}

/* ================= بند ث: خطة زيارة بكرة ================= */
let planAreas=new Set();
function planNeed(t){ const ow=autoOwed(t), a=ACC[t.id], ord=db.sales.filter(s=>s.st==='order' && s.t===t.id);
  return {ow, money:a&&a.owe>0?a.owe:0, ord, any: ow.length || (a&&a.owe>0) || ord.length}; }
function planList(){ return db.teachers.filter(t=>t.area && planAreas.has(t.area)).map(t=>({t, n:planNeed(t)})).filter(x=>x.n.any)
  .sort((a,b)=>a.t.area.localeCompare(b.t.area,'ar') || a.t.name.localeCompare(b.t.name,'ar')); }
function planTake(list){ const m={}; for(const {n} of list){ for(const k of n.ow) m[k]=(m[k]||0)+1; for(const s of n.ord) for(const it of s.items) m[it.b]=(m[it.b]||0)+it.q; } return m; }
function renderPlan(){
  setHeader('🗺️ خطة زيارة بكرة', false);
  const cnt={}; for(const t of db.teachers) if(t.area && planNeed(t).any) cnt[t.area]=(cnt[t.area]||0)+1;
  for(const a of [...planAreas]) if(!cnt[a]) planAreas.delete(a);
  const areas=Object.keys(cnt).sort((a,b)=>a.localeCompare(b,'ar'));
  let h=`<div class="card"><h3 class="sec-t">📍 اختار القرية / المنطقة (أو أكتر)</h3>${areas.length?`<div class="plan-areas">${areas.map(a=>`<button class="chip ${planAreas.has(a)?'on':''}" data-act="plan-a" data-a="${esc(a)}">${esc(a)} (${cnt[a]})</button>`).join('')}</div>`:'<div class="muted">مفيش مدرسين باقيلهم حاجة 🎉</div>'}</div>`;
  if(!planAreas.size){ app.innerHTML=h+'<div class="empty">اختار قرية علشان تشوف المدرسين اللي محتاجين زيارة.</div>'; return; }
  const list=planList(), take=planTake(list), idx=indexEntries();
  const tk=Object.keys(take).sort((a,b)=>bookRank[a]-bookRank[b]);
  h+=`<div class="card"><h3 class="sec-t">🚗 خد معاك (${tk.reduce((s,k)=>s+take[k],0)} كتاب)</h3>${tk.map(k=>`<div class="kv"><span style="color:var(--c-${bookParts(k).sb});font-weight:700">${esc(bookLabel(k))}</span><b>${take[k]}</b></div>`).join('')||'<div class="muted">مفيش كتب.</div>'}
    <button class="btn" style="width:100%;margin-top:10px" data-act="plan-copy">📋 انسخ الخطة (للواتساب)</button></div>
    <h3 class="sec-t">👥 المدرسين (${list.length})</h3><div class="tlist">${list.map(({t,n})=>teacherCard(t, idx[t.id],
      (n.ow.length?`<div class="oline">⏳ ${esc(owedLine(n.ow.map(b=>({b,q:1}))))}</div>`:'') + (n.ord.length?`<div class="oline" style="color:var(--sel-ink)">🛒 طلب: ${n.ord.map(s=>itemsLine(s.items)).join(' • ')}</div>`:''))).join('')}</div>`;
  app.innerHTML=h;
}
function planText(){
  const list=planList(), take=planTake(list);
  return `🗺️ خطة بكرة — ${[...planAreas].join('، ')}\n\n🚗 خد معاك:\n` + Object.keys(take).sort((a,b)=>bookRank[a]-bookRank[b]).map(k=>`• ${bookLabel(k)}: ${take[k]}`).join('\n') +
    `\n\n👥 المدرسين:\n` + list.map(({t,n})=>`• ${t.name}${t.phone?` (${t.phone})`:''} — ${t.area}${n.ow.length?` — باقيله ${n.ow.length} كتاب`:''}${n.money?` — عليه ${fmtM(n.money)}`:''}${n.ord.length?' — عنده طلب':''}`).join('\n');
}

/* ================= بند ظ: تنبيه «مدرسين A ما استلموش» ================= */
const AL_KEY=KEY+'-alert';
function alState(){ const z={day:dayKey(), cur:'', done:[], eve:false};
  try{ const s=JSON.parse(localStorage.getItem(AL_KEY)||'{}'); return s.day===z.day ? {...z, ...s} : z; }catch(e){ return z; } }
function alSave(s){ try{ localStorage.setItem(AL_KEY, JSON.stringify(s)); }catch(e){} }
function pendingA(area){ return db.teachers.filter(t=>t.area===area && clsLetter(t)==='A' && !isDup(t) && autoOwed(t).length); }
function workedAreasToday(){ const d=dayKey(), ids=new Set();
  for(const e of db.entries) if(e.s==='d' && dk(e.dd)===d) ids.add(e.t);
  for(const s of db.sales) if(dk(s.st==='sold'?s.sd:s.d)===d) ids.add(s.t);
  return [...new Set([...ids].map(id=>tById(id)?.area).filter(Boolean))]; }
function bell(){
  try{ navigator.vibrate && navigator.vibrate([300,150,300,150,600]); }catch(e){}
  try{ const C=new (window.AudioContext||window.webkitAudioContext)();
    [0,0.35,0.7].forEach(t0=>{ const o=C.createOscillator(), g=C.createGain(); o.frequency.value=880; o.connect(g); g.connect(C.destination);
      g.gain.setValueAtTime(0.3,C.currentTime+t0); g.gain.exponentialRampToValueAtTime(0.001,C.currentTime+t0+0.3); o.start(C.currentTime+t0); o.stop(C.currentTime+t0+0.32); });
    setTimeout(()=>C.close(),1600); }catch(e){}
}
function alertA(groups){   // groups = [[القرية, [مدرسين]], ...]
  if(!groups.length || document.getElementById('alA')) return;
  bell();
  const m=document.createElement('div'); m.className='modal'; m.id='alA'; m.style.zIndex='80';
  m.innerHTML=`<div class="box"><h3>🔔 لسه فيه مدرسين A ما استلموش</h3>${groups.map(([a,l])=>`<div class="card" style="margin-bottom:8px"><b>📍 ${esc(a)}</b>
      ${l.map(t=>`<div class="al-row"><div class="grow"><a href="#/t/${encodeURIComponent(t.id)}" data-al="x"><b>${esc(t.name)}</b></a> <span class="small muted">باقيله ${autoOwed(t).length}</span></div><div class="icos">${phoneBtns(t)}</div></div>`).join('')}
      <button class="btn owe sm" style="width:100%;margin-top:8px" data-al="back" data-a="${esc(a)}">↩️ ارجع لهم</button></div>`).join('')}
    <button class="btn ghost" style="width:100%" data-al="x">بعدين</button></div>`;
  document.body.appendChild(m);
  m.addEventListener('click', e=>{ const b=e.target.closest('[data-al]'); if(e.target===m){ m.remove(); return; } if(!b) return;
    if(b.dataset.al==='back'){ homeArea=b.dataset.a; homeFilter='owed'; homeQuery=''; m.remove(); if(location.hash==='#/teachers') render(); else location.hash='#/teachers'; }
    else m.remove(); });
}
// بعد كل تسليم/بيع: لو دخل قرية تانية والقرية اللي قبلها فيها مدرسين A ما استلموش → تنبيه
function afterWork(tid){
  const t=tById(tid); if(!t || !t.area) return;
  const s=alState(), prev=s.cur; let grp=[];
  if(prev && prev!==t.area && !s.done.includes(prev)){ const l=pendingA(prev); if(l.length){ s.done.push(prev); grp=[[prev,l]]; } }
  s.cur=t.area; alSave(s);
  saveVillageLoc(t.area);
  if(grp.length) setTimeout(()=>alertA(grp), 500);
}
// بعد 6 بالليل: المناطق اللي اشتغل فيها النهارده وفيها A ما استلموش
function eveningCheck(){
  if(new Date().getHours()<18 || !db.teachers.length) return;
  const s=alState(); if(s.eve) return; s.eve=true; alSave(s);
  const grp=workedAreasToday().map(a=>[a, pendingA(a)]).filter(([,l])=>l.length);
  if(grp.length) setTimeout(()=>alertA(grp), 1500);
}
// GPS (والبرنامج مفتوح بس): أول تسليم في القرية يحفظ مكانها، ولو بعد عنها أكتر من 2 كم وفيها A ما استلموش → تنبيه
let geoWatch=null;
function distKm(a,b){ const R=6371, r=x=>x*Math.PI/180, dLa=r(b.lat-a.lat), dLo=r(b.lng-a.lng);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function saveVillageLoc(area){
  if(!navigator.geolocation) return; db.vloc ||= {};
  if(db.vloc[area]){ startWatch(); return; }
  try{ navigator.geolocation.getCurrentPosition(p=>{ db.vloc[area]={lat:p.coords.latitude, lng:p.coords.longitude}; save(false); startWatch(); }, ()=>{}, {enableHighAccuracy:true, timeout:20000, maximumAge:120000}); }catch(e){}
}
function startWatch(){
  if(geoWatch!=null || !navigator.geolocation) return;
  try{ geoWatch=navigator.geolocation.watchPosition(p=>{
    const here={lat:p.coords.latitude, lng:p.coords.longitude}, s=alState();
    for(const a of workedAreasToday()){ const v=db.vloc?.[a]; if(!v || s.done.includes(a) || distKm(here,v)<=2) continue;
      const l=pendingA(a); if(!l.length) continue;
      s.done.push(a); alSave(s); alertA([[a,l]]); break; }
  }, ()=>{}, {enableHighAccuracy:false, maximumAge:60000, timeout:60000}); }catch(e){}
}

      `<div class="field" style="margin-top:8px"><label>🚚 ميعاد التوصيل المتوقع (للطلب — اختياري)</label><input id="sf_due" type="date" value="${esc(ed?.due||st.due||'')}"></div>

      (raw ? `<div class="addnew"><b class="small">➕ ضيفه (لو مش موجود)</b><div class="row2"><input id="sf_nn" placeholder="الاسم" value="${esc(isNum?'':raw)}"><input id="sf_np" inputmode="tel" dir="ltr" placeholder="التليفون" value="${esc(isNum?raw:'')}"></div>
        <input id="sf_na" list="vl_s" autocomplete="off" placeholder="المنطقة / القرية" style="margin-top:6px;width:100%">${vlist('vl_s')}
        <button class="btn sm pri" data-sf="addt" style="margin-top:8px">➕ ضيفه</button></div>` : '<div class="hint">اكتب اسم المدرس أو رقمه.</div>');
  };
  const drawT=()=>{

// المشاركة (واتساب وغيره) من قايمة المشاركة، ولو مش متاحة ينزّل الملف
async function shareFile(blob, name, type, title){
  const file=new File([blob], name, {type});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title}); return; }catch(e){ if(e.name==='AbortError') return; }
  }
  download(blob, name); toast('⬇️ الملف نزل');
}
// سجل المعاملات بالتاريخ: فاتورة 1، مرتجع، دفع
function invLog(tid){
  const D=tSaleData(tid), S=saleIdx(), out=[];
  for(const x of D.inv){ let v=0; for(const it of x.s.items) if(it.post!=null) v+=it.q*it.post; out.push({d:x.s.sd||x.s.d, k:'inv', t:`فاتورة ${x.no}`, v, c:'#1d4ed8'}); }
  const g=new Map(); for(const p of D.rets){ const k=p.g||p.d; if(!g.has(k)) g.set(k,{d:p.d, v:0, n:0}); const z=g.get(k); z.v+=retVal(p,S); z.n+=p.q||0; }
  for(const z of g.values()) out.push({d:z.d, k:'ret', t:`مرتجع ${z.n} كتاب`, v:z.v, c:'#ea580c'});
  for(const p of D.pays) out.push({d:p.d, k:'pay', t:'دفع', v:p.amt, c:'#15803d'});
  return out.sort((a,b)=>a.d.localeCompare(b.d)).map(l=>({...l, day:fmtDay(dk(l.d))}));

// PDF بسيط فيه صورة JPEG واحدة (مكتوب يدوي من غير مكتبة)
function pdfFromJpeg(jpg, iw, ih){
  const enc=new TextEncoder(), parts=[], offs=[]; let len=0;
  const put=d=>{ const u=typeof d==='string'?enc.encode(d):d; parts.push(u); len+=u.length; };
  const pw=595, ph=Math.round(595*ih/iw*100)/100;
  const content=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
  put('%PDF-1.4\n');
  const obj=(n,body)=>{ offs[n]=len; put(`${n} 0 obj\n`); for(const b of body) put(b); put('\nendobj\n'); };
  obj(1,['<< /Type /Catalog /Pages 2 0 R >>']);
  obj(2,['<< /Type /Pages /Kids [3 0 R] /Count 1 >>']);
  obj(3,[`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`]);
  obj(4,[`<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`, jpg, '\nendstream']);
  obj(5,[`<< /Length ${content.length} >>\nstream\n${content}\nendstream`]);
  const xref=len;
  put(`xref\n0 6\n0000000000 65535 f \n${[1,2,3,4,5].map(n=>String(offs[n]).padStart(10,'0')+' 00000 n \n').join('')}trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, {type:'application/pdf'});
}

function retForm(tid){

  if(!ks.length){ alert('مفيش كتب اشتراها علشان يرجّعها.'); return; }

  const unit={}; for(const l of lines) if(l.it.post!=null && (!unit[l.it.b] || (l.s.sd||'')>unit[l.it.b].sd)) unit[l.it.b]={p:l.it.post, sd:l.s.sd||''};
  const rq={};
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="box"><h3>↩️ مرتجع من ${esc(t.name)}</h3>
    <p class="hint" style="margin:0 0 6px">اكتب عدد المرتجع قدام الكتب اللي رجّعها بس، وسيب الباقي فاضي.</p>

        ${db.merchants.length?`<div class="small muted">🏪 من التاجر: ${esc(partsMerch(retPlan(tid,k,by[k])))}</div><div class="small" style="color:var(--owe)" data-live="${k}"></div>`:''}</div>
      <div class="step"><button data-rf="dec" data-k="${k}" aria-label="أقل">−</button><input class="qin" inputmode="numeric" data-k="${k}"><button class="plus" data-rf="inc" data-k="${k}" aria-label="زوّد">+</button></div></div>`).join('')}
    <div class="sale-foot"><div id="r_tot" class="tot"></div>

      <p class="hint" style="margin-top:0">الكتب بترجع لبضاعة نفس التاجر اللي اتباعت منه.</p>
      <div class="row2"><button class="btn pri" id="r_ok">💾 حفظ المرتجع</button><button class="btn ghost" id="r_x">إلغاء</button></div></div></div>`;
  document.body.appendChild(m);
  const close=()=>m.remove();
  const drawTot=()=>{
    let n=0, v=0, miss=false, over=false;
    for(const k of ks){ const q=rq[k]||0; if(!q) continue; n+=q; if(q>by[k]) over=true; if(unit[k]) v+=q*unit[k].p; else miss=true; }
    m.querySelector('#r_tot').innerHTML = n
      ? `↩️ مرتجع <b>${n}</b> كتاب${v?` — <b>${fmtM(v)}</b>`:''}${miss?' <span class="small muted">(فيه كتب سعرها لسه ما اتحددش)</span>':''}${over?'<div class="small" style="color:var(--bad)">⚠️ فيه كتاب المرتجع بتاعه أكتر من اللي خده</div>':''}`
      : '<span class="muted">اكتب عدد المرتجع قدام الكتب</span>';
  };
  const setQ=(k,q)=>{ q=Math.max(0,Math.min(9999,q||0)); if(q) rq[k]=q; else delete rq[k];
    const r=m.querySelector(`.srow[data-k="${k}"]`); if(r){ r.classList.toggle('sel',!!q); const i=r.querySelector('.qin'); if(document.activeElement!==i) i.value=q||''; i.style.borderColor=q>by[k]?'var(--bad)':'';
      const lv=r.querySelector('[data-live]'); if(lv) lv.textContent = q && q<=by[k] ? `↩️ رايح لـ: ${partsMerch(retPlan(tid,k,q))}` : ''; }
    drawTot(); };
  m.addEventListener('input', e=>{ const i=e.target.closest('.qin'); if(i) setQ(i.dataset.k, parseInt(digits(i.value).replace(/\D/g,''),10)); });
  m.addEventListener('click', e=>{
    if(e.target===m){ close(); return; }
    const b=e.target.closest('[data-rf]'); if(!b) return;

    });
  };
  drawTot();
}

function mretAlloc(name, k, q, left){
  const out=[];
  for(const l of [...db.merchants].reverse()){ if(!q) break; if(l.m!==name || l.b!==k || left[l.id]<=0) continue;
    const n=Math.min(q,left[l.id]); out.push({lot:l.id, q:n}); q-=n; }
  return out;
}
function mretForm(name){
  const x=merchSum().find(z=>z.name===name); if(!x) return;
  const left=lotLeft(), took={}, has={};
  for(const l of db.merchants) if(l.m===name){ took[l.b]=(took[l.b]||0)+l.q; has[l.b]=(has[l.b]||0)+Math.max(0,left[l.id]); }
  const ks=Object.keys(took).sort((a,b)=>bookRank[a]-bookRank[b]);
  if(!ks.length){ alert('مفيش كتب خدتها منه.'); return; }
  const rq={};
  const val=(k,q)=>mretAlloc(name,k,q,left).reduce((s,z)=>{ const l=db.merchants.find(y=>y.id===z.lot); return s+(l&&l.p!=null?z.q*l.p:0); },0);
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="box"><h3>↩️ مرتجع لـ ${esc(name)}</h3>
    <p class="hint" style="margin:0 0 6px">اكتب عدد المرتجع قدام الكتب اللي رجّعتها بس، وسيب الباقي فاضي.</p>
    <div class="srow" style="border-top:0;font-size:13px;color:var(--muted);font-weight:700"><div class="grow">الكتاب</div><div>المرتجع</div></div>
    ${ks.map(k=>`<div class="srow" data-k="${k}"><div class="grow"><b style="color:var(--c-${bookParts(k).sb})">${esc(bookLabel(k))}</b>
        <div class="small">خدت <b>${took[k]}</b> • فاضل معاك <b>${has[k]}</b></div><div class="small muted" data-live="${k}"></div></div>
      <div class="step"><button data-rf="dec" data-k="${k}" aria-label="أقل">−</button><input class="qin" inputmode="numeric" data-k="${k}"><button class="plus" data-rf="inc" data-k="${k}" aria-label="زوّد">+</button></div></div>`).join('')}
    <div class="sale-foot"><div id="mr_tot" class="tot"></div>
      <div class="field"><label>التاريخ</label><input id="mr_d" type="date" value="${dayKey()}"></div>
      <div class="row2"><button class="btn pri" id="mr_ok">💾 حفظ المرتجع</button><button class="btn ghost" id="mr_x">إلغاء</button></div></div></div>`;
  document.body.appendChild(m);
  const close=()=>m.remove();
  const drawTot=()=>{
    let n=0, v=0, over=false;
    for(const k of ks){ const q=rq[k]||0; if(!q) continue; n+=q; if(q>has[k]) over=true; else v+=val(k,q); }
    const after=r2(x.owe-v);
    m.querySelector('#mr_tot').innerHTML = n
      ? `↩️ إجمالي المرتجع <b>${n}</b> كتاب — <b>${fmtM(v)}</b><div class="small">${after<0?`<b style="color:var(--ok)">ليك عنده بعد المرتجع: ${fmtM(-after)}</b>`:`عليك له بعد المرتجع: <b>${fmtM(after)}</b>`}</div>${over?'<div class="small" style="color:var(--bad)">⚠️ فيه كتاب المرتجع بتاعه أكتر من الفاضل معاك</div>':''}`
      : `<span class="muted">اكتب عدد المرتجع قدام الكتب</span><div class="small">عليك له دلوقتي: <b>${fmtM(x.owe)}</b></div>`;
  };
  const setQ=(k,q)=>{ q=Math.max(0,Math.min(9999,q||0)); if(q) rq[k]=q; else delete rq[k];
    const r=m.querySelector(`.srow[data-k="${k}"]`); if(r){ r.classList.toggle('sel',!!q); const i=r.querySelector('.qin'); if(document.activeElement!==i) i.value=q||''; i.style.borderColor=q>has[k]?'var(--bad)':'';
      r.querySelector('[data-live]').innerHTML = q ? (q>has[k] ? '<span style="color:var(--bad)">أكتر من الفاضل معاك</span>' : `يتبقى معاك ${has[k]-q} • قيمة المرتجع ${fmtM(val(k,q))}`) : ''; }
    drawTot(); };
  m.addEventListener('input', e=>{ const i=e.target.closest('.qin'); if(i) setQ(i.dataset.k, parseInt(digits(i.value).replace(/\D/g,''),10)); });
  m.addEventListener('click', e=>{
    if(e.target===m){ close(); return; }
    const b=e.target.closest('[data-rf]'); if(!b) return;
    const k=b.dataset.k; setQ(k,(rq[k]||0)+(b.dataset.rf==='inc'?1:-1));
  });
  m.querySelector('#mr_x').onclick=close;
  m.querySelector('#mr_ok').onclick=()=>{
    const pick=ks.filter(k=>rq[k]>0);
    if(!pick.length){ alert('اكتب عدد المرتجع قدام الكتاب الأول'); return; }
    const over=pick.filter(k=>rq[k]>has[k]);
    if(over.length){ alert('المرتجع أكتر من الفاضل معاك في:\n'+over.map(k=>`• ${bookLabel(k)}: فاضل معاك ${has[k]} بس`).join('\n')); return; }
    const d=pickDate(m.querySelector('#mr_d').value), n=pick.reduce((s,k)=>s+rq[k],0); close();
    withUndo(`↩️ اتسجّل مرتجع ${n} كتاب لـ ${name}`, ()=>{
      const lf=lotLeft();
      for(const b of pick) db.merchRets.push({id:uid(), m:name, b, q:rq[b], d, lots:mretAlloc(name, b, rq[b], lf)});
    });
  };
  drawTot();
}
