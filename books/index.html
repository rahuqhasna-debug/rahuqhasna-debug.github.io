<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>سلاح التلميذ البحيرة</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#f3f5f4;--card:#ffffff;--ink:#14201e;--muted:#5d6b68;--line:#dde4e2;
  --brand:#0f766e;--brand-ink:#ffffff;--brand-soft:#e2f2ef;
  --ok:#15803d;--ok-soft:#e4f4e9;--owe:#b45309;--owe-soft:#fdf0dc;--bad:#b91c1c;--bad-soft:#fde7e7;
  --sel:#dbeafe;--sel-ink:#1d4ed8;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 10px rgba(0,0,0,.04);
  --c-ar:#1D4ED8;--c-math:#15803D;--c-stu:#92400E;--c-en:#7E22CE;--c-sci:#EA580C;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1413;--card:#17201e;--ink:#e5eeec;--muted:#93a39f;--line:#283432;
  --brand:#2dd4bf;--brand-ink:#04201c;--brand-soft:#11322e;
  --ok:#4ade80;--ok-soft:#12301d;--owe:#fbbf24;--owe-soft:#38290b;--bad:#f87171;--bad-soft:#3a1515;
  --sel:#1e3358;--sel-ink:#93c5fd;--shadow:none;
  --c-ar:#60a5fa;--c-math:#4ade80;--c-stu:#d6a35c;--c-en:#c084fc;--c-sci:#fb923c}}
:root[data-theme="dark"]{
  --bg:#0e1413;--card:#17201e;--ink:#e5eeec;--muted:#93a39f;--line:#283432;
  --brand:#2dd4bf;--brand-ink:#04201c;--brand-soft:#11322e;
  --ok:#4ade80;--ok-soft:#12301d;--owe:#fbbf24;--owe-soft:#38290b;--bad:#f87171;--bad-soft:#3a1515;
  --sel:#1e3358;--sel-ink:#93c5fd;--shadow:none;
  --c-ar:#60a5fa;--c-math:#4ade80;--c-stu:#d6a35c;--c-en:#c084fc;--c-sci:#fb923c}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic","Noto Naskh Arabic",Arial,sans-serif;font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.wrap{max-width:860px;margin:0 auto;padding:12px 16px 120px}
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink)}
header.top .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-btn{flex:none;border:0;border-radius:10px;padding:5px 10px;background:rgba(255,255,255,.18);color:inherit;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}
.bk-btn.due{background:var(--owe);color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.backrow{max-width:860px;margin:10px auto 0;padding:0 12px}
.backrow[hidden]{display:none}
.backbtn{width:100%;background:#ea580c;color:#fff;border:0;border-radius:12px;padding:11px 14px;font:inherit;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 2px 6px rgba(234,88,12,.35)}
.backbtn:active{transform:scale(.98)}
header.top .back{background:rgba(255,255,255,.22);border:0;color:inherit;font-size:18px;font-weight:800;padding:8px 14px;border-radius:12px;cursor:pointer;white-space:nowrap;flex:none}
.areabar{position:sticky;top:50px;z-index:12;background:var(--bg);padding:6px 0 4px}
.areabar select{width:100%;font-size:16px;font-weight:700;padding:10px;border-radius:12px}
.stickytop{position:sticky;top:-16px;z-index:6;background:var(--card);padding-top:8px}
html,body{max-width:100%;overflow-x:hidden}   /* الصفحة بعرض التليفون، من غير تمرير يمين وشمال — التمرير فوق وتحت بس */
img,svg,video,canvas{max-width:100%}
.card,.box,main,#app{max-width:100%;min-width:0;overflow-wrap:anywhere}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;max-width:215px;text-align:center;padding:8px 4px 9px;text-decoration:none;color:var(--muted);font-size:13px;position:relative}
nav.tabs a .i{display:block;font-size:20px;line-height:1.2}
nav.tabs a.on{color:var(--brand);font-weight:700}
nav.tabs .badge{position:absolute;top:3px;right:calc(50% - 22px);background:var(--owe);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;min-width:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:17px}
.search input:focus{outline:none;border-color:var(--brand)}
.btn{border:0;border-radius:12px;padding:11px 16px;cursor:pointer;background:var(--brand-soft);color:var(--brand);font-weight:700;white-space:nowrap}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.ok{background:var(--ok);color:#fff}
.btn.owe{background:var(--owe);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
select.area{border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:6px 10px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.tlist{display:flex;flex-direction:column;gap:8px}
.titem{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-decoration:none;color:inherit}
.titem:active{background:var(--brand-soft)}
.titem .nm{font-weight:700}
.titem .sub{font-size:13px;color:var(--muted)}
.titem .grow{flex:1;min-width:0}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.owe{background:var(--owe-soft);color:var(--owe)}
.pill.new{background:var(--line);color:var(--muted)}
.pill.cls{background:var(--brand-soft);color:var(--brand)}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.thead h2{margin:0 0 4px;font-size:21px}
.thead .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:var(--muted)}
.thead .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.warn{border-radius:12px;padding:12px;margin-bottom:12px;background:var(--owe-soft);border:1px solid color-mix(in srgb,var(--owe) 35%,transparent)}
.warn h3{margin:0 0 8px;font-size:16px;color:var(--owe)}
.orow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed color-mix(in srgb,var(--owe) 30%,transparent)}
.orow:first-of-type{border-top:0}
.orow .grow{flex:1}
.got{border-radius:12px;padding:12px;margin-bottom:12px;background:var(--ok-soft)}
.got h3{margin:0 0 6px;font-size:15px;color:var(--ok)}
.stage-t{font-size:15px;font-weight:800;margin:18px 2px 8px;color:var(--muted)}
.subj-grid{columns:165px;column-gap:8px}
details.subj{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 8px;break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid}
details.subj>summary .sn,details.subj .lbl b{color:var(--sc)}
.pill.stk{background:var(--line);color:var(--muted)}
.pill.stk.neg{background:var(--bad-soft);color:var(--bad)}
.tbox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.tbox .stat{cursor:pointer;font:inherit;color:inherit}
.tbox .stat span{font-size:14px;font-weight:700}
.tbox .stat.on{border-color:var(--brand);background:var(--brand-soft)}
.blist{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;line-height:1.9}
.bk{font-weight:700}
.stk-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.stk-row .grow{flex:1;min-width:0;font-weight:700;font-size:14px}
.stk-row input{width:64px;padding:7px 8px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);text-align:center}
details.stk>summary{cursor:pointer;font-weight:700;padding:8px 0;color:var(--brand)}
details.subj>summary{list-style:none;cursor:pointer;padding:10px 10px;display:flex;align-items:center;gap:4px;font-weight:700;white-space:nowrap}
details.subj>summary .pill{font-size:11px;padding:0 5px}
details.subj>summary::-webkit-details-marker{display:none}
details.subj>summary::after{content:"▾";margin-inline-start:auto;color:var(--muted);transition:transform .15s}
details.subj[open]>summary::after{transform:rotate(180deg)}
details.subj.mine>summary{background:var(--brand-soft)}
.star{font-size:12px;color:var(--brand)}
.grow-row{display:flex;align-items:center;gap:4px;padding:6px 8px;border-top:1px solid var(--line);min-height:50px}
.grow-row.sel{background:var(--sel)}
.grow-row .lbl{flex:1;min-width:0;cursor:pointer;user-select:none;line-height:1.25}
.grow-row .lbl b{font-size:15px;display:block}
.grow-row .lbl .pill{font-size:11px;padding:0 5px}
.step{display:flex;align-items:center;gap:2px;flex:none}
.step button{width:34px;height:36px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);font-size:19px;cursor:pointer;line-height:1;padding:0}
.step button.plus{border-color:var(--brand);color:var(--brand)}
.step .q{min-width:20px;text-align:center;font-weight:800;font-size:17px}
.titem{cursor:pointer}
.titem .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.icos{display:flex;gap:6px}
.ico{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;background:var(--brand-soft);text-decoration:none;font-size:18px}
.oline{font-size:13px;color:var(--owe);font-weight:700;margin-top:3px}
.lhead{grid-column:1/-1;font-weight:700;color:var(--muted);font-size:14px;margin:2px 2px 0}
.grow-row.sel .q{color:var(--sel-ink)}
.actbar{position:fixed;left:0;right:0;bottom:62px;z-index:25;display:none;padding:0 12px}
.actbar.show{display:block}
.actbar .in{max-width:836px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px;display:flex;gap:8px;align-items:center}
.actbar .btn{flex:1;padding:13px 8px}
.hist{font-size:14px}
.hrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow .grow{flex:1}
textarea{width:100%;min-height:70px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);padding:8px 10px;resize:vertical}
.field{margin-bottom:10px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.field input,.field select{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@media (min-width:700px){.modal{align-items:center}.modal .box{border-radius:18px}}
.modal h3{margin:0 0 12px}
.row2{display:flex;gap:8px}
.row2>*{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:140px;z-index:60;background:#1f2937;color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:#7dd3fc;font-weight:700;cursor:pointer}
.oblock{margin-bottom:10px}
.oblock .hd{display:flex;align-items:center;gap:8px;font-weight:700}
.oblock .hd .grow{flex:1}
.oblock ul{margin:6px 0 0;padding:0 18px 0 0}
.oblock li{padding:2px 0}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.sec-t{font-size:16px;margin:0 0 10px}
.banner{background:var(--bad-soft);color:var(--bad);padding:10px 14px;border-radius:12px;margin-bottom:12px;font-weight:700}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.cls-bar{background:var(--sel);border:1.5px solid color-mix(in srgb,var(--sel-ink) 40%,transparent);border-radius:12px;padding:12px;margin-bottom:12px}
.cls-bar h3{margin:0 0 8px;font-size:16px;color:var(--sel-ink)}
.cls-bar .acts{display:flex;gap:8px;flex-wrap:wrap}
.cls-bar select{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font-size:15px;min-width:120px}
.backup-bar{background:var(--owe-soft);border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.backup-bar .grow{flex:1;font-size:14px;color:var(--owe)}
.auto-owed{background:color-mix(in srgb,var(--brand-soft) 70%,transparent);border:1px dashed var(--brand);border-radius:12px;padding:12px;margin-bottom:12px}
.auto-owed h3{margin:0 0 6px;font-size:15px;color:var(--brand)}
.auto-owed .items{font-size:14px;color:var(--muted)}
.lock-badge{display:inline-block;background:var(--line);color:var(--muted);border-radius:8px;padding:1px 6px;font-size:11px;margin-inline-start:6px}
/* البيع والتجار */
.scard .hd{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:4px}
.scard .hd a{color:inherit;text-decoration:none}
.scard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.scard .acts .btn{text-decoration:none}
.scard .tot{margin-top:6px;font-size:15px}
.scard.focus{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin-top:6px}
.mgrid div{background:var(--bg);border-radius:10px;padding:6px 2px}
.mgrid span{display:block;font-size:12px;color:var(--muted)}
.mgrid b{font-size:14px}
.sumline{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:16px}
details.mcard>summary{list-style:none;cursor:pointer}
details.mcard>summary::-webkit-details-marker{display:none}
details.mcard h4{margin:12px 0 4px;font-size:15px}
details.done>summary{cursor:pointer;font-weight:700;color:var(--muted);padding:8px 2px}
.tscroll{overflow-x:auto;margin-top:10px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center}
.tbl th{color:var(--muted);font-weight:700;font-size:12px}
.tbl td:first-child,.tbl th:first-child{text-align:right}
.mline{display:block;width:100%;text-align:right;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:700;cursor:pointer}
.pill.sale{background:var(--sel);color:var(--sel-ink)}
.pill.money{background:var(--bad-soft);color:var(--bad)}
.sale-foot{position:sticky;bottom:-16px;background:var(--card);border-top:1px solid var(--line);padding:10px 0 4px;margin-top:10px}
.sale-foot .tot{margin-bottom:8px;font-size:16px}
.pick{display:flex;align-items:center;gap:8px;background:var(--brand-soft);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.pick .grow{flex:1;min-width:0}
.pick-row{display:block;width:100%;text-align:right;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.addnew{border:1px dashed var(--line);border-radius:12px;padding:10px;margin-top:6px}
.addnew input{min-width:0;width:100%;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);margin-top:6px}
.srow{display:flex;align-items:center;gap:6px;padding:8px 4px;border-top:1px solid var(--line)}
.srow.sel{background:var(--sel)}
.srow .grow{flex:1;min-width:0;line-height:1.35}
.step .qin{width:48px;height:36px;text-align:center;border-radius:9px;border:1.5px solid var(--line);background:var(--card);font-weight:800;font-size:17px;padding:0}
.srow .step button{width:30px;height:36px;font-size:17px}
details.others>summary{cursor:pointer;font-weight:700;padding:10px 2px;color:var(--brand)}
.inv-wrap{position:fixed;inset:0;z-index:55;background:#e5e7eb;overflow:auto;padding:16px 12px 24px}
.inv{background:#fff;color:#111;max-width:560px;margin:0 auto;border-radius:12px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.inv-h{background:#0f766e;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px}
.inv-h .brand{font-weight:800;font-size:21px;flex:1}
.inv-h h2{margin:0;font-size:17px}
.inv-h .d{font-size:13px;opacity:.9}
.inv-b{padding:14px 16px 18px}
.inv-who{background:#e2f2ef;border-radius:10px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:15px}
.inv-who span{color:#555}
.inv .tbl{margin:12px 0;border-radius:8px;overflow:hidden}
.inv .tbl th{background:#0f766e;color:#fff;font-size:13px;border:0;padding:8px 4px}
.inv .tbl td{border:0;color:#111}
.inv .tbl tbody tr:nth-child(even) td{background:#f3f4f6}
.inv .tbl s{color:#888}
.inv .kv{border-color:#e5e7eb}
.inv .kv:first-of-type{border-top:0}
.inv-np{text-align:center;color:#b45309;font-weight:700;margin:6px 0}
.inv-due{margin-top:10px;background:#b91c1c;color:#fff;border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;font-size:20px;font-weight:800}
.inv-acts{max-width:560px;margin:12px auto 0;display:flex;flex-wrap:wrap;gap:8px}
.inv-acts .btn{flex:1 1 40%;text-align:center;text-decoration:none}
/* اللوجو والتوقيع */
header.top .logo{width:30px;height:30px;border-radius:7px;background:#fff;object-fit:contain;flex:none}
.splash{position:fixed;inset:0;z-index:100;background:#fff;color:#0f766e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .35s}
.splash img{width:150px;height:150px;object-fit:contain}
.splash .nm{font-size:22px;font-weight:800}
.splash .sg{font-size:14px;color:#5d6b68}
.splash.out{opacity:0;pointer-events:none}
.sign{text-align:center;color:var(--muted);font-size:13px;margin:18px 0 4px}
/* ألوان كروت المدرسين */
.titem.st-part{background:var(--owe-soft);border-color:color-mix(in srgb,var(--owe) 35%,transparent);border-inline-start:5px solid var(--owe)}
.titem.st-done{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent);border-inline-start:5px solid var(--ok)}
.pill.dup{background:var(--bad-soft);color:var(--bad)}
.pill.abc{background:var(--sel);color:var(--sel-ink)}
.pill.nw{background:#ede9fe;color:#6d28d9}
.titem.is-new{border-inline-end:5px solid #7c3aed}
.ddrow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line);font-size:15px}

/* ================= التصنيفات ================= */
const CLS_MAP = {
  'فصل':       {stages:['p'], gradeRange:{p:[1,3]}, subjects:['ar','math']},
  'صفوف عليا': {stages:['p'], gradeRange:{p:[4,6]}},
  'اعدادي':    {stages:['m'], gradeRange:{m:[1,3]}},
  'إعدادي':    {stages:['m'], gradeRange:{m:[1,3]}},
  'صفوف عليا واعدادي': {stages:['p','m'], gradeRange:{p:[4,6], m:[1,3]}},
  'ابتدائي واعدادي':   {stages:['p','m'], gradeRange:{p:[1,6], m:[1,3]}},
  'ابتدائي وإعدادي':   {stages:['p','m'], gradeRange:{p:[1,6], m:[1,3]}},
  'ابتدائي':   {stages:['p'], gradeRange:{p:[1,6]}},
  'كشكول':     {stages:['p'], gradeRange:{p:[1,6]}, subjects:['ar','math','stu','sci']},
};
function parseCls(raw){
  if(!raw) return null;
  const n = normText(raw);
  for(const [k,v] of Object.entries(CLS_MAP)){
    if(normText(k)===n) return v;
  }
  if(/كشكول/.test(n)) return CLS_MAP['كشكول'];
  if(/فصل/.test(n)) return CLS_MAP['فصل'];
  if(/صفوف.?عليا/.test(n) && /اعدا/.test(n)) return CLS_MAP['صفوف عليا واعدادي'];
  if(/صفوف.?عليا/.test(n)) return CLS_MAP['صفوف عليا'];
  if(/ابتدا/.test(n) && /اعدا/.test(n)) return CLS_MAP['ابتدائي واعدادي'];
  if(/ابتدا/.test(n)) return CLS_MAP['ابتدائي'];
  if(/اعدا/.test(n)) return CLS_MAP['اعدادي'];
  return null;
}
// عمود التصنيف في شيت المندوب فيه A أو B أو C (نوع المدرس)
function clsLetter(t){ const s=String(t.cls||'').trim().toUpperCase(); return /^[ABC]$/.test(s) ? s : ''; }
// التخصص: اللي المندوب اختاره (t.spec)، وإلا «كشكول» أو «فصل» لو مكتوبين في أي عمود، وإلا التصنيف لو مفهوم
const ALL_CLS = {p:'ابتدائي', m:'اعدادي', pm:'ابتدائي واعدادي'};   // «كل الصفوف» حسب المرحلة
function teacherCls(t){
  if(t.spec){ const c = t.spec==='كل الصفوف' ? CLS_MAP[ALL_CLS[t.stage]] : parseCls(t.spec); if(c) return c; }
  for(const v of [t.cls, t.subjectText, t.stageText]){ const n=normText(v||'');
    if(/كشكول/.test(n)) return CLS_MAP['كشكول']; if(/فصل/.test(n)) return CLS_MAP['فصل']; }
  return clsLetter(t) ? null : parseCls(t.cls);
}
// المواد والمراحل بتاعته (للبحث وترتيب الكتب)
function tSubs(t){ const c=teacherCls(t); return [...new Set([...(c?.subjects||[]), ...(t.subjects||[]).flatMap(x=>x==='kash'?KASH:[x])])]; }
// مواد المدرس في مرحلة معينة: لو المندوب حدد التخصص بنفسه → المواد اللي علّم عليها، وإلا زي الأول (مواد التصنيف لو ليه)
function subsFor(t, cls, st){
  const base = (t.spec && (t.subjects||[]).length) ? t.subjects : (cls.subjects || t.subjects || []);
  const s=new Set(); for(const x of base){ if(x==='kash'){ if(st==='p') KASH.forEach(k=>s.add(k)); } else s.add(x); }
  return s;
}
function tStages(t){ const c=teacherCls(t); return [...new Set([...(c?.stages||[]), ...(t.stage||'').split('').filter(s=>STAGES[s])])]; }
function myGroups(t){ return new Set(expectedBooks(t).map(k=>k.split('-').slice(0,2).join('-'))); }
function expectedBooks(t){
  let cls = teacherCls(t);
  if(!cls){ // مفيش تصنيف واضح → من المرحلة + المادة اللي في الشيت
    const sts=(t.stage||'').split('').filter(s=>STAGES[s]);
    if(!sts.length) return [];
    cls={stages:sts, gradeRange:{}};
  }
  const books = [];
  for(const st of cls.stages){
    const [gMin, gMax] = cls.gradeRange[st] || [1, STAGES[st].grades];
    const ss = subsFor(t, cls, st), stSubs = STAGES[st].subjects.filter(sb => ss.has(sb));
    for(const sb of stSubs){
      const from = Math.max(gMin, FROM[st+'-'+sb]||1);
      for(let g=from; g<=gMax; g++) books.push(`${st}-${sb}-${g}`);
    }
  }
  return books;
}
function autoOwed(t){
  const exp = expectedBooks(t);
  if(!exp.length) return [];
  const delivered = new Set();
  for(const e of db.entries) if(e.t===t.id && e.s==='d') delivered.add(e.b);
  return exp.filter(k => !delivered.has(k));
}
function owedEntries(){
  const r=[]; for(const t of db.teachers) for(const k of autoOwed(t)) r.push({id:'', t:t.id, b:k, q:1, s:'o', dd:'', rd:''});
  return r;
}

  return 0;
}

function indexEntries(){
  const idx = {};
  for(const e of [...db.entries.filter(e=>e.s==='d'), ...owedEntries()]){
    const x = idx[e.t] ||= {d:0, o:0, last:'', books:{}};
    const b = x.books[e.b] ||= {d:0,o:0};
    if(e.s==='d'){x.d+=e.q; b.d+=e.q;} else {x.o+=e.q; b.o+=e.q;}
    const a = actDate(e); if(a > x.last) x.last = a;
  }
  return idx;
}
function owedTotal(){ return owedEntries().length; }
function dayStats(day){
  const visits=new Set(); let d=0,o=0;
  for(const e of db.entries){
    if(e.s==='d' && dk(e.dd)===day){ d+=e.q; visits.add(e.t); }
    if(e.rd && dk(e.rd)===day){ o+=e.q; visits.add(e.t); }
  }
  return {visits:visits.size, d, o};
}

function todayData(){
  const t=dayKey(), del={}, sold={}, S=saleIdx(); let dN=0, sv=0, sN=0, paid=0, rN=0, rv=0;
  for(const e of db.entries) if(e.s==='d' && dk(e.dd)===t){ dN+=e.q; del[e.b]=(del[e.b]||0)+e.q; }
  for(const s of db.sales) if(s.st==='sold' && dk(s.sd)===t) for(const it of s.items){ sN+=it.q; sold[it.b]=(sold[it.b]||0)+it.q; if(it.post!=null) sv+=it.q*it.post; }
  for(const p of db.payments) if(dk(p.d)===t){ if(p.k==='pay') paid+=p.amt; else { rN+=p.q||0; rv+=retVal(p,S); } }
  return {dN, sv:r2(sv), sN, paid:r2(paid), rN, rv:r2(rv), del, sold, visits:dayStats(t).visits};
}

const SUBJ_RE=[['ar',/^(ال)?عربي/],['math',/^(ال)?رياض/],['stu',/^(ال)?دراس/],['en',/^(ال)?(انجليز|انجلش|english)/],['sci',/^(ال)?علوم/]];
const subjOf=w=>{ const m=SUBJ_RE.find(([k,re])=>re.test(w)); return m?m[0]:null; };
// البحث بأي حاجة: كل الكلمات لازم تتطابق. A/B/C لوحده = التصنيف بس
function parseQuery(raw){
  const q={owed:false, subjs:[], stages:[], letter:'', rest:[]};
  for(let w of normText(raw).split(' ').filter(Boolean)){
    if(w.length>2 && w[0]==='و' && (subjOf(w.slice(1)) || /^(ال)?(ابتدا|اعدا)/.test(w.slice(1)))) w=w.slice(1);
    if(/^(ال)?مستحق/.test(w)) q.owed=true;
    else if(subjOf(w)) q.subjs.push(subjOf(w));
    else if(/^(ال)?ابتدا/.test(w)) q.stages.push('p');
    else if(/^(ال)?اعدا/.test(w)) q.stages.push('m');
    else if(/^[abc]$/.test(w)) q.letter=w.toUpperCase();
    else q.rest.push(w);
  }
  return q;
}
const emptyQ = () => ({owed:false, subjs:[], stages:[], letter:'', rest:[]});
function teacherHay(t){ return normText([t.name, t.phone, t.area, t.school, t.subjectText, t.stageText, STAGE_TXT[t.stage]||'', t.cls, t.spec,
  ...tSubs(t).map(s=>SUBJ[s]), ...tStages(t).map(s=>STAGES[s].name)].filter(Boolean).join(' ')); }
function matchTeacher(t, Q, owedList){
  if(Q.letter && clsLetter(t)!==Q.letter) return false;
  if(Q.owed){ const l=owedList || autoOwed(t).map(b=>({b, s:'o'})); if(!l.some(e=>owedMatch(e, Q.subjs, Q.stages))) return false; }
  else { const ss=tSubs(t), sts=tStages(t); if(!Q.subjs.every(s=>ss.includes(s)) || !Q.stages.every(s=>sts.includes(s))) return false; }
  if(!Q.rest.length) return true;
  const h=hayT(t), ph=t.phone||'';   // كل البيانات + التاجر + فعّال + الموقع
  return Q.rest.every(w=>h.includes(w) || (/^\d{3,}$/.test(w) && ph.includes(w.replace(/^0/,''))));
}
function owedMatch(e,subjs,stages){ if(e.s!=='o') return false; const p=bookParts(e.b); return (!subjs?.length||subjs.includes(p.sb)) && (!stages?.length||stages.includes(p.st)); }
function owedLine(ents){
  const by={}; for(const e of [...ents].sort((a,b)=>bookRank[a.b]-bookRank[b.b])){ (by[bookParts(e.b).sb] ||= []).push(e); }
  return Object.entries(by).map(([sb,l])=>`${SUBJ[sb]}: `+l.map(e=>{const p=bookParts(e.b); return `${GRADE[p.g-1]} ${STAGES[p.st].name}`+(e.q>1?` (${e.q})`:'');}).join('، ')).join(' • ');
}

function renderList(){
  const idx=indexEntries(), today=dayKey();
  const raw=homeQuery.trim(); const qd=normPhone(raw).replace(/^0/,'');
  const isNum = raw && /^[\d٠-٩۰-۹\s+\-]+$/.test(raw);
  const Q = raw && !isNum ? parseQuery(raw) : emptyQ();
  const owedBy={}; for(const e of owedEntries()) (owedBy[e.t] ||= []).push(e);
  const visitedToday=new Set(db.entries.filter(e=>dk(e.dd)===today||dk(e.rd)===today).map(e=>e.t));
  let list=db.teachers.filter(t=>{
    if(homeArea && t.area!==homeArea) return false;
    const x=idx[t.id];
    if(homeFilter==='plan' && t.plan!==today) return false;
    if(homeFilter==='owed' && !x?.o) return false;
    if(homeFilter==='today' && !visitedToday.has(t.id)) return false;
    if(homeFilter==='none' && x?.d) return false;
    if(homeFilter==='done' && !(x?.d && !x.o)) return false;
    if(homeFilter==='part' && !(x?.d && x.o)) return false;
    if(!raw) return true;
    if(isNum) return !!qd && (t.phone||'').includes(qd);
    return matchTeacher(t, Q, owedBy[t.id]||[]);
  });
  const rk=(homeArea || homeFilter==='plan') ? recvRankFn() : null;   // شغال على قرية/خط سير: اللي استلم ينزل تحت واللي لسه فوق
  list.sort((a,b)=>{
    if(rk){ const d=rk(a)-rk(b); if(d) return d; }
    const la=idx[a.id]?.last||'', lb=idx[b.id]?.last||'';
    if(homeFilter==='all' && !raw && la!==lb) return lb.localeCompare(la);
    return a.name.localeCompare(b.name,'ar');
  });
  const total=list.length; list=list.slice(0,80);
  const el=$('#tlist');
  if(!total){ el.innerHTML=`<div class="empty" style="grid-column:1/-1">${raw?'مفيش مدرس بالاسم ده في الصفحة دي':'مفيش مدرسين بالاختيار ده'}<br><br><button class="btn" data-act="new-teacher" data-name="${esc(isNum||Q.owed||Q.subjs.length||Q.stages.length||Q.letter?'':raw)}" data-phone="${esc(isNum?raw:'')}">➕ ضيف مدرس جديد</button></div>`; return; }
  let head='';
  if(raw && !isNum){
    const areaHit = Q.rest.length ? [...new Set(list.map(t=>t.area).filter(a=>a && Q.rest.every(w=>normText(a).includes(w))))] : [];
    const desc=[Q.owed?'ليهم مستحق':'', ...Q.subjs.map(s=>SUBJ[s]), ...Q.stages.map(s=>STAGES[s].name), Q.letter?`تصنيف ${Q.letter}`:'', areaHit.length===1?`في ${areaHit[0]}`:''].filter(Boolean).join(' ');
    head=`<div class="lhead">${total} مدرس ${esc(desc)}</div>`;
  }
  const showOwed = Q.owed || homeFilter==='owed';
  el.innerHTML = head + list.map(t=>{
    const oe = showOwed ? (owedBy[t.id]||[]).filter(e=>owedMatch(e, Q.owed?Q.subjs:null, Q.owed?Q.stages:null)) : [];
    return teacherCard(t, idx[t.id], oe.length?`<div class="oline">⏳ ${esc(owedLine(oe))}</div>`:'');
  }).join('') + (total>80?`<div class="empty small" style="grid-column:1/-1">ظاهر 80 من ${total} — اكتب في البحث علشان تضيّق</div>`:'');
  if(raw){ const ws=qWords(raw); el.querySelectorAll('.titem').forEach(x=>markWords(x, ws)); }
}

/* ================= صفحة المدرس ================= */
function renderTeacher(id){
  const t=tById(id);
  if(!t){ setHeader('مش لاقي المدرس', true); app.innerHTML='<div class="empty">المدرس ده مش موجود. <a href="#/">ارجع للرئيسية</a></div>'; return; }
  setHeader(t.name, true);
  const ents=db.entries.filter(e=>e.t===id && e.s==='d');
  const owed=autoOwed(t).map(k=>({b:k,q:1}));
  const books={}; for(const e of ents){ const b=books[e.b] ||= {d:0,o:0}; b.d+=e.q; }
  for(const e of owed){ (books[e.b] ||= {d:0,o:0}).o=1; }
  const delivered=Object.entries(books).filter(([k,v])=>v.d).sort((a,b)=>bookRank[a[0]]-bookRank[b[0]]);
  const phone=t.phone||'';
  const wa = phone ? 'https://wa.me/2'+phone : '';

  const expK=expectedBooks(t);
  const dTot=delivered.reduce((s,[k,v])=>s+v.d,0);
  // 1) كارت فوق بلون حالته: أبيض ما استلمش، برتقاني باقيله، أخضر خلّص
  const stc = !dTot ? '' : owed.length ? 'st-part' : 'st-done';
  const chipsArr=[phone&&`📞 <span dir="ltr">${esc(phone)}</span>`, t.subjectText&&`📚 ${esc(t.subjectText)}`, t.stage&&`🏫 ${STAGE_TXT[t.stage]}`,
    t.spec&&`🎯 ${esc(t.spec)}`, t.area&&`📍 ${esc(t.area)}`, t.school&&`🏢 ${esc(t.school)}`, t.cls&&!clsLetter(t)&&`🏷️ ${esc(t.cls)}`,
    t.students&&`👨‍🎓 ${esc(t.students)} طالب`, t.plan&&`🗓️ خط السير ${fmtDay(t.plan)}`,
    t.active===true&&'✅ فعّال', t.active===false&&'⛔ مش فعّال'].filter(Boolean);
  let html = `<div class="card tcard ${stc}"><div class="tc-top"><button class="avatar avatar-btn" data-act="photos" data-id="${esc(t.id)}" title="صور المدرس">${t.thumb?`<img src="${t.thumb}" alt="" loading="lazy" decoding="async">`:esc((t.name||'؟').trim().charAt(0)||'؟')}<span class="ph-badge">📷${(t.phN||0)>1?t.phN:''}</span></button>

    ${chipsArr.length?`<div class="tc-chips">${chipsArr.map(c=>`<span>${c}</span>`).join('')}</div>`:''}

    <div class="row2" style="margin-top:10px"><button class="btn ${t.loc?'ghost':'owe'}" data-act="loc-up">📍 ${t.loc?'عدّل الموقع':'ارفع الموقع'}</button>${t.loc?`<button class="btn pri" data-act="nav-go" data-id="${esc(t.id)}">🚗 ابدأ الطريق</button>`:'<span class="small" style="align-self:center;color:var(--owe);font-weight:700">📍 الموقع ناقص</span>'}</div></div>

  if(isDup(t)) html += `<div class="banner">⚠️ الرقم ده متكرر — ممنوع تسليم أو بيع لحد ما تمسح المتكرر. <a href="#" data-act="go-dups">افتح الأرقام المتكررة</a></div>`;

  // التخصص: لو مش معروف (مفيش كتب مستحقة) لازم يتحدد قبل التسليم

    html += `<div class="tprog"><i style="width:${pc}%"></i></div><div class="small muted" style="margin-bottom:4px">سلّم ${dn} من ${expK.length}</div>`; }
  // 4) تبويبات: التسليم • البيع • السجل • ملاحظات
  const acc=ACC[id];
  const tb=(k,l)=>`<button class="${tTab===k?'on':''}" data-act="ttab" data-k="${k}">${l}</button>`;
  html += `<div class="ttabs">${tb('del','📚 التسليم')}${tb('sale',`💰 البيع${acc?.orders?` (${acc.orders})`:''}`)}${tb('hist','🕘 السجل')}${tb('notes','📝 ملاحظات')}</div>`;
  if(tTab==='sale'){ app.innerHTML = html + tSaleHtml(t); updateActbar(); return; }
  if(tTab==='notes'){
    const rqs=(db.reqs||[]).filter(r=>r.t===id).sort((a,b)=>b.at.localeCompare(a.at));
    html += `<div class="card"><h3 class="sec-t">🔔 طلبات المدرس (بتظهر في الجرس فوق)</h3>
      <div style="display:flex;gap:8px"><input id="rq_t" class="grow" style="flex:1;min-width:0" placeholder="اللي طلبه منك… مثلاً: كتاب رياضة تالتة" autocomplete="off"><button class="btn ok" data-act="req-add" data-id="${esc(id)}">➕ ضيف</button></div>
      ${rqs.map(r=>`<div class="hrow"><div class="grow">${r.done?`<s class="muted">${esc(r.txt)}</s> <span class="pill ok">خلص</span>`:esc(r.txt)}<div class="small muted">${fmtDT(r.at)}</div></div>${r.done?'':`<button class="btn sm ok" data-act="req-done" data-id="${esc(r.id)}">✔️</button>`}<button class="btn sm danger" data-act="req-del" data-id="${esc(r.id)}">🗑️</button></div>`).join('')}</div>`;
    app.innerHTML = html + `<div class="card"><h3 class="sec-t">📝 ملاحظات</h3><textarea id="notes" style="min-height:160px" placeholder="مثلاً: عايز كتاب لابنه في رابعة…">${esc(t.notes||'')}</textarea></div>`;
    const n=$('#notes'); let nt; n.addEventListener('input',()=>{ clearTimeout(nt); nt=setTimeout(()=>{ t.notes=n.value; save(); },400); });
    updateActbar(); return; }
  if(tTab==='hist'){ const vl=tVisitLog(id), KC={'تسليم':'ok','بيع':'sale','دفعة':'pay','مرتجع':'owe'};
    const vh=`<div class="card"><h3 class="sec-t">👣 الزيارات (${new Set(vl.map(v=>v.at.slice(0,16))).size})</h3>${vl.length ? vl.map(v=>`<div class="kv"><span>${visitLabel(v)}</span><span><span class="pill vk-${KC[v.k]}">${v.k}</span> ${esc(v.txt)}</span></div>`).join('') : '<div class="muted">لسه ما اتزارش.</div>'}</div>`;
    app.innerHTML = html + vh + histHtml(t, ents) + editLogCard(id) + tLogCard(id); updateActbar(); return; }

  html += `<p class="small muted" style="margin:4px 2px 0">دوس <b>+</b> على الكتب اللي هيستلمها (أو دوس على اسم الكتاب)، وبعدين دوس «سلّمت». المستحق بيتحسب لوحده من التصنيف أو المرحلة والمادة.</p>`;
  // ترتيب الكتب: «⭐ تخصصه» فوق مفتوح (كل مواده في كل مراحله)، وتحته «باقي الكتب» مقفول
  const left=stockLeft(), mg=myGroups(t);
  const grp=(st,sb,mine)=>{
    const gkey=`${st}-${sb}`; let dSum=0,oSum=0,rows='';
    for(let g=FROM[gkey]||1; g<=STAGES[st].grades; g++){
      const k=`${gkey}-${g}`; const b=books[k]||{d:0,o:0};

    }
    return `<details class="subj ${mine?'mine':''}" data-g="${gkey}" style="--sc:var(--c-${sb})" ${!closedGroups.has(gkey)?'open':''}>
      <summary>${mine?'<span class="star">★</span>':''}<span class="sn">${SUBJ[sb]}${mine&&tStages(t).length>1?` <span class="small">${STAGES[st].name}</span>`:''}</span>
        ${dSum?`<span class="pill ok">✅ ${dSum}</span>`:''}${oSum?`<span class="pill owe">⏳ ${oSum}</span>`:''}</summary>
      ${rows}</details>`;

  const stageBlocks=skip=>['p','m'].map(st=>{ const subs=STAGES[st].subjects.filter(sb=>!skip.has(`${st}-${sb}`));
    return subs.length ? `<div class="stage-t">${STAGES[st].name}</div><div class="subj-grid">${subs.map(sb=>grp(st,sb,false)).join('')}</div>` : ''; }).join('');
  if(mg.size){
    const mineList=['p','m'].flatMap(st=>STAGES[st].subjects.filter(sb=>mg.has(`${st}-${sb}`)).map(sb=>[st,sb]));
    const restSel=Object.keys(sel).some(k=>!mg.has(k.split('-').slice(0,2).join('-')));

      <details class="others-t" ${othersOpen||restSel?'open':''}><summary>📚 باقي الكتب</summary>${stageBlocks(mg)}</details>`;
  } else html += stageBlocks(new Set());
  app.innerHTML = html;
  updateActbar();
}
// سجل التعاملات: التسليمات + البيع والطلبات + الدفعات والمرتجعات
function histHtml(t, ents){
  const id=t.id;
  const ev=ents.map(e=>{
      const locked = e.s==='d' && e.dd && (Date.now() - new Date(e.dd).getTime()) > 3600000;
      return {d:actDate(e)||'', h:`<div class="hrow"><div class="grow">
        ${e.s==='d'?'<span class="pill ok">اتسلّم</span>':'<span class="pill owe">مستحق</span>'}
        <b>${esc(bookLabel(e.b))}</b>${e.q>1?` × ${e.q}`:''}${locked?'<span class="lock-badge">🔒</span>':''}
        <div class="small muted">${e.s==='d'?`اتسلّم ${fmtDT(e.dd)}`:''}${e.rd?`${e.s==='d'?' • ':''}اتطلب ${fmtDT(e.rd)}`:''}${e.rep&&e.rep!==db.rep?` • ${esc(e.rep)}`:''}</div></div>
        <button class="btn sm danger" data-act="del-entry" data-id="${e.id}" title="امسح">🗑️</button></div>`}; });
  const SI=saleIdx();
  for(const s of db.sales){ if(s.t!==id) continue;
    if(s.st==='sold'){ const v=s.items.reduce((a,it)=>a+(it.post==null?0:it.q*it.post),0), miss=s.items.some(it=>it.post==null);
      ev.push({d:s.sd||s.d, h:`<div class="hrow"><div class="grow"><span class="pill sale">💰 بيع</span> ${itemsLine(s.items)}
        <div class="small muted">${fmtDT(s.sd||s.d)} • ${miss?'السعر لسه ما اتحددش':fmtM(v)}</div></div>
        <button class="btn sm danger" data-act="del-sale" data-id="${s.id}" title="امسح">🗑️</button></div>`}); }
    else if(s.st==='order') ev.push({d:s.d, h:`<div class="hrow"><div class="grow"><span class="pill owe">🛒 طلب</span> ${itemsLine(s.items)}
        <div class="small muted">اتطلب ${fmtDT(s.d)}</div></div></div>`});
    else if(s.st==='cancel' || s.st==='refused') ev.push({d:s.cd||s.d, h:`<div class="hrow"><div class="grow"><span class="pill dup">${s.st==='cancel'?'❌ طلب اتلغى':'🚫 رفض الشراء'}</span> ${itemsLine(s.items)}
        <div class="small muted">اتطلب ${fmtDT(s.d)}${s.cd?` • اتقفل ${fmtDT(s.cd)}`:''}</div></div></div>`});
  }
  for(const p of db.payments){ if(p.t!==id) continue;
    ev.push({d:p.d, h:`<div class="hrow"><div class="grow">${p.k==='pay'
      ? `<span class="pill ok">💵 دفع</span> <b>${fmtM(p.amt)}</b>`
      : `<span class="pill new">↩️ مرتجع</span> <b>${esc(bookLabel(p.b))}</b> × ${p.q} <span class="small muted">(${fmtM(retVal(p,SI))})</span>`}
      <div class="small muted">${fmtDT(p.d)}</div></div>
      <button class="btn sm danger" data-act="del-pay" data-id="${p.id}" title="امسح">🗑️</button></div>`});
  }
  ev.sort((a,b)=>b.d.localeCompare(a.d));
  return `<div class="card"><h3 class="sec-t">🕘 سجل التعاملات (${ev.length})</h3><div class="hist">` +
    (ev.length ? ev.map(x=>x.h).join('') : '<div class="muted">لسه مفيش.</div>') + `</div></div>`;
}
// سجل بيانات المدرس: تعديل البيانات (القديم ← الجديد) + الصور + الطلبات، بتاريخها
function tLogCard(id){
  const ev=[...(db.tlog||[]).filter(x=>x.t===id).map(x=>({at:x.at||'', h:`<span class="pill new">${x.k==='صور'?'📷':x.k==='إضافة'?'➕':'✏️'} ${esc(x.k||'تعديل')}</span> ${esc(x.txt)}`})),

    .sort((a,b)=>b.at.localeCompare(a.at));
  return `<div class="card"><h3 class="sec-t">🧾 تعديل البيانات والصور والطلبات (${ev.length})</h3><div class="hist">` +

}
/* --- صور المدرس (أكتر من صورة) — بتتخزن في IndexedDB لوحدها عشان البيانات الأساسية تفضل خفيفة والبرنامج مايهنجش.
   في db بيفضل بس t.thumb (صورة صغيرة جدًا للقائمة) و t.phN (العدد). النسخة الاحتياطية على الدرايف فيها الصور كاملة. --- */
const PH_MAX=6;
let _pdb=null;
function pdb(){ return _pdb ||= new Promise((res,rej)=>{ const r=indexedDB.open('selah-photos',1); r.onupgradeneeded=()=>r.result.createObjectStore('p'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function pdo(mode, fn){ const d=await pdb(); return new Promise((res,rej)=>{ const tx=d.transaction('p',mode), st=tx.objectStore('p'); const r=fn(st); tx.oncomplete=()=>res(r&&r.result); tx.onerror=()=>rej(tx.error); }); }
const phGet = id => pdo('readonly', s=>s.get(id)).then(v=>v||[]).catch(()=>[]);
const phSet = (id, arr) => arr.length ? pdo('readwrite', s=>s.put(arr, id)) : phDel(id);
const phDel = id => pdo('readwrite', s=>s.delete(id)).catch(()=>{});
async function phAll(){ const o={}; try{ const d=await pdb(); await new Promise((res,rej)=>{ const tx=d.transaction('p','readonly'), c=tx.objectStore('p').openCursor(); c.onsuccess=()=>{ const x=c.result; if(x){ o[x.key]=x.value; x.continue(); } }; tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }catch(e){} return o; }
function thumbOf(src){ return new Promise(res=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(1, 72/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.6)); }; im.onerror=()=>res(''); im.src=src; }); }
async function phSync(t, arr){ await phSet(t.id, arr); t.phN=arr.length; t.thumb=arr.length?await thumbOf(arr[0]):''; delete t.photos; }
// نقل الصور القديمة من البيانات الأساسية لـ IndexedDB (مرة واحدة، ومع أي استرجاع نسخة)
async function migratePhotos(){
  if(!window.indexedDB) return; let n=0;
  for(const t of db.teachers||[]) if(t && Array.isArray(t.photos)){ try{ if(t.photos.length) await phSync(t, t.photos); else delete t.photos; n++; }catch(e){ return; } }
  if(n){ save(false); render(); }
}
function shrinkImg(file, max=480, q=0.7){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file), im=new Image();
  im.onload=()=>{ const s=Math.min(1, max/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',q)); };

const GRADE_RE=[[/^(ال)?(اولي|اول)$/,1],[/^(ال)?(تانيه|ثانيه|تاني|ثاني)$/,2],[/^(ال)?(تالته|ثالثه|تالت|ثالث)$/,3],[/^(ال)?(رابعه|رابع)$/,4],[/^(ال)?(خامسه|خامس)$/,5],[/^(ال)?(سادسه|سادس|سته|ست)$/,6]];

function parseBookQuery(raw){
  const specs=[], rest=[]; let cur=null;
  const nu=()=>{ cur={sb:'', g:0, st:''}; specs.push(cur); return cur; };
  for(let w of normText(raw).split(' ').filter(Boolean)){
    if(w.length>1 && w[0]==='و'){ const r=w.slice(1); if(subjOf(r)||gradeOf(r)||stageOf(r)) w=r; }
    const sb=subjOf(w), g=gradeOf(w), st=stageOf(w);
    if(sb){ if(cur && !cur.sb) cur.sb=sb; else nu().sb=sb; }
    else if(g){ if(cur && !cur.g) cur.g=g; else nu().g=g; }
    else if(st){ if(cur && !cur.st) cur.st=st; else nu().st=st; }
    else if(!/^(ال)?صف$/.test(w)) rest.push(w);

const DAY_NM=['الأحد','الاتنين','التلات','الأربع','الخميس','الجمعة','السبت'];

const dShort=k=>{ const [,m,d]=k.split('-'); return `${+d}/${+m}`; };
function delByDay(){ const m={}; for(const e of db.entries) if(e.s==='d' && e.dd){ const x=m[dk(e.dd)] ||= {n:0, b:{}}; x.n+=e.q; x.b[e.b]=(x.b[e.b]||0)+e.q; } return m; }

function ddSum(){ const el=$('#ddsum'); if(!el) return; const D=delByDay(), n=[...delDays].reduce((s,k)=>s+(D[k]?.n||0),0);
  el.innerHTML = delDays.size ? `تم اختيار <b>${delDays.size}</b> ${delDays.size===1?'يوم':'أيام'} — <b>${n}</b> كتاب` : '<span class="muted">اختار يوم أو أكتر</span>'; }
function ddQuick(r){
  const D=delByDay(), t=dayKey(), d=new Date();
  const from = r==='today' ? t : r==='week' ? dayKey(new Date(Date.now()-6*864e5)) : r==='month' ? isoDay(d.getFullYear(), d.getMonth()+1, 1) : null;
  delDays = new Set(from ? Object.keys(D).filter(k=>k>=from && k<=t) : []);
  app.querySelectorAll('[data-dd]').forEach(cb=>cb.checked=delDays.has(cb.dataset.dd)); ddSum();
  if(from && !delDays.size) toast('مفيش تسليمات في الفترة دي');
}
const SUBJ_ALL={ar:'العربي', math:'الرياضة', stu:'الدراسات', sci:'العلوم', en:'الإنجليزي'};
function delSheetOf(days){
  const D=delByDay(); days=[...days].filter(k=>D[k]).sort();
  if(!days.length) return null;
  // الأيام صفوف والكتب أعمدة: فوق صف المواد (مدموج)، وتحته صف الكتب، ولكل مادة عمود إجمالي، وآخر عمود الإجمالي الكلي، وآخر صف الإجمالي
  const hd=days.map(k=>`${dayName(k)} ${dShort(k)}`), B=(t,c)=>({rich:[{t:String(t), bold:true, color:c}]});
  const cols=[];   // {k: مفتاح الكتاب} أو {sb: إجمالي المادة} أو {all: الإجمالي الكلي}
  const sR=['اليوم'], bR=['اليوم'], merges=[];
  for(const sb of ['ar','math','stu','sci','en']){
    const ks=BOOK_ORDER.filter(k=>bookParts(k).sb===sb); if(!ks.length) continue;
    const a=cols.length+1;
    for(const k of ks){ const p=bookParts(k); cols.push({k}); sR.push(SUBJ_ALL[sb]); bR.push(`${GRADE[p.g-1]} ${STAGES[p.st].name}`); }
    cols.push({sb}); sR.push(SUBJ_ALL[sb]); bR.push('إجمالي '+SUBJ_ALL[sb]);
    merges.push(`${colName(a)}5:${colName(cols.length)}5`);
  }
  cols.push({all:1}); sR.push('الإجمالي الكلي'); bR.push('الإجمالي الكلي');
  merges.push('A5:A6', `${colName(cols.length)}5:${colName(cols.length)}6`);
  sR.hdr=true;
  const val=(c, d)=> c.k ? (D[d].b[c.k]||0) : c.sb ? Object.keys(D[d].b).filter(k=>bookParts(k).sb===c.sb).reduce((s,k)=>s+D[d].b[k],0) : D[d].n;
  const cell=(c, n)=> c.sb ? B(n, SUBJ_COLOR[c.sb]) : c.all ? B(n) : n;
  const rows=[[`المندوب: ${db.rep}`], [`الإدارة: ${db.idara||'—'}`], ['الأيام: '+hd.join('، ')], [], sR, bR];
  for(const d of days) rows.push([`${dayName(d)} ${fmtDay(d)}`, ...cols.map(c=>cell(c, val(c, d)))]);
  rows.push([B('الإجمالي'), ...cols.map(c=>B(days.reduce((s,d)=>s+val(c, d),0), c.sb?SUBJ_COLOR[c.sb]:undefined))]);
  return {name:'الكتب اللي اتسلّمت', rows, head:5, freezeCol:1, merges, widths:[18, ...cols.map(c=>c.k?11:13)]};
}
function exportDelDays(){
  if(!delDays.size){ alert('اختار يوم أو أكتر الأول'); return; }
  const sh=delSheetOf(delDays); if(!sh) return;
  const ks=[...delDays].sort();
  sendSheet(buildXlsx([sh]), `الكتب اللي اتسلمت — ${db.rep} — ${ks[0]}${ks.length>1?' لحد '+ks[ks.length-1]:''} — ${stamp()}.xlsx`, 'شيتات التسليمات');
}

/* ================= ZIP / XLSX ================= */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipBlob(files, type){
  const enc=new TextEncoder(), parts=[], cd=[]; let off=0;
  for(const f of files){
    const nm=enc.encode(f.name), d=typeof f.data==='string'?enc.encode(f.data):f.data, crc=crc32(d);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,0,true); lh.setUint16(12,0x21,true); lh.setUint32(14,crc,true); lh.setUint32(18,d.length,true);
    lh.setUint32(22,d.length,true); lh.setUint16(26,nm.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer), nm, d);
    const ch=new DataView(new ArrayBuffer(46));

    if(name<0) name=h.findIndex(x=>/^(الاسم|اسم|المدرس|المعلم|اسم المدرس)$/.test(x));

$('#fileXlsx').addEventListener('change', async e=>{

  if(H.date>=0){ const nums=data.map(r=>r[H.date]).filter(v=>typeof v==='number' && v>20000 && v<80000).map(serialToParts);
    if(nums.length>2 && new Set(nums.map(p=>p[2])).size===1 && new Set(nums.map(p=>p[1])).size>2) swap=true; }
  const parseDate=v=>{
    if(v===undefined||v==='') return '';
    if(typeof v==='number' && v>20000 && v<80000){ let [y,m,d]=serialToParts(v); if(swap) [m,d]=[d,m]; return isoDay(y,m,d); }
    const s=digits(v); let mm=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/); if(mm) return isoDay(+mm[3],+mm[2],+mm[1]);
    mm=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(mm) return isoDay(+mm[1],+mm[2],+mm[3]); return '';
  };
  let add=0, upd=0, twice=0; const plan=[], seen=new Map();
  for(const r of data){
    const name=get(r,H.name), phone=normPhone(get(r,H.phone));
    const subjectText=get(r,H.subject), stageText=get(r,H.stage);
    const rec={name, phone, stage:parseStage(stageText), stageText, subjectText, subjects:[...parseSubjects(subjectText), ...(/كشكول/.test(normText(subjectText))?['kash']:[])],
      area:get(r,H.area), school:get(r,H.school), cls:get(r,H.cls), students:get(r,H.students), plan:parseDate(r[H.date])};
    // نفس الرقم مرتين في نفس الشيت → يتضاف مرة واحدة (السطر التاني يكمّل الخانات الفاضية بس)
    if(phone && seen.has(phone)){ const p=seen.get(phone).rec; for(const k of Object.keys(rec)) if(!p[k] || (Array.isArray(p[k]) && !p[k].length)) p[k]=rec[k]; twice++; continue; }
    const ex = phone ? db.teachers.find(t=>t.phone===phone) : db.teachers.find(t=>normText(t.name)===normText(name));
    const item={rec, ex}; plan.push(item); if(phone) seen.set(phone, item); ex?upd++:add++;
  }
  if(!plan.length){ alert('الشيت فاضي.'); return; }
  if(!confirm(`لقيت ${plan.length} مدرس في الشيت:\n• ${add} جديد\n• ${upd} موجودين قبل كده (هتتحدّث بياناتهم بس)${twice?`\n• ${twice} سطر رقمه متكرر في الشيت (اتحسب مرة واحدة)`:''}\n\nأستوردهم؟`)) return;
  for(const {rec,ex} of plan){
    if(ex){ for(const k of Object.keys(rec)) if(rec[k] && (!Array.isArray(rec[k]) || rec[k].length)) ex[k]=rec[k];
      delete ex.isNew; delete ex.newArea; }   // اتستورد من الشيت → مبقاش «جديد»

});

  // ملف واحد «سلاح التلميذ» فيه 12 شيت. الأسعار والمبلغ بعد الخصم جايين جاهزين من البرنامج (it.pre / it.post / l.p)، مفيش أي نسبة خصم بتتحسب هنا.
  const inRange = k => all || (k && k>=repFrom && k<=repTo);
  const tmap=Object.fromEntries(db.teachers.map(t=>[t.id,t])), L=lotMap();
  const TN=id=>tmap[id]?.name||'؟', TP=id=>tmap[id]?.phone||'';
  const tsort=(a,b)=>TN(a).localeCompare(TN(b),'ar') || String(a).localeCompare(String(b));
  const SB=k=>SUBJ[bookParts(k).sb], GR=k=>{ const p=bookParts(k); return `${GRADE[p.g-1]} ${STAGES[p.st].name}`; };
  const mName=lot=>lotName(L,lot);
  const SC=['ar','math','stu','en','sci'];
  const TOTF='FCE3A8', LOW=5;
  const cls=t=>clsLetter(t)||t.cls||'', spec=t=>t.spec || [t.subjectText, STAGE_TXT[t.stage]||''].filter(Boolean).join(' — ');
  const plus=(col, rs)=>rs.length ? rs.map(r=>col+r).join('+') : '0';
  // لون فاتح ثابت لكل مدرس/تاجر (من اسمه/كوده مش من رقم السطر)، ولو طلع نفس لون اللي قبله ياخد اللي بعده
  const XP=['FDE2E4','DCEBFF','E3F4E1','FFF1C9','EDE4F7','D9F2EF','FDE8D7','E0F2FE','FBE3F1','E8F3D6','E0E7FF','FCEFD9'];
  const hashC=s=>{ let h=0; for(const ch of String(s)) h=(h*31+ch.charCodeAt(0))>>>0; return h; };
  const colorer=()=>{ let prev=null; return key=>{ let i=hashC(key)%XP.length; if(XP[i]===prev) i=(i+1)%XP.length; prev=XP[i]; return XP[i]; }; };
  const groupBy=(arr, f)=>{ const m=new Map(); for(const x of arr){ const k=f(x); if(!m.has(k)) m.set(k,[]); m.get(k).push(x); } return m; };

  /* ---------- بيانات البيع (الفترة = تاريخ البيع) ---------- */
  const allSold=db.sales.filter(s=>s.st==='sold').sort((a,b)=>(a.sd||a.d||'').localeCompare(b.sd||b.d||''));
  const invNo={}, ic={}; for(const s of allSold){ ic[s.t]=(ic[s.t]||0)+1; invNo[s.id]=ic[s.t]; }
  const sold=allSold.filter(s=>inRange(dk(s.sd||s.d)));
  const retBy={};   // sale:i → [{d, g, q, lots}]
  for(const p of db.payments) if(p.k==='ret') for(const pt of p.parts||[])
    (retBy[pt.sale+':'+pt.i] ||= []).push({d:p.d, g:p.g||p.d, q:pt.q, lots:pt.lots&&pt.lots.length?pt.lots:[{lot:null, q:pt.q}]});
  // سطر لكل (فاتورة، كتاب، تاجر) + دفعات المرتجع بتاعته
  const lines=[];
  for(const s of sold) s.items.forEach((it,i)=>{
    const rs=(retBy[s.id+':'+i]||[]).sort((a,b)=>a.d.localeCompare(b.d));
    const srcs=(it.src&&it.src.length?it.src:[{lot:null, q:it.q}]).map(x=>({lot:x.lot||null, q:x.q, rets:[]}));
    for(const r of rs){ let left=r.q;
      for(const x of srcs){ const q=r.lots.filter(z=>(z.lot||null)===x.lot).reduce((a,z)=>a+z.q,0); if(q){ x.rets.push({d:r.d, q}); left-=q; } }
      if(left>0) srcs[0].rets.push({d:r.d, q:left}); }
    for(const x of srcs) lines.push({s, t:s.t, b:it.b, lot:x.lot, q:x.q, pre:it.pre??null, post:it.post??null, rets:x.rets.sort((a,b)=>a.d.localeCompare(b.d)), rq:x.rets.reduce((a,r)=>a+r.q,0)});
  });
  const linesByT=groupBy(lines, l=>l.t), tids=[...linesByT.keys()].sort(tsort);

  /* ---------- 1) فواتير البيع بمرتجعات: الكتب صفوف، وجنبها المستلم والمرتجع والصافي ---------- */
  const s1=[['المدرس','التليفون','الكتاب','المستلم','المرتجع','الصافي']];
  { const c=colorer(), totRows=[], GT={q:0,r:0};
    for(const tid of tids){ const f=c(tid), by=new Map();
      for(const ln of linesByT.get(tid)){ if(!by.has(ln.b)) by.set(ln.b,{q:0,r:0}); const x=by.get(ln.b); x.q+=ln.q; x.r+=ln.rq; }
      const a=s1.length+1; let tq=0, tr_=0;
      for(const k of [...by.keys()].sort((x,y)=>bookRank[x]-bookRank[y])){ const x=by.get(k), rn=s1.length+1;
        const row=[TN(tid), TP(tid), bookLabel(k), x.q, x.r||'', {f:`D${rn}-E${rn}`, v:x.q-x.r}]; row.fill=f; s1.push(row); tq+=x.q; tr_+=x.r; }
      const rn=s1.length+1, tr=['إجمالي: '+TN(tid), '', '', {f:`SUM(D${a}:D${rn-1})`, v:tq}, {f:`SUM(E${a}:E${rn-1})`, v:tr_}, {f:`SUM(F${a}:F${rn-1})`, v:tq-tr_}];
      tr.fill=f; tr.bold=true; s1.push(tr); totRows.push(rn); GT.q+=tq; GT.r+=tr_; }
    if(totRows.length){ const tr=['الإجمالي العام', '', '', {f:plus('D',totRows), v:GT.q}, {f:plus('E',totRows), v:GT.r}, {f:plus('F',totRows), v:GT.q-GT.r}]; tr.fill=TOTF; tr.bold=true; s1.push(tr); } }
  /* ---------- 2) حسابات المدرسين: سطر لكل دفعة مرتجع، والكتاب الأصلي بيتكرر ---------- */
  const s2=[['المدرس','التليفون','المادة','الصف','التاجر اللي اتسحب منه','تاريخ التسليم','المسحوب','السعر','السعر بعد الخصم','تاريخ الدفعة','عدد الدفعة','التاجر اللي رجع له','المرتجع التراكمي','الباقي بعد الدفعة','المبلغ قبل الخصم','المبلغ بعد الخصم']];
  { const c=colorer(), totRows=[], GT={G:0,M:0,N:0,O:0,P:0};
    for(const tid of tids){ const f=c(tid), last=[], V={G:0,M:0,N:0,O:0,P:0};
      const lns=[...linesByT.get(tid)].sort((a,b)=>(a.s.sd||'').localeCompare(b.s.sd||'') || bookRank[a.b]-bookRank[b.b]);
      for(const ln of lns){ const steps=ln.rets.length?ln.rets:[null]; let cum=0;
        steps.forEach((r,j)=>{ const rn=s2.length+1; cum+=r?r.q:0; const rem=ln.q-cum;
          const row=[TN(tid), TP(tid), SB(ln.b), GR(ln.b), mName(ln.lot), {date:ln.s.sd||ln.s.d}, ln.q, ln.pre??'', ln.post??'',
            r?{date:r.d}:'', r?r.q:'', r?mName(ln.lot):'',
            {f: j ? `M${rn-1}+K${rn}` : `K${rn}`, v:cum}, {f:`G${rn}-M${rn}`, v:rem},
            ln.pre!=null?{f:`N${rn}*H${rn}`, v:r2(rem*ln.pre)}:'', ln.post!=null?{f:`N${rn}*I${rn}`, v:r2(rem*ln.post)}:''];
          row.fill=f; s2.push(row);
          if(j===steps.length-1){ last.push(rn); V.G+=ln.q; V.M+=cum; V.N+=rem; if(ln.pre!=null) V.O+=rem*ln.pre; if(ln.post!=null) V.P+=rem*ln.post; } }); }
      // إجمالي المدرس = آخر باقي لكل كتاب (مش مجموع الأسطر)
      const rn=s2.length+1;
      const tr=['إجمالي: '+TN(tid), '', '', '', '', '', {f:plus('G',last), v:V.G}, '', '', '', '', '', {f:plus('M',last), v:V.M}, {f:plus('N',last), v:V.N}, {f:plus('O',last), v:r2(V.O)}, {f:plus('P',last), v:r2(V.P)}];
      tr.fill=f; tr.bold=true; s2.push(tr); totRows.push(rn); for(const k in GT) GT[k]+=V[k]; }
    if(totRows.length){ const tr=['الإجمالي العام', '', '', '', '', '', {f:plus('G',totRows), v:GT.G}, '', '', '', '', '', {f:plus('M',totRows), v:GT.M}, {f:plus('N',totRows), v:GT.N}, {f:plus('O',totRows), v:r2(GT.O)}, {f:plus('P',totRows), v:r2(GT.P)}];
      tr.fill=TOTF; tr.bold=true; s2.push(tr); } }

  /* ---------- 3) صافي كتب المدرسين (بعد المرتجع، من غير ذكر المرتجع) ---------- */
  const N3='صافي كتب المدرسين';
  const s3=[['المدرس','التليفون','المادة','الصف','التاجر','الصافي','السعر','السعر بعد الخصم','المبلغ قبل الخصم','المبلغ بعد الخصم']];
  const rankV={};   // tid → {n, pre, post}
  let E3=1;
  { const c=colorer();
    for(const tid of tids){
      const ag=new Map();
      for(const ln of linesByT.get(tid)){ const key=[ln.b, mName(ln.lot), ln.pre??'', ln.post??''].join('|');
        if(!ag.has(key)) ag.set(key,{b:ln.b, m:mName(ln.lot), pre:ln.pre, post:ln.post, n:0}); ag.get(key).n+=ln.q-ln.rq; }
      const rows=[...ag.values()].filter(x=>x.n!==0).sort((a,b)=>bookRank[a.b]-bookRank[b.b] || a.m.localeCompare(b.m,'ar'));
      if(!rows.length) continue;
      const f=c(tid), a=s3.length+1, V={n:0, pre:0, post:0};
      for(const x of rows){ const rn=s3.length+1;
        const row=[TN(tid), TP(tid), SB(x.b), GR(x.b), x.m, x.n, x.pre??'', x.post??'', x.pre!=null?{f:`F${rn}*G${rn}`, v:r2(x.n*x.pre)}:'', x.post!=null?{f:`F${rn}*H${rn}`, v:r2(x.n*x.post)}:''];
        row.fill=f; s3.push(row); V.n+=x.n; if(x.pre!=null) V.pre+=x.n*x.pre; if(x.post!=null) V.post+=x.n*x.post; }
      const b=s3.length;
      const tr=['إجمالي: '+TN(tid), '', '', '', '', {f:`SUM(F${a}:F${b})`, v:V.n}, '', '', {f:`SUM(I${a}:I${b})`, v:r2(V.pre)}, {f:`SUM(J${a}:J${b})`, v:r2(V.post)}];
      tr.fill=f; tr.bold=true; s3.push(tr);
      rankV[tid]={n:V.n, pre:r2(V.pre), post:r2(V.post)}; }
    E3=s3.length;
    if(E3>1){
      const sf=(crit, col)=>`SUMIF($C$2:$C$${E3},"${crit}",${col}$2:${col}$${E3})`;
      const det=s3.slice(1).filter(r=>r[2]);   // سطور الكتب بس (الإجمالي عمود المادة فاضي)
      const vs=(pick, col)=>r2(det.filter(pick).reduce((a,r)=>a+(typeof r[col]==='object'?r[col].v:(+r[col]||0)),0));
      s3.push([]); const h=['إجمالي لكل مادة','','','','','الصافي','','','المبلغ قبل الخصم','المبلغ بعد الخصم']; h.hdr=true; s3.push(h);
      for(const sb of SC){ const nm=SUBJ[sb]; if(!det.some(r=>r[2]===nm)) continue; const p=r=>r[2]===nm;
        const r=['إجمالي '+nm, '', '', '', '', {f:sf(nm,'F'), v:vs(p,5)}, '', '', {f:sf(nm,'I'), v:vs(p,8)}, {f:sf(nm,'J'), v:vs(p,9)}]; r.fill=TOTF; r.bold=true; s3.push(r); }
      const g=['الإجمالي العام', '', '', '', '', {f:sf('<>','F'), v:vs(()=>true,5)}, '', '', {f:sf('<>','I'), v:vs(()=>true,8)}, {f:sf('<>','J'), v:vs(()=>true,9)}]; g.fill=TOTF; g.bold=true; s3.push(g); } }

  /* ---------- 4) حسابات التجار: الكتب صفوف، وجنبها المستلمة والمرتجع والصافي ---------- */
  const N4='حسابات التجار';
  const s4=[['التاجر','المادة','الصف','الكتب المستلمة','المرتجع','الصافي','السعر قبل الخصم','السعر بعد الخصم','الإجمالي']], m4=[], mref={}, bkNet={};
  const rl4={}; for(const r of db.merchRets) for(const z of r.lots||[]) rl4[z.lot]=(rl4[z.lot]||0)+z.q;   // مرتجع كل فاتورة (عشان سعر الصافي)
  const newX=()=>({q:0,r:0,v:0,ps:new Set(),miss:false});
  const mNames=[...new Set([...db.merchants.map(l=>l.m), ...db.merchRets.map(r=>r.m)])].sort((a,b)=>a.localeCompare(b,'ar'));
  { const c=colorer();
    for(const name of mNames){ const f=c(name), by=new Map();
      for(const l of db.merchants) if(l.m===name){ if(!by.has(l.b)) by.set(l.b,newX()); const x=by.get(l.b); x.q+=l.q; const n=l.q-(rl4[l.id]||0);
        if(l.p!=null){ x.v+=n*l.p; x.ps.add(l.p); } else if(n) x.miss=true; }   // x.v = قيمة الباقي بسعر كل فاتورة
      for(const r of db.merchRets) if(r.m===name){ if(!by.has(r.b)) by.set(r.b,newX()); by.get(r.b).r+=r.q; }
      if(!by.size) continue;
      const a=s4.length+1; let tk=0, rt=0, tv=0;
      for(const k of [...by.keys()].sort((x,y)=>bookRank[x]-bookRank[y])){ const x=by.get(k), rn=s4.length+1, net=x.q-x.r, p=priceOf(k);
        // السعر بعد الخصم: لو كل الفواتير بنفس السعر → معادلة الصافي × السعر، لو مختلف → متوسط بالقيمة الفعلية
        const post = x.ps.size===1 ? [...x.ps][0] : (x.ps.size && net ? r2(x.v/net) : '');
        const tot = x.ps.size===1 ? {f:`F${rn}*H${rn}`, v:r2(x.v)} : (x.ps.size ? r2(x.v) : '');
        const row=[name, SB(k), GR(k), x.q, x.r||'', {f:`D${rn}-E${rn}`, v:net}, p?.pre??'', post, tot]; row.fill=f; s4.push(row); tk+=x.q; rt+=x.r;
        tv += typeof tot==='object' ? tot.v : (tot===''?0:tot);
        (bkNet[k] ||= {n:0}).n+=net; }
      const rn=s4.length+1, tr=['إجمالي: '+name, '', '', {f:`SUM(D${a}:D${rn-1})`, v:tk}, {f:`SUM(E${a}:E${rn-1})`, v:rt}, {f:`SUM(F${a}:F${rn-1})`, v:tk-rt}, '', '', {f:`SUM(I${a}:I${rn-1})`, v:r2(tv)}];
      tr.fill=f; tr.bold=true; s4.push(tr);
      const mt=merchTeachers(name);
      const rr=[name, 'المدرسين اللي كتبه راحت لهم', {v:mt.length?mt.map(z=>`${z.t.name} (${z.n-z.r})`).join('، '):'—', wrap:true}, '', '', '', '', '', ''];
      rr.fill=f; rr.bold=true; s4.push(rr); m4.push(`C${s4.length}:I${s4.length}`);
      mref[name]={tr:rn, tkv:tk, rtv:rt}; } }

  /* ---------- 4-ب) أسعار الكتب: السعر قبل وبعد الخصم، وعدد الكتب × كل سعر، والإجماليات تحت ---------- */
  const s4b=[['الكتاب','العدد (الصافي)','سعر الكتاب قبل الخصم','سعر الكتاب بعد الخصم','العدد × السعر قبل الخصم','العدد × السعر بعد الخصم']];
  { const TV={n:0, pre:0, post:0};
    for(const k of Object.keys(bkNet).sort((x,y)=>bookRank[x]-bookRank[y])){ const n=bkNet[k].n, p=priceOf(k), rn=s4b.length+1;
      const row=[bookLabel(k), n, p?.pre??'', p?.post??'', p?.pre!=null?{f:`B${rn}*C${rn}`, v:r2(n*p.pre)}:'', p?.post!=null?{f:`B${rn}*D${rn}`, v:r2(n*p.post)}:''];
      row.fill=XP[hashC(bookParts(k).sb)%XP.length]; s4b.push(row); TV.n+=n; if(p?.pre!=null) TV.pre+=n*p.pre; if(p?.post!=null) TV.post+=n*p.post; }
    if(s4b.length>1){ const b=s4b.length, tr=['الإجماليات', {f:`SUM(B2:B${b})`, v:TV.n}, '', '', {f:`SUM(E2:E${b})`, v:r2(TV.pre)}, {f:`SUM(F2:F${b})`, v:r2(TV.post)}]; tr.fill=TOTF; tr.bold=true; s4b.push(tr); } }
  /* ---------- 5) صافي التجار ---------- */
  const s5=[['التاجر','إجمالي المأخوذ','إجمالي المرتجع','الصافي','السعر قبل الخصم','السعر بعد الخصم']];
  { const rl={}; for(const r of db.merchRets) for(const z of r.lots||[]) rl[z.lot]=(rl[z.lot]||0)+z.q;
    const c=colorer(), a=2;
    for(const name of mNames){ const x=mref[name]; if(!x) continue; let pre=0, post=0, pm=false, qm=false;
      for(const l of db.merchants) if(l.m===name){ const n=l.q-(rl[l.id]||0); const p=priceOf(l.b);
        if(p?.pre!=null) pre+=n*p.pre; else pm=true; if(l.p!=null) post+=n*l.p; else qm=true; }
      const rn=s5.length+1;
      const row=[name, {f:`'${N4}'!D${x.tr}`, v:x.tkv}, {f:`'${N4}'!E${x.tr}`, v:x.rtv}, {f:`B${rn}-C${rn}`, v:x.tkv-x.rtv}, pre||!pm?r2(pre):'', post||!qm?r2(post):''];
      row.fill=c(name); s5.push(row); }
    if(s5.length>1){ const b=s5.length; const sum=(col,i)=>({f:`SUM(${col}${a}:${col}${b})`, v:r2(s5.slice(1).reduce((s,r)=>s+(typeof r[i]==='object'?r[i].v:(+r[i]||0)),0))});
      const tr=['الإجمالي', sum('B',1), sum('C',2), sum('D',3), sum('E',4), sum('F',5)]; tr.fill=TOTF; tr.bold=true; s5.push(tr); } }

  /* ---------- التسليمات (الفترة = تاريخ التسليم) ---------- */
  const dents=db.entries.filter(e=>e.s==='d' && e.dd && inRange(dk(e.dd)));
  const tInfo=id=>{ const t=tmap[id]||{}; return [cls(t), spec(t), t.area||'', t.school||'']; };

  /* 6) تسليمات 1: المواد أعمدة، وآخر كل يوم عدد المدرسين وإجمالي الكتب */
  const s6=[['الاسم','التليفون','التاريخ','الساعة','التصنيف','التخصص','المنطقة','المدرسة', ...SC.map(s=>SUBJ[s]), 'إجمالي الكتب','الكتب','عدد المدرسين']];
  { const c=colorer(), sc0=8, scL=colName(sc0), scR=colName(sc0+SC.length-1), totC=colName(sc0+SC.length), cntC=colName(sc0+SC.length+2), dayTot=[];
    const visits=[...groupBy(dents, e=>e.t+'|'+e.dd).values()].map(l=>({t:l[0].t, dd:l[0].dd, l})).sort((a,b)=>a.dd.localeCompare(b.dd));
    for(const [day, vs] of groupBy(visits, v=>dk(v.dd))){
      const a=s6.length+1;
      for(const v of vs){ const by={}; let n=0; for(const e of v.l){ const sb=bookParts(e.b).sb; by[sb]=(by[sb]||0)+e.q; n+=e.q; }
        const rn=s6.length+1, ks=[...v.l].sort((x,y)=>bookRank[x.b]-bookRank[y.b]);
        const row=[TN(v.t), TP(v.t), {date:v.dd}, timeStr(new Date(v.dd)), ...tInfo(v.t), ...SC.map(s=>by[s]||''), {f:`SUM(${scL}${rn}:${scR}${rn})`, v:n},
          ks.map(e=>bookLabel(e.b)+(e.q>1?` × ${e.q}`:'')).join('، '), ''];
        row.fill=c(v.t); s6.push(row); }
      const b=s6.length, rn=b+1;
      const tr=[`إجمالي ${dayName(day)} ${fmtDay(day)}`, '', '', '', '', '', '', '',
        ...SC.map((s,i)=>{ const col=colName(sc0+i); return {f:`SUM(${col}${a}:${col}${b})`, v:vs.reduce((x,v)=>x+v.l.filter(e=>bookParts(e.b).sb===s).reduce((y,e)=>y+e.q,0),0)}; }),
        {f:`SUM(${totC}${a}:${totC}${b})`, v:vs.reduce((x,v)=>x+v.l.reduce((y,e)=>y+e.q,0),0)}, '',
        {f:`SUMPRODUCT(1/COUNTIF(A${a}:A${b},A${a}:A${b}))`, v:new Set(vs.map(v=>TN(v.t))).size}];
      tr.fill=TOTF; tr.bold=true; s6.push(tr); dayTot.push(rn); }
    if(dayTot.length){ const g=['الإجمالي الكلي', '', '', '', '', '', '', '', ...SC.map((s,i)=>{ const col=colName(sc0+i); return {f:plus(col,dayTot), v:dayTot.reduce((x,r)=>x+(s6[r-1][sc0+i].v||0),0)}; }),

/* ================= الشيتات → درايف المندوب: «شيتات سلاح التلميذ/<الفولدر>» =================
   مش بتنزل على التليفون. مفيش نت أو الدرايف مش مربوط → بتستنى في طابور وتترفع لوحدها بعدين. */
const SHQ_KEY='selah-sheetq';
function shq(){ try{ return JSON.parse(localStorage.getItem(SHQ_KEY)||'[]'); }catch(e){ return []; } }
function shqSet(q){ try{ localStorage.setItem(SHQ_KEY, JSON.stringify(q)); return true; }catch(e){ return false; } }
const stamp=()=>{ const d=new Date(); return `${dayKey(d)} ${timeStr(d).replace(':','-')}`; };
const blobB64=b=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(b); });
const upSheet=it=>cloudPost({k:'sheet', mail:db.mail, rep:db.rep, key:db.driveKey, name:it.name, sub:it.sub, b64:it.b64});
function openUrl(u){ const w=window.open(u,'_blank'); if(!w) location.href=u; }
// شيت جوجل على أندرويد: يتفتح في تطبيق «جداول بيانات Google» (المتصفح على الموبايل بيفتحه عرض بس)
function openSheet(u){
  const m=/\/spreadsheets\/d\/([\w-]+)/.exec(u||'');
  if(m && /Android/i.test(navigator.userAgent)){
    location.href='intent://docs.google.com/spreadsheets/d/'+m[1]+'/edit#Intent;scheme=https;package=com.google.android.apps.docs.editors.sheets;S.browser_fallback_url='+encodeURIComponent('https://play.google.com/store/apps/details?id=com.google.android.apps.docs.editors.sheets')+';end';
    return;
  }
  openUrl(u);
}
async function sendSheets(list){
  list=list.map(x=>({...x, name:x.name.replace(/[\\\/:*?"<>|]/g,'-')}));
  if(!GCLIENT_ID || !CLOUD_URL){ for(const x of list) download(x.blob, x.name); toast('⬇️ الشيت نزل'); return; }
  const items=[]; for(const x of list) items.push({name:x.name, sub:x.sub, b64:await blobB64(x.blob), at:new Date().toISOString()});
  const names=list.map(x=>`📁 ${x.sub} ← ${x.name}`).join('\n');
  const queue=(why, arr=items)=>{
    const q=shq(); q.push(...arr); const ok=shqSet(q);
    if(!ok || confirm(`${why}\n\n${names}\n\nعايز تنزّله على التليفون كمان دلوقتي؟`)) for(const x of list) download(x.blob, x.name);
    if(location.hash==='#/report') render();
  };
  if(!db.driveKey){ queue('🔗 الدرايف لسه مش مربوط — الشيت هيترفع لوحده أول ما تربطه.'); if(navigator.onLine) linkDrive(); return; }
  if(!navigator.onLine){ queue('📵 مفيش نت — الشيت هيترفع على الدرايف لوحده أول ما النت يرجع.'); return; }
  toast('⏳ بيترفع على الدرايف…');
  const urls=[];
  for(let i=0;i<items.length;i++){
    try{ const j=await upSheet(items[i]); urls.push(j.url); }
    catch(e){ if(/relink/.test(e.message)){ db.driveKey=''; save(false); }
      queue(/relink/.test(e.message) ? '⚠️ الدرايف محتاج يتربط تاني من الإعدادات — الشيت هيستنى ويترفع بعدين.' : '⚠️ الرفع ما نجحش — هيتحاول تاني لوحده.', items.slice(i));
      return; }
  }
  if(confirm(`✅ اترفع على الدرايف في «شيتات سلاح التلميذ»:\n\n${names}\n\nتفتحه دلوقتي؟`)) openSheet(urls[0]);
}
const sendSheet=(blob, name, sub)=>sendSheets([{blob, name, sub}]);
var shqBusy=false;
async function flushSheets(){
  if(shqBusy || !db.driveKey || !navigator.onLine || !CLOUD_URL) return;
  let q=shq(); if(!q.length) return; shqBusy=true; let n=0;
  try{ while(q.length){ try{ await upSheet(q[0]); }catch(e){ if(/relink/.test(e.message)){ db.driveKey=''; save(false); } break; }
    q.shift(); shqSet(q); n++; } }
  finally{ shqBusy=false; }
  if(n){ toast(`✅ اترفع ${n} شيت على الدرايف`); if(location.hash==='#/report') render(); }
}
window.addEventListener('online', ()=>setTimeout(flushSheets, 3000));

$('#fileStock').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  let rows; try{ rows=await readXlsx(f); }catch(err){ alert('مش قادر أقرا الملف ده. اتأكد إنه شيت إكسل (.xlsx).'); return; }
  let H=null;
  for(let i=0;i<Math.min(15,rows.length);i++){
    const h=[...(rows[i]||[])].map(x=>normText(x??'')); const fi=re=>h.findIndex(x=>x && re.test(x));
    const sb=fi(/ماده/), g=fi(/صف/), q=fi(/عدد|كميه/);
    if(sb>=0 && g>=0 && q>=0){ H={row:i, sb, g, q, st:fi(/مرحله/)}; break; }
  }
  if(!H){ alert('مش لاقي أعمدة: المادة، الصف، العدد'); return; }
  const now=new Date().toISOString(), add=[]; let bad=0;
  for(const r of rows.slice(H.row+1)){
    if(!r) continue;
    const q=parseInt(digits(r[H.q]??'').replace(/[^\d-]/g,''),10); if(!q) continue;
    const sb=parseSubjects(String(r[H.sb]??''))[0], g=parseGrade(r[H.g]);
    const st=((H.st>=0?parseStage(String(r[H.st]??'')):'') || parseStage(String(r[H.g]??'')) || 'p')[0];
    const k=`${st}-${sb}-${g}`;
    if(!sb || bookRank[k]===undefined){ bad++; continue; }
    add.push({id:uid(), b:k, q, d:now});
  }
  if(!add.length){ alert('مفيش أعداد في الشيت.'); return; }
  const tot=add.reduce((s,x)=>s+x.q,0);
  if(!confirm(`لقيت ${tot} كتاب (${add.length} صنف)${bad?`\n⚠️ و ${bad} سطر مش فاهمه (هيتساب)`:''}.\n\nأضيفهم للمخزون؟`)) return;
  withUndo(`📦 اتضاف ${tot} كتاب للمخزون`, ()=>{ db.stock.push(...add); });
});

  // نفس شيت «جرد مخزن مندوب ترم أول» بالملّي: العدد بيتكتب رابطة («جرد ربط») + فرد («جرد فرط») والإجمالي = ربط × الربطة + فرط.
  // الربطة: الكتاب 20، الملحق 40 (بعض الملاحق غير كده — هتتحدد مع شريف)، المفكرة زي شيت الشركة.
  // الملحق والمفكرة عددهم نفس عدد الكتاب بتاعهم. اللي مش في البرنامج (أكتشف، بوستر، كارت، كوبونات) فاضي.
  const left=stockLeft()||{}, L=k=>Math.max(0, left[k]||0);
  const rg=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
  const R=[]; // [الاسم, مفتاح الكتاب أو null, الربطة]
  const add=(pre,sb,st,gs,size)=>{ for(const g of gs) R.push([`${pre} ${g}${st==='p'?'ب':'ع'}`, sb?`${st}-${sb}-${g}`:null, typeof size==='function'?size(g):size]); };
  add('سلاح عربى','ar','p',rg(1,6),20);
  add('سلاح أكتشف',null,'p',rg(1,3),100);
  add('سلاح رياضة','math','p',rg(1,6),20);
  add('سلاح انجليزى','en','p',rg(1,6),20);
  add('سلاح علوم','sci','p',rg(4,6),20);
  add('سلاح دراسات','stu','p',rg(4,6),20);
  add('ملحق عربى','ar','p',rg(2,6),g=>g===2?100:40);
  add('ملحق رياضة','math','p',[4],40);
  add('ملحق انجليزى','en','p',rg(1,6),40);
  add('سلاح عربى','ar','m',rg(1,3),20); add('سلاح رياضة','math','m',rg(1,3),20); add('سلاح دراسات','stu','m',rg(1,3),20);
  add('ملحق عربى','ar','m',rg(1,3),40); add('ملحق رياضة','math','m',rg(1,3),g=>g===3?80:40); add('ملحق دراسات','stu','m',rg(1,3),40);
  add('مفكرة عربى','ar','m',rg(1,3),120); add('مفكرة رياضة','math','m',rg(1,3),60); add('مفكرة دراسات','stu','m',rg(1,3),g=>g===3?60:50);
  add('بوستر دراسات',null,'m',rg(1,3),200);
  R.push(['كارت المعلم',null,1], ['كوبون 1&2&3',null,1], ['كوبون 4&5&6',null,1]);
  const d=new Date(), DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const rows=[
    ['اسم المحافظة','','','التاريخ',{date:d.toISOString()},''],
    ['البحيرة','','','اليوم',DAYS[d.getDay()],''],
    ['اسم المندوب :  ',db.rep||'','كتب','','هدايا عينية',''],
    ['','','هدايا','','الصنف','العدد بالنسخة'],
    ['الصنف','جرد ربط','جرد فرط','الاجمالى','','']];
  for(const [nm,k,size] of R){
    // العدد بيتقسم: رابطة (جرد ربط) والباقي فرد (جرد فرط) — مثلاً 21 والرابطة 20 = 1 رابطة و 1 فرد
    const rn=rows.length+1, label=(nm+' ﺣ1').replace(/^(كارت المعلم|كوبون.*) ﺣ1$/,'$1'), n=k?L(k):0;
    const bq = k ? (size>1 ? Math.floor(n/size) : 0) : '', fq = k ? (size>1 ? n%size : n) : '';
    rows.push([label, bq, fq, size>1?{f:`B${rn}*${size}+C${rn}`, v:n}:{f:`B${rn}+C${rn}`, v:n}]); }
  const sg=rows.length+1;
  rows.push(['توقيع المندوب','','توقيع القائم بالجرد',''], [db.rep||'']);
  const merges=['A1:C1','E1:F1','A2:C2','E2:F2','A3:A4','B3:B4','C3:D3','E3:F3','C4:D4','E4:E5','F4:F5',`C${sg}:D${sg}`];
  sendSheet(buildXlsx([{name:'Sheet', rows, widths:[48.8,25.9,20,18.6,33.1,18.6], head:4, merges, noFreeze:true, af:false}]), `جرد مخزن مندوب — ${db.rep} — ${stamp()}.xlsx`, 'شيتات الجرد');
}

  for(const l of db.merchants) add(l.b, 'in', l.q);

  for(const g of db.gifts||[]) for(const it of g.items||[]) add(it.b, 'gift', it.q);

  for(const p of db.payments) if(p.k==='ret') for(const pt of p.parts||[]){ const it=sById[pt.sale]?.items?.[pt.i]; if(it) add(it.b, 'tret', pt.q); }

  if(ks.length){ const b=rows.length, S=(col,i)=>({f:`SUM(${col}2:${col}${b})`, v:rows.slice(1).reduce((a,r)=>a+(typeof r[i]==='object'?r[i].v:r[i]),0)});

/* ================= شيت بيع الشركة (نفس شكل «بيع مباشر»: English • Prim • Prep • Summary) ================= */

  if(!askCode()) return;
  const inR=k=>k && k>=repFrom && k<=repTo, L=lotMap();
  const tmap=Object.fromEntries(db.teachers.map(t=>[t.id,t]));
  const sold=db.sales.filter(s=>s.st==='sold' && inR(dk(s.sd||s.d))).sort((a,b)=>(a.sd||a.d||'').localeCompare(b.sd||b.d||''));
  if(!sold.length && !confirm('مفيش بيع في الفترة اللي اخترتها، الشيت هيطلع فاضي. تكمل؟')) return;
  const G=(st,sb,a,b)=>Array.from({length:b-a+1},(_,i)=>`${st}-${sb}-${a+i}`);
  const INV='رقم الفاتورة فى حالة الفاتورة المجمعة';
  const SH=[
    {name:'English', ks:G('p','en',1,6), lb:['Eng 1','Eng 2','Eng 3','Eng 4','Eng 5','Eng 6'], tail:['Total', INV, 'ملاحظات']},
    {name:'Prim', ks:[...G('p','ar',1,6), ...G('p','math',1,6), ...G('p','stu',4,6), ...G('p','sci',4,6)],
      lb:['ع 1','ع 2','ع 3','ع4','ع5','ع6','ح 1','ح 2','ح 3','ح4','ح5','ح6','مواد 4','مواد 5','مواد 6','علوم 4','علوم 5','علوم 6'], tail:['Total', INV]},
    {name:'Prep', ks:[...G('m','ar',1,3), ...G('m','math',1,3), ...G('m','stu',1,3)], lb:['ع 1','ع 2','ع 3','ح 1','ح 2','ح 3','مواد 1','مواد 2','مواد 3'], tail:['Total', INV]}];
  const H0=['التاريخ','الكود الوظيفى للمندوب','اسم المندوب','المحافظة','القطاع','اسم المدرس','رقم الهاتف','الإدارة','اسم التاجر'];
  // كل فاتورة → كميات لكل تاجر
  const groups=[];
  for(const s of sold){ const byM=new Map();
    for(const it of s.items){ for(const x of (it.src&&it.src.length?it.src:[{lot:null, q:it.q}])){ const m=x.lot?lotName(L,x.lot):'';
      if(!byM.has(m)) byM.set(m,{}); const o=byM.get(m); o[it.b]=(o[it.b]||0)+x.q; } }
    for(const [m,q] of byM) groups.push({s, m, q}); }
  const out=[];
  for(const sh of SH){ const n0=H0.length, rows=[[...H0, ...sh.lb, ...sh.tail]], c0=colName(n0), c1=colName(n0+sh.ks.length-1);
    for(const g of groups){ const v=sh.ks.map(k=>g.q[k]||0); if(!v.some(Boolean)) continue;
      const t=tmap[g.s.t]||{}, rn=rows.length+1;
      rows.push([{date:g.s.sd||g.s.d}, db.empCode||'', db.rep||'', 'البحيرة', 'البحيرة', t.name||'', t.phone||'', db.idara||'', g.m,
        ...v.map(x=>x||''), {f:`SUM(${c0}${rn}:${c1}${rn})`, v:v.reduce((a,x)=>a+x,0)}, '', ...(sh.tail.length>2?['']:[])]); }
    sh.rows=rows; sh.n=rows.length;
    sh.sum=k=>{ const i=sh.ks.indexOf(k), col=colName(n0+i); return {f:`SUM('${sh.name}'!${col}2:${col}${Math.max(2,sh.n)})`, v:rows.slice(1).reduce((a,r)=>a+(+r[n0+i]||0),0)}; };
    out.push({name:sh.name, rows, widths:[12,14,16,11,11,24,14,14,18, ...sh.ks.map(()=>7), 8, 20, 20], freezeCol:0, af:false}); }
  // Summary: صف لكل محافظة، والبحيرة بس فيها أرقام
  const [EN,PR,PP]=SH;
  const sKs=[[PR,PR.ks.slice(0,6)],[PR,PR.ks.slice(6,12)],[PR,PR.ks.slice(12,15)],[PR,PR.ks.slice(15,18)],[EN,EN.ks],[PP,PP.ks]];
  const sLb=[...PR.lb, ...EN.lb, ...PP.lb];
  const GOV=['القاهرة','القليوبية','الفيوم','بني سويف','الاسكندرية','البحيرة','الاسماعيلية','بورسعيد','السويس','الشرقية','الغربية','الدقهلية','دمياط','المنوفية','كفر الشيخ','المنيا','اسيوط','سوهاج','قنا','البحر الاحمر','الاقصر','اسوان'];
  const W=sLb.length, last=colName(W);
  const srows=[['Gov', ...sLb, 'Total']];
  for(const gv of GOV){ const rn=srows.length+1;
    const cells = gv==='البحيرة' ? sKs.flatMap(([sh,ks])=>ks.map(k=>sh.sum(k))) : Array(W).fill(0);
    srows.push([gv, ...cells, {f:`SUM(B${rn}:${colName(W)}${rn})`, v:cells.reduce((a,c)=>a+(typeof c==='object'?c.v:c),0)}]); }
  const b=srows.length, tr=['Total', ...Array.from({length:W+1},(_,i)=>{ const col=colName(i+1); return {f:`SUM(${col}2:${col}${b})`, v:srows.slice(1).reduce((a,r)=>a+(typeof r[i+1]==='object'?r[i+1].v:r[i+1]),0)}; })];
  tr.fill='FCE3A8'; tr.bold=true; srows.push(tr);
  out.push({name:'Summary', rows:srows, widths:[14, ...Array(W+1).fill(7)], freezeCol:0, af:false});
  sendSheet(buildXlsx(out), `بيع مباشر — ${db.rep} — ${repFrom} لحد ${repTo} — ${stamp()}.xlsx`, 'شيتات البيع');
}
