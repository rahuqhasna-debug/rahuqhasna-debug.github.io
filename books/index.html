function rowBook(sbv, gv, stv){
  const sb=parseSubjects(String(sbv??''))[0], g=parseGrade(gv); if(!sb || !g) return null;
  const st=(parseStage(String(stv??'')) || parseStage(String(gv??'')) || (sb==='en'?'p':'m'))[0];
  const k=`${st}-${sb}-${g}`; return bookRank[k]===undefined ? null : k;
}
function findHead(rows, need){
  for(let i=0;i<Math.min(15,rows.length);i++){
    const h=[...(rows[i]||[])].map(x=>normText(x??'')); const fi=re=>h.findIndex(x=>x && re.test(x));
    const H={row:i, h, sb:fi(/ماده/), g:fi(/صف/), st:fi(/مرحله/)};
    if(H.sb>=0 && H.g>=0 && need(H, fi)) return H;
  }
  return null;
}
$('#filePrice').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  let rows; try{ rows=await readXlsx(f); }catch(err){ alert('مش قادر أقرا الملف ده. اتأكد إنه شيت إكسل (.xlsx).'); return; }
  const H=findHead(rows, (H,fi)=>{ H.pre=fi(/قبل/); H.post=fi(/بعد/); return H.pre>=0 || H.post>=0; });
  if(!H){ alert('مش لاقي أعمدة: المادة، الصف، السعر قبل الخصم / بعد الخصم'); return; }
  const upd={}; let bad=0;
  for(const r of rows.slice(H.row+1)){
    if(!r) continue;
    const pre=H.pre>=0?parseNum(r[H.pre]):null, post=H.post>=0?parseNum(r[H.post]):null;
    if(pre==null && post==null) continue;
    const k=rowBook(r[H.sb], r[H.g], H.st>=0?r[H.st]:'');
    if(!k || !isSell(k)){ bad++; continue; }
    upd[k]={pre, post};
  }
  const n=Object.keys(upd).length;
  if(!n){ alert('مفيش أسعار في الشيت.'); return; }
  if(!confirm(`لقيت أسعار ${n} كتاب${bad?`\n⚠️ و ${bad} سطر مش فاهمه (هيتساب)`:''}.\n\nأحفظها؟`)) return;
  withUndo(`💲 اتحفظت أسعار ${n} كتاب`, ()=>{ Object.assign(db.prices, upd); fillPrices(); });
});
$('#fileMerch').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  let rows; try{ rows=await readXlsx(f); }catch(err){ alert('مش قادر أقرا الملف ده. اتأكد إنه شيت إكسل (.xlsx).'); return; }
  const H=findHead(rows, ()=>true);
  if(!H){ alert('مش لاقي أعمدة: المادة، الصف'); return; }
  // أعمدة التجار بالترتيب. بيقبل «محمود عدد» و«محمود سعر»، أو «محمود» بس:
  // العمود اللي فيه «سعر» = سعر التاجر اللي قبله، وأي عمود تاني = عدد تاجر (واسم التاجر مكرر مرتين = التاني سعر)
  const raw=rows[H.row]||[], ms=[], byN={}, fixed=new Set([H.sb, H.g, H.st]); let last=null;
  for(let i=0;i<raw.length;i++){
    const n=H.h[i]||''; if(fixed.has(i) || !n || /اجمالي|ملاحظ|صنف|كتاب/.test(n)) continue;
    const isP=/سعر/.test(n), isQ=/عدد|كميه/.test(n);
    const name=String(raw[i]).replace(/(ال)?(عدد|سعر|كمية|كميه)/g,' ').replace(/[\-–_:()]/g,' ').replace(/\s+/g,' ').trim();
    const key=normText(name);
    let mc = key ? byN[key] : null;
    if(isP){ const tgt=mc||last; if(tgt && tgt.p<0) tgt.p=i; continue; }
    if(mc && !isQ && mc.q>=0 && mc.p<0){ mc.p=i; continue; }
    if(!key) continue;
    if(!mc){ mc=byN[key]={name, q:-1, p:-1}; ms.push(mc); }
    if(mc.q<0) mc.q=i;
    last=mc;
  }
  const now=new Date().toISOString(), add=[]; let bad=0;
  for(const mc of ms.filter(x=>x.q>=0)){
    for(const r of rows.slice(H.row+1)){
      if(!r) continue;
      const q=parseInt(digits(r[mc.q]??'').replace(/[^\d]/g,''),10); if(!q) continue;
      const k=rowBook(r[H.sb], r[H.g], H.st>=0?r[H.st]:'');
      if(!k || !isSell(k)){ bad++; continue; }
      let p=mc.p>=0?parseNum(r[mc.p]):null; if(p==null) p=priceOf(k)?.post ?? null;
      add.push({id:uid(), m:mc.name, b:k, q, p, d:now});
    }
  }
  if(!add.length){ alert('مفيش أعداد في الشيت.'); return; }
  const sum={}; for(const l of add) sum[l.m]=(sum[l.m]||0)+l.q;
  // تأكيد + تاريخ الاستلام (النهارده افتراضي)
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="box"><h3>🏪 بضاعة تجار جديدة</h3>${Object.entries(sum).map(([n,q])=>`<div class="kv"><span>${esc(n)}</span><b>${q} كتاب</b></div>`).join('')}
    ${bad?`<div class="hint" style="color:var(--bad)">⚠️ و ${bad} سطر مش فاهمه (هيتساب)</div>`:''}
    <div class="field" style="margin-top:10px"><label>تاريخ الاستلام</label><input id="mu_d" type="date" value="${dayKey()}"></div>
    <div class="row2"><button class="btn pri" id="mu_ok">➕ ضيفهم</button><button class="btn ghost" id="mu_x">إلغاء</button></div></div>`;
  document.body.appendChild(m);
  m.addEventListener('click',ev=>{ if(ev.target===m) m.remove(); });
  m.querySelector('#mu_x').onclick=()=>m.remove();
  m.querySelector('#mu_ok').onclick=()=>{
    const d=pickDate(m.querySelector('#mu_d').value), g=uid(); m.remove();
    for(const l of add){ l.d=d; l.g=g; }
    withUndo(`🏪 اتضاف ${add.reduce((s,l)=>s+l.q,0)} كتاب لبضاعة التجار`, ()=>{ db.merchants.push(...add); });
  };
});

/* ================= الدرايف (Apps Script على حساب شريف) ================= */
// المندوب بيبعت بس: نسخة من كل شغله (ملف لكل يوم) + صفحته في شيت البيع + صور الفواتير. وبيسحب الأسعار.
var syncTimer=null, syncBusy=false, invBusy=false, dbkTimer=null, dbkBusy=false;   // var: ممكن save() تتنده قبل السطر ده
function scheduleSync(ms=15000){ if(!CLOUD_URL) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>cloudSync(), ms);
  clearTimeout(dbkTimer); dbkTimer=setTimeout(()=>{ if(driveDue()) driveBackup(); }, 8000); }

/* --- النسخة الاحتياطية على درايف المندوب نفسه ---
   كل نص ساعة أو كل 4 زيارات (أيهما الأول)، لو فيه تعديل من آخر نسخة. الدرايف بيحتفظ بآخر 40 نسخة.
   الربط مرة واحدة: المندوب يوافق بحساب جوجل بتاعه (صلاحية drive.file = الملفات اللي البرنامج عملها بس)،
   والسكريبت بيحفظ الصلاحية ويرفع النسخ بعد كده لوحده. */
const GCLIENT_ID = '1017677782441-dhfvp69vnhq7tes5stvkqqedm7kvgb5q.apps.googleusercontent.com';   // Client ID من Google Cloud (شريف بيحطه). فاضي = النسخ على الدرايف مقفولة
const DBK_MIN = 30, DBK_VISITS = 4, DBK_KEEP = 40;
function visitsSince(iso){
  const v=new Set();
  for(const e of db.entries){ if((e.s==='d' && (e.dd||'')>iso) || (e.rd && e.rd>iso)) v.add(e.t); }
  for(const s of db.sales) if((s.sd||s.d||'')>iso) v.add(s.t);
  return v.size;
}
function driveDue(){
  if(!GCLIENT_ID || !CLOUD_URL || !db.driveKey) return false;
  if(!db.entries.length && !db.stock.length && !db.sales.length && !db.merchants.length) return false;
  if(db.lastDriveBk && (db.lastChange||'') <= db.lastDriveBk) return false;   // مفيش جديد
  if(!db.lastDriveBk) return true;
  return (Date.now()-new Date(db.lastDriveBk).getTime())/60000 >= DBK_MIN || visitsSince(db.lastDriveBk) >= DBK_VISITS;
}
async function driveBackup(manual){
  if(!GCLIENT_ID || !CLOUD_URL || !db.driveKey || dbkBusy) return false;
  if(!navigator.onLine){ if(manual) toast('📵 مفيش نت — النسخة هتترفع لوحدها أول ما النت يرجع'); return false; }
  dbkBusy=true; const at=new Date().toISOString(), d=new Date(at), k=dayKey(d);
  const name=`نسخة — ${dayName(k)} ${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()} — ${timeStr(d).replace(':','-')}.json`;
  try{
    const j=await cloudPost({k:'bk', mail:db.mail, rep:db.rep, key:db.driveKey, name, keep:DBK_KEEP, data:{app:'selah-books', ...db, savedAt:at}});
    db.lastDriveBk=at; db.lastBackup=at; db.driveCount=j.count||0; save(false); updateBkBtn();
    if(manual){ toast(`✅ النسخة اترفعت على الدرايف بتاعك (${j.count||''} نسخة)`); }
    if(location.hash==='#/settings') render();
    return true;
  }catch(e){
    if(/relink/.test(e.message)){ db.driveKey=''; save(false); toast('⚠️ الدرايف محتاج يتربط تاني من الإعدادات'); if(location.hash==='#/settings') render(); }
    else if(manual) toast('⚠️ النسخة ما اترفعتش — هتتحاول تاني لوحدها');
    return false;
  }finally{ dbkBusy=false; }
}
function loadGis(){
  if(window.google?.accounts?.oauth2 || document.getElementById('gisJs')) return;
  const s=document.createElement('script'); s.id='gisJs'; s.src='https://accounts.google.com/gsi/client'; s.async=true;
  s.onerror=()=>s.remove(); document.head.appendChild(s);
}
function linkDrive(){
  if(!GCLIENT_ID || !CLOUD_URL) return;
  if(!navigator.onLine){ toast('📵 محتاج نت عشان تربط الدرايف'); return; }
  if(!window.google?.accounts?.oauth2){ loadGis(); toast('⏳ استنى ثانيتين ودوس تاني'); return; }
  const c=google.accounts.oauth2.initCodeClient({client_id:GCLIENT_ID, scope:'https://www.googleapis.com/auth/drive.file email',
    ux_mode:'popup', login_hint:db.mail||'', callback: async r=>{
      if(!r || r.error || !r.code){ toast('⚠️ الربط ما كملش'); return; }
      try{
        const j=await cloudPost({k:'link', mail:db.mail, rep:db.rep, code:r.code});
        db.driveKey=j.key; db.driveMail=j.gmail||''; db.lastDriveBk=''; save(false);
        toast('✅ الدرايف اتربط — بيرفع أول نسخة…'); render(); driveBackup(true);
      }catch(e){ alert(/norefresh/.test(e.message)
        ? 'جوجل ما ادّاش صلاحية دائمة.\nافتح myaccount.google.com/permissions وشيل «سلاح التلميذ» واربط تاني.'
        : 'الربط ما نجحش. جرّب تاني بعد شوية.'); }
    }});
  c.requestCode();
}
function driveCard(){
  if(!GCLIENT_ID || !CLOUD_URL) return '';
  if(!db.driveKey) return `<div class="card"><h3 class="sec-t">🗂️ النسخة الاحتياطية على الدرايف بتاعك</h3>
    <p class="hint" style="margin-top:0">اربط حساب جوجل بتاعك مرة واحدة، والبرنامج هيرفع نسخة لوحده على الدرايف بتاعك كل نص ساعة أو كل ${DBK_VISITS} زيارات، ويحتفظ بآخر ${DBK_KEEP} نسخة في فولدر «سلاح التلميذ البحيرة».</p>
    <button class="btn pri" style="width:100%" data-act="drive-link">🔗 اربط الدرايف بتاعي</button></div>`;
  return `<div class="card"><h3 class="sec-t">🗂️ النسخة الاحتياطية على الدرايف بتاعك</h3>
    <div class="kv"><span>الحساب</span><b>${esc(db.driveMail||db.mail)}</b></div>
    <div class="kv"><span>آخر نسخة</span><b>${db.lastDriveBk?fmtDT(db.lastDriveBk):'لسه'}</b></div>
    ${db.driveCount?`<div class="kv"><span>النسخ اللي على الدرايف</span><b>${db.driveCount} من ${DBK_KEEP}</b></div>`:''}
    <div class="row2" style="margin-top:8px"><button class="btn pri" data-act="drive-now">⬆️ ارفع نسخة دلوقتي</button><button class="btn ghost" data-act="drive-link">🔗 اربط تاني</button></div>
    <p class="hint">بتترفع لوحدها كل نص ساعة أو كل ${DBK_VISITS} زيارات (أيهما الأول) لو فيه شغل جديد. لو مفيش نت بتستنى لحد ما النت يرجع. هتلاقيها في الدرايف ← فولدر «سلاح التلميذ البحيرة»، ولو احتجت ترجّع نسخة نزّلها ورجّعها من «استرجاع نسخة».</p></div>`;
}
async function cloudPost(body){
  const r=await fetch(CLOUD_URL, {method:'POST', body:JSON.stringify(body)});   // text/plain → من غير preflight
  const j=await r.json(); if(!j.ok) throw new Error(j.err||'fail'); return j;
}
// الصفوف اللي بتتكتب في شيت المندوب على درايف شريف (بند ش): البيع، المرتجعات والدفعات، التسليمات
function syncRows(){
  const tm=Object.fromEntries(db.teachers.map(t=>[t.id,t])), lot=Object.fromEntries(db.merchants.map(l=>[l.id,l])), S=saleIdx(), D=iso=>fmtDay(dk(iso));
  const sold=db.sales.filter(s=>s.st==='sold').sort((a,b)=>(a.sd||'').localeCompare(b.sd||''));
  // رقم الفاتورة = ترتيبها عند المدرس ده (من الأقدم)
  const invNo={}, cnt={}; for(const s of sold){ cnt[s.t]=(cnt[s.t]||0)+1; invNo[s.id]=cnt[s.t]; }
  // اسم صورة الفاتورة على الدرايف بيبدأ بـ «فاتورة-<المدرس>-<اليوم>» (زي queueInvoice)
  const imgBase=(t,iso)=>`فاتورة-${t.name||''}-${dk(iso)}`.replace(/[\\/:*?"<>|]/g,'');
  const sales=[['رقم الفاتورة','التاريخ','المدرس','التليفون','الكتاب','العدد','السعر قبل','السعر بعد','الإجمالي','التاجر','صورة الفاتورة']];
  for(const s of sold){ const t=tm[s.t]||{};
    for(const it of s.items) for(const x of (it.src&&it.src.length?it.src:[{lot:null,q:it.q}]))
      sales.push([`فاتورة ${invNo[s.id]}`, D(s.sd), t.name||'؟', t.phone||'', bookLabel(it.b), x.q, it.pre??'', it.post??'', it.post!=null?r2(x.q*it.post):'', x.lot?(lot[x.lot]?.m||'؟'):'—', 'IMG:'+imgBase(t,s.sd)]); }
  const pays=[['التاريخ','المدرس','النوع','الكتاب','العدد','المبلغ','فاتورة رقم']];
  for(const p of [...db.payments].sort((a,b)=>(a.d||'').localeCompare(b.d||''))){ const t=tm[p.t]||{};
    if(p.k==='pay') pays.push([D(p.d), t.name||'؟', 'دفعة', '', '', r2(p.amt), '']);
    else pays.push([D(p.d), t.name||'؟', 'مرتجع', bookLabel(p.b), p.q, r2(retVal(p,S)), [...new Set((p.parts||[]).map(pt=>invNo[pt.sale]).filter(Boolean))].map(n=>'فاتورة '+n).join('، ')]); }
  // التسليمات: كل سطر ليه كود ثابت (e.id) عشان عمود «التسجيل على برنامج الشركة» اللي شريف بيعلّمه يفضل زي ما هو
  const dels=[];
  for(const e of [...db.entries].sort((a,b)=>((tm[a.t]?.name||'').localeCompare(tm[b.t]?.name||'','ar')) || (actDate(a)||'').localeCompare(actDate(b)||''))){
    const t=tm[e.t]||{}, a=actDate(e);
    dels.push({id:e.id, r:[t.name||'؟', t.phone||'', bookLabel(e.b), e.q, e.s==='d'?'اتسلّم':'مستحق (لسه)', a?D(a):'', a?timeStr(new Date(a)):'', t.area||'', e.rd?D(e.rd):'', e.dd?D(e.dd):'', e.rep||db.rep]}); }
  return {sales, pays, dels};
}
function syncStats(){
  const st=dayStats(dayKey()), acc=accMap(), left=stockLeft(), S=saleIdx(); let sold=0, owe=0;
  for(const a of Object.values(acc)){ sold+=a.bought; if(a.owe>0) owe+=a.owe; }
  // أرقام كل يوم (آخر 40 يوم) لمقارنة المناديب في صفحة المتابعة: سلّم • باع بـ • حصّل • مرتجع
  const from=dayKey(new Date(Date.now()-40*864e5)), days={}, g=k=>days[k] ||= {d:0, sv:0, pd:0, rv:0};
  for(const e of db.entries) if(e.s==='d'){ const k=dk(e.dd); if(k>=from) g(k).d+=e.q; }
  for(const s of db.sales) if(s.st==='sold'){ const k=dk(s.sd); if(k>=from) for(const it of s.items) if(it.post!=null) g(k).sv+=it.q*it.post; }
  for(const p of db.payments){ const k=dk(p.d); if(k<from) continue; if(p.k==='pay') g(k).pd+=p.amt; else g(k).rv+=retVal(p,S); }
  for(const k in days) for(const f of ['sv','pd','rv']) days[k][f]=r2(days[k][f]);
  const merchOwe=r2(merchSum().reduce((s,x)=>s+Math.max(0,x.owe),0));
  return {teachers:db.teachers.length, visitsToday:st.visits, deliveredToday:st.d, delivered:db.entries.filter(e=>e.s==='d').reduce((s,e)=>s+e.q,0),
    owed:owedTotal(), sold:r2(sold), owe:r2(owe), orders:db.sales.filter(s=>s.st==='order').length, stockLeft:left?Object.values(left).reduce((a,b)=>a+b,0):null,
    merchOwe, days};
}
async function cloudSync(manual){
  if(!CLOUD_URL || !db.mail || syncBusy || !navigator.onLine) return;
  if(db.lastSync && (db.lastChange||'') <= db.lastSync){ flushInv(); if(manual) toast('☁️ كل حاجة متبعتة'); return; }
  syncBusy=true; const at=new Date().toISOString();
  try{
    const {sales, pays, dels}=syncRows();
    await cloudPost({k:'sync', mail:db.mail, rep:db.rep, idara:db.idara||'', day:dayKey(), at, stats:syncStats(), sales, pays, dels,
      data:{app:'selah-books', ...db, savedAt:at}});
    db.lastSync=at; save(false); if(manual){ toast('☁️ اتبعت ✅'); if(location.hash==='#/settings') render(); }
  }catch(e){ if(manual) toast('⚠️ ما اتبعتش — هيحاول تاني لوحده'); }
  finally{ syncBusy=false; }
  flushInv();
}
// صور الفواتير: بتستنى في طابور على الجهاز لحد ما يبقى فيه نت
var INV_KEY=KEY+'-inv';
function invQ(){ try{ return JSON.parse(localStorage.getItem(INV_KEY)||'[]'); }catch(e){ return []; } }
function setInvQ(q){ try{ localStorage.setItem(INV_KEY, JSON.stringify(q)); }catch(e){ try{ localStorage.setItem(INV_KEY, JSON.stringify(q.slice(-3))); }catch(_){} } }
function queueInvoice(data, base){
  if(!CLOUD_URL) return;
  try{ const d=new Date(), b64=invoiceCanvas(data).toDataURL('image/jpeg',0.8).split(',')[1];
    const q=invQ(); q.push({name:`${base}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.jpg`, b64}); setInvQ(q.slice(-15)); }catch(e){}
  setTimeout(flushInv, 2000);
}
async function flushInv(){
  if(!CLOUD_URL || !db.mail || invBusy || !navigator.onLine) return;
  invBusy=true;
  try{ let q=invQ(); while(q.length){ await cloudPost({k:'inv', mail:db.mail, rep:db.rep, name:q[0].name, b64:q[0].b64}); q=invQ(); q.shift(); setInvQ(q); } }
  catch(e){} finally{ invBusy=false; }
}
// الأسعار: من شيت «الأسعار» على درايف شريف (المندوب ما بيعدّلهاش)
async function pullPrices(manual){
  if(!CLOUD_URL || !navigator.onLine) return;
  try{
    const r=await fetch(CLOUD_URL+'?k=prices'); const j=await r.json(); if(!j.ok || !Array.isArray(j.rows)) throw new Error('bad');
    const H=findHead(j.rows, (H,fi)=>{ H.pre=fi(/قبل/); H.post=fi(/بعد/); return H.pre>=0 || H.post>=0; }); if(!H) throw new Error('head');
    const np={};
    for(const row of j.rows.slice(H.row+1)){
      const pre=H.pre>=0?parseNum(row[H.pre]):null, post=H.post>=0?parseNum(row[H.post]):null;
      if(pre==null && post==null) continue;
      const k=rowBook(row[H.sb], row[H.g], H.st>=0?row[H.st]:''); if(k && isSell(k)) np[k]={pre, post};
    }
    // رقم واتساب التقارير: من صفحة «إعدادات» في شيت الأسعار (شريف بس اللي بيحدده)
    if(j.phone!=null){ const ph=String(j.phone).trim(); if(ph!==(db.reportPhone||'')){ db.reportPhone=ph; save(false); } }
    const changed=JSON.stringify(np)!==JSON.stringify(db.prices);
    db.pricesAt=new Date().toISOString();
    if(changed){ db.prices=np; fillPrices(); save(); render(); toast('💲 الأسعار اتحدّثت'); }
    else { save(false); if(manual){ toast('💲 الأسعار زي ما هي'); render(); } }
  }catch(e){ if(manual) toast('⚠️ مش قادر أجيب الأسعار دلوقتي'); }
}
if(CLOUD_URL){
  const dchk=()=>{ if(driveDue()) driveBackup(); };
  setTimeout(()=>{ pullPrices(); cloudSync(); dchk(); if(GCLIENT_ID && !db.driveKey) loadGis(); }, 3000);
  window.addEventListener('online', ()=>{ pullPrices(); cloudSync(); setTimeout(dchk, 4000); });
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ cloudSync(); dchk(); } else setTimeout(dchk, 2000); });
  setInterval(()=>cloudSync(), 5*60000);
  setInterval(dchk, 60000);
}

render();

document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) eveningCheck(); });

setTimeout(()=>{ const s=$('#splash'); if(s){ s.classList.add('out'); setTimeout(()=>s.remove(), 400); } }, 1000);
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
