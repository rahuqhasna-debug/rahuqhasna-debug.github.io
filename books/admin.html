<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>المراسلات - سلاح التلميذ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body>
<header class="top"><div class="in">
  <button class="hb" id="backBtn" hidden aria-label="رجوع">→</button>
  <h1 id="title">المراسلات</h1>
  <a class="hb" id="bellBtn" href="#/bell" hidden aria-label="الإشعارات">🔔<span class="cnt" id="bellCnt" hidden></span></a>
  <button class="hb" id="outBtn" hidden aria-label="خروج">🚪</button>
</div></header>
<main class="wrap" id="app"><div class="loading">جاري التحميل…</div></main>
<div id="cbar"></div>
<nav class="tabs" id="tabs" hidden>
  <a href="index.html"><span class="i">🏠</span>البرنامج</a>
  <a href="index.html#/msgs"><span class="i" style="display:inline-block;width:22px;height:22px">🟩</span>واتساب</a>
  <a href="#/" data-tab="list"><span class="i">👥</span>المدرسين</a>
  <a href="#/invite" data-tab="invite"><span class="i">✉️</span>رسالة الدعوة</a>
  <a href="#/bell" data-tab="bell"><span class="i">🔔</span>الإشعارات</a>
  <a href="#/settings" data-tab="settings" id="setTab" hidden><span class="i">⚙️</span>الإعدادات</a>
</nav>
<script>
"use strict";
const sb = makeClient(true);
const app = $('#app');
let me = null, T = [], notesBy = {}, pendSet = new Set(), staffList = [], BC = { edits: 0, orders: 0, msgs: 0 }, unreadBy = {}, lastMsg = {}, ordersBy = {}, pollT = null;
const ui = { q: '', filter: 'all', rep: '', selMode: false, sel: new Set(), shown: 200, bellTab: 'msgs', invQ: '', invSel: new Set() };
const isAdmin = () => me && me.role === 'admin';
const MB = 1048576, GKEY = 'selah-books-v1';

/* ---------- البرنامج الأخضر (نفس الموقع = نفس localStorage) ---------- */
function gdb() { try { return JSON.parse(localStorage.getItem(GKEY) || 'null'); } catch (e) { return null; } }
function gsave(db) { db.lastChange = new Date().toISOString(); localStorage.setItem(GKEY, JSON.stringify(db)); }
function gBooks(db, tid) {
  const m = {};
  for (const s of db.sales || []) if (s.t === tid) for (const it of s.items || []) m[it.b] = (m[it.b] || 0) + (+it.q || 0);
  return Object.entries(m).filter(([, q]) => q > 0).map(([b, q]) => ({ b, l: bookLabel(b), q }));
}
function gProfile(t) {
  return { name: t.name || '', phone: t.phone || '', stage: t.stage || '', subjects: (t.subjects || []).filter(x => x !== 'kash').slice(0, 2), spec: t.spec || '',
    area: t.area || '', school: t.school || '', grades: (t.tGrades && t.tGrades.length ? t.tGrades : (t.grades || []).filter(g => g >= 1 && g <= 6)), where: t.where || '', students: t.students || '',
    ...(t.tAddress ? { address: t.tAddress } : {}), ...(t.tLoc ? { loc: t.tLoc } : {}), ...(t.tDays ? { days: t.tDays } : {}) };
}
function gApply(localId, fin) {   // الموافقة تتكتب في البرنامج الأخضر كمان
  const db = gdb(); if (!db || !localId) return false;
  const t = (db.teachers || []).find(x => x.id === localId); if (!t) return false;
  const map = { name: 'name', phone: 'phone', stage: 'stage', spec: 'spec', area: 'area', school: 'school', where: 'where', students: 'students', address: 'tAddress', loc: 'tLoc', days: 'tDays' };
  const lines = [];
  for (const k in fin) {
    if (k === 'avatar') continue;
    if (k === 'subjects') { const keep = (t.subjects || []).includes('kash') ? ['kash'] : []; t.subjects = [...new Set([...fin.subjects, ...keep])]; t.subjectText = ''; }
    else if (k === 'grades') { t.grades = (fin.grades || []).filter(g => g <= 6); t.tGrades = fin.grades; }
    else if (map[k]) t[map[k]] = fin[k];
    lines.push(`${FIELD_LABEL[k] || k}: ${valText(k, fin[k])}`);
  }
  (db.tlog ||= []).push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), t: t.id, at: new Date().toISOString(), k: 'تحديث من المدرس (المراسلات)', txt: lines.join(' • ') });
  gsave(db); return true;
}
function gOrder(localId, items) {   // طلب كتب اتوافق عليه ← «طلب مستني» في البيع
  const db = gdb(); if (!db || !localId || !(db.teachers || []).some(x => x.id === localId)) return false;
  const its = items.filter(i => i.q > 0).map(i => ({ b: i.b, q: i.q }));
  (db.sales ||= []).push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), t: localId, st: 'order', d: new Date().toISOString(), items: its, oq: Object.fromEntries(its.map(i => [i.b, i.q])), rep: db.rep, from: 'teacher-app' });
  gsave(db); return true;
}

/* ---------- أدوات ---------- */
function ask(title, { ph = '', val = '', multi = true, okTxt = 'تمام' } = {}) {
  return new Promise(res => {
    let done = false;
    const m = modal(`<h3>${esc(title)}</h3>${multi ? `<textarea id="askv" placeholder="${esc(ph)}">${esc(val)}</textarea>` : `<input class="inp" id="askv" placeholder="${esc(ph)}" value="${esc(val)}">`}
      <div class="acts"><button class="btn pri" id="askok">${okTxt}</button><button class="btn ghost" data-close>إلغاء</button></div>`,
      (box, close) => { $('#askv', box).focus(); $('#askok', box).onclick = () => { done = true; const v = $('#askv', box).value.trim(); close(); res(v); }; });
    const ob = new MutationObserver(() => { if (!document.body.contains(m)) { ob.disconnect(); if (!done) res(null); } });
    ob.observe(document.body, { childList: true });
  });
}
function norm(s) { return String(s || '').toLowerCase().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[ً-ْ]/g, ''); }
function setHeader(t, back) { $('#title').textContent = t; $('#backBtn').hidden = !back; }
function setTab(t) { $$('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === t)); }
function repName(id) { const s = staffList.find(x => x.id === id); return s ? s.name : '—'; }
function inviteLink(t) {
  const c = getCfg(), base = location.href.split('#')[0].replace(/admin\.html.*$/, '');
  return base + 'teacher.html#c=' + t.invite_code + (c.custom ? '&p=' + encodeCfg(c.url, c.key) : '');
}
const INV_DEF = 'أهلًا أ/ {الاسم} 👋\nده رابط ملفك في «سلاح التلميذ»، افتحه وثبّته على موبايلك وكمّل بياناتك:\n[رابط المدرس]';
function inviteMsg(t, tpl) { tpl = tpl || LS.get('selah-trial-inv') || INV_DEF; if (!tpl.includes('[رابط المدرس]')) tpl += '\n[رابط المدرس]'; return tpl.replace(/(أ\/\s*)?\{الاسم\}/g, 'أ/ ' + t.name).replace(/\[رابط المدرس\]/g, inviteLink(t)); }
// حالة تحديث بيانات المدرس: full = حدّث كله واتوافق، part = حدّث جزء، none = ماحدّثش خالص
let apprSet = new Set(), openUpd = new Set();
const UPD_KEYS = ['address', 'loc', 'days'];
function updState(t) {
  const pr = t.profile || {}, has = k => { const v = pr[k]; return v && (typeof v !== 'object' || Object.keys(v).length); };
  if (!apprSet.has(t.id) && !pendSet.has(t.id)) return 'none';
  return apprSet.has(t.id) && UPD_KEYS.every(has) && !openUpd.has(t.id) && !pendSet.has(t.id) ? 'full' : 'part';
}
const UPD_C = { full: ['#16a34a', '🟢 حدّث كله'], part: ['#f59e0b', '🟠 باقيله جزء'], none: ['#94a3b8', '⚪ ماحدّثش'] };
const tB = id => badgesHtml(unreadBy[id] || 0, pendSet.has(id) ? 1 : 0, ordersBy[id] || 0);   // علامات المدرس جنب اسمه في أي مكان
function avHtml(t, cls = '') { return t.avatar ? `<img class="av ${cls}" src="${t.avatar}" alt="">` : `<span class="av ${cls}">${esc((t.name || '؟').trim()[0] || '👤')}</span>`; }
async function fetchAll(make) {
  let out = [];
  for (let i = 0; ; i += 1000) { const { data, error } = await make().range(i, i + 999); if (error) throw error; out = out.concat(data); if (data.length < 1000) break; }
  return out;
}
const short = v => v === null || v === undefined || v === '' ? '—' : typeof v === 'string' ? (v.startsWith('data:') ? '(صورة)' : v) : typeof v === 'object' ? JSON.stringify(v) : String(v);
const AUD_L = { reason: 'السبب', q: 'السؤال', reply: 'رد المدرس', photos: 'صور', rep: 'المندوب', from: 'من', to: 'إلى', body: 'النص' };
function auditDetails(d) {
  if (!d) return '';
  const p = [];
  for (const k in d) {
    const v = d[k];
    if (v && typeof v === 'object' && !Array.isArray(v) && ('o' in v || 'n' in v)) p.push(`${FIELD_LABEL[k] || k}: ${valText(k, v.o)} ← ${valText(k, v.n)}`);
    else if (k === 'fields' && Array.isArray(v)) p.push('الحقول: ' + v.map(x => FIELD_LABEL[x] || x).join('، '));
    else if (k === 'items' && Array.isArray(v)) p.push('الكتب: ' + v.map(i => `${i.l || bookLabel(i.b)} ${i.q}`).join('، '));
    else if (v !== null && v !== '' && v !== 0) p.push(`${AUD_L[k] || k}: ${short(v)}`);
  }
  return p.map(esc).join('<br>');
}
function ding() { try { navigator.vibrate && navigator.vibrate([300, 120, 300]); } catch (e) { } try { new Audio('ring.mp3').play().catch(() => { }); } catch (e) { } }

/* ---------- الدخول ---------- */
async function boot() {
  if (!sb) { app.innerHTML = '<div class="alert"><h3>القاعدة لسه مش متظبطة</h3>config.js فاضي.</div>'; return; }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  await loadMe();
}
async function loadMe() {
  try {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) return renderLogin();
    let { data, error } = await sb.from('staff').select('*').eq('user_id', user.id).maybeSingle();
    if (error) throw error;
    if (!data && !user.is_anonymous) { const r = await sb.rpc('claim_admin', { p_name: (gdb() || {}).rep || 'المالك' }); if (r.error) return renderLogin(errMsg(r.error)); data = r.data; }
    if (data && data.role === 'rep' && data.active && data.approved === false) return renderWait(data);
    if (!data || !data.active) return renderLogin(user.is_anonymous ? (data && !data.active ? 'الرقم ده اتقفل — كلّم المالك' : 'ادخل الرقم السري تاني') : 'الحساب ده مش مسموح له');
    me = data;
    $('#bellBtn').hidden = false; $('#outBtn').hidden = false; $('#tabs').hidden = false; $('#setTab').hidden = !isAdmin();
    await loadAll(); route();
    importGreen().then(ch => { if (ch) refresh(); }).catch(() => { });
    if (window.pushInitStaff) window.pushInitStaff(me).catch(() => { });
    setInterval(() => counts().catch(() => { }), 30000);
  } catch (e) { app.innerHTML = `<div class="alert">${esc(errMsg(e))}</div><button class="btn" onclick="boot()">حاول تاني</button>`; }
}
function renderWait(s) {
  me = null; $('#tabs').hidden = true; $('#bellBtn').hidden = true; $('#outBtn').hidden = true; setHeader('💬 المراسلات', false);
  app.innerHTML = `<div class="card" style="text-align:center;padding:24px"><div style="font-size:46px">⏳</div><h3>أهلًا ${esc(s.name || '')}</h3>
    <div>طلبك وصل للمالك — مستني الموافقة.</div><div class="small muted" style="margin:6px 0 14px">أول ما يوافق، دوس «جرّب تاني» وهيفتح معاك.</div>
    <button class="btn pri" id="wAgain" style="width:100%">🔄 جرّب تاني</button></div><a class="btn ghost" href="index.html">→ رجوع للبرنامج</a>`;
  $('#wAgain').onclick = () => loadMe();
}
function renderLogin(msg) {
  me = null; $('#tabs').hidden = true; $('#bellBtn').hidden = true; $('#outBtn').hidden = true; setHeader('💬 المراسلات 🔒', false);
  app.innerHTML = `${msg ? `<div class="alert">${esc(msg)}</div>` : ''}
  <div class="chips"><button class="chip on" data-lt="rep">🔑 مندوب</button><button class="chip" data-lt="admin">👑 المالك</button></div>
  <div class="card" id="lrep"><h3>ادخل الرقم السري بتاعك</h3>
    <input class="inp" id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" dir="ltr" placeholder="الرقم السري" style="font-size:22px;text-align:center;letter-spacing:3px">
    <div class="hint small muted">اكتبه زي ما وصلك بالظبط (حروف كابيتال وأرقام وعلامات). بيشتغل على موبايل واحد بس.</div>
    ${(gdb() || {}).rep ? `<div class="small" style="margin-top:6px">هتدخل باسم: <b>${esc(gdb().rep)}</b></div>` : ''}
    <button class="btn pri" id="goRep" style="width:100%;margin-top:10px">دخول</button></div>
  <div class="card" id="ladm" hidden><h3>دخول المالك</h3>
    <div class="field"><label>الإيميل</label><input id="em" type="email" autocomplete="username" dir="ltr"></div>
    <div class="field"><label>الباسورد</label><input id="pw" type="password" autocomplete="current-password" dir="ltr"></div>
    <button class="btn pri" id="goAdm" style="width:100%">دخول</button></div>
  <a class="btn ghost" href="index.html">→ رجوع للبرنامج</a>`;
  $$('[data-lt]').forEach(b => b.onclick = () => { $$('[data-lt]').forEach(x => x.classList.toggle('on', x === b)); $('#lrep').hidden = b.dataset.lt !== 'rep'; $('#ladm').hidden = b.dataset.lt === 'rep'; });
  $('#goRep').onclick = async () => {
    const code = $('#code').value.replace(/\s/g, '').toUpperCase(); if (code.length < 6) return toast('اكتب الرقم صح');
    const b = $('#goRep'); b.disabled = true;
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (session && !session.user.is_anonymous) await sb.auth.signOut();
      if (!session || !session.user.is_anonymous) { const r = await sb.auth.signInAnonymously(); if (r.error) throw r.error; }
      const { data: r, error } = await sb.rpc('claim_rep', { p_code: code, p_device: deviceId(), p_name: (gdb() || {}).rep || '' });
      if (error) throw error;
      // أول مرة: يبلّغ المالك إن فيه مندوب مستني موافقة
      if (r && !r.approved && window.pushToStaff) { const { data: ids } = await sb.rpc('owner_ids'); if (ids && ids.length) window.pushToStaff(ids, `👤 ${r.name} عايز يدخل المراسلات — وافق أو ارفض`, 'admin.html#/settings').catch(() => { }); }
      await loadMe();
    } catch (e) { b.disabled = false; toast(errMsg(e), 4000); }
  };
  $('#goAdm').onclick = async () => {
    const b = $('#goAdm'); b.disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
    if (error) { b.disabled = false; return toast(/Invalid login/i.test(error.message) ? 'الإيميل أو الباسورد غلط' : errMsg(error), 4000); }
    await loadMe();
  };
}
$('#outBtn').onclick = async () => {
  if (!confirm(me && me.role === 'rep' ? 'تخرج؟ هتحتاج الرقم السري تاني (على نفس الموبايل).' : 'تسجيل خروج؟')) return;
  await sb.auth.signOut(); me = null; renderLogin();
};
$('#backBtn').onclick = () => { if (history.length > 1) history.back(); else location.hash = '#/'; };

/* ---------- البيانات ---------- */
async function counts() {
  const { data } = await sb.rpc('bell_counts'); if (!data) return;
  const was = BC.msgs + BC.orders + BC.edits + (BC.reps || 0); BC = data;
  const n = BC.edits + BC.orders + BC.msgs + (BC.reps || 0); $('#bellCnt').hidden = !n; $('#bellCnt').textContent = n;
  const stt = $('#setTab'); if (stt) stt.innerHTML = `<span class="i">⚙️</span>الإعدادات${BC.reps ? `<span class="cnt">${BC.reps}</span>` : ''}`;
  if (n > was) ding();
  LS.set('selah-trial-bell', { n, at: Date.now() });   // البرنامج الأخضر بيقراه للجرس
}
async function loadAll() {
  const [t, n, p, s, u] = await Promise.all([
    fetchAll(() => sb.from('teachers').select('id,name,phone,rep_id,enabled,invite_code,profile,last_seen,created_at,local_id,books').order('name')),
    fetchAll(() => sb.from('teacher_notes').select('teacher_id,body')),
    fetchAll(() => sb.from('edit_requests').select('teacher_id').eq('status', 'pending')),
    isAdmin() ? fetchAll(() => sb.from('staff').select('id,name,role,active').order('created_at')) : Promise.resolve([me]),
    fetchAll(() => sb.from('messages').select('id,teacher_id,body,created_at').eq('from_teacher', true).is('read_at', null).order('id')),
    fetchAll(() => sb.from('orders').select('teacher_id').eq('status', 'pending')),
    fetchAll(() => sb.from('edit_requests').select('teacher_id').eq('status', 'approved')),
    fetchAll(() => sb.from('update_requests').select('teacher_id').eq('status', 'open'))
  ]).then(r => { ordersBy = {}; r[5].forEach(x => ordersBy[x.teacher_id] = (ordersBy[x.teacher_id] || 0) + 1);
    apprSet = new Set(r[6].map(x => x.teacher_id)); openUpd = new Set(r[7].map(x => x.teacher_id)); return r; });
  T = t; staffList = s; notesBy = {}; n.forEach(x => (notesBy[x.teacher_id] ||= []).push(x.body));
  pendSet = new Set(p.map(x => x.teacher_id)); unreadBy = {}; lastMsg = {};
  u.forEach(x => { unreadBy[x.teacher_id] = (unreadBy[x.teacher_id] || 0) + 1; lastMsg[x.teacher_id] = { b: x.body, id: x.id, at: x.created_at }; });
  await counts();
}
async function refresh() { try { await loadAll(); route(); } catch (e) { toast(errMsg(e)); } }

/* ---------- التوجيه ---------- */
function route() {
  if (!me) return;
  clearInterval(pollT); $('#cbar').innerHTML = '';
  const h = location.hash.slice(1) || '/';
  if (h.startsWith('/t/')) { setTab('list'); return viewTeacher(decodeURIComponent(h.slice(3))); }
  if (h.startsWith('/c/')) { setTab('list'); return viewChat(decodeURIComponent(h.slice(3))); }
  if (h === '/bell') { setTab('bell'); return viewBell(); }
  if (h === '/invite') { setTab('invite'); return viewInvite(); }
  if (h === '/settings' && isAdmin()) { setTab('settings'); return viewSettings(); }
  setTab('list'); viewList();
}
window.addEventListener('hashchange', () => { route(); scrollTo(0, 0); });

/* ---------- استيراد من البرنامج الأخضر ---------- */
// بيحصل لوحده مع كل فتح (لو البرنامج اتغيّر من آخر مرة) — من غير زرار
async function importGreen() {
  const db = gdb();
  if (!db || !(db.teachers || []).length) return false;
  const sig = me.id + '|' + (db.lastChange || '') + '|' + db.teachers.length;
  if (LS.get('selah-trial-isync') === sig && T.some(t => t.rep_id === me.id)) return false;
  const mine = new Map(T.filter(t => t.rep_id === me.id && t.local_id).map(t => [t.local_id, t]));
  const rows = db.teachers.filter(t => t && t.id && t.name).map(t => {
    const old = mine.get(t.id), prof = { ...(old ? old.profile : {}), ...gProfile(t) };
    return { rep_id: me.id, local_id: t.id, name: t.name, phone: t.phone || '', profile: prof, books: gBooks(db, t.id) };
  });
  for (let i = 0; i < rows.length; i += 300) {
    const { error } = await sb.from('teachers').upsert(rows.slice(i, i + 300), { onConflict: 'rep_id,local_id' });
    if (error) { console.warn(error); return false; }
  }
  if (isAdmin() && db.prices) {
    const items = Object.entries(db.prices).filter(([k, p]) => p && (p.post || p.pre)).map(([b, p]) => ({ b, l: bookLabel(b), pre: p.pre ?? null, post: p.post ?? null }));
    if (items.length) await sb.from('app_settings').upsert({ key: 'prices', value: { items, at: new Date().toISOString() } });
  }
  LS.set('selah-trial-isync', sig); return true;
}

/* ---------- قائمة المدرسين ---------- */
function filtered() {
  const q = norm(ui.q);
  // اللي بعتوا رسايل جديدة فوق (الأحدث الأول)
  // اللي عندهم رسايل أو طلبات جديدة فوق
  const rank = t => (lastMsg[t.id] || ordersBy[t.id] ? 1e12 : 0) + (lastMsg[t.id] ? lastMsg[t.id].id : 0) + (ordersBy[t.id] || 0);
  return T.filter(t => {
    if (ui.rep && t.rep_id !== ui.rep) return false;
    if (ui.filter === 'notes' && !notesBy[t.id]) return false;
    if (ui.filter === 'pend' && !pendSet.has(t.id)) return false;
    if (ui.filter === 'unread' && !unreadBy[t.id]) return false;
    if (ui.filter === 'new' && t.last_seen) return false;
    if (ui.filter === 'off' && t.enabled) return false;
    if (UPD_C[ui.filter] && updState(t) !== ui.filter) return false;
    if (!q) return true;
    const pr = t.profile || {};
    const hay = norm([t.name, t.phone, pr.area, pr.school, valText('subjects', pr.subjects), pr.address, UPD_C[updState(t)][1], ...(notesBy[t.id] || [])].join(' '));
    return q.split(/\s+/).every(w => hay.includes(w));
  }).sort((a, b) => rank(b) - rank(a));
}
function viewList() {
  setHeader(`المدرسين — ${me.name}`, false);

/* ---------- 🔔 التنبيه: صوت + إشعار. الإشعار بيقوله يحدّث إيه (لو فيه طلب تحديث)، وبعد 3 تنبيهات «الأستاذ … بينبّهك» ---------- */
async function ringTeachers(ids) {
  if (!ids.length) return;
  const { error } = await sb.from('messages').insert(ids.map(id => ({ teacher_id: id, from_teacher: false, kind: 'ring', body: '', sender: me.name })));
  if (error) return toast(errMsg(error));
  const { data: ups } = await sb.from('update_requests').select('teacher_id,fields').in('teacher_id', ids).eq('status', 'open');
  const need = {}; (ups || []).forEach(u => (need[u.teacher_id] ||= new Set()) && (u.fields || []).forEach(f => need[u.teacher_id].add(f)));
  const rc = LS.get('selah-trial-ringc', {}), now = Date.now(), groups = {};
  ids.forEach(id => {
    const c = rc[id] && now - rc[id].at < 2 * 3600e3 ? rc[id].n + 1 : 1; rc[id] = { n: c, at: now };
    const txt = c >= 3 ? `🔔 الأستاذ ${me.name} بينبّهك` : need[id] ? '📝 حدّث: ' + [...need[id]].map(k => FIELD_LABEL[k] || k).join('، ') : '🔔';
    (groups[txt] ||= []).push(id);
  });
  LS.set('selah-trial-ringc', rc);
  if (window.pushRingTeachers) for (const txt in groups) window.pushRingTeachers(groups[txt], txt).catch(() => { });
  toast(`🔔 اتنبّه ${ids.length} مدرس`);
}

/* ---------- المحادثة ---------- */
let chatMsgs = [], chatLast = 0;
let chatSel = null;   // وضع التحديد للمسح
function bubbleS(m, t) {
  if (m.kind === 'ring') return '';   // التنبيه مايظهرش في الشات عند المندوب
  const mine = !m.from_teacher, sel = chatSel && chatSel.has(m.id);
  return `<div class="bub ${mine ? 'me' : 'them'}" data-mid="${m.id}" style="${chatSel ? 'cursor:pointer;' : ''}${sel ? 'outline:3px solid #dc2626;' : ''}">${chatSel ? (sel ? '☑️ ' : '⬜ ') : ''}${esc(m.body)}<span class="tm">${fmtDate(m.created_at)}${mine ? (m.read_at ? ' <b style="color:#2563eb">✓✓</b>' : ' ✓') : ''}</span></div>`;
}
async function viewChat(id) {
  const t = T.find(x => x.id === id); if (!t) { location.hash = '#/'; return; }
  setHeader('💬 ' + t.name, true);
  chatSel = null;
  app.innerHTML = `<style>@keyframes ringy{0%,100%{transform:rotate(0)}20%{transform:rotate(-25deg)}40%{transform:rotate(25deg)}60%{transform:rotate(-15deg)}80%{transform:rotate(15deg)}}.ringing{animation:ringy .5s 3}</style>
    <div class="acts" style="margin:0 0 6px"><button class="btn sm owe" id="ring"><span id="ringI" style="display:inline-block">🔔</span> نبّه المدرس</button><a class="btn sm ghost" href="#/t/${t.id}">👤 ملفه</a>
    <button class="btn sm ghost" id="keep">📌 احفظ رسالة في سجله</button><button class="btn sm danger" id="delm">🗑️ مسح رسايل</button></div>
    <div id="delbar" hidden class="alert" style="padding:8px"><b>دوس على الرسايل اللي عايز تمسحها</b><div class="acts"><button class="btn sm danger" id="delgo">🗑️ امسح المحدد (0)</button><button class="btn sm ghost" id="delx">إلغاء</button></div></div>
    <div class="small muted" style="text-align:center">${t.last_seen ? 'آخر دخول ' + fmtDate(t.last_seen) : 'لسه ما فتحش البرنامج'}</div><div class="chat" id="chat"><div class="loading">…</div></div>`;
  $('#cbar').innerHTML = `<div class="chatbar"><div class="in"><textarea id="mt" placeholder="اكتب رسالتك…"></textarea><button class="btn pri" id="ms">إرسال</button></div></div>`;
  chatMsgs = []; chatLast = 0;
  const pull = async first => {
    const { data, error } = await sb.from('messages').select('*').eq('teacher_id', t.id).gt('id', first ? 0 : chatLast).order('id').limit(300);
    if (error || !$('#chat')) return;
    if (!first && data.some(m => m.from_teacher)) ding();
    chatMsgs = first ? data : chatMsgs.concat(data);
    if (chatMsgs.length) chatLast = chatMsgs[chatMsgs.length - 1].id;
    if (data.some(m => m.from_teacher && !m.read_at)) { await sb.from('messages').update({ read_at: new Date().toISOString() }).eq('teacher_id', t.id).eq('from_teacher', true).is('read_at', null); delete unreadBy[t.id]; delete lastMsg[t.id]; counts(); }
    if (!first) { const { data: rd } = await sb.from('messages').select('id,read_at').eq('teacher_id', t.id).eq('from_teacher', false).not('read_at', 'is', null).gt('id', Math.max(0, chatLast - 50)); (rd || []).forEach(r => { const m = chatMsgs.find(x => x.id === r.id); if (m) m.read_at = r.read_at; }); }
    if (!chatSel) $('#chat').innerHTML = chatMsgs.map(m => bubbleS(m, t)).join('') || '<div class="empty small">ابدأ المحادثة 👋</div>';
    if (first || data.some(m => m.kind !== 'ring')) scrollTo(0, document.body.scrollHeight);
  };
  const send = async (kind, body) => {
    const { error } = await sb.from('messages').insert({ teacher_id: t.id, from_teacher: false, kind, body, sender: me.name });
    if (error) return toast(errMsg(error));
    pull(false);
    if (window.pushToTeacher) window.pushToTeacher(t, kind === 'ring' ? `🔔 رُدّ على الأستاذ ${me.name}` : `💬 الأستاذ ${me.name}: ${body.slice(0, 80)}`, kind === 'ring').catch(() => { });
  };
  $('#ms').onclick = async () => { const v = $('#mt').value.trim(); if (!v) return; $('#mt').value = ''; await send('text', v); };
  $('#ring').onclick = async () => {
    const i = $('#ringI'); i.classList.remove('ringing'); void i.offsetWidth; i.classList.add('ringing');
    try { navigator.vibrate && navigator.vibrate([200, 80, 200]); } catch (e) { }
    await ringTeachers([t.id]); pull(false);
  };
  const redraw = () => { $('#chat').innerHTML = chatMsgs.map(m => bubbleS(m, t)).join('') || '<div class="empty small">ابدأ المحادثة 👋</div>'; if (chatSel) $('#delgo').textContent = `🗑️ امسح المحدد (${chatSel.size})`; };
  $('#delm').onclick = () => { chatSel = new Set(); $('#delbar').hidden = false; redraw(); };
  $('#delx').onclick = () => { chatSel = null; $('#delbar').hidden = true; redraw(); };
  $('#chat').onclick = e => { if (!chatSel) return; const b = e.target.closest('[data-mid]'); if (!b) return; const id = +b.dataset.mid; chatSel.has(id) ? chatSel.delete(id) : chatSel.add(id); redraw(); };
  $('#delgo').onclick = async () => {
    if (!chatSel || !chatSel.size) return toast('اختار رسالة الأول');
    if (!confirm(`هيتمسح ${chatSel.size} رسالة من عندك وعند المدرس. متأكد؟`)) return;
    const ids = [...chatSel]; const { error } = await sb.from('messages').delete().in('id', ids); if (error) return toast(errMsg(error));
    chatMsgs = chatMsgs.filter(m => !ids.includes(m.id)); chatSel = null; $('#delbar').hidden = true; redraw(); toast('اتمسحت ✅');
  };
  $('#keep').onclick = () => {
    const ms = chatMsgs.filter(m => m.kind === 'text').slice(-30);
    if (!ms.length) return toast('مفيش رسايل');
    modal(`<h3>📌 اختار الرسايل اللي تتحفظ في سجل المدرس</h3><div id="kl">${ms.map(m => `<label class="kv" style="justify-content:flex-start;gap:8px"><input type="checkbox" value="${m.id}"><span style="flex:1">${m.from_teacher ? '👨‍🏫' : '🧑‍💼'} ${esc(m.body)}<br><span class="small muted">${fmtDate(m.created_at)}</span></span></label>`).join('')}</div>
      <div class="acts"><button class="btn pri" id="ks">حفظ</button><button class="btn ghost" data-close>إلغاء</button></div>`, (box, close) => {
      $('#ks', box).onclick = async () => {
        const ids = $$('input:checked', box).map(i => +i.value); if (!ids.length) return close();
        const rows = ms.filter(m => ids.includes(m.id)).map(m => ({ teacher_id: t.id, kind: 'msg', body: m.body, sender: m.from_teacher ? t.name : me.name, msg_at: m.created_at }));
        const { error } = await sb.from('teacher_notes').insert(rows); if (error) return toast(errMsg(error));
        rows.forEach(r => (notesBy[t.id] ||= []).push(r.body)); close(); toast('📌 اتحفظت في سجله');
      };
    });
  };
  await pull(true); pollT = setInterval(() => pull(false), 8000);
}

/* ---------- صفحة المدرس ---------- */
async function viewTeacher(id) {
  setHeader('ملف المدرس', true); app.innerHTML = '<div class="loading">جاري التحميل…</div>';
  const [tR, nR, aR, eR, uR, oR] = await Promise.all([
    sb.from('teachers').select('*').eq('id', id).maybeSingle(),
    sb.from('teacher_notes').select('*').eq('teacher_id', id).order('created_at', { ascending: false }),
    sb.from('audit_log').select('*').eq('teacher_id', id).order('created_at', { ascending: false }).limit(100),
    sb.from('edit_requests').select('*').eq('teacher_id', id).in('status', ['pending', 'question']).order('created_at'),
    sb.from('update_requests').select('*').eq('teacher_id', id).eq('status', 'open').order('created_at', { ascending: false }),
    sb.from('orders').select('*').eq('teacher_id', id).eq('status', 'pending').order('created_at')

function bindReviews(root) {
  root.addEventListener('change', e => { const c = e.target.closest('[data-ph]'); if (c) c.parentNode.classList.toggle('on', c.checked); });
  root.addEventListener('click', async e => {
    const qb = e.target.closest('.qty [data-d]'); if (qb) { const n = $('b', qb.parentNode); n.textContent = Math.max(0, +n.textContent + +qb.dataset.d); return; }
    const ob = e.target.closest('[data-oact]');
    if (ob) {
      const card = ob.closest('[data-ord]'), o = ORDS[card.dataset.ord], a = ob.dataset.oact, t = o.teachers || {};
      const items = $$('[data-b]', card).map(r => { const i = o.items.find(x => x.b === r.dataset.b) || {}; return { ...i, q: +$('b', r).textContent }; });
      if (a === 'ask') { location.hash = '#/c/' + o.teacher_id; return; }
      let reason = null;
      if (a === 'reject') { reason = await ask('❌ سبب الرفض (المدرس هيشوفه)'); if (reason === null) return; }
      $$('button', card).forEach(x => x.disabled = true);
      const { error } = await sb.from('orders').update({ status: a === 'approve' ? 'approved' : 'rejected', items, reason, decided_at: new Date().toISOString() }).eq('id', o.id);
      if (error) { $$('button', card).forEach(x => x.disabled = false); return toast(errMsg(error)); }
      let msg = 'تمام ✅';
      if (a === 'approve') {
        // طلب جديد ← الكتب كلها. تعديل كمية ← الزيادة بس تبقى طلب مستني، والنقص بتعدّله بإيدك
        const add = o.kind === 'order' ? items : items.map(i => ({ ...i, q: i.q - (i.was || 0) })).filter(i => i.q > 0);
        const less = o.kind === 'edit' ? items.filter(i => i.q < (i.was || 0)) : [];
        const ok = add.length ? gOrder(t.local_id, add) : true;
        msg = ok ? `📥 اتنقل «طلب مستني» في البيع${less.length ? ` — وفيه ${less.length} كتاب قلّت كميته: عدّله في البيع بإيدك` : ''}` : '✅ اتوافق — سجّله في البيع بإيدك (المدرس مش في البرنامج على الموبايل ده)';
      }
      if (window.pushToTeacher) window.pushToTeacher({ id: o.teacher_id }, a === 'approve' ? '✅ طلب الكتب بتاعك اتوافق عليه' : '❌ طلب الكتب اترفض', false).catch(() => { });
      card.remove(); toast(msg, 4500); counts();
      return;
    }
    const b = e.target.closest('[data-act]'); if (!b) return;
    const card = b.closest('[data-req]'), r = REQS[card.dataset.req], act = b.dataset.act;
    const keep = $$('[data-ph]:checked', card).map(c => c.dataset.ph);
    const photos = (r.photos || []).filter(p => keep.includes(p.id));
    // الصور اللي اتعلّمت تتحفظ على درايف المالك (فولدر «صور المدرسين/<الاسم>»)، وبعد القرار بتتمسح من القاعدة لوحدها
    const savePhotos = () => {
      if (!photos.length) return;
      const nm = (r.teachers && r.teachers.name || 'مدرس').replace(/[\\/:*?"<>|]/g, ''), C = window.SILAH_CONFIG || {};
      const dl = () => photos.forEach((p, i) => downloadDataUrl(p.d, `${nm}-${new Date().toISOString().slice(0, 10)}-${i + 1}.jpg`));
      if (!C.CLOUD_URL || !navigator.onLine) return dl();
      fetch(C.CLOUD_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ k: 'tphoto', tid: r.teacher_id, name: nm, photos: photos.map(p => p.d) }) })
        .then(() => toast(`☁️ ${photos.length} صورة اتحفظت على الدرايف`, 3000)).catch(dl);
    };
    const send = async (action, final, reason) => {
      $$('button', card).forEach(x => x.disabled = true);
      const { error } = await sb.rpc('review_edit', { p_id: r.id, p_action: action, p_final: final || null, p_reason: reason || null });
      if (error) { $$('button', card).forEach(x => x.disabled = false); return toast(errMsg(error), 4000); }
      if (action === 'approve' || action === 'edit') { const done = gApply((r.teachers || {}).local_id || (T.find(x => x.id === r.teacher_id) || {}).local_id, final || r.new_values); if (done) toast('✅ واتكتب في البرنامج كمان', 3000); }
      if (window.pushToTeacher) window.pushToTeacher({ id: r.teacher_id }, action === 'reject' ? '❌ تعديل ملفك اترفض' : action === 'question' ? '❓ المندوب عنده سؤال على تعديلك' : '✅ تعديل ملفك اتوافق عليه', false).catch(() => { });
      card.remove(); loadAll().then(() => { if (!location.hash.startsWith('#/bell')) route(); });
    };
    if (act === 'approve') {
      if ((r.photos || []).length && !confirm(`${photos.length} صورة هتتحفظ على الدرايف و${r.photos.length - photos.length} هتتمسح. موافق؟`)) return;
      savePhotos(); send('approve');
    } else if (act === 'edit') {
      const st = {}, keys = Object.keys(r.new_values || {});
      if (!keys.length) { savePhotos(); return send('approve'); }
      const base = { ...(T.find(x => x.id === r.teacher_id) || {}).profile, ...r.new_values };
      modal(`<h3>✏️ عدّل قبل الموافقة</h3><div class="small muted" style="margin-bottom:8px">المدرس هيشوف اللي إنت غيّرته.</div>
        <form id="ef" onsubmit="return false">${profileForm(base, { only: keys })}</form>
        <div class="acts"><button class="btn ok" id="es">✅ وافق بالتعديل</button><button class="btn ghost" data-close>إلغاء</button></div>`, (box, close) => {
        const f = $('#ef', box); bindProfileForm(f, st);
        $('#es', box).onclick = () => {
          const v = readProfileForm(f, st), fin = {};
          keys.forEach(k => { fin[k] = k === 'avatar' ? (st.avatar || r.new_values.avatar) : k === 'loc' ? (st.loc || r.new_values.loc) : v[k]; });
          close(); savePhotos(); send('edit', fin);
        };
      });
    } else if (act === 'reject') {
      const why = await ask('❌ سبب الرفض (المدرس هيشوفه)', { ph: 'مثلاً: الرقم ناقص' }); if (why === null) return;
      send('reject', null, why);
    } else if (act === 'question') {
      const q = await ask('❓ اكتب سؤالك للمدرس', { ph: 'مثلاً: السنتر ده في أنهي شارع؟' }); if (!q) return;
      send('question', null, q);
    }
  });
}

/* ---------- إعدادات المالك ---------- */
function meter(pct) { const c = pct > 90 ? 'r' : pct > 75 ? 'y' : ''; return `<div class="meter"><i class="${c}" style="width:${Math.min(100, pct).toFixed(1)}%"></i></div>`; }
function dot(pct) { return pct > 90 ? '🔴' : pct > 75 ? '🟡' : '🟢'; }
async function viewSettings() {
  setHeader('⚙️ إعدادات المالك', false); app.innerHTML = '<div class="loading">جاري التحميل…</div>';
  const { data, error } = await sb.rpc('usage_stats');
  if (error) { app.innerHTML = `<div class="alert">${esc(errMsg(error))}</div>`; return; }
  const lim = +(data.settings.db_limit_mb || 500), quota = +(data.settings.rep_quota_mb || 100), pr = data.settings.prices;
  const { data: sx } = await sb.from('staff').select('id,approved,device_id,claimed_at');
  const SX = Object.fromEntries((sx || []).map(x => [x.id, x]));
  const waitReps = data.staff.filter(s => s.role === 'rep' && s.active && SX[s.id] && SX[s.id].device_id && SX[s.id].approved === false).map(s => ({ ...s, ...SX[s.id] }));
  const dbPct = data.db_bytes / (lim * MB) * 100;
  app.innerHTML = `<div class="card"><h3>${dot(dbPct)} مساحة القاعدة</h3>${(data.db_bytes / MB).toFixed(1)} من ${lim} ميجا (${dbPct.toFixed(1)}%)${meter(dbPct)}</div>
  <div class="card"><h3>💲 قايمة الأسعار عند المدرسين</h3><div class="small muted">${pr && pr.items ? `${pr.items.length} كتاب — آخر تحديث ${fmtDate(pr.at)}` : 'لسه ما اترفعتش'}</div>
    <button class="btn sm" id="upPr" style="margin-top:8px">⬆️ ارفع الأسعار من البرنامج</button></div>
  ${waitReps.length ? `<div class="card" style="border:2px solid #f59e0b"><h3>👤 مناديب مستنيين موافقتك (${waitReps.length})</h3>
    ${waitReps.map(s => `<div class="kv" data-s="${s.id}"><span><b>${esc(s.name || 'مندوب')}</b><br><span class="small muted">دخل ${fmtDate(s.claimed_at)} · الرقم <span dir="ltr">${esc(s.rep_code || '')}</span></span></span>
      <span class="acts" style="margin:0"><button class="btn sm ok" data-a="ok">✅ موافق</button><button class="btn sm danger" data-a="no">❌ مش موافق</button></span></div>`).join('')}</div>` : ''}
  <div class="card"><div style="display:flex;align-items:center"><h3 style="flex:1">🔑 أرقام المناديب</h3><button class="btn pri" id="newRep">➕ رقم جديد</button></div>
    <div class="small muted" style="margin-bottom:6px">اعمل رقم وابعته للمندوب. لما يدخله هيجيلك تطلب الموافقة. كل رقم لمندوب واحد وموبايل واحد.</div>
    ${data.staff.map(s => { const x = SX[s.id] || {}, pct = s.bytes / (quota * MB) * 100; const st = s.role === 'admin' ? '<span class="pill ok">👑 المالك</span>' : !x.device_id ? '<span class="pill owe">لسه ما استخدمش الرقم</span>' : !s.active ? '<span class="pill bad">🔴 مقفول</span>' : x.approved === false ? '<span class="pill owe">⏳ مستني موافقتك</span>' : '<span class="pill ok">🟢 شغّال</span>';
      return `<div class="kv" style="display:block;padding:10px 0" data-s="${s.id}">
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><b>${esc(s.name || 'رقم جديد')}</b>${st}${s.role === 'rep' ? `<code dir="ltr" style="font-size:16px;font-weight:800;background:var(--line,#eee);border-radius:6px;padding:1px 8px">${esc(s.rep_code || '')}</code>` : ''}</div>
      <div class="small muted">${s.teachers} مدرس · ${(s.bytes / 1024).toFixed(0)} ك.ب ${dot(pct)}</div>
      ${s.role === 'rep' ? `<div class="acts"><button class="btn sm" data-a="copy">📋 انسخ</button><button class="btn sm ok" data-a="wa">واتساب</button>
        ${x.device_id && x.approved !== false ? `<button class="btn sm ${s.active ? 'danger' : 'ok'}" data-a="toggle">${s.active ? '🔴 اقفله' : '🟢 شغّله'}</button>` : ''}
        <details style="display:inline-block"><summary class="btn sm ghost" style="list-style:none">⋮</summary><button class="btn sm ghost" data-a="unlink" style="margin-top:6px">📱 غيّر الموبايل</button></details></div>` : ''}</div>`; }).join('')}</div>
  <div class="card"><h3>حدود المساحة</h3><div class="row2"><div class="field"><label>حد القاعدة (ميجا)</label><input id="lim" type="number" value="${lim}"></div>
    <div class="field"><label>نصيب المندوب (ميجا)</label><input id="quo" type="number" value="${quota}"></div></div><button class="btn sm" id="saveLim">حفظ</button></div>`;
  const appUrl = location.href.split('#')[0].replace(/admin\.html.*$/, '');
  const repMsg = s => `رقمك السري في «المراسلات» في برنامج سلاح التلميذ:\n${s.rep_code}\n\nافتح البرنامج: ${appUrl}\nواضغط «📬 الرسائل» ← «💬 المراسلات» واكتب الرقم زي ما هو بالظبط. (بيشتغل على موبايل واحد بس)`;
  $('#upPr').onclick = async () => {
    const db = gdb(); if (!db || !db.prices) return toast('مفيش أسعار في البرنامج على الموبايل ده');
    const items = Object.entries(db.prices).filter(([k, p]) => p && (p.post || p.pre)).map(([b, p]) => ({ b, l: bookLabel(b), pre: p.pre ?? null, post: p.post ?? null }));
    const { error: e } = await sb.from('app_settings').upsert({ key: 'prices', value: { items, at: new Date().toISOString() } }); if (e) return toast(errMsg(e));
    toast(`✅ اترفع ${items.length} سعر`); viewSettings();
  };
  $('#newRep').onclick = async () => {
    const { data: code, error: e } = await sb.rpc('admin_create_rep', { p_name: '' }); if (e) return toast(errMsg(e));
    await loadAll(); viewSettings();
    modal(`<h3>✅ رقم سري جديد</h3><div style="font-size:30px;text-align:center;letter-spacing:3px;font-weight:800;background:#f1f5f9;color:#0f172a;border-radius:12px;padding:10px" dir="ltr">${esc(code)}</div>
      <div class="small muted" style="margin:8px 0">ابعته للمندوب. لما يكتبه هيجيلك تطلب الموافقة باسمه.</div>
      <div class="acts"><button class="btn" id="c1">📋 انسخ الرسالة</button><a class="btn ok" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(repMsg({ rep_code: code }))}">ابعته واتساب</a><button class="btn ghost" data-close>قفل</button></div>`,
      box => { $('#c1', box).onclick = () => copyText(repMsg({ rep_code: code })); });
  };
  $$('[data-s] [data-a]').forEach(b => b.onclick = async () => {
    const s = data.staff.find(x => x.id === b.closest('[data-s]').dataset.s), a = b.dataset.a; let r;
    if (a === 'copy') return copyText(s.rep_code);
    if (a === 'wa') return window.open('https://wa.me/?text=' + encodeURIComponent(repMsg(s)), '_blank');
    if (a === 'ok') r = await sb.rpc('admin_approve_rep', { p_id: s.id, p_ok: true });
    if (a === 'no') { if (!confirm(`رفض ${s.name}؟ الرقم ده هيتقفل.`)) return; r = await sb.rpc('admin_approve_rep', { p_id: s.id, p_ok: false }); }
    if (a === 'unlink') { if (!confirm(`${s.name} غيّر موبايله؟ الرقم هيشتغل على أول موبايل يتكتب عليه بعد كده.`)) return; r = await sb.rpc('admin_reset_rep', { p_id: s.id, p_new_code: false }); }
    if (a === 'toggle') { if (s.active && !confirm(`تقفل البرنامج عند ${s.name}؟`)) return; r = await sb.from('staff').update({ active: !s.active }).eq('id', s.id); }
    if (a === 'ok' && !(r && r.error) && window.pushToStaff) window.pushToStaff([s.id], '✅ المالك وافق — افتح المراسلات', 'admin.html').catch(() => { });
    if (r && r.error) return toast(errMsg(r.error));
    await loadAll(); viewSettings(); toast('تمام ✅');
  });
  $('#saveLim').onclick = async () => {
    const { error: e } = await sb.from('app_settings').upsert([{ key: 'db_limit_mb', value: +$('#lim').value || 500 }, { key: 'rep_quota_mb', value: +$('#quo').value || 100 }]);
    if (e) return toast(errMsg(e)); viewSettings(); toast('اتحفظ ✅');
  };
}

boot();
</script>
<script src="push.js"></script>
</body>
</html>
