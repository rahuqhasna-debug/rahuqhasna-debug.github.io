.tcard .tck{width:22px;height:22px;flex:none;margin:0}
.bdg.r{background:#e11d48}
.selrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.selrow .cnt{font-weight:700;font-size:14px}
.irow{display:flex!important;align-items:center;gap:8px;cursor:pointer;flex-wrap:wrap}
.irow .grow{flex:1;min-width:150px}
.rgrp .rq{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}

header.top h1{font-size:17px}
header.top .in{gap:4px;padding-inline:10px}
.chatbar{bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom))}

.backfab[hidden],body:has(.selbar) .backfab{display:none}
.chatbar .in{padding-inline-end:100px}
.chatbar #ms{order:-1;padding-inline:10px}
.selbar{bottom:calc(10px + env(safe-area-inset-bottom))}
.chat{padding-bottom:130px}
.search.big input{font-size:18px;padding:14px}
.search.big .btn{flex:none;padding-inline:14px}
.lacts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 10px}
.lacts .btn{padding:9px 2px;font-size:13.5px;text-align:center;white-space:nowrap}
#tl.selm{padding-bottom:130px}
.avb{display:inline-flex;flex:none;cursor:pointer;border-radius:50%}
.chead{position:sticky;top:var(--hh,56px);z-index:15;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.chead .r1{display:flex;align-items:center;gap:8px}
.chead .who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:inherit;font-family:inherit;text-align:start;cursor:pointer}
.chead .who span.tx{flex:1;min-width:0}
.chead .who b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .who small{display:block;font-size:12.5px;color:var(--muted)}
.chead .icos2{display:flex;justify-content:space-around;gap:6px;margin-top:8px}
.chead .icos2 .tic{width:44px;height:44px;font-size:21px;cursor:pointer}
.chead .r1 .tic{cursor:pointer;width:42px;height:42px;font-size:20px}
#nrbar{background:#fef3c7;color:#92400e;border:1px solid #f59e0b;border-radius:12px;padding:8px 10px;margin-top:8px;gap:8px;align-items:center;flex-wrap:wrap}
