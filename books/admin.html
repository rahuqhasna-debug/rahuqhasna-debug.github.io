const ui = { q: '', filter: 'all', rep: '', selMode: false, sel: new Set(), shown: 200, bellTab: 'msgs', invQ: '', invSel: new Set(), invK: 'inv', retAll: false };

/* ---------- البرنامج الأخضر (نفس الموقع = نفس localStorage) ---------- */
function gdb() { try { return JSON.parse(localStorage.getItem(GKEY) || 'null'); } catch (e) { return null; } }
function gsave(db) { db.lastChange = new Date().toISOString(); localStorage.setItem(GKEY, JSON.stringify(db)); }
function gBooks(db, tid) {
  const m = {};
  for (const s of db.sales || []) if (s.t === tid) for (const it of s.items || []) m[it.b] = (m[it.b] || 0) + (+it.q || 0);
  return Object.entries(m).filter(([, q]) => q > 0).map(([b, q]) => ({ b, l: bookLabel(b), q }));
}
function gProfile(t) {
  return { name: t.name || '', phone: t.phone || '', stage: t.stage || '', subjects: (t.subjects || []).filter(x => x !== 'kash').slice(0, 2), spec: t.spec || '',
    area: t.area || '', school: t.school || '', grades: (t.tGrades && t.tGrades.length ? t.tGrades : (t.grades || []).filter(g => g >= 1 && g <= 6)), where: t.where || '', students: t.students || '',
    ...(t.tAddress ? { address: t.tAddress } : {}), ...(t.tLoc ? { loc: t.tLoc } : {}), ...(t.tDays ? { days: t.tDays } : {}) };
}
function gApply(localId, fin) {   // الموافقة تتكتب في البرنامج الأخضر كمان
  const db = gdb(); if (!db || !localId) return false;
  const t = (db.teachers || []).find(x => x.id === localId); if (!t) return false;
  const map = { name: 'name', phone: 'phone', stage: 'stage', spec: 'spec', area: 'area', school: 'school', where: 'where', students: 'students', address: 'tAddress', loc: 'tLoc', days: 'tDays' };
  const lines = [];
  for (const k in fin) {
    if (k === 'avatar') { if (typeof fin.avatar === 'string' && fin.avatar.startsWith('data:image/')) { gPhoto(t.id, fin.avatar); lines.push('📷 الصورة الشخصية اتحدّثت'); } continue; }
    if (k === 'subjects') { const keep = (t.subjects || []).includes('kash') ? ['kash'] : []; t.subjects = [...new Set([...fin.subjects, ...keep])]; t.subjectText = ''; }
    else if (k === 'grades') { t.grades = (fin.grades || []).filter(g => g <= 6); t.tGrades = fin.grades; }
    else if (map[k]) t[map[k]] = fin[k];
    // متابعة 10: موقع المدرس الجديد يظهر على خريطة البرنامج على طول
    if (k === 'loc' && fin.loc && fin.loc.lat && fin.loc.lng) t.loc = { lat: +fin.loc.lat, lng: +fin.loc.lng };
    lines.push(`${FIELD_LABEL[k] || k}: ${valText(k, fin[k])}`);
  }
  (db.tlog ||= []).push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), t: t.id, at: new Date().toISOString(), k: 'تحديث من المدرس (المراسلات)', txt: lines.join(' • ') });
  gsave(db); return true;
}
// صورة المدرس اللي اتوافق عليها ← صور البرنامج الأخضر (IndexedDB «selah-photos» store «p» + t.thumb/t.phN) — أول صورة = اللي بتظهر في الدايرة
function gThumb(src) { return new Promise(res => { const im = new Image(); im.onload = () => { const s = Math.min(1, 72 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.6)); }; im.onerror = () => res(''); im.src = src; }); }
async function gPhoto(localId, img) {
  try {
    if (!window.indexedDB) return;
    const d = await new Promise((res, rej) => { const r = indexedDB.open('selah-photos', 1); r.onupgradeneeded = () => r.result.createObjectStore('p'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    const io = (mode, fn) => new Promise((res, rej) => { const tx = d.transaction('p', mode), r = fn(tx.objectStore('p')); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); });
    const arr = ((await io('readonly', s => s.get(localId))) || []).filter(x => x !== img);
    arr.unshift(img); if (arr.length > 6) arr.length = 6;
    await io('readwrite', s => s.put(arr, localId));
    const th = await gThumb(img), db = gdb(), t = db && (db.teachers || []).find(x => x.id === localId);
    if (t) { t.thumb = th; t.phN = arr.length; delete t.noAv; gsave(db); }
  } catch (e) { console.warn('gPhoto', e); }
}
// طلب بيع واحد بس لكل مدرس (طلب شريف 2026-11-12): آخر طلب هو اللي يتعتمد ويحل محل اللي قبله
function gOne(db, localId, its, why) {
  const olds = (db.sales || []).filter(s => s.t === localId && s.st === 'order').sort((a, b) => (b.d || '').localeCompare(a.d || ''));
  if (!olds.length) return false;
  const s = olds[0], was = s.items.map(i => `${bookLabel(i.b)} ${i.q}`).join('، ');
  s.items = its.map(i => { const o = s.items.find(x => x.b === i.b); return o ? { ...o, q: i.q } : { b: i.b, q: i.q }; });
  s.oq = Object.fromEntries(its.map(i => [i.b, i.q])); s.d = new Date().toISOString();
  if (olds.length > 1) db.sales = db.sales.filter(x => !olds.slice(1).includes(x));
  (db.tlog ||= []).push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), t: localId, at: s.d, k: why, txt: `كان: ${was} ← بقى: ${its.map(i => `${bookLabel(i.b)} ${i.q}`).join('، ')}` });
  return true;
}
// تنظيف: المدرس اللي عنده أكتر من طلب مستني في البيع ← يفضل طلب واحد (الأحدث)
function gMergeAll() {
  const db = gdb(); if (!db) return 0; let n = 0;
  const by = {}; for (const s of db.sales || []) if (s.st === 'order' && s.t) (by[s.t] ||= []).push(s);
  for (const tid in by) if (by[tid].length > 1) { const nw = by[tid].sort((a, b) => (b.d || '').localeCompare(a.d || ''))[0]; if (gOne(db, tid, nw.items.filter(i => i.q > 0).map(i => ({ b: i.b, q: i.q })), 'اتجمعت طلباته في طلب واحد (الأحدث)')) n++; }
  if (n) gsave(db); return n;
}
function gOrder(localId, items, mode = 'replace') {   // طلب كتب اتوافق عليه ← «طلب مستني» في البيع (ولو فيه طلب قبله، بيتعدّل هو)
  const db = gdb(); if (!db || !localId || !(db.teachers || []).some(x => x.id === localId)) return false;
  const its = items.filter(i => i.q > 0).map(i => ({ b: i.b, q: i.q }));
  if (mode === 'add') { const s = (db.sales || []).filter(x => x.t === localId && x.st === 'order').sort((a, b) => (b.d || '').localeCompare(a.d || ''))[0];
    if (s) { const all = s.items.map(i => ({ b: i.b, q: i.q })); for (const i of its) { const o = all.find(x => x.b === i.b); if (o) o.q += i.q; else all.push({ ...i }); } its.length = 0; its.push(...all); } }
  if (gOne(db, localId, its, mode === 'add' ? 'زيادة من المدرس اتضافت على طلبه' : 'آخر طلب من المدرس حل محل اللي قبله')) { gsave(db); return 'merged'; }
  (db.sales ||= []).push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), t: localId, st: 'order', d: new Date().toISOString(), items: its, oq: Object.fromEntries(its.map(i => [i.b, i.q])), rep: db.rep, from: 'teacher-app' });
  gsave(db); return true;
}

/* ---------- أدوات ---------- */
function ask(title, { ph = '', val = '', multi = true, okTxt = 'تمام' } = {}) {
  return new Promise(res => {
    let done = false;
    const m = modal(`<h3>${esc(title)}</h3>${multi ? `<textarea id="askv" placeholder="${esc(ph)}">${esc(val)}</textarea>` : `<input class="inp" id="askv" placeholder="${esc(ph)}" value="${esc(val)}">`}
      <div class="acts"><button class="btn pri" id="askok">${okTxt}</button><button class="btn ghost" data-close>إلغاء</button></div>`,
      (box, close) => { $('#askv', box).focus(); $('#askok', box).onclick = () => { done = true; const v = $('#askv', box).value.trim(); close(); res(v); }; });
    const ob = new MutationObserver(() => { if (!document.body.contains(m)) { ob.disconnect(); if (!done) res(null); } });
    ob.observe(document.body, { childList: true });
  });
}
function norm(s) { return String(s || '').toLowerCase().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[ً-ْ]/g, ''); }
// زرار الرجوع ظاهر في كل صفحة (في قايمة المدرسين بيرجّع للبرنامج)
function setHeader(t, back) { $('#title').textContent = t; $('#backBtn').hidden = false; }
function setTab(t) { $$('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === t)); }
function repName(id) { const s = staffList.find(x => x.id === id); return s ? s.name : '—'; }
function inviteLink(t) {
  const c = getCfg(), base = location.href.split('#')[0].replace(/admin\.html.*$/, '');
  return base + 'teacher.html#c=' + t.invite_code + (c.custom ? '&p=' + encodeCfg(c.url, c.key) : '');
}
const INV_DEF = 'أهلًا أ/ {الاسم} 👋\nده رابط ملفك في «سلاح التلميذ»، افتحه وثبّته على موبايلك وكمّل بياناتك:\n[رابط المدرس]';
const INV_APP = 'أهلًا أ/ {الاسم} 👋\nعشان توصلك رسايلنا ومواعيد استلام النسخ على طول، ثبّت تطبيق «سلاح التلميذ» على موبايلك من الرابط ده:\n[رابط المدرس]\nافتح الرابط ودوس «ثبّت» وبعدين فعّل الإشعارات 🙏';
// رسالتين: كل واحدة نصها محفوظ لوحده
const INV_KEYS = { inv: ['selah-trial-inv', INV_DEF, '✉️ رسالة الدعوة'], app: ['selah-trial-inv-app', INV_APP, '📲 رسالة التثبيت'] };
function inviteMsg(t, tpl) { tpl = tpl || LS.get('selah-trial-inv') || INV_DEF; if (!tpl.includes('[رابط المدرس]')) tpl += '\n[رابط المدرس]'; return tpl.replace(/(أ\/\s*)?\{الاسم\}/g, 'أ/ ' + t.name).replace(/\[رابط المدرس\]/g, inviteLink(t)); }
// حالة تحديث بيانات المدرس: full = حدّث كله واتوافق، part = حدّث جزء، none = ماحدّثش خالص
let apprSet = new Set(), openUpd = new Set();
const UPD_KEYS = ['address', 'loc', 'days'];
function updState(t) {
  const pr = t.profile || {}, has = k => { const v = pr[k]; return v && (typeof v !== 'object' || Object.keys(v).length); };
  if (!apprSet.has(t.id) && !pendSet.has(t.id)) return 'none';
  return apprSet.has(t.id) && UPD_KEYS.every(has) && !openUpd.has(t.id) && !pendSet.has(t.id) ? 'full' : 'part';
}
const UPD_C = { full: ['#16a34a', '🟢 حدّث كله'], part: ['#f59e0b', '🟠 باقيله جزء'], none: ['#94a3b8', '⚪ ماحدّثش'] };
const tB = id => badgesHtml(unreadBy[id] || 0, pendSet.has(id) ? 1 : 0, ordersBy[id] || 0) + (retsBy[id] ? `<span class="bdg r" title="عنده مرتجع ما استلمتهوش">↩️ ${retsBy[id]}</span>` : '');   // علامات المدرس جنب اسمه في أي مكان
// متابعة 10: الأربع زراير جنب اسم المدرس في كل مكان (📞 مكالمة · واتساب · 📨 المراسلات · 🔄 اطلب تحديث)
function icos4(t) {
  t = t && (T.find(x => x.id === t.id) || t); if (!t || !t.id) return '';
  return `<span class="icos">${t.phone ? `<a class="tic" data-ic href="tel:${esc(t.phone)}" title="اتصال">📞</a><a class="tic" data-ic target="_blank" rel="noopener" href="https://wa.me/${waPhone(t.phone)}" title="واتساب">${WA_ICON}</a>` : ''}<a class="tic" data-ic href="#/c/${t.id}" title="رسايل سلاح التلميذ">📨</a><button type="button" class="tic" data-ru="${t.id}" title="اطلب تحديث بيانات المدرس ده">🔄</button></span>`;
}
// 🔄 في أي مكان بيفتح طلب التحديث للمدرس ده بس (قبل أي حاجة تانية في الصفحة)
document.addEventListener('click', e => { const b = e.target.closest('[data-ru]'); if (!b) return; e.preventDefault(); e.stopPropagation(); reqUpdateDlg([b.dataset.ru]); }, true);
const instPill = t => t.app_at ? '<span class="pill ok" title="ثبّت التطبيق">📲 مثبّت</span>' : '<span class="pill new" title="لسه ما فتحش من التطبيق المتثبّت">🌐 مش مثبّت</span>';
// صور المدرسين للدايرة اللي بره: نسخة صغيرة 72px متخزنة على الموبايل، وبتتحدّث لوحدها لما المدرس يغيّر صورته
let AVC = LS.get('selah-trial-av') || {};
async function loadAvatars() {
  const rows = await fetchAll(() => sb.from('teachers').select('id,updated_at').not('avatar', 'is', null));
  const keep = {}, need = [];
  for (const r of rows) { const o = AVC[r.id]; if (o && o.k === r.updated_at) keep[r.id] = o; else need.push(r); }
  for (let i = 0; i < need.length; i += 20) {
    const part = need.slice(i, i + 20), { data } = await sb.from('teachers').select('id,avatar').in('id', part.map(x => x.id));
    for (const x of data || []) { const th = x.avatar ? await gThumb(x.avatar) : ''; if (th) keep[x.id] = { k: (part.find(p => p.id === x.id) || {}).updated_at, th }; }
  }
  const ch = JSON.stringify(Object.keys(keep).map(k => [k, keep[k].k])) !== JSON.stringify(Object.keys(AVC).map(k => [k, AVC[k].k]));
  AVC = keep; try { LS.set('selah-trial-av', keep); } catch (e) { }
  // المدرس اللي ملوش صورة في البرنامج الأخضر ياخد صورته من المراسلات (للدايرة)
  try { const db = gdb(); let n = 0; if (db) for (const x of T) { const a = keep[x.id], gt = a && x.local_id && (db.teachers || []).find(y => y.id === x.local_id); if (gt && !gt.thumb && !gt.noAv) { gt.thumb = a.th; n++; } } if (n) gsave(db); } catch (e) { }
  if (ch && me) route();
}
function avHtml(t, cls = '') {
  const src = t.avatar || (AVC[t.id] && AVC[t.id].th) || (t.id && T.find(x => x.id === t.id) && ((gInfo()[(T.find(x => x.id === t.id) || {}).local_id] || {}).th));
  return src ? `<img class="av ${cls}" src="${src}" alt="">` : `<span class="av ${cls}">${esc((t.name || '؟').trim()[0] || '👤')}</span>`;
}
async function fetchAll(make) {
  let out = [];
  for (let i = 0; ; i += 1000) { const { data, error } = await make().range(i, i + 999); if (error) throw error; out = out.concat(data); if (data.length < 1000) break; }
  return out;
}
const short = v => v === null || v === undefined || v === '' ? '—' : typeof v === 'string' ? (v.startsWith('data:') ? '(صورة)' : v) : typeof v === 'object' ? JSON.stringify(v) : String(v);
const AUD_L = { reason: 'السبب', q: 'السؤال', reply: 'رد المدرس', photos: 'صور', rep: 'المندوب', from: 'من', to: 'إلى', body: 'النص' };
function auditDetails(d) {
  if (!d) return '';
  const p = [];
  for (const k in d) {
    const v = d[k];
    if (v && typeof v === 'object' && !Array.isArray(v) && ('o' in v || 'n' in v)) p.push(`${FIELD_LABEL[k] || k}: ${valText(k, v.o)} ← ${valText(k, v.n)}`);
    else if (k === 'fields' && Array.isArray(v)) p.push('الحقول: ' + v.map(x => FIELD_LABEL[x] || x).join('، '));
    else if (k === 'items' && Array.isArray(v)) p.push('الكتب: ' + v.map(i => `${i.l || bookLabel(i.b)} ${i.q}`).join('، '));
    else if (v !== null && v !== '' && v !== 0) p.push(`${AUD_L[k] || k}: ${short(v)}`);
  }
  return p.map(esc).join('<br>');
}
// المالك والمناديب: إشعار عادي (اهتزاز بس) — نغمة الجرس للمدرسين بس
function ding() {
  try { navigator.vibrate && navigator.vibrate([300, 120, 300]); } catch (e) { }
  // نغمة «رسالة جديدة» قريبة من الواتساب (نغمتين سريعتين)
  try {
    const C = new (window.AudioContext || window.webkitAudioContext)();
    [[880, 0, .11], [1175, .13, .2]].forEach(([f, t0, d]) => { const o = C.createOscillator(), g = C.createGain(); o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(C.destination);
      g.gain.setValueAtTime(.0001, C.currentTime + t0); g.gain.exponentialRampToValueAtTime(.35, C.currentTime + t0 + .015); g.gain.exponentialRampToValueAtTime(.0001, C.currentTime + t0 + d);
      o.start(C.currentTime + t0); o.stop(C.currentTime + t0 + d + .02); });
    setTimeout(() => C.close(), 1000);
  } catch (e) { }
}

/* ---------- متابعة 7: فواتير المدرس + المرتجعات + التسليم المجاني ← نسخة عند المدرس (جدول ledger) ----------
   فاتورة بيع (sale) = كل بيع st:'sold' · مرتجع (ret) = payments k:'ret' متجمّعة بـ g · تسليم مجاني (free) = entries s:'d' متجمّعة بالتاريخ.
   مرتجع المدرس اللي اتوافق عليه ليه صف 'rq:<id>' (بيتكتب وقت الموافقة) والمرتجع اللي في البرنامج بعد تنفيذه (فيه rid) بيتخطّى عشان مايتكررش. */
async function syncLedger(db) {
  const mine = {}; (await fetchAll(() => sb.from('teachers').select('id,local_id').eq('rep_id', me.id))).forEach(x => { if (x.local_id) mine[x.local_id] = x.id; });
  const S = Object.fromEntries((db.sales || []).map(s => [s.id, s])), rows = [];
  for (const s of db.sales || []) {
    if (s.st !== 'sold' || !mine[s.t]) continue;
    const its = (s.items || []).filter(i => i.q > 0).map(i => ({ b: i.b, l: bookLabel(i.b), q: +i.q, pre: i.pre ?? null, post: i.post ?? null }));
    if (its.length) rows.push({ teacher_id: mine[s.t], ref: 's:' + s.id, kind: 'sale', at: s.sd || s.d || new Date().toISOString(), items: its, total: its.reduce((a, i) => a + (i.post != null ? i.q * i.post : 0), 0) });
  }
  const rg = {};
  for (const p of db.payments || []) {
    if (p.k !== 'ret' || !mine[p.t] || p.rid) continue;
    let v = 0; for (const pt of p.parts || []) { const it = S[pt.sale] && S[pt.sale].items[pt.i]; if (it && it.post != null) v += pt.q * it.post; }
    const g = rg[p.g || p.id] ||= { t: p.t, at: p.d, items: [], total: 0 };
    g.items.push({ b: p.b, l: bookLabel(p.b), q: +p.q, post: p.q ? v / p.q : null }); g.total += v;
  }
  for (const k in rg) rows.push({ teacher_id: mine[rg[k].t], ref: 'r:' + k, kind: 'ret', at: rg[k].at || new Date().toISOString(), items: rg[k].items, total: rg[k].total });
  const fg = {};
  for (const e of db.entries || []) {
    if (e.s !== 'd' || !mine[e.t] || !e.dd) continue;
    const g = fg[e.t + ':' + e.dd] ||= { t: e.t, at: e.dd, m: {} }; g.m[e.b] = (g.m[e.b] || 0) + (+e.q || 0);
  }
  for (const k in fg) { const g = fg[k]; rows.push({ teacher_id: mine[g.t], ref: 'f:' + k, kind: 'free', at: g.at.length <= 10 ? g.at + 'T12:00:00Z' : g.at, items: Object.entries(g.m).filter(([, q]) => q > 0).map(([b, q]) => ({ b, l: bookLabel(b), q })), total: null }); }
  const keep = new Set(rows.map(r => r.teacher_id + '|' + r.ref));
  for (let i = 0; i < rows.length; i += 200) { const { error } = await sb.from('ledger').upsert(rows.slice(i, i + 200), { onConflict: 'teacher_id,ref' }); if (error) throw error; }
  const old = await fetchAll(() => sb.from('ledger').select('id,teacher_id,ref').in('teacher_id', Object.values(mine)));
  const gone = old.filter(r => !r.ref.startsWith('rq:') && !keep.has(r.teacher_id + '|' + r.ref)).map(r => r.id);
  for (let i = 0; i < gone.length; i += 100) await sb.from('ledger').delete().in('id', gone.slice(i, i + 100));
}
// حساب المرتجع بنفس طريقة البرنامج الأخضر: من أحدث بيع الأول، وبسعر البيع نفسه
function gRetCalc(db, localId, items) {
  const done = {};

/* ---------- 🔔 التنبيه: صوت + إشعار. الإشعار بيقوله يحدّث إيه (لو فيه طلب تحديث)، وبعد 3 تنبيهات «الأستاذ … بينبّهك» ---------- */
async function ringTeachers(ids) {
  if (!ids.length) return;
  // schema6: t_alert بيكتب رسالة «🔔 الأستاذ … بينبّهك» نوعها alert، وبتتمسح لوحدها بعد 30 دقيقة
  const { error } = await sb.rpc('t_alert', { p_teacher_ids: ids });
  if (error) return toast(errMsg(error));
  const { data: ups } = await sb.from('update_requests').select('teacher_id,fields').in('teacher_id', ids).eq('status', 'open');
  const need = {}; (ups || []).forEach(u => (need[u.teacher_id] ||= new Set()) && (u.fields || []).forEach(f => need[u.teacher_id].add(f)));
  const rc = LS.get('selah-trial-ringc', {}), now = Date.now(), groups = {};
  ids.forEach(id => {
    const c = rc[id] && now - rc[id].at < 2 * 3600e3 ? rc[id].n + 1 : 1; rc[id] = { n: c, at: now };
    const txt = `🔔 الأستاذ ${me.name} بينبّه حضرتك` + (need[id] && c < 3 ? ' — حدّث: ' + [...need[id]].map(k => FIELD_LABEL[k] || k).join('، ') : '');
    (groups[txt] ||= []).push(id);
  });
  LS.set('selah-trial-ringc', rc);
  if (window.pushRingTeachers) for (const txt in groups) window.pushRingTeachers(groups[txt], txt).catch(() => { });
  toast(`🔔 اتنبّه ${ids.length} مدرس`);
}

    ${e.reason && (e.status === 'question' || e.teacher_reply) ? `<div class="small">❓ سؤالك: ${esc(e.reason)}</div>` : ''}
    ${e.teacher_reply ? `<div class="good small" style="padding:8px;margin:6px 0">💬 رد المدرس: ${esc(e.teacher_reply)}</div>` : ''}
    ${Object.keys(e.new_values || {}).length ? `<table class="diff">${diffRows(e)}</table>` : ''}
    ${ph.length ? `<div class="small muted" style="margin:8px 0 4px">📷 ${ph.length} صورة — علّم اللي عايز تحتفظ بيها (هتتحفظ على الدرايف، والباقي يتمسح):</div>
      <div class="photos">${ph.map(p => `<label class="ph on"><img src="${p.d}" alt=""><input type="checkbox" checked data-ph="${p.id}"></label>`).join('')}</div>` : ''}
    <div class="acts"><button class="btn sm ok" data-act="approve">✅ موافقة</button><button class="btn sm" data-act="edit">✏️ عدّل ووافق</button>
      <button class="btn sm danger" data-act="reject">❌ رفض</button><button class="btn sm ghost" data-act="question">❓ اسأله</button></div></div>`;
}
function orderCard(o, inTeacher) {
  ORDS[o.id] = o;
  const t = o.teachers || {};
  return `<div class="card" data-ord="${o.id}" style="border-color:#b45309">
    ${inTeacher ? '' : `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px"><a class="grow" href="#/t/${o.teacher_id}"><b>${esc(t.name || '')}</b></a> ${tB(o.teacher_id)} ${icos4({ id: o.teacher_id })}</div>`}
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:6px"><div class="grow">
      <b>${o.kind === 'order' ? '🛒 طلب كتب' : (o.items || []).some(i => i.sid) ? '✏️ عايز يعدّل طلب البيع اللي سجّلته' : '✏️ طلب تعديل كمية'}</b><div class="small muted">${fmtDate(o.created_at)}</div></div></div>
    ${o.kind === 'edit' ? '<div class="small muted" style="margin-bottom:4px">الطلب كله — اللي اتغيّر متعلّم بالبرتقاني:</div>' : ''}
    <div id="oi-${o.id}">${(o.items || []).map(i => { const chg = o.kind === 'edit' && i.was != null && i.was !== i.q;
      return `<div class="kv" data-b="${esc(i.b)}" ${chg ? 'style="background:var(--owe-soft);border-radius:8px;padding:6px"' : ''}><span>${esc(i.l || bookLabel(i.b))}${o.kind === 'edit' && i.was != null ? ` <span class="small ${chg ? '' : 'muted'}">(كان ${i.was}${chg ? ` ← بقى ${i.q}` : ''})</span>` : ''}</span>
      <span class="qty"><button type="button" data-d="-1">−</button><b>${i.q}</b><button type="button" data-d="1">+</button></span></div>`; }).join('')}</div>
    ${o.note ? `<div class="small">ملاحظة: ${esc(o.note)}</div>` : ''}
    <div class="acts"><button class="btn sm ok" data-oact="approve">${(o.items || []).some(i => i.sid) ? '✅ وافق وعدّل الطلب في البيع' : '📥 انقله للطلبات في البيع'}</button><button class="btn sm danger" data-oact="reject">❌ رفض</button><button class="btn sm ghost" data-oact="ask">💬 اسأله في الشات</button></div>
    <div class="small muted">تقدر تغيّر الكمية بـ − / + قبل النقل. النقل بيسجله «طلب مستني» في البيع، ومش بيتنفذ غير لما انت تنفذه من هناك.</div></div>`;
}
function bindReviews(root) {
  root.addEventListener('change', e => { const c = e.target.closest('[data-ph]'); if (c) c.parentNode.classList.toggle('on', c.checked); });
  root.addEventListener('click', async e => {
    const qb = e.target.closest('.qty [data-d]'); if (qb) { const n = $('b', qb.parentNode); n.textContent = Math.max(0, +n.textContent + +qb.dataset.d); return; }
    const ob = e.target.closest('[data-oact]');
    if (ob) {
      const card = ob.closest('[data-ord]'), o = ORDS[card.dataset.ord], a = ob.dataset.oact, t = o.teachers || {};
      const items = $$('[data-b]', card).map(r => { const i = o.items.find(x => x.b === r.dataset.b) || {}; return { ...i, q: +$('b', r).textContent }; });
      if (a === 'ask') { location.hash = '#/c/' + o.teacher_id; return; }
      let reason = null;
      if (a === 'reject') { reason = await ask('❌ سبب الرفض (المدرس هيشوفه)'); if (reason === null) return; }
      $$('button', card).forEach(x => x.disabled = true);
      const { error } = await sb.from('orders').update({ status: a === 'approve' ? 'approved' : 'rejected', items, reason, decided_at: new Date().toISOString() }).eq('id', o.id);
      if (error) { $$('button', card).forEach(x => x.disabled = false); return toast(errMsg(error)); }
      let msg = 'تمام ✅';
      const sid = o.kind === 'edit' && (o.items || []).map(i => i.sid).find(Boolean);
      if (a === 'approve' && sid) {
        // تعديل على طلب أنا اللي سجّلته ← نفس الطلب في البيع يتعدّل، والنسخة اللي عند المدرس تتحدّث
        const ok = gSaleEdit(sid, items);
        const mir = await sb.from('orders').select('id').eq('note', 'rep:' + sid).maybeSingle();
        if (mir.data) await sb.from('orders').update({ items: items.filter(i => i.q > 0).map(i => ({ b: i.b, l: i.l || bookLabel(i.b), q: i.q, sid })) }).eq('id', mir.data.id);
        msg = ok ? '✅ الطلب اتعدّل في البيع' : '✅ اتوافق — بس الطلب مش لاقيه في البيع على الموبايل ده، عدّله بإيدك';
      } else if (a === 'approve') {
        // طلب جديد ← الكتب كلها. تعديل كمية ← الزيادة بس تبقى طلب مستني، والنقص بتعدّله بإيدك
        const add = o.kind === 'order' ? items : items.map(i => ({ ...i, q: i.q - (i.was || 0) })).filter(i => i.q > 0);
        const less = o.kind === 'edit' ? items.filter(i => i.q < (i.was || 0)) : [];
        const ok = add.length ? gOrder(t.local_id, add, o.kind === 'order' ? 'replace' : 'add') : true;
        // الطلبات القديمة المستنية لنفس المدرس تتقفل — آخر طلب هو المعتمد
        try { await syncRepOrders(gdb()); } catch (e) { }   // الطلب يظهر عند المدرس على طول «✅ تم استلام طلبك»
        if (o.kind === 'order') await sb.from('orders').update({ status: 'approved', reason: 'اتجمع مع آخر طلب', decided_at: new Date().toISOString() }).eq('teacher_id', o.teacher_id).eq('kind', 'order').eq('status', 'pending').neq('id', o.id);
        msg = ok ? `${ok === 'merged' ? '📥 طلبه اللي في البيع اتعدّل بآخر طلب (طلب واحد بس)' : '📥 اتنقل «طلب مستني» في البيع'}${less.length ? ` — وفيه ${less.length} كتاب قلّت كميته: عدّله في البيع بإيدك` : ''}` : '✅ اتوافق — سجّله في البيع بإيدك (المدرس مش في البرنامج على الموبايل ده)';
      }
      if (window.pushToTeacher) window.pushToTeacher({ id: o.teacher_id }, a === 'approve' ? '✅ طلب الكتب بتاعك اتوافق عليه' : '❌ طلب الكتب اترفض', false).catch(() => { });
      card.remove(); toast(msg, 4500); counts();
      return;
    }
    const b = e.target.closest('[data-act]'); if (!b) return;
    const card = b.closest('[data-req]'), r = REQS[card.dataset.req], act = b.dataset.act;
    const keep = $$('[data-ph]:checked', card).map(c => c.dataset.ph);
    const photos = (r.photos || []).filter(p => keep.includes(p.id));
    // الصور اللي اتعلّمت تتحفظ على درايف المالك (فولدر «صور المدرسين/<الاسم>»)، وبعد القرار بتتمسح من القاعدة لوحدها
    const savePhotos = () => {
      if (!photos.length) return;
      const nm = (r.teachers && r.teachers.name || 'مدرس').replace(/[\\/:*?"<>|]/g, ''), C = window.SILAH_CONFIG || {};
      const dl = () => photos.forEach((p, i) => downloadDataUrl(p.d, `${nm}-${new Date().toISOString().slice(0, 10)}-${i + 1}.jpg`));
      if (!C.CLOUD_URL || !navigator.onLine) return dl();
      fetch(C.CLOUD_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ k: 'tphoto', tid: r.teacher_id, name: nm, photos: photos.map(p => p.d) }) })
        .then(() => toast(`☁️ ${photos.length} صورة اتحفظت على الدرايف`, 3000)).catch(dl);
    };
    const send = async (action, final, reason) => {
      $$('button', card).forEach(x => x.disabled = true);
      const { error } = await sb.rpc('review_edit', { p_id: r.id, p_action: action, p_final: final || null, p_reason: reason || null });
      if (error) { $$('button', card).forEach(x => x.disabled = false); return toast(errMsg(error), 4000); }
      if (action === 'approve' || action === 'edit') { const done = gApply((r.teachers || {}).local_id || (T.find(x => x.id === r.teacher_id) || {}).local_id, final || r.new_values); if (done) toast('✅ واتكتب في البرنامج كمان', 3000); }
      if (window.pushToTeacher) window.pushToTeacher({ id: r.teacher_id }, action === 'reject' ? '❌ تعديل ملفك اترفض' : action === 'question' ? '❓ المندوب عنده سؤال على تعديلك' : '✅ تعديل ملفك اتوافق عليه', false).catch(() => { });
      card.remove(); loadAll().then(() => { if (!location.hash.startsWith('#/bell')) route(); });
    };
    if (act === 'approve') {
      if ((r.photos || []).length && !confirm(`${photos.length} صورة هتتحفظ على الدرايف و${r.photos.length - photos.length} هتتمسح. موافق؟`)) return;
      savePhotos(); send('approve');
    } else if (act === 'edit') {
      const st = {}, keys = Object.keys(r.new_values || {});
      if (!keys.length) { savePhotos(); return send('approve'); }
      const base = { ...(T.find(x => x.id === r.teacher_id) || {}).profile, ...r.new_values };
      modal(`<h3>✏️ عدّل قبل الموافقة</h3><div class="small muted" style="margin-bottom:8px">المدرس هيشوف اللي إنت غيّرته.</div>
        <form id="ef" onsubmit="return false">${profileForm(base, { only: keys })}</form>
        <div class="acts"><button class="btn ok" id="es">✅ وافق بالتعديل</button><button class="btn ghost" data-close>إلغاء</button></div>`, (box, close) => {
        const f = $('#ef', box); bindProfileForm(f, st);
        $('#es', box).onclick = () => {
          const v = readProfileForm(f, st), fin = {};
          keys.forEach(k => { fin[k] = k === 'avatar' ? (st.avatar || r.new_values.avatar) : k === 'loc' ? (st.loc || r.new_values.loc) : v[k]; });
          close(); savePhotos(); send('edit', fin);
        };
      });
    } else if (act === 'reject') {
      const why = await ask('❌ سبب الرفض (المدرس هيشوفه)', { ph: 'مثلاً: الرقم ناقص' }); if (why === null) return;
      send('reject', null, why);
    } else if (act === 'question') {
      const q = await ask('❓ اكتب سؤالك للمدرس', { ph: 'مثلاً: السنتر ده في أنهي شارع؟' }); if (!q) return;
      send('question', null, q);
    }
  });
}

/* ---------- الجرس ---------- */
// متابعة 10: اتشالت تبويبات «قريبًا» (🧾 طلباتي، 📋 الملاحظات، 🗑️ مسح الرسايل)
const BELL = [['msgs', '💬 رسايل جديدة'], ['orders', '🛒 طلبات المدرسين'], ['rets', '↩️ مرتجعات'], ['edits', '📝 تعديل الملفات'], ['inst', '📲 ثبّتوا التطبيق']];
async function viewBell() {
  setHeader('🔔 الإشعارات', false);
  const cnt = { orders: BC.orders, edits: BC.edits, msgs: BC.msgs, rets: BC.rets, inst: BC.inst };
  if (!BELL.some(([k]) => k === ui.bellTab)) ui.bellTab = 'msgs';
  app.innerHTML = `${BC.reps ? `<a class="alert" href="#/settings" style="display:block;text-decoration:none">👤 ${BC.reps} مندوب مستني موافقتك ←</a>` : ''}<div class="chips">${BELL.map(([k, l]) => `<button class="chip ${ui.bellTab === k ? 'on' : ''}" data-b="${k}">${l}${cnt[k] ? `<span class="n">${cnt[k]}</span>` : ''}</button>`).join('')}</div><div id="bb"></div>`;
  $$('[data-b]').forEach(b => b.onclick = () => { ui.bellTab = b.dataset.b; viewBell(); });
  const bb = $('#bb');
  bb.innerHTML = '<div class="loading">جاري التحميل…</div>';
  if (ui.bellTab === 'msgs') {
    const ids = Object.keys(unreadBy);
    ids.sort((a, b) => (lastMsg[b]?.id || 0) - (lastMsg[a]?.id || 0));
    bb.innerHTML = ids.length ? `<div class="tlist" style="display:flex">${ids.map(id => T.find(t => t.id === id)).filter(Boolean).map(t => `<div class="titem" data-go="#/c/${t.id}">${avHtml(t)}<div class="grow"><div class="nm">${esc(t.name)} ${tB(t.id)}</div>
      <div class="sub" style="color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">💬 ${esc((lastMsg[t.id]?.b || '').slice(0, 80))}</div><div class="sub">${fmtDate(lastMsg[t.id]?.at)}</div><div style="margin-top:6px">${icos4(t)}</div></div></div>`).join('')}</div>` : '<div class="card empty">مفيش رسايل جديدة ✅</div>';
    bb.onclick = e => { if (e.target.closest('[data-ic]')) return; const it = e.target.closest('[data-go]'); if (it) location.hash = it.dataset.go; };
    return;
  }
  // متابعة 12: المدرسين اللي ثبّتوا التطبيق (الأحدث فوق، والجديد من آخر مرة متعلّم 🆕)
  if (ui.bellTab === 'inst') {
    const { data, error } = await sb.from('teachers').select('id,name,phone,app_at').not('app_at', 'is', null).order('app_at', { ascending: false }).limit(200);
    if (error) { bb.innerHTML = `<div class="alert">${esc(errMsg(error))}</div>`; return; }
    const seen = LS.get('selah-trial-inst-seen') || new Date(0).toISOString();
    bb.innerHTML = data.length ? `<div class="small muted" style="margin-bottom:6px">${data.length} مدرس ثبّتوا التطبيق</div><div class="tlist" style="display:flex">${data.map(t => `<div class="titem" data-go="#/t/${t.id}">${avHtml(t)}<div class="grow"><div class="nm">${esc(t.name)} ${t.app_at > seen ? '<span class="pill ok">🆕 جديد</span>' : ''}</div>
      <div class="sub">📲 ثبّت ${fmtDate(t.app_at)}</div><div style="margin-top:6px">${icos4(t)}</div></div></div>`).join('')}</div>` : '<div class="card empty">لسه ولا مدرس ثبّت التطبيق</div>';
    bb.onclick = e => { if (e.target.closest('[data-ic]')) return; const it = e.target.closest('[data-go]'); if (it) location.hash = it.dataset.go; };
    if (data.length && data[0].app_at > seen) { LS.set('selah-trial-inst-seen', data[0].app_at); counts().catch(() => { }); }
    return;
  }
  if (ui.bellTab === 'rets') {
    const { data, error } = await sb.from('returns').select('*, teachers(name,local_id,phone)').eq('status', 'pending').order('created_at').limit(50);
    if (error) { bb.innerHTML = `<div class="alert">${esc(errMsg(error))}</div>`; return; }
    bb.innerHTML = `<a class="btn owe" href="#/rets" style="display:block;text-align:center;margin-bottom:8px">↩️ كل المرتجعات (ومعاها اللي مستني تستلمه) ←</a>` + (retGroups(data) || '<div class="card empty">مفيش طلبات مرتجع جديدة ✅</div>');
    bindRets(bb, data, () => { if (location.hash === '#/bell') viewBell(); }); return;
  }
  if (ui.bellTab === 'orders') {
    const { data, error } = await sb.from('orders').select('*, teachers(name,local_id)').eq('status', 'pending').order('created_at').limit(50);
    if (error) { bb.innerHTML = `<div class="alert">${esc(errMsg(error))}</div>`; return; }
    bb.innerHTML = data.map(o => orderCard(o)).join('') || '<div class="card empty">مفيش طلبات كتب مستنية ✅</div>';
    bindReviews(bb); return;
  }
  const { data, error } = await sb.from('edit_requests').select('*, teachers(name,phone,avatar,local_id)').in('status', ['pending', 'question']).order('updated_at').limit(40);
  if (error) { bb.innerHTML = `<div class="alert">${esc(errMsg(error))}</div>`; return; }
  const pend = data.filter(e => e.status === 'pending'), q = data.filter(e => e.status === 'question');
  bb.innerHTML = (pend.map(e => reviewCard(e)).join('') || '<div class="card empty">مفيش تعديلات مستنية ✅</div>')
    + (q.length ? `<details class="card"><summary><b>❓ مستنيين رد المدرس (${q.length})</b></summary>${q.map(e => reviewCard(e)).join('')}</details>` : '');
  bindReviews(bb);
}

/* ---------- إعدادات المالك ---------- */
function meter(pct) { const c = pct > 90 ? 'r' : pct > 75 ? 'y' : ''; return `<div class="meter"><i class="${c}" style="width:${Math.min(100, pct).toFixed(1)}%"></i></div>`; }
function dot(pct) { return pct > 90 ? '🔴' : pct > 75 ? '🟡' : '🟢'; }
async function viewSettings() {
  setHeader('⚙️ إعدادات المالك', false); app.innerHTML = '<div class="loading">جاري التحميل…</div>';
  const { data, error } = await sb.rpc('usage_stats');
  if (error) { app.innerHTML = `<div class="alert">${esc(errMsg(error))}</div>`; return; }
  const lim = +(data.settings.db_limit_mb || 500), quota = +(data.settings.rep_quota_mb || 100), pr = data.settings.prices;
  const { data: sx } = await sb.from('staff').select('id,approved,device_id,claimed_at');
  const SX = Object.fromEntries((sx || []).map(x => [x.id, x]));

  app.innerHTML = `<div class="card"><h3>${dot(dbPct)} مساحة القاعدة</h3>${(data.db_bytes / MB).toFixed(1)} من ${lim} ميجا (${dbPct.toFixed(1)}%)${meter(dbPct)}</div>
  <div class="card"><h3>💲 قايمة الأسعار عند المدرسين</h3><div class="small muted">${pr && pr.items ? `${pr.items.length} كتاب — آخر تحديث ${fmtDate(pr.at)}` : 'لسه ما اترفعتش'}</div>
    <button class="btn sm" id="upPr" style="margin-top:8px">⬆️ ارفع الأسعار من البرنامج</button></div>
  ${waitReps.length ? `<div class="card" style="border:2px solid #f59e0b"><h3>👤 مناديب مستنيين موافقتك (${waitReps.length})</h3>
    ${waitReps.map(s => `<div class="kv" data-s="${s.id}"><span><b>${esc(s.name || 'مندوب')}</b><br><span class="small muted">دخل ${fmtDate(s.claimed_at)} · الرقم <span dir="ltr">${esc(s.rep_code || '')}</span></span></span>
      <span class="acts" style="margin:0"><button class="btn sm ok" data-a="ok">✅ موافق</button><button class="btn sm danger" data-a="no">❌ مش موافق</button></span></div>`).join('')}</div>` : ''}
  <div class="card"><div style="display:flex;align-items:center"><h3 style="flex:1">🔑 أرقام المناديب</h3><button class="btn pri" id="newRep">➕ رقم جديد</button></div>
    <div class="small muted" style="margin-bottom:6px">اعمل رقم وابعته للمندوب. لما يدخله هيجيلك تطلب الموافقة. كل رقم لمندوب واحد وموبايل واحد.</div>
    ${data.staff.map(s => { const x = SX[s.id] || {}, pct = s.bytes / (quota * MB) * 100; const st = s.role === 'admin' ? '<span class="pill ok">👑 المالك</span>' : !x.device_id ? '<span class="pill owe">لسه ما استخدمش الرقم</span>' : !s.active ? '<span class="pill bad">🔴 مقفول</span>' : x.approved === false ? '<span class="pill owe">⏳ مستني موافقتك</span>' : '<span class="pill ok">🟢 شغّال</span>';
      return `<div class="kv" style="display:block;padding:10px 0" data-s="${s.id}">
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><b>${esc(s.name || 'رقم جديد')}</b>${st}${s.role === 'rep' ? `<code dir="ltr" style="font-size:16px;font-weight:800;background:var(--line,#eee);border-radius:6px;padding:1px 8px">${esc(s.rep_code || '')}</code>` : ''}</div>
      <div class="small muted">${s.teachers} مدرس · ${(s.bytes / 1024).toFixed(0)} ك.ب ${dot(pct)}</div>
      ${s.role === 'rep' ? `<div class="acts"><button class="btn sm" data-a="copy">📋 انسخ</button><button class="btn sm ok" data-a="wa">واتساب</button>
        ${x.device_id && x.approved !== false ? `<button class="btn sm ${s.active ? 'danger' : 'ok'}" data-a="toggle">${s.active ? '🔴 اقفله' : '🟢 شغّله'}</button>` : ''}
        <details style="display:inline-block"><summary class="btn sm ghost" style="list-style:none">⋮</summary><button class="btn sm ghost" data-a="unlink" style="margin-top:6px">📱 غيّر الموبايل</button></details></div>` : ''}</div>`; }).join('')}</div>
  <div class="card"><h3>حدود المساحة</h3><div class="row2"><div class="field"><label>حد القاعدة (ميجا)</label><input id="lim" type="number" value="${lim}"></div>
    <div class="field"><label>نصيب المندوب (ميجا)</label><input id="quo" type="number" value="${quota}"></div></div><button class="btn sm" id="saveLim">حفظ</button></div>`;
  const appUrl = location.href.split('#')[0].replace(/admin\.html.*$/, '');
  const repMsg = s => `رقمك السري في «المراسلات» في برنامج سلاح التلميذ:\n${s.rep_code}\n\nافتح البرنامج: ${appUrl}\nوادخل «⚙️ الإعدادات» ← «💬 فعّل المراسلات» واكتب الرقم زي ما هو بالظبط. (بيشتغل على موبايل واحد بس)`;
  $('#upPr').onclick = async () => {
    const db = gdb(); if (!db || !db.prices) return toast('مفيش أسعار في البرنامج على الموبايل ده');
    const items = Object.entries(db.prices).filter(([k, p]) => p && (p.post || p.pre)).map(([b, p]) => ({ b, l: bookLabel(b), pre: p.pre ?? null, post: p.post ?? null }));
    const { error: e } = await sb.from('app_settings').upsert({ key: 'prices', value: { items, at: new Date().toISOString() } }); if (e) return toast(errMsg(e));
    toast(`✅ اترفع ${items.length} سعر`); viewSettings();
  };
  $('#newRep').onclick = async () => {
    const { data: code, error: e } = await sb.rpc('admin_create_rep', { p_name: '' }); if (e) return toast(errMsg(e));
    await loadAll(); viewSettings();
    modal(`<h3>✅ رقم سري جديد</h3><div style="font-size:30px;text-align:center;letter-spacing:3px;font-weight:800;background:#f1f5f9;color:#0f172a;border-radius:12px;padding:10px" dir="ltr">${esc(code)}</div>
      <div class="small muted" style="margin:8px 0">ابعته للمندوب. لما يكتبه هيجيلك تطلب الموافقة باسمه.</div>
      <div class="acts"><button class="btn" id="c1">📋 انسخ الرسالة</button><a class="btn ok" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(repMsg({ rep_code: code }))}">ابعته واتساب</a><button class="btn ghost" data-close>قفل</button></div>`,
      box => { $('#c1', box).onclick = () => copyText(repMsg({ rep_code: code })); });
  };
  $$('[data-s] [data-a]').forEach(b => b.onclick = async () => {
    const s = data.staff.find(x => x.id === b.closest('[data-s]').dataset.s), a = b.dataset.a; let r;
    if (a === 'copy') return copyText(s.rep_code);
    if (a === 'wa') return window.open('https://wa.me/?text=' + encodeURIComponent(repMsg(s)), '_blank');
    if (a === 'ok') r = await sb.rpc('admin_approve_rep', { p_id: s.id, p_ok: true });
    if (a === 'no') { if (!confirm(`رفض ${s.name}؟ الرقم ده هيتقفل.`)) return; r = await sb.rpc('admin_approve_rep', { p_id: s.id, p_ok: false }); }
    if (a === 'unlink') { if (!confirm(`${s.name} غيّر موبايله؟ الرقم هيشتغل على أول موبايل يتكتب عليه بعد كده.`)) return; r = await sb.rpc('admin_reset_rep', { p_id: s.id, p_new_code: false }); }
    if (a === 'toggle') { if (s.active && !confirm(`تقفل البرنامج عند ${s.name}؟`)) return; r = await sb.from('staff').update({ active: !s.active }).eq('id', s.id); }
    if (a === 'ok' && !(r && r.error) && window.pushToStaff) window.pushToStaff([s.id], '✅ المالك وافق — افتح المراسلات', 'admin.html').catch(() => { });
    if (r && r.error) return toast(errMsg(r.error));
    await loadAll(); viewSettings(); toast('تمام ✅');
  });
  $('#saveLim').onclick = async () => {
    const { error: e } = await sb.from('app_settings').upsert([{ key: 'db_limit_mb', value: +$('#lim').value || 500 }, { key: 'rep_quota_mb', value: +$('#quo').value || 100 }]);
    if (e) return toast(errMsg(e)); viewSettings(); toast('اتحفظ ✅');
  };
}

boot();
</script>
<script src="push.js"></script>
</body>
</html>
